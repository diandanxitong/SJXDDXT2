
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码点单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EFE0;
    --bg-soft:#ECE0C6;
    --card:#FDFBF5;
    --card-line:#8B6F47;
    --ember:#C9502E;
    --ember-dark:#96371D;
    --cinnabar:#B8402A;
    --jade:#2F7A5E;
    --jade-hi:#9BC7A6;
    --jade-dark:#245F49;
    --gold:#E8A23D;
    --gold-ink:#8A5A18;
    --gold-line:rgba(138,90,24,.4);
    --text:#221A13;
    --text-muted:#5C4A34;
    --radius:16px;
    --brush:'Ma Shan Zheng',cursive;
    --serif-display:'Bodoni Moda',serif;
    --ease-silk:cubic-bezier(.22,1,.36,1);
    --dur-fast:.18s;
    --dur:.32s;
    --gold-hi:#F6DFA0;
    --gold-deep:#9C6A1E;
    --shadow-card:0 1px 2px rgba(59,44,30,.12), 0 16px 32px -16px rgba(59,44,30,.35);
    --shadow-card-active:0 2px 4px rgba(59,44,30,.18), 0 22px 40px -14px rgba(59,44,30,.4);
    --shadow-pop:0 22px 54px rgba(59,44,30,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  ::selection{background:rgba(184,64,42,.24);color:var(--text);}
  :focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px;border-radius:4px;}
  *{scrollbar-width:thin;scrollbar-color:var(--card-line) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:var(--card-line);border-radius:8px;}
  html,body{background:var(--bg);color:var(--text);}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
  }
  body.lang-zh-custom{
    font-family:'Noto Serif SC','Songti SC','SimSun','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  }
  body.lang-zh-hant{
    font-family:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
  }
  html,body{overscroll-behavior-y:none;}
  body{
    display:flex;
    justify-content:center;
    background-color:var(--bg);
  }
  #app{
    width:100%;max-width:480px;min-height:100vh;position:relative;padding-bottom:110px;
    box-shadow:0 0 0 1px rgba(232,162,61,.06);
  }
  #app::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--cinnabar),var(--gold) 50%,var(--cinnabar));
  }
  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--gold-ink);
    text-transform:uppercase;font-weight:700;
  }
  /* ---------- table picker (test mode) ---------- */
  .pick-screen{padding:64px 24px;text-align:center;}
  .pick-screen h1{
    font-family:var(--brush);
    font-weight:400;
    font-size:44px;margin:10px 0 6px;color:var(--text);
    text-shadow:0 2px 1px rgba(184,64,42,.3), 0 6px 14px rgba(59,44,30,.22);
  }
  .pick-hint{color:var(--text-muted);font-size:14px;margin-bottom:32px;}
  .table-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .table-grid button{
    aspect-ratio:1;border-radius:14px;border:1px solid var(--card-line);
    background:var(--card);color:var(--text);font-size:22px;font-weight:700;
    font-family:var(--serif-display);cursor:pointer;
  }
  .table-grid button:hover{border-color:var(--gold-ink);color:var(--gold-ink);}
  .table-grid button:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px;}

  /* ---------- header ---------- */
  header.bar{
    padding:26px 24px 22px;
    position:relative;overflow:hidden;
  }
  header.bar::after{
    content:"";position:absolute;top:-42px;right:-42px;width:120px;height:120px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23E8A23D' stroke-width='2'><circle cx='50' cy='50' r='30'/><path d='M20 50 Q35 30 50 50 Q65 70 80 50'/><path d='M20 50 Q35 70 50 50 Q65 30 80 50'/></g></svg>");
    background-size:contain;background-repeat:no-repeat;opacity:.1;pointer-events:none;
  }
  .menu-logo-row{position:relative;z-index:1;display:flex;justify-content:center;margin-bottom:14px;}
  .menu-logo{width:68px;height:auto;display:block;filter:drop-shadow(0 4px 10px rgba(59,44,30,.25));}
  .bar-row{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .table-badge{display:flex;flex-direction:column;align-items:flex-start;gap:10px;position:relative;}
  .table-badge-row{display:flex;align-items:baseline;gap:14px;}
  .table-badge .num{
    font-family:var(--serif-display);font-weight:700;
    font-size:36px;color:var(--ember);line-height:1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 3px 2px rgba(201,80,46,.28), 0 8px 16px rgba(59,44,30,.2);
  }
  .masthead-rule{
    margin-top:2px;height:1px;position:relative;
    background:linear-gradient(90deg, var(--gold-line), transparent 85%);
  }
  .change-table{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;
  }
  .change-table:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  /* ---------- panda nav ----------
     On the menu screen it's docked inline in the header (.menu-panda-slot)
     so it scrolls away with the page instead of floating forever; #panda-nav
     is the fixed fallback root used on the other (less-visited) screens. */
  #panda-nav{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;}
  .menu-panda-slot{position:relative;z-index:56;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;}
  .panda-overlay{position:fixed;inset:0;z-index:55;background:none;border:none;padding:0;margin:0;cursor:default;}
  /* "我的" 和语言切换现在并排放在同一行——语言切换从"我的"下拉菜单里搬出来，
     单独一个按钮，图标用"文"这个语言切换的通用符号，而不是之前的地球图标 🌐 */
  .panda-nav-row{position:relative;z-index:56;display:flex;align-items:center;gap:16px;}
  .my-order-btn{
    position:relative;z-index:56;
    display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;
    padding:0;font-family:inherit;color:var(--text);
  }
  .panda-avatar{
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .panda-avatar img{display:block;width:100%;height:100%;object-fit:contain;}
  .lang-switch-icon{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:18px;font-weight:900;color:var(--gold-ink);
    background:rgba(232,162,61,.14);border:1px solid var(--gold-line);border-radius:50%;
  }
  .my-order-label{font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .my-order-btn:hover .my-order-label{color:var(--gold-ink);}
  .panda-dropdown{
    position:relative;z-index:56;margin-top:8px;min-width:136px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:12px;
    overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .panda-dropdown button{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:13.5px;font-weight:700;padding:12px 16px;cursor:pointer;font-family:inherit;
  }
  .panda-dropdown button+button{border-top:1px solid var(--card-line);}
  .panda-dropdown button:hover{background:var(--bg-soft);color:var(--cinnabar);}

  /* ---------- menu ---------- */
  .menu-title-row{
    padding:20px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .menu-title{
    font-size:26px;font-weight:400;color:var(--gold-ink);
    font-family:var(--brush);letter-spacing:.04em;
  }
  .allergen-info-btn{
    flex-shrink:0;background:none;border:1px solid var(--gold-line);color:var(--gold-ink);
    font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;
    white-space:nowrap;font-family:inherit;
  }
  .allergen-info-btn:hover{background:rgba(232,162,61,.1);}
  .menu-view-row{padding:0 24px 14px;display:flex;gap:8px;}
  .menu-view-btn{
    flex:1;min-width:0;padding:10px 8px;border-radius:12px;
    border:1px solid var(--card-line);background:var(--bg-soft);color:var(--text-muted);
    font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .menu-view-btn.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .menu-view-btn:hover{color:var(--text);}
  .allergen-modal{padding-bottom:8px;}
  .allergen-grid{padding:4px 18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;}
  .allergen-grid-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);}
  /* ---------- chef's-special carousel (one photo, auto-advances every 3s) ---------- */
  .chef-carousel{padding:22px 0 6px;}
  .chef-slide{
    position:relative;display:block;width:calc(100% - 24px);margin:0 12px;aspect-ratio:3/1;
    overflow:hidden;border:none;border-radius:0;
    background:var(--card);padding:0;cursor:pointer;font-family:inherit;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
  }
  .chef-slide-photo{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:opacity .3s ease;
  }
  .chef-slide-tag{
    position:absolute;left:14px;top:14px;z-index:2;
    background:rgba(20,14,11,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    border:1px solid var(--gold-line);color:var(--gold-hi);
    font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 11px;border-radius:20px;
  }
  .chef-slide-caption{
    position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,.76) 0%, rgba(0,0,0,0) 100%);
    color:#fff;font-size:15px;font-weight:800;letter-spacing:.01em;text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:opacity .3s ease;
  }
  .menu-body{display:flex;align-items:flex-start;}
  .category-nav{
    width:84px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--card-line);
    position:sticky;top:0;align-self:flex-start;
    max-height:100vh;max-height:100dvh;overflow-y:auto;
    overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:4px 0;
  }
  .category-nav.latin{width:96px;}
  .category-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    position:relative;
    background:none;border:none;color:var(--text-muted);
    font-size:13.5px;font-weight:700;padding:12px 6px;cursor:pointer;text-align:center;
    font-family:inherit;line-height:1.3;
    margin:2px 8px;border-radius:11px;
    overflow-wrap:break-word;word-break:break-word;hyphens:auto;
  }
  .cat-btn.latin{
    font-size:11px;font-weight:700;line-height:1.22;letter-spacing:-.01em;
    padding:10px 4px;hyphens:none;
  }
  .cat-btn.active{
    color:var(--gold-ink);
    background:linear-gradient(160deg, rgba(232,162,61,.28), rgba(232,162,61,.12));
    box-shadow:inset 0 0 0 1px var(--gold-line);
  }
  .cat-btn:hover{color:var(--text);}
  @keyframes cat-flash-warn{
    0%,100%{color:inherit;text-shadow:none;}
    50%{color:#ff3b30;text-shadow:0 0 10px rgba(255,59,48,.65);}
  }
  .cat-btn.flash-warn{animation:cat-flash-warn .28s ease-in-out 3;}

  /* ---------- nag toast (missing soup base / missing rice-noodle toppings) ---------- */
  .nag-toast{
    position:fixed;left:50%;top:88px;z-index:90;transform:translateX(-50%);
    max-width:82vw;text-align:center;pointer-events:none;
    background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    color:#fff;font-size:13px;font-weight:800;line-height:1.4;
    padding:11px 18px;border-radius:14px;border:1px solid var(--gold-line);
    box-shadow:0 14px 32px rgba(0,0,0,.45);
    animation:nag-toast-life 2.6s ease forwards;
  }
  .nag-toast.nag-toast-info{
    background:linear-gradient(160deg,var(--jade) 0%,var(--jade-dark) 100%);
  }
  @keyframes nag-toast-life{
    0%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.94);}
    10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    85%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.96);}
  }
  .dish-panel{flex:1;min-width:0;padding-right:16px;}
  .category-note{
    font-size:12px;line-height:1.5;color:var(--text-muted);
    background:var(--bg-soft);border:1px solid var(--card-line);border-radius:12px;
    padding:9px 12px;margin:0 0 14px 16px;
  }
  .category-note .note-link{
    color:var(--gold-ink);font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer;
  }
  .dish-list{padding:0 0 0 16px;display:flex;flex-direction:column;gap:8px;}
  .dish-group-header{
    font-size:13.5px;font-weight:800;letter-spacing:.04em;color:var(--gold-ink);
    padding:2px 2px 0;margin-top:2px;
  }
  .dish-group-header:first-child{margin-top:0;}
  .dish-card{
    position:relative;overflow:hidden;
    padding:9px;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23E8A23D' stroke-width='2' stroke-opacity='.16'><circle cx='50' cy='50' r='30'/><path d='M20 50 Q35 30 50 50 Q65 70 80 50'/><path d='M20 50 Q35 70 50 50 Q65 30 80 50'/></g></svg>"),
      linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    background-repeat:no-repeat,no-repeat;
    background-position:right -20px top -20px,0 0;
    background-size:86px 86px,100% 100%;
    border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
  }
  /* Photo pinned top-left and never re-centered — the extend note below can
     grow the card as tall as it wants without nudging the photo. */
  .dish-card-row{display:flex;align-items:flex-start;gap:10px;}
  .dish-photo-wrap{
    position:relative;width:84px;height:84px;flex-shrink:0;overflow:hidden;
    border-radius:calc(var(--radius) - 6px);
    background:linear-gradient(160deg,var(--bg-soft) 0%,var(--card) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .dish-photo-wrap::before{
    content:"🍽";font-size:24px;opacity:.28;position:absolute;
  }
  .dish-photo{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;}
  .dish-body{flex:1;min-width:0;}
  .dish-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dish-name{font-size:15px;font-weight:900;letter-spacing:.01em;line-height:1.32;color:var(--text);}
  .dish-price{
    flex-shrink:0;font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;
    background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    border:1px solid var(--gold-line);
    white-space:nowrap;padding:4px 10px 5px;border-radius:8px;margin-top:1px;
    box-shadow:0 2px 6px rgba(150,55,29,.35);
  }
  .dish-body .tag{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.4;overflow-wrap:break-word;}
  .dish-card.sold-out .dish-photo-wrap::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:rgba(245,241,236,.6);
  }
  .dish-card.sold-out .dish-name{color:var(--text-muted);}
  .sold-out-msg{font-size:13px;font-weight:800;color:var(--gold-ink);text-align:center;margin-top:10px;}
  .allergen-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .allergen-chip{
    font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--text-muted);
    border:1px solid var(--card-line);border-radius:6px;padding:2px 6px;cursor:default;
    background:none;font-family:inherit;
  }
  .allergen-row .allergen-chip{cursor:pointer;}
  .allergen-row .allergen-chip:hover, .allergen-row .allergen-chip:active{
    border-color:var(--gold-ink);color:var(--gold-ink);background:rgba(232,162,61,.1);
  }
  .allergen-tap-hint{font-size:10.5px;color:var(--text-muted);margin-top:5px;}
  .allergen-popup{
    position:fixed;z-index:75;transform:translate(-50%,-100%) translateY(-10px);
    max-width:min(78vw,260px);
    display:flex;align-items:flex-start;gap:8px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:10px;
    padding:9px 12px;box-shadow:0 10px 26px rgba(0,0,0,.5);
    font-size:12.5px;color:var(--text);line-height:1.4;
  }
  .allergen-popup-code{
    flex-shrink:0;font-weight:900;color:var(--gold-ink);font-size:11px;
    background:rgba(232,162,61,.14);border-radius:6px;padding:1px 6px;
  }
  .size-row{display:flex;gap:6px;margin-top:10px;}
  .size-pill{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:7px 4px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11.5px;cursor:pointer;text-align:center;
  }
  .size-pill .size-label{font-weight:700;}
  .size-pill .size-price{font-size:11px;opacity:.85;}
  .size-pill.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .option-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .option-chip{
    display:flex;align-items:center;gap:5px;
    padding:6px 10px;border-radius:20px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:12px;cursor:pointer;font-family:inherit;
  }
  .option-chip .option-check{
    width:13px;height:13px;flex-shrink:0;border-radius:4px;border:1px solid var(--card-line);
    display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:var(--bg);
  }
  .option-chip.active{border-color:var(--jade);color:var(--text);background:rgba(47,122,94,.16);}
  .option-chip.active .option-check{background:var(--jade);border-color:var(--jade);color:#fff;}
  .dish-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:7px;padding-top:6px;border-top:1px dashed var(--card-line);}
  .dish-actions.with-add-extra{justify-content:space-between;}
  .add-extra-btn{
    background:none;border:1px solid var(--gold-line);color:var(--gold-ink);
    border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .add-extra-btn:hover{border-color:var(--jade-dark);color:var(--jade-dark);}
  .add-on-banner{
    display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    background:rgba(36,95,73,.1);border:1px solid var(--gold-line);border-radius:var(--radius);
    padding:11px 15px;margin-bottom:14px;font-size:13px;color:var(--text-muted);
  }
  .add-on-banner strong{color:var(--jade-dark);}
  .add-on-done-btn{
    flex-shrink:0;background:var(--jade-dark);color:#fff;border:none;border-radius:20px;
    padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .spice-tag.add-on-tag{color:var(--cinnabar);border-color:rgba(184,64,42,.4);}
  .order-line.order-line-addon{padding-left:14px;background:rgba(36,95,73,.05);border-radius:10px;}
  .stepper{
    display:flex;align-items:center;gap:0;flex-shrink:0;
    border:1px solid var(--card-line);border-radius:999px;padding:3px;
    background:var(--bg-soft);
  }
  .stepper button{
    width:30px;height:30px;border-radius:999px;border:none;
    background:none;color:var(--text);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper button:disabled{opacity:.35;cursor:not-allowed;}
  .stepper button:not(:disabled):hover{color:var(--ember);}
  .stepper button.stepper-add{
    border-radius:50%;background:var(--jade);color:#fff;font-size:19px;
  }
  .stepper button.stepper-add:not(:disabled):hover{background:var(--jade-dark);color:#fff;}
  .dish-card .stepper button.stepper-add{font-size:17px;}
  .stepper .qty{
    width:28px;text-align:center;font-weight:700;font-size:15px;
    font-family:'Archivo Black',sans-serif;font-variant-numeric:tabular-nums;
  }
  .dish-card .stepper button{width:36px;height:36px;font-size:15px;}
  .dish-card .stepper .qty{width:26px;font-size:13.5px;}
  .dish-extend{
    margin-top:12px;padding-top:12px;border-top:1px dashed var(--card-line);
    animation:dish-extend-in .3s cubic-bezier(.2,1,.3,1);
  }
  @keyframes dish-extend-in{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    .dish-extend{animation:none;}
  }
  /* the note reads as a small slip clipped below the ticket, not the card itself stretching */
  .dish-extend-note{
    position:relative;background:var(--bg-soft);
    border:1px solid var(--card-line);border-radius:12px;
    padding:14px 14px 12px;
  }
  .dish-extend-note::before{
    content:"";position:absolute;top:-7px;left:16px;width:26px;height:7px;
    background:var(--gold);border-radius:3px 3px 0 0;
  }
  .dish-extend-note>*:first-child{margin-top:0;padding-top:0;border-top:none;}
  .spice-row{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--card-line);}
  .spice-pill{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 4px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11.5px;line-height:1.25;cursor:pointer;
    text-align:center;
  }
  .spice-pill .flames{display:flex;gap:1px;flex-shrink:0;}
  .spice-pill .spice-label{overflow-wrap:break-word;}
  .spice-pill.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .flame{fill:var(--card-line);}
  .spice-pill.active .flame.lit{fill:var(--cinnabar);}
  .spice-pill:not(.active) .flame.lit{fill:var(--text-muted);}
  .spice-pill:disabled{opacity:.4;cursor:not-allowed;}
  .spice-row-disabled{cursor:not-allowed;}

  /* ---------- sticky bottom bar ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:30;
    padding:20px 16px 42px;
  }
  .bottom-bar-inner{
    width:100%;max-width:448px;display:flex;align-items:stretch;gap:12px;
  }
  .submit-btn{
    flex:1;background:linear-gradient(160deg,rgba(150,55,29,.72) 0%,rgba(105,38,20,.72) 100%);
    backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
    color:#fff;border:1px solid var(--gold-line);border-radius:14px;
    padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
    box-shadow:0 6px 18px rgba(150,55,29,.35);
  }
  .submit-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;border-color:var(--card-line);}
  .submit-btn:not(:disabled):active{background:var(--ember-dark);}

  /* one unified pill spanning most of the screen width, split unevenly into two actions;
     fixed (not fully-round) radius so wrapping to extra lines in other languages just
     lengthens the pill instead of making it look like it's ballooning wider */
  .action-pill-wrap{position:relative;width:84%;max-width:380px;min-width:280px;margin:0 auto;}
  .action-pill{
    position:relative;display:flex;align-items:stretch;
    border-radius:26px;overflow:hidden;
    background:linear-gradient(160deg, rgba(253,251,245,.78) 0%, rgba(236,224,198,.78) 100%);
    backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--gold-line);
    box-shadow:0 12px 28px rgba(0,0,0,.45);
  }
  .action-pill::before{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 42%);
  }
  .action-pill::after{
    content:"";position:absolute;z-index:2;top:20%;bottom:20%;left:40%;width:1px;
    background:linear-gradient(180deg, transparent, rgba(232,162,61,.45), transparent);
    pointer-events:none;
  }
  .cart-btn, .order-now-btn{
    min-width:0;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:10px 8px;text-align:center;
  }
  .cart-btn{flex:2;background:rgba(184,64,42,.1);color:var(--cinnabar);}
  .order-now-btn{
    flex:3;color:#fff;
    background:linear-gradient(160deg, rgba(150,55,29,.86) 0%, rgba(105,38,20,.86) 100%);
  }
  .cart-btn-title{text-shadow:0 1px 1px rgba(255,255,255,.5);}
  .order-now-title{text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .cart-btn .cart-btn-sub{color:var(--cinnabar);opacity:.8;}
  .cart-btn:disabled{color:var(--text-muted);cursor:not-allowed;background:none;}
  .order-now-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;}
  .cart-btn:not(:disabled):active{background:rgba(184,64,42,.2);}
  .order-now-btn:not(:disabled):active{background:linear-gradient(160deg, rgba(150,55,29,.96) 0%, rgba(105,38,20,.96) 100%);}
  .cart-btn-title, .order-now-title{font-size:16px;font-weight:900;letter-spacing:.02em;overflow-wrap:break-word;}
  .cart-btn-sub, .order-now-sub{font-size:10px;font-weight:700;opacity:.85;overflow-wrap:break-word;}
  .cart-btn.latin, .order-now-btn.latin{padding:9px 6px;}
  .cart-btn.latin .cart-btn-title, .order-now-btn.latin .order-now-title{font-size:13px;letter-spacing:0;line-height:1.15;}
  .cart-btn.latin .cart-btn-sub, .order-now-btn.latin .order-now-sub{font-size:9px;line-height:1.15;}
  .cart-btn.latin.lang-en .cart-btn-title, .order-now-btn.latin.lang-en .order-now-title{font-size:16px;letter-spacing:.02em;line-height:1.15;}
  .cart-btn.latin.lang-en .cart-btn-sub, .order-now-btn.latin.lang-en .order-now-sub{font-size:10px;line-height:1.15;}

  /* ---------- cart button: slim vertical tab docked to the right edge ---------- */
  .cart-side-fab{
    position:fixed;right:0;top:56%;transform:translateY(-50%);z-index:40;
    width:32px;padding:12px 4px;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    background:linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    border:1px solid var(--gold-line);border-right:none;border-radius:14px 0 0 14px;
    color:var(--text);cursor:pointer;
    box-shadow:-4px 6px 16px rgba(0,0,0,.4);
  }
  .cart-side-fab:active:not(:disabled){transform:translateY(-50%) scale(.96);}
  .cart-side-fab-icon-wrap{position:relative;flex-shrink:0;display:flex;}
  .cart-side-fab-icon{width:20px;height:20px;object-fit:contain;pointer-events:none;display:block;}
  .cart-side-fab-badge{
    position:absolute;top:-7px;right:-9px;min-width:16px;height:16px;padding:0 3px;
    border-radius:999px;background:var(--cinnabar);color:#fff;
    font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--bg-soft);
  }
  .cart-side-fab-label{
    font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--gold-ink);
    writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.2;
    min-height:38px;
  }
  .cart-side-fab-label.latin{
    text-orientation:sideways;letter-spacing:.02em;
  }
  .cart-side-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);border:none;padding:0;margin:0;cursor:default;}
  .cart-side-panel{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);transform-origin:right center;
    animation:cart-side-in .26s cubic-bezier(.2,1,.3,1);
    z-index:71;width:min(84vw,340px);max-height:70vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--gold-line);border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);padding:18px 18px 14px;
  }
  @keyframes cart-side-in{
    from{opacity:0;transform:translateY(-50%) translateX(24px) scale(.94);}
    to{opacity:1;transform:translateY(-50%) translateX(0) scale(1);}
  }
  .cart-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cart-side-title{font-family:var(--brush);font-weight:400;font-size:20px;color:var(--gold-ink);}
  .cart-side-close{
    flex-shrink:0;background:none;border:1px solid var(--card-line);color:var(--text-muted);
    width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cart-side-close:hover{color:var(--gold-ink);border-color:var(--gold-line);}
  .cart-side-panel .order-summary{margin:0;}

  /* ---------- add-to-cart status animation (GSAP-driven, see celebrateAddToCart) ---------- */
  .hotpot-toast{
    position:fixed;left:50%;bottom:148px;z-index:80;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .fx-check{width:56px;height:56px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));}
  .hotpot-caption{
    background:var(--card);border:1px solid var(--card-line);color:var(--text);
    font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:20px;
  }
  .call-toast-bell{font-size:48px;line-height:1;}

  /* ---------- confirm screen ---------- */
  .confirm-screen{padding:56px 28px 40px;text-align:center;}
  .stamp-ring{
    width:132px;height:132px;margin:0 auto 26px;border-radius:50%;
    border:3px solid var(--cinnabar);display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);position:relative;
    box-shadow:0 0 0 1px rgba(184,64,42,.15), 0 10px 24px rgba(59,44,30,.28), 0 3px 6px rgba(184,64,42,.22);
  }
  .stamp-ring::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--cinnabar);border-radius:50%;
  }
  .stamp-ring span{
    font-family:var(--serif-display);font-weight:700;color:var(--cinnabar);font-size:19px;letter-spacing:.05em;
  }
  .confirm-screen h2{
    font-family:var(--brush);font-weight:400;font-size:34px;color:var(--gold-ink);margin-bottom:22px;
  }

  /* ---------- kitchen-status pulse (shown once staff confirms the order, GSAP-driven, see animateChefSteam) ---------- */
  .chef-cooking{position:relative;width:56px;height:56px;margin:18px auto 10px;}
  .fx-cooking-ring{
    position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
    border-radius:50%;border:2px solid var(--ember);opacity:0;
  }
  .fx-cooking-dot{
    position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
    border-radius:50%;background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    box-shadow:0 3px 8px rgba(150,55,29,.4);
  }
  .kitchen-sent-title{
    font-family:var(--brush);font-weight:400;font-size:26px;color:var(--gold-ink);margin:4px 0 2px;
  }
  .order-summary{list-style:none;text-align:left;background:var(--card);border:1px solid var(--card-line);
    border-top:1px solid var(--gold-line);
    border-radius:var(--radius);padding:6px 18px;margin-bottom:20px;}
  .order-summary li{padding:13px 0;font-size:15px;}
  .order-summary li + li{border-top:1px dashed var(--card-line);}
  .order-line-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:700;}
  .order-line-name{overflow-wrap:break-word;}
  .order-line-price{color:var(--gold-ink);font-size:13.5px;white-space:nowrap;flex-shrink:0;padding-top:1px;}
  .order-line-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .order-line-bottom .stepper{margin-left:auto;}
  .order-total-line{
    display:flex;justify-content:space-between;padding:14px 0 6px;
    font-weight:900;font-size:15px;color:var(--gold-ink);
  }
  .spice-tag{font-size:11.5px;color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:20px;padding:2px 9px;}
  .hint{color:var(--text-muted);font-size:13.5px;margin-bottom:26px;}
  .order-removed-notice{
    color:var(--cinnabar);font-size:13.5px;font-weight:700;line-height:1.5;
    background:rgba(184,64,42,.1);border:1px solid rgba(184,64,42,.35);
    border-radius:var(--radius);padding:12px 16px;margin-bottom:22px;
  }
  .ghost-btn{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    padding:11px 22px;border-radius:12px;font-size:14px;cursor:pointer;
  }
  .ghost-btn:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  .back-row{text-align:left;padding:14px 24px 0;}
  .back-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:13px;font-weight:700;cursor:pointer;padding:6px 2px;
    font-family:inherit;
  }
  .back-btn:hover{color:var(--gold-ink);}

  .my-order-card{
    margin-top:32px;text-align:left;
    background:var(--card);border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .my-order-title{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--text);}
  .my-order-card .order-summary{
    margin:12px 0 0;background:none;border:none;padding:0;
  }
  .my-order-card .order-summary li{padding:11px 0;}
  .my-order-card .order-summary li + li{border-top:1px dashed var(--card-line);}
  .my-order-note{font-size:12.5px;color:var(--gold-ink);margin:14px 0 0;}
  .text-link-btn{
    background:none;border:none;color:var(--cinnabar);font-weight:700;font-size:14px;
    cursor:pointer;padding:14px 0 0;font-family:inherit;display:block;
  }
  .text-link-btn:hover{text-decoration:underline;}

  /* ---------- welcome / language select ---------- */
  /* Lives on body (not .welcome-screen) — body is the element that actually
     grows to the page's full scrollable height, so a plain (non-fixed)
     cover background here always reaches the bottom with no seam, and it
     works on iOS Safari, which largely ignores background-attachment:fixed
     on non-body elements. */
  body.welcome-bg{
    background:var(--bg) url("../image/background/背景图.webp") center/cover no-repeat;
  }
  /* #app normally reserves 110px at the bottom for the fixed order bar, but
     the welcome screen has no order bar — that reserved strip was making the
     page tall enough to scroll, revealing body's own background underneath
     the welcome photo. Drop it only here. */
  body.welcome-bg #app{padding-bottom:0;}
  .welcome-screen{
    position:relative;overflow:hidden;
    min-height:100vh;min-height:100dvh;width:100%;display:flex;align-items:center;justify-content:center;
    padding:min(10vh,40px) 24px;
  }
  .welcome-inner{
    position:relative;z-index:1;
    text-align:center;width:100%;max-width:380px;
    display:flex;flex-direction:column;align-items:center;
  }

  .welcome-leaf{
    width:150px;
    opacity:0;transform:translateY(10px) scale(.86);
    transition:opacity 1.1s cubic-bezier(.16,.9,.28,1), transform 1.1s cubic-bezier(.16,.9,.28,1);
    filter:drop-shadow(0 6px 14px rgba(59,44,30,.25));
  }
  .welcome-leaf.in{opacity:1;transform:translateY(0) scale(1);}
  .welcome-leaf img{
    display:block;width:100%;height:auto;
  }

  .welcome-word{
    margin:24px 0 0;min-height:1.3em;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    font-family:'Bodoni Moda','Noto Serif SC','Noto Serif TC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    font-weight:600;font-size:clamp(26px,6.4vw,32px);
    letter-spacing:.02em;color:var(--text);
    text-shadow:0 1px 2px rgba(239,224,190,.6);
  }
  .welcome-word.in{opacity:1;transform:translateY(0);}
  .welcome-word.swap{opacity:0;transform:translateY(6px);transition:opacity .38s ease, transform .38s ease;}

  /* ---------- maintenance / system paused ---------- */
  .maintenance-msg{
    margin:26px 0 0;min-height:2.8em;max-width:320px;
    opacity:1;transform:translateY(0);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    font-weight:600;font-size:clamp(16px,4.4vw,19px);line-height:1.55;
    letter-spacing:.01em;color:var(--text);
    text-shadow:0 1px 2px rgba(239,224,190,.6);
    transition:opacity .38s ease, transform .38s ease;
  }
  .maintenance-msg.swap{opacity:0;transform:translateY(6px);}

  .welcome-divider{
    width:64%;height:1px;margin:22px 0 20px;
    background:linear-gradient(90deg, transparent, var(--gold-deep) 50%, transparent);
    transform:scaleX(0);transform-origin:center;
    transition:transform 1s ease;
  }
  .welcome-divider.in{transform:scaleX(1);}

  .welcome-wordmark{
    opacity:0;transform:translateY(14px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
  }
  .welcome-wordmark.in{opacity:1;transform:translateY(0);}
  .welcome-wordmark h1{
    margin:0;
    font-family:'Bodoni Moda','Noto Serif SC','Noto Serif TC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    font-weight:700;font-size:clamp(20px,5.2vw,26px);
    letter-spacing:.06em;text-transform:uppercase;line-height:1.3;
    color:var(--gold-deep);
  }

  .welcome-kicker{
    margin-top:16px;
    opacity:0;transform:translateY(8px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-deep);
  }
  .welcome-kicker.in{opacity:1;transform:translateY(0);}

  .welcome-btn-wrap{
    margin-top:38px;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    position:relative;
  }
  .welcome-btn-wrap.in{opacity:1;transform:translateY(0);}
  .lang-select-btn{
    position:relative;z-index:56;
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(160deg, #221C14 0%, #120E0A 100%);
    border:1px solid var(--gold);color:var(--gold-hi);
    padding:13px 28px;border-radius:999px;font-size:13px;font-weight:700;
    letter-spacing:.05em;cursor:pointer;font-family:inherit;
    box-shadow:0 10px 26px rgba(59,44,30,.35);
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease, background .2s ease;
  }
  .lang-select-btn:hover{border-color:var(--gold-hi);box-shadow:0 12px 30px rgba(59,44,30,.45);transform:translateY(-1px);}
  .lang-select-icon{font-size:16px;}
  .lang-panel{
    position:relative;z-index:56;margin-top:14px;
    background:linear-gradient(165deg, var(--card), var(--bg));
    border:1px solid var(--gold-line);
    border-radius:16px;box-shadow:0 14px 34px rgba(59,44,30,.4);
    text-align:left;
    display:flex;flex-wrap:wrap;gap:8px;padding:12px;
  }
  .lang-panel button{
    flex:1 1 calc(50% - 4px);
    display:flex;align-items:center;justify-content:space-between;
    background:var(--bg-soft);border:1px solid var(--card-line);border-radius:10px;
    color:var(--text);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    padding:12px 14px;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .lang-panel button:hover{border-color:var(--gold-line);background:rgba(232,162,61,.1);}
  .lang-panel button.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.14);}
  .lang-panel .lang-check{color:var(--gold-ink);opacity:0;font-size:13px;}
  .lang-panel button.active .lang-check{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .welcome-leaf,.welcome-word,.welcome-divider,.welcome-wordmark,.welcome-kicker,.welcome-btn-wrap,.maintenance-msg{
      transition:none !important;
    }
  }

  /* ---------- in-app language switcher ---------- */
  .lang-switcher-overlay{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);border:none;padding:0;margin:0;cursor:default;}
  .lang-switcher-panel{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:66;width:calc(100% - 56px);max-width:340px;

    padding:11px 10px 11px 18px;border-radius:999px;
    border:1px solid var(--card-line);background:var(--bg-soft);
  }
  .review-field-label{font-size:14px;color:var(--text);font-weight:700;}

    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);

    box-shadow:0 20px 50px rgba(0,0,0,.6);padding:20px;

  .upsell-header{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .upsell-title{
    text-align:center;font-family:var(--brush);font-size:21px;font-weight:400;
    color:var(--gold-ink);margin-bottom:0;
  }
  .upsell-shuffle-btn{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:4px;
    border:1px solid var(--card-line);border-radius:999px;background:var(--bg-soft);
    color:var(--text-muted);font-size:11.5px;font-weight:700;padding:6px 10px;
    cursor:pointer;font-family:inherit;
  }
  .upsell-shuffle-btn:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  .upsell-shuffle-btn.spinning .upsell-shuffle-icon{transform:rotate(360deg);}
  .upsell-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .upsell-tile{
    display:flex;flex-direction:column;align-items:center;gap:4px;

      border-color var(--dur) var(--ease-silk),
      box-shadow var(--dur) var(--ease-silk),
      color var(--dur) var(--ease-silk),

  .dish-card{
    box-shadow:var(--shadow-card);
    animation:dish-in .5s var(--ease-silk) both;

  .dish-card:nth-of-type(1){animation-delay:0ms}
  .dish-card:nth-of-type(2){animation-delay:35ms}

  .dish-card:nth-of-type(4){animation-delay:105ms}

    color:var(--gold-ink);
  }

  .cart-side-overlay, .lang-switcher-overlay{
    backdrop-filter:blur(7px) saturate(140%);-webkit-backdrop-filter:blur(7px) saturate(140%);

  }

  @keyframes overlay-fade{from{opacity:0}to{opacity:1}}

  .lang-switcher-panel, .upsell-modal{

  @keyframes modal-pop-in{
    from{opacity:0;transform:translate(-50%,-50%) scale(.94);}

  .review-input:focus{box-shadow:0 0 0 3px rgba(232,162,61,.16);}

// 导致请求悬在那里既不成功也不报错。这里让 SDK 自动探测并回退到长轮询，兼容性更好。
db.settings({ experimentalAutoDetectLongPolling: true });
const ordersRef = db.collection('orders');
const menuStatusRef = db.collection('menuStatus').doc('soldOut');
// 同桌多台手机共享的"下单前购物车草稿"：一台手机选了锅底/加了菜，还没点"下单"，
// 同桌其他人扫同一个桌号码进来也要实时看到，避免大家各点各的、菜重复下单。
// 文档 id 就是桌号，字段 items 结构跟 state.items 一模一样，按菜品 id 逐条存。
const tableCartsRef = db.collection('tableCarts');

// 给一个 promise 加超时：网络很差时 Firestore 请求可能一直挂着不 resolve 也不 reject，
// 页面就会卡在"下单中"出不来。超时后统一当失败处理，好歹能提示顾客重试。
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

// 沽清菜品：员工在接单看板的"沽清菜品"页里勾选后写入这里，这边实时监听，
// 让菜单里对应菜品立刻变灰、不可点选（无需刷新页面）
let soldOutIds = new Set();
function isSoldOut(id){ return soldOutIds.has(id); }
menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  render();
}, err => {});

// 接单看板上的"关闭系统"：员工输入密码后写这个文档，扫码端实时监听到 disabled:true
// 就整站切换成"暂停服务"提示页，不管顾客当时停在哪个界面上
const systemStatusRef = db.collection('systemStatus').doc('main');
let systemDisabled = false;
systemStatusRef.onSnapshot(snap => {
  const data = snap.data();
  systemDisabled = !!(data && data.disabled);
  render();
}, err => {});

  return dict[key] !== undefined ? dict[key] : I18N.zh[key];
}
function tCat(catId){ return (I18N[state.lang] || I18N.zh).categories[catId]; }
const CATEGORY_NOTE_KEYS = { soupBase:'soupBaseNote', lunchSet:'lunchSetNote', miniHotpot:'miniHotpotNote' };
function categoryNoteHTML(catId){
  const key = CATEGORY_NOTE_KEYS[catId];
  if(!key) return '';
  let text = t(key);
  // 锅底提示语开头就是"鸳鸯锅"这个分组名，把它变成可点的下划线链接，点了跳到鸳鸯锅那组菜品
  if(catId === 'soupBase'){
    const dualLabel = tSubGroup('potDual');
    if(text.indexOf(dualLabel) === 0){
      text = `<span class="note-link" onclick="scrollToSubGroup('potDual')">${dualLabel}</span>` + text.slice(dualLabel.length);
    }
  }
  return `<p class="category-note">${text}</p>`;
}
// 从某份冒菜/火锅米线点了“加菜”按钮跳过来时，在“加菜”分类顶部提示正在为哪份菜加菜
function addOnBannerHTML(catId){
  if(catId !== 'lunchPieces' || !state.addOnTarget) return '';
  const targetDish = MENU_BY_ID[state.addOnTarget];
  if(!targetDish) return '';
  const name = dishDisplayName(targetDish, getItem(state.addOnTarget));
  return `<div class="add-on-banner">
    <span>${t('addOnBannerPrefix')}<strong>${name}</strong>${t('addOnBannerSuffix')}</span>
    <button class="add-on-done-btn" onclick="finishAddOn()">${t('addOnDoneBtn')}</button>
  </div>`;
}
function scrollToSubGroup(sub){
  const label = tSubGroup(sub);
  const header = Array.from(document.querySelectorAll('.dish-group-header')).find(h => h.textContent === label);
  if(!header) return;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  header.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
}
function tSpice(idx){ return (I18N[state.lang] || I18N.zh).spice[idx]; }
function tDish(id, field){ return (I18N[state.lang] || I18N.zh).dishes[id][field]; }
function tAllergen(code){ return (ALLERGEN_NAMES[code] || {})[state.lang] || ALLERGEN_NAMES[code].zh; }
function tSize(key){ return (SIZE_LABELS[key] || {})[state.lang] || SIZE_LABELS[key].zh; }
function tCookMethod(key){ return (COOK_METHOD_LABELS[key] || {})[state.lang] || COOK_METHOD_LABELS[key].zh; }
function tSoupBase(key){ return key ? ((SOUP_BASE_LABELS[key] || {})[state.lang] || SOUP_BASE_LABELS[key].zh) : ''; }
function tDrink(key){ return key ? ((DRINK_LABELS[key] || {})[state.lang] || DRINK_LABELS[key].zh) : ''; }
function tOption(key){ return (OPTION_LABELS[key] || {})[state.lang] || OPTION_LABELS[key].zh; }
function displayDishName(zhName){
  // 冒菜套餐选好口味后存的是具体口味名（牛肉冒菜套餐/猪肉冒菜套餐...），不是独立菜品，
  // 这里得先认出这些名字，换语言查看老订单时才能正确翻译回去
  const meatKey = HOTPOT_BOWL_MEAT_TYPES.find(k => HOTPOT_BOWL_SET_MEAT_LABELS[k].zh === zhName);
  if(meatKey) return tHotpotBowlSetMeat(meatKey);
  const id = ZH_NAME_TO_ID[zhName];
  return id ? tDish(id, 'name') : zhName;
}
function zhDishName(id){ return I18N.zh.dishes[id].name; }
// 冒菜套餐选好口味后，下单/购物车/厨房显示的名字要是具体口味（牛肉冒菜套餐），不是笼统的"冒菜套餐"
function dishDisplayName(d, item){
  if(d.id === HOTPOT_BOWL_SET_ID && item && item.meatType) return tHotpotBowlSetMeat(item.meatType);
  return tDish(d.id, 'name');
}
function dishDisplayTag(d, item){
  if(d.id === HOTPOT_BOWL_SET_ID && item && item.meatType) return tHotpotBowlSetMeatTag(item.meatType);
  return tDish(d.id, 'tag');
}
function dishZhName(d, item){
  if(d.id === HOTPOT_BOWL_SET_ID && item && item.meatType) return HOTPOT_BOWL_SET_MEAT_LABELS[item.meatType].zh;
  return zhDishName(d.id);
}
function displaySpice(zhSpice){
  const idx = SPICE_LEVELS.indexOf(zhSpice);
  return idx >= 0 ? tSpice(idx) : zhSpice;
}
function formatPrice(v){ return '€' + v.toFixed(2); }
function dishUnitPrice(d, item){
  if(d.sizes){
    const key = (item && item.size) || d.sizes[0].key;
    const opt = d.sizes.find(s => s.key === key);
    return opt ? opt.price : d.sizes[0].price;
  }
  return d.price;
}
function dishPriceLabel(d, item){
  let label = formatPrice(dishUnitPrice(d, item));
  if(d.unit === 'person') label += t('perPersonSuffix');
  if(d.unit === 'piece') label += t('perPieceSuffix');
  return label;
}

// 本桌订单的实时镜像：一旦选定桌号就一直监听，不管顾客在看菜单/下单确认页/我的订单页。
// 员工在接单看板上单品删除或整单删除，都是直接改/删 Firestore 里的 order 文档，这个监听
// 会立刻收到推送——用来把"下单确认页"和"我的订单页"的展示实时同步过来，而不是等顾客
// 手动刷新或重新进入页面才发现菜品已经被后台删掉了。
let liveTableOrdersUnsub = null;
let liveTableOrders = [];
let liveTableOrdersLoaded = false;

function watchTableOrders(table){
  if(liveTableOrdersUnsub){ liveTableOrdersUnsub(); liveTableOrdersUnsub = null; }
  liveTableOrders = [];
  liveTableOrdersLoaded = false;
  if(!table) return;
  liveTableOrdersUnsub = ordersRef.where('table', '==', String(table)).onSnapshot(snap => {
    liveTableOrders = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    liveTableOrdersLoaded = true;
    onTableOrdersChanged();
  }, err => {});
}

// 同桌共享购物车草稿：本桌一旦选定就订阅 tableCarts/<桌号>，任何一台设备改了某道菜
// （数量/辣度/锅底/饮品……）都会推到这个文档，其它设备的 onSnapshot 立刻收到并合并
// 进本地 state.items，界面自动跟着更新（复用 updateItemUI 逐张菜卡片刷新，不整页重画）。
let sharedCartUnsub = null;

function watchSharedCart(table){
  if(sharedCartUnsub){ sharedCartUnsub(); sharedCartUnsub = null; }
  if(!table) return;
  sharedCartUnsub = tableCartsRef.doc(table).onSnapshot(snap => {
    const incoming = (snap.data() && snap.data().items) || {};
    // 只用共享草稿"新增/更新"本地购物车，绝不因为某道菜不在共享草稿里就把它从本地
    // 删掉——本地选择永远以本机这次点单为准，共享草稿只是拿来同步其它设备改了什么，
    // 不能反过来抹掉本机自己已经选的菜。这一点很关键：本机自己写共享草稿的那次
    // "乐观回声"也会经过这个回调，如果那次写入之后被回滚（权限被拒/网络失败/
    // 餐厅wifi 抽风……），回滚后的快照里这道菜就是"缺失"的——只要缺失就跳过、
    // 绝不删除，本地购物车就不会被回滚顺带清空（之前出现过"点了显示加入购物车
    // 成功，但购物车是空的"就是因为这里曾经写成"缺失就删除"）。
    const changedIds = [];
    Object.keys(incoming).forEach(id => {
      const newVal = incoming[id];
      if(!newVal) return;
      if(JSON.stringify(state.items[id] || null) === JSON.stringify(newVal)) return;
      state.items[id] = newVal;
      changedIds.push(id);
    });
    if(changedIds.length === 0) return;
    if(state.screen === 'menu') changedIds.forEach(updateItemUI);
    else if(state.screen === 'cart' || state.screen === 'orderReview') render();
  }, err => {});
}

// 每次本地改动某道菜（数量/口味/锅底……）都同步写一份到共享购物车草稿里。
// 用嵌套对象字面量 { items: { [菜品id]: 值 } } + merge:true——Firestore 对 set()
// 的嵌套 map 字段是递归合并的，只会精确覆盖这一道菜自己的记录，不会动到同桌其他人
// 正在改的另一道菜，文档还不存在时（本桌第一次有人点单）也会自动建出来。
// （注意：不能写成顶层带点号的字段路径 "items.<id>" 当 key——那个写法只对 update()
// 生效；传给 set() 时会被当成一个字面量就叫 "items.xxx" 的字段，既没merge进 items
// 这个 map，也会被安全规则的 hasOnly(['items','updatedAt']) 拒绝，之前就是栽在这上面。）
function pushSharedCartItem(id){
  if(!state.table) return;
  tableCartsRef.doc(state.table).set({
    items: { [id]: state.items[id] || null },
    updatedAt: Date.now(),
  }, { merge: true }).catch(()=>{});
}

// 下单成功后草稿要清空——这一轮选的菜已经变成正式订单了，留着会让同桌其他人
// 以为这些菜还没提交，继续叠加甚至重复下单
function clearSharedCart(){
  if(!state.table) return;
  tableCartsRef.doc(state.table).set({ items: {}, updatedAt: Date.now() }).catch(()=>{});
}

function onTableOrdersChanged(){
  const foodOrders = liveTableOrders.filter(o => !o.call);

  if(state.myOrderItems !== null){
    state.myOrderItems = mergeItems(foodOrders);
  }

  if(state.lastOrder){
    const doc = liveTableOrders.find(o => o.id === state.lastOrder.docId);
    state.lastOrder.summaryItems = mergeItems(foodOrders);
    state.lastOrder.removed = !doc;
    if(doc && doc.status) state.lastOrder.status = doc.status;
  }

  if(state.screen === 'myOrder' || state.screen === 'confirm') render();
}

function stopWelcomeCycle(){
  if(welcomeTimer){ clearInterval(welcomeTimer); welcomeTimer = null; }

function startWelcomeCycle(){
  if(welcomeTimer) return;
  let idx = 0;
  welcomeTimer = setInterval(()=>{
    const el = document.getElementById('welcome-word');
    if(!el) return;
    el.classList.add('swap');
    setTimeout(()=>{
      idx = (idx + 1) % LANG_ORDER.length;
      el.textContent = LANG_META[LANG_ORDER[idx]].greeting;
      el.classList.remove('swap');
    }, 400);
  }, 1800);
}

function getItem(id){
  return state.items[id] || {
    qty:0, spice: LUNCH_FLAVOR_DISH_IDS.includes(id) ? null : '中辣',
    size:null, excludes:{}, cookMethod:'steamed', soupBase:null, drink:null, meatType:null, addOns:{},

}

// 冒菜/火锅米线卡片正在“加菜”浏览模式下（点了那个菜的加菜按钮，跳来挑配菜），
// 配菜卡片显示/操作的不是全局数量，而是挂在目标菜品身上的 addOns 数量
function isAddOnBrowsing(d){
  return d.category === 'lunchPieces' && !!state.addOnTarget;
}
function getEffectiveItem(d){
  if(isAddOnBrowsing(d)){
    const target = getItem(state.addOnTarget);
    const qty = (target.addOns && target.addOns[d.id]) || 0;
    return { qty, spice:'中辣', size:null, excludes:{}, cookMethod:'steamed', soupBase:null, drink:null, meatType:null, addOns:{} };
  }
  return getItem(d.id);
}

function changeQty(id, delta){
  const d = MENU_BY_ID[id];
  if(d && isAddOnBrowsing(d)){
    changeAddOnQty(state.addOnTarget, id, delta);
    return;
  }
  const cur = getItem(id);
  const qty = Math.max(0, Math.min(20, cur.qty + delta));
  state.items[id] = { qty, spice: cur.spice, size: cur.size, excludes: cur.excludes, cookMethod: cur.cookMethod, soupBase: cur.soupBase, drink: cur.drink, meatType: cur.meatType, addOns: cur.addOns };
  if(delta > 0 && qty > cur.qty) celebrateAddToCart();
  updateItemUI(id);
  pushSharedCartItem(id);
  // 自选火锅米线只是个空碗，选它的一瞬间就带客人去午市点餐挑配菜
  if(id === CUSTOM_RICE_NOODLES_ID && delta > 0 && cur.qty === 0){
    promptCustomRiceNoodlesPicks();
  }
  // 迷你火锅同理：选了它就直接带客人去加菜，凑够10件配菜
  if(id === MINI_HOTPOT_ID && delta > 0 && cur.qty === 0){
    promptMiniHotpotPicks();
  }
}

// “加菜”配菜的数量挂在目标菜品（冒菜/火锅米线）身上的 addOns 里，同一份配菜
// 分别加给两份不同的菜时要各自计数，所以不能存进配菜自己的全局数量里
function changeAddOnQty(targetId, lpId, delta){
  const target = getItem(targetId);
  if(target.qty <= 0) return;
  const addOns = Object.assign({}, target.addOns);
  const cur = addOns[lpId] || 0;
  const qty = Math.max(0, Math.min(20, cur + delta));
  if(qty <= 0) delete addOns[lpId]; else addOns[lpId] = qty;
  state.items[targetId] = Object.assign({}, target, { addOns });
  if(delta > 0 && qty > cur) celebrateAddToCart();
  updateItemUI(lpId);
  pushSharedCartItem(targetId);
}

function setSpice(id, level){
  const cur = getItem(id);
  if(cur.qty <= 0) return;
  // 番茄/菌汤这类不辣的锅底，辣度那一行是灰的，不接受点击
  if(LUNCH_FLAVOR_DISH_IDS.includes(id) && !SPICE_ELIGIBLE_SOUP_KEYS.includes(cur.soupBase)) return;
  state.items[id] = { qty: cur.qty, spice: level, size: cur.size, excludes: cur.excludes, cookMethod: cur.cookMethod, soupBase: cur.soupBase, drink: cur.drink, meatType: cur.meatType, addOns: cur.addOns };
  updateItemUI(id);
  pushSharedCartItem(id);
}

function setSoupBase(id, key){
  const cur = getItem(id);
  if(cur.qty <= 0) return;
  // 换成不辣的锅底（番茄/菌汤）时，之前选的辣度就不作数了，清掉避免带着一个选不了的辣度去下单
  const spice = SPICE_ELIGIBLE_SOUP_KEYS.includes(key) ? cur.spice : null;
  state.items[id] = { qty: cur.qty, spice, size: cur.size, excludes: cur.excludes, cookMethod: cur.cookMethod, soupBase: key, drink: cur.drink, meatType: cur.meatType, addOns: cur.addOns };

  pushSharedCartItem(id);
}

// Patches just the affected dish card (+ cart badge/panel) instead of the
// full render(), so tapping qty/spice/size/exclude on the menu doesn't
// rebuild every dish photo on screen and flash the page.
function updateItemUI(id){
  if(state.screen !== 'menu'){ render(); return; }

  const card = document.querySelector(`.dish-card[data-id="${id}"]`);
  if(card){
    const body = card.querySelector('.dish-body');
    if(body) body.innerHTML = dishBodyHTML(MENU_BY_ID[id]);
    const extendSlot = card.querySelector('.dish-extend-slot');
    if(extendSlot) extendSlot.innerHTML = dishExtendHTML(MENU_BY_ID[id]);
  }

  if(state.cartPopupOpen){
    const body = document.getElementById('cart-side-body');
    if(body) body.innerHTML = cartSideBodyHTML();
  }

  const count = totalCount();
  const fab = document.querySelector('.cart-side-fab');
  if(fab){
    const badge = fab.querySelector('.cart-side-fab-badge');
    if(badge){
      badge.textContent = count;
      badge.classList.remove('bump');
      void badge.offsetWidth;
      badge.classList.add('bump');
    }
  }
  const orderBtn = document.querySelector('.order-now-btn');
  if(orderBtn) orderBtn.disabled = count === 0;
}

function setCategory(cat){
  if(cat !== 'lunchPieces') state.addOnTarget = null;

  render();
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const behavior = reduceMotion ? 'auto' : 'smooth';
  const dishList = document.querySelector('.dish-list');
  const firstEl = dishList && dishList.firstElementChild;
  if(firstEl) firstEl.scrollIntoView({ behavior, block: 'start' });

function setMenuView(view){

function scrollDishListIntoView(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const behavior = reduceMotion ? 'auto' : 'smooth';
  const dishList = document.querySelector('.dish-list');
  const firstEl = dishList && dishList.firstElementChild;

function flashCategoryNav(cat){

  if(!btn) return;

  btn.classList.remove('flash-warn');
  void btn.offsetWidth;   // restart the animation if it's already flashing
  btn.classList.add('flash-warn');
}

function showNagToast(msg, kind){

  const toast = document.createElement('div');
  toast.className = 'nag-toast' + (kind === 'info' ? ' nag-toast-info' : '');
  toast.textContent = msg;
  document.body.appendChild(toast);
  toast.addEventListener('animationend', (ev)=>{ if(ev.target === toast) toast.remove(); });
}

// 下单前的最终把关：火锅生食材必须配一份锅底；自选火锅米线必须配午市点餐里的配菜；
// 冒菜/火锅米线必须选好辣度+汤底；单点“加菜”配菜不能脱离一个午餐类型单独下单
// bug fix：锅底送进厨房后，顾客再扫码回来只加菜，本地购物车 state.items 是全新的空对象，
// 看不到"锅底其实已经点过了"，会被误判成没点锅底又逼着重选一次。这里查一下本桌
// liveTableOrders（已经提交、还没被移出看板的所有订单，含厨房里正在做的）里是不是已经
// 有一份真正的锅底菜（排除蘸料），有的话这一轮点单就不用再强制选了。
function tableAlreadyHasSoupBase(){
  return liveTableOrders.some(o => !o.call && (o.items || []).some(it => {
    const dish = MENU_BY_ID[ZH_NAME_TO_ID[it.name]];
    return !!dish && dish.category === 'soupBase' && dish.sub !== 'dipSauce';
  }));
}

// 甜品/饮品推销只在本桌第一次下单时弹一次——查的是 liveTableOrders 而不是本机的
// state.upsellShown，所以不管顾客是同一台设备加菜、还是同桌换了另一台手机扫码，
// 只要这一桌已经有过正式订单（呼叫服务员的 call 单不算），后面都不会再弹，
// 免得每次点单都被推销一遍让人反感。这里没有额外等 liveTableOrdersLoaded：
// 选定桌号那一刻就订阅了，走到下单这一步时通常早就有数据了；真赶上极端情况下
// 还没加载出来，宁可漏推一次，也不要在明明点过单的桌子上又弹一次。
function tableHasPriorOrder(){
  return liveTableOrders.some(o => !o.call);
}

function validateCartForCheckout(){
  const hasQty = cats => MENU.some(d => cats.includes(d.category) && getItem(d.id).qty > 0);
  // "蘸料" 也挂在 soupBase 分类下（方便导航），但它是蘸碟不是锅底，不能当锅底数
  const hasSoupBase = MENU.some(d => d.category === 'soupBase' && d.sub !== 'dipSauce' && getItem(d.id).qty > 0)
    || tableAlreadyHasSoupBase();
  if(hasQty(HOTPOT_INGREDIENT_CATS) && !hasSoupBase){
    return { ok:false, view:'hotpot', category:'soupBase', message:t('missingSoupBaseMsg') };
  }

  for(const id of LUNCH_FLAVOR_DISH_IDS){
    const it = getItem(id);
    // 番茄/菌汤锅底不辣，不强制选辣度；其余口味（经典麻辣/骨汤/麻辣拌）辣度必选
    const spiceRequired = it.soupBase && SPICE_ELIGIBLE_SOUP_KEYS.includes(it.soupBase);
    // 冒菜套餐还得多选一样：牛肉/猪肉/海鲜/素食
    const meatTypeMissing = id === HOTPOT_BOWL_SET_ID && !it.meatType;
    // 只有午市套餐本身含饮品，才强制选饮料；单点的冒菜/火锅米线不含饮品，不做要求
    const drinkMissing = LUNCH_SET_DISH_IDS.includes(id) && !it.drink;
    if(it.qty > 0 && (!it.soupBase || drinkMissing || meatTypeMissing || (spiceRequired && !it.spice))){
      return { ok:false, view:'lunch', category: MENU_BY_ID[id].category, message:t('missingLunchFlavorMsg') };
    }
  }

  // 迷你火锅只需要选锅底（不用选辣度）
  for(const id of SOUP_BASE_ONLY_DISH_IDS){
    const it = getItem(id);
    if(it.qty > 0 && !it.soupBase){
      return { ok:false, view:'lunch', category: MENU_BY_ID[id].category, message:t('missingMiniHotpotSoupBaseMsg') };
    }
  }

  // bug fix：单独点“加菜”分类里的配菜（不是通过某份冒菜/火锅米线的加菜按钮加的），
  // 必须先选一个午餐类型（冒菜/火锅米线/自选米线/迷你火锅/午市套餐），否则厨房不知道这配菜该配给哪碗
  const hasLunchType = hasQty(['hotpotBowl']) || getItem(RICE_NOODLES_FIXED_ID).qty > 0 || getItem(CUSTOM_RICE_NOODLES_ID).qty > 0 || getItem(MINI_HOTPOT_ID).qty > 0 || LUNCH_SET_DISH_IDS.some(id => getItem(id).qty > 0);
  const hasStandaloneLunchPieces = MENU.some(d => d.category === 'lunchPieces' && (state.items[d.id] || {}).qty > 0);
  if(hasStandaloneLunchPieces && !hasLunchType){
    return { ok:false, view:'lunch', category:'hotpotBowl', message:t('missingLunchTypeMsg') };
  }

  if(getItem(CUSTOM_RICE_NOODLES_ID).qty > 0 && !hasQty(['lunchPieces'])){
    return { ok:false, view:'lunch', category:'lunchPieces', message:t('missingLunchPiecesMsg') };
  }

  // 迷你火锅锅底免费，但换来的是必须凑够最低10件配菜才能下单
  if(getItem(MINI_HOTPOT_ID).qty > 0){
    const lunchPiecesTotalQty = MENU
      .filter(d => d.category === 'lunchPieces')
      .reduce((s, d) => s + ((state.items[d.id] || {}).qty || 0), 0);
    if(lunchPiecesTotalQty < MINI_HOTPOT_MIN_FILLINGS){
      return { ok:false, view:'lunch', category:'lunchPieces', message:t('missingMiniHotpotFillingsMsg') };
    }
  }
  return { ok:true };
}

function showAllergenPopup(event, code){

}

// Removes any in-flight toast, killing its GSAP tweens first so a rapid
// double-tap on + doesn't leave an orphaned timeline running against a
// detached element.
function clearHotpotToast(){
  const existing = document.querySelector('.hotpot-toast');
  if(existing){
    gsap.killTweensOf(existing.querySelectorAll('*'));
    gsap.killTweensOf(existing);
    existing.remove();
  }
}

function celebrateAddToCart(){
  clearHotpotToast();

  const toast = document.createElement('div');
  toast.className = 'hotpot-toast';

    <svg class="fx-check" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
      <circle class="fx-check-pulse" cx="32" cy="32" r="24" fill="none" stroke="var(--jade)" stroke-width="2"/>
      <circle class="fx-check-circle" cx="32" cy="32" r="22" fill="var(--jade)"/>
      <path class="fx-check-mark" d="M21 33 L28.5 40.5 L44 23" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="hotpot-caption">${t('addedToCart')}</p>
  `;
  document.body.appendChild(toast);

  const circle = toast.querySelector('.fx-check-circle');
  const pulse = toast.querySelector('.fx-check-pulse');
  const mark = toast.querySelector('.fx-check-mark');
  const caption = toast.querySelector('.hotpot-caption');
  const cleanup = () => toast.remove();

  const markLen = mark.getTotalLength();
  gsap.set(mark, { strokeDasharray: markLen, strokeDashoffset: markLen });

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    gsap.set(toast, { xPercent: -50, autoAlpha: 1 });
    gsap.set(mark, { strokeDashoffset: 0 });
    gsap.set(pulse, { autoAlpha: 0 });
    gsap.set(caption, { autoAlpha: 1 });
    gsap.delayedCall(1.1, () => gsap.to(toast, { autoAlpha: 0, duration: 0.3, onComplete: cleanup }));
    return;
  }

  gsap.set(toast, { xPercent: -50, autoAlpha: 0, y: 8, scale: 0.9 });
  gsap.set(circle, { transformOrigin: '50% 50%', scale: 0 });
  gsap.set(pulse, { transformOrigin: '50% 50%', scale: 0.6, autoAlpha: 0 });
  gsap.set(caption, { autoAlpha: 0, y: 6 });

  // Circle pops in, the checkmark draws itself stroke-by-stroke, one pulse
  // ring confirms it — a compact status badge, not a scene.
  gsap.timeline({ onComplete: cleanup })
    .to(toast, { autoAlpha: 1, y: 0, scale: 1, duration: 0.25, ease: 'power2.out' }, 0)
    .to(circle, { scale: 1, duration: 0.32, ease: 'back.out(2.2)' }, 0.05)
    .to(mark, { strokeDashoffset: 0, duration: 0.28, ease: 'power2.out' }, 0.32)
    .fromTo(pulse, { autoAlpha: 0.55, scale: 0.7 }, { autoAlpha: 0, scale: 1.5, duration: 0.55, ease: 'power1.out' }, 0.34)
    .to(caption, { autoAlpha: 1, y: 0, duration: 0.25, ease: 'power2.out' }, 0.42)
    .to(toast, { autoAlpha: 0, y: -6, scale: 0.95, duration: 0.3, ease: 'power1.in' }, '+=0.5');
}

async function callWaiter(){
  if(state.callingWaiter || !state.table) return;
  state.callingWaiter = true;
  render();
  try{
    await withTimeout(ordersRef.add({
      table: state.table, items: [], createdAt: Date.now(),
      nickname: state.orderNickname || '', partySize: state.orderPartySize || 1,
      status: 'pending', call: true,
    }), 12000);
    celebrateCallWaiter();
  }catch(e){ alert(t('orderFailed')); }
  state.callingWaiter = false;
  render();
}

function setPartySize(delta){
  state.orderPartySize = Math.max(1, Math.min(50, state.orderPartySize + delta));

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function handlePlaceOrderClick(){
  if(totalCount() === 0 || state.submitting) return;
  const check = validateCartForCheckout();
  if(!check.ok){ jumpToCategoryWithWarning(check.view, check.category, check.message); return; }
  if(!state.upsellShown && !tableHasPriorOrder()){
    openUpsell();
  }else{
    submitOrder();
  }
}

// 只有午市套餐本身含一杯饮品，点了套餐的顾客下单前就不用再推饮品或酒水；
// 单点的冒菜/火锅米线不含饮品，仍然可以推，甜品则始终可以推
function upsellPool(){
  const hasLunchSetWithDrink = LUNCH_SET_DISH_IDS.some(id => getItem(id).qty > 0);
  return MENU.filter(d => (d.category === 'desserts' || ((d.category === 'drinks' || d.category === 'wine') && !hasLunchSetWithDrink)) && !isSoldOut(d.id));
}

function openUpsell(){
  const pool = upsellPool();
  if(pool.length === 0){
    state.upsellShown = true;
    submitOrder();
    return;
  }
  state.upsellItems = shuffle(pool.map(d => d.id)).slice(0, 4);
  state.upsellSelected = {};
  state.upsellOpen = true;
  render();
}

// “换一批”：换成另外 4 个随机推荐，规则跟打开弹窗时一样（点了含饮品的午市套餐就不会换出酒水/饮料）。
// 只重画格子本身，弹窗其余部分（标题、按钮）不用跟着重建。
function shuffleUpsell(event){
  const pool = upsellPool();
  if(pool.length === 0) return;
  state.upsellItems = shuffle(pool.map(d => d.id)).slice(0, 4);
  state.upsellSelected = {};
  const grid = document.querySelector('.upsell-grid');
  if(grid) grid.innerHTML = upsellTilesHTML();
  const btn = event && event.currentTarget;
  if(btn){
    btn.classList.remove('spinning');
    void btn.offsetWidth;
    btn.classList.add('spinning');
  }
}

// Patches just the tapped tile's selected state instead of a full render(),
// so tapping a photo to select it doesn't rebuild (and flash) every photo
// in the upsell grid.
function toggleUpsellItem(id){
  state.upsellSelected[id] = !state.upsellSelected[id];
  const tile = document.querySelector(`.upsell-tile[data-id="${id}"]`);
  if(tile) tile.classList.toggle('selected', state.upsellSelected[id]);
}

function confirmUpsellAdd(){
  Object.keys(state.upsellSelected).forEach(id => {
    if(!state.upsellSelected[id]) return;
    const cur = getItem(id);
    state.items[id] = { qty: cur.qty + 1, spice: cur.spice, size: cur.size, excludes: cur.excludes };
    pushSharedCartItem(id);
  });
  state.upsellOpen = false;
  state.upsellShown = true;   // resolved: pressing 立刻下单 again on the mirrored review page submits for real, no re-prompt
  render();
}

function skipUpsell(){
  state.upsellOpen = false;
  state.upsellShown = true;   // resolved: submit immediately with no drinks/dessert added
  render();
  submitOrder();
}

// On the menu screen the button is docked inline in the header

// Everywhere else it falls back to the fixed #panda-nav root. Either way,
// toggling the dropdown only repaints that one slot, not the whole screen
// behind it (so the menu's dish cards never flash/re-mount).

function togglePandaMenu(){

function closePandaMenu(){

    return s + v.qty + addOnQty;

async function fetchTableOrders(table){
  try{
    const snap = await withTimeout(ordersRef.where('table', '==', String(table)).get(), 8000);
    return snap.docs.map(d => d.data());
  }catch(e){ return []; }
}

// 同一桌可能有多笔未处理订单（加菜），按“菜名+辣度+份量”合并数量，方便顾客看到本桌目前的点单全貌
function mergeItems(ordersList){
  const merged = new Map();
  ordersList.forEach(o => {
    o.items.forEach(it => {
      const key = it.name + '__' + it.spice + '__' + (it.size || '') + '__' + (it.cookMethod || '') + '__' + (it.soupBase || '') + '__' + (it.drink || '') + '__' + (it.forDish || '');
      if(!merged.has(key)) merged.set(key, { name: it.name, spice: it.spice, size: it.size || null, cookMethod: it.cookMethod || null, soupBase: it.soupBase || null, drink: it.drink || null, forDish: it.forDish || null, price: it.price, qty: 0 });
      merged.get(key).qty += it.qty;
    });
  });
  return Array.from(merged.values());
}

async function submitOrder(){
  if(state.submitting || totalCount() === 0) return;
  state.submitting = true; render();

  const items = [];
  MENU.forEach(d => {
    const it = getItem(d.id);
    if(it.qty > 0){
      const entry = { name: dishZhName(d, it), qty: it.qty, price: dishUnitPrice(d, it) };
      if(d.spicy) entry.spice = it.spice;
      if(d.sizes) entry.size = it.size || d.sizes[0].key;
      if(d.category === 'dumplings') entry.cookMethod = it.cookMethod || 'steamed';
      if(SOUP_BASE_DISH_IDS.includes(d.id)) entry.soupBase = it.soupBase;
      if(LUNCH_FLAVOR_DISH_IDS.includes(d.id)) entry.drink = it.drink;
      const excludeKeys = Object.keys(it.excludes || {}).filter(k => it.excludes[k]);
      if(excludeKeys.length) entry.excludes = excludeKeys;
      items.push(entry);
    }
    // “加菜”配菜挂在这份菜身上，落单时拆成独立菜品行，并标出是给哪份菜加的，
    // 方便购物车/订单/厨房看到是谁点的加菜
    if(it.addOns){
      Object.keys(it.addOns).forEach(lpId => {
        const qty = it.addOns[lpId];
        if(qty <= 0) return;
        const lpDish = MENU_BY_ID[lpId];
        if(!lpDish) return;
        items.push({ name: zhDishName(lpId), qty, price: dishUnitPrice(lpDish, {}), forDish: dishZhName(d, it) });
      });
    }
  });

  const order = {
    table: state.table, items, createdAt: Date.now(),
    nickname: state.orderNickname || '', partySize: state.orderPartySize || 1,
  };

  try{
    const priorOrders = await fetchTableOrders(state.table);
    const isAddOn = priorOrders.length > 0;

    const docRef = await withTimeout(ordersRef.add({
      table: order.table,
      items: order.items,
      createdAt: order.createdAt,
      nickname: order.nickname,
      partySize: order.partySize,
      status: 'pending',
    }), 12000);

    const tableOrders = await fetchTableOrders(state.table);
    const summaryItems = mergeItems(tableOrders.length > 0 ? tableOrders : [...priorOrders, order]);

    state.lastOrder = {
      table: order.table, items: order.items, summaryItems, isAddOn,
      nickname: order.nickname, partySize: order.partySize,
      docId: docRef.id, status: 'pending', removed: false,
    };
    // 这一轮共享购物车草稿已经变成正式订单了，立刻清空——不然同桌其他设备还会
    // 看着这些菜"待点"，容易重复加、重复下单
    clearSharedCart();
    screenHistory.push('menu');
    state.screen = 'confirm';
  }catch(e){
    alert(t('orderFailed'));
  }
  state.submitting = false;
  render();
}

function flameIcons(n){
  let out = '';
  for(let i=0;i<3;i++){
    out += `<svg class="flame ${i<n?'lit':''}" viewBox="0 0 24 24" width="11" height="11">
      <path d="M12 2c1 3-3 4-3 7a3 3 0 006 0c0-1-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-4 3-5 5-9z"/>
    </svg>`;
  }
  return out;
}

let chefCarouselTimer = null;
let chefCarouselIndex = 0;

function stopChefCarousel(){
  if(chefCarouselTimer){ clearInterval(chefCarouselTimer); chefCarouselTimer = null; }
}

function startChefCarousel(){
  if(chefCarouselTimer || CHEF_ITEMS.length < 2) return;
  chefCarouselTimer = setInterval(()=>{
    const visibleChefItems = CHEF_ITEMS.filter(d=>isDishVisible(d.id));
    if(visibleChefItems.length === 0) return;
    chefCarouselIndex = (chefCarouselIndex + 1) % visibleChefItems.length;
    const d = visibleChefItems[chefCarouselIndex];
    const name = tDish(d.id,'name');
    const img = document.getElementById('chef-carousel-photo');
    const cap = document.getElementById('chef-carousel-caption');
    if(!img || !cap) return;
    img.style.opacity = 0;
    cap.style.opacity = 0;
    setTimeout(()=>{
      img.src = d.img;
      img.alt = name;
      cap.textContent = name;
      img.style.opacity = 1;
      cap.style.opacity = 1;
    }, 300);
  }, 3000);
}

// Everything that only shows up once qty>0 (spice level, soup-base pick,
// meat type, drink pick, cook method, options) lives in one "extension"
// note below the card row — a divider, then an inset slip — instead of
// stretching/recentering the row itself the instant the + button is tapped.
// Self-contained (recomputes it/flags) so dishCardHTML and updateItemUI can
// both call it without threading state through dishBodyHTML.
function dishExtendHTML(d){
  const inAddOnMode = isAddOnBrowsing(d);
  const it = inAddOnMode ? getEffectiveItem(d) : getItem(d.id);
  if(it.qty<=0) return '';
  const isLunchFlavorDish = LUNCH_FLAVOR_DISH_IDS.includes(d.id);
  const isLunchSetDish = LUNCH_SET_DISH_IDS.includes(d.id);
  const isHotpotBowlSet = d.id === HOTPOT_BOWL_SET_ID;
  const hasSoupBaseRow = SOUP_BASE_DISH_IDS.includes(d.id);
  const rows = `
    ${d.spicy && !isLunchFlavorDish && !inAddOnMode ? `
      <div class="spice-row">
        ${SPICE_LEVELS.map((lvl,i)=>`
          <button class="spice-pill ${it.spice===lvl?'active':''}" onclick="setSpice('${d.id}','${lvl}')">
            <span class="flames">${flameIcons(i+1)}</span><span class="spice-label">${tSpice(i)}</span>
          </button>`).join('')}
      </div>` : ''}
    ${isHotpotBowlSet && !inAddOnMode ? hotpotBowlMeatRowHTML(d, it) : ''}
    ${hasSoupBaseRow ? `
      <div class="spice-row">
        ${LUNCH_FLAVOR_SOUP_KEYS[d.id].map(key=>`
          <button class="spice-pill ${it.soupBase===key?'active':''}" onclick="setSoupBase('${d.id}','${key}')">
            <span class="spice-label">${tSoupBase(key)}</span>
          </button>`).join('')}
      </div>` : ''}
    ${isLunchFlavorDish && !inAddOnMode ? lunchSpiceRowHTML(d, it) : ''}
    ${isLunchSetDish && !inAddOnMode ? lunchDrinkRowHTML(d, it) : ''}
    ${d.category==='dumplings' ? `
      <div class="spice-row">
        ${['steamed','panFried'].map(m=>`
          <button class="spice-pill ${(it.cookMethod||'steamed')===m?'active':''}" onclick="setCookMethod('${d.id}','${m}')">
            <span class="spice-label">${tCookMethod(m)}</span>
          </button>`).join('')}
      </div>` : ''}
    ${d.options.length>0 && !inAddOnMode ? optionsRowHTML(d, it) : ''}`;
  return rows.trim() ? `<div class="dish-extend"><div class="dish-extend-note">${rows}</div></div>` : '';
}

function dishBodyHTML(d){

            <span class="cart-btn-title">${state.callingWaiter ? t('calling') : t('callWaiter')}</span>
            <span class="cart-btn-sub">${t('callWaiterSub')}</span>

          <button class="order-now-btn${isLatinLang?' latin':''}${state.lang==='en'?' lang-en':''}" onclick="goToOrderReview()" ${count===0?'disabled':''}>

function orderLineHTML({name, qty, spice, price, extra}){
  const lineTotal = price != null ? formatPrice(price * qty) : '';
  const bottomBits = (spice ? `<span class="spice-tag">${spice}</span>` : '') + (extra || '');
  return `<li class="order-line">
    <div class="order-line-top">
      <span class="order-line-name">${name} × ${qty}</span>
      ${lineTotal ? `<span class="order-line-price">${lineTotal}</span>` : ''}
    </div>
    ${bottomBits ? `<div class="order-line-bottom">${bottomBits}</div>` : ''}
  </li>`;
}
function totalRowHTML(total){
  return `<li class="order-total-line"><span>${t('totalLabel')}</span><span>${formatPrice(total)}</span></li>`;
}
function editableOrderSummaryHTML(items, total){
  return `<ul class="order-summary">
    ${items.map(it=>`
      <li class="order-line${it.isAddOn ? ' order-line-addon' : ''}">
        <div class="order-line-top">
          <span class="order-line-name">${it.name}</span>
          <span class="order-line-price">${formatPrice(it.price*it.qty)}</span>
        </div>
        <div class="order-line-bottom">
          ${it.spicy && it.spice ? `<span class="spice-tag">${displaySpice(it.spice)}</span>` : ''}
          ${it.sizeLabel ? `<span class="spice-tag">${it.sizeLabel}</span>` : ''}
          ${it.cookMethodLabel ? `<span class="spice-tag">${it.cookMethodLabel}</span>` : ''}
          ${it.soupBaseLabel ? `<span class="spice-tag">${it.soupBaseLabel}</span>` : ''}
          ${it.drinkLabel ? `<span class="spice-tag">${it.drinkLabel}</span>` : ''}
          ${it.forDish ? `<span class="spice-tag add-on-tag">${t('addOnTagPrefix')}${it.forDish}</span>` : ''}
          ${it.excludeTags}
          <span class="stepper">
            <button onclick="${it.isAddOn ? `changeAddOnQty('${it.ownerId}','${it.id}',-1)` : `changeQty('${it.id}',-1)`}" aria-label="${t('decreaseQty')}">−</button>
            <span class="qty">${it.qty}</span>
            <button onclick="${it.isAddOn ? `changeAddOnQty('${it.ownerId}','${it.id}',1)` : `changeQty('${it.id}',1)`}" aria-label="${t('increaseQty')}">+</button>
          </span>
        </div>
      </li>`).join('')}
    ${totalRowHTML(total)}

}
function excludesTagsHTML(excludes){
  if(!excludes || excludes.length === 0) return '';
  return excludes.map(k => `<span class="spice-tag">${tOption(k)}</span>`).join('');
}

function myOrderHTML(){

              ${items.map(it=>{

                return orderLineHTML({
                  name: displayDishName(it.name),

function cartItemsForCheckout(){
  const out = [];
  MENU.forEach(d => {
    const it = getItem(d.id);
    if(it.qty > 0){
      out.push({
        id: d.id, name: dishDisplayName(d, it), qty: it.qty, spice: it.spice, spicy: d.spicy,
        price: dishUnitPrice(d, it),
        sizeLabel: d.sizes ? tSize(it.size || d.sizes[0].key) : null,
        cookMethodLabel: d.category==='dumplings' ? tCookMethod(it.cookMethod || 'steamed') : null,
        soupBaseLabel: SOUP_BASE_DISH_IDS.includes(d.id) ? tSoupBase(it.soupBase) : null,
        drinkLabel: LUNCH_FLAVOR_DISH_IDS.includes(d.id) ? tDrink(it.drink) : null,
        excludeTags: excludesTagsHTML(Object.keys(it.excludes||{}).filter(k=>it.excludes[k])),
      });
    }
    if(it.addOns){
      Object.keys(it.addOns).forEach(lpId => {
        const qty = it.addOns[lpId];
        if(qty <= 0) return;
        const lpDish = MENU_BY_ID[lpId];
        if(!lpDish) return;
        out.push({
          id: lpId, name: tDish(lpId,'name'), qty,
          price: dishUnitPrice(lpDish, {}),
          isAddOn: true, ownerId: d.id, forDish: dishDisplayName(d, it),
          excludeTags: '',
        });
      });
    }
  });
  return out;
}

  return `

              price: it.price,
              extra: (it.size ? `<span class="spice-tag">${tSize(it.size)}</span>` : '') + (it.cookMethod ? `<span class="spice-tag">${tCookMethod(it.cookMethod)}</span>` : '') + (it.soupBase ? `<span class="spice-tag">${tSoupBase(it.soupBase)}</span>` : '') + (it.drink ? `<span class="spice-tag">${tDrink(it.drink)}</span>` : '') + excludesTagsHTML(it.excludes) + (it.forDish ? `<span class="spice-tag add-on-tag">${t('addOnTagPrefix')}${displayDishName(it.forDish)}</span>` : ''),
            });

        <button class="text-link-btn" onclick="resetToMenu()">${t('continueOrdering')} →</button>
