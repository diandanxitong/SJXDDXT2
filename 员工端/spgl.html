<style>
  :root{
    --paper:#FDFCF9;
    --paper-tint:#F7F2EA;
    --ink:#1C1712;
    --ink-soft:#736A60;
    --ink-faint:#B3A99C;
    --brand:#AA0101;
    --brand-tint:#F7E9E4;
    --hairline:#E6E0D6;
    --ok:#1F7A4D;
    --ok-tint:#E8F2EC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;padding:26px 30px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}

  .top-nav{margin-bottom:20px;display:flex;gap:16px;}
  .top-nav a{font-size:13px;color:var(--ink-soft);text-decoration:none;font-weight:500;}
  .top-nav a:hover{color:var(--brand);}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:14px;}
  header h1{font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;}
  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .stat-line{font-size:12px;color:var(--ink-soft);margin-bottom:24px;}
  .stat-line b{color:var(--ink);font-weight:700;}

  .btn{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    padding:9px 16px;border-radius:6px;white-space:nowrap;
    text-decoration:none;display:inline-block;
  }
  .btn:disabled{opacity:.4;cursor:default;}
  .btn-outline{background:none;border:1px solid var(--hairline);color:var(--ink-soft);}
  .btn-outline:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-primary{background:var(--ink);border:1px solid var(--ink);color:var(--paper);}
  .btn-primary:hover{background:var(--brand);border-color:var(--brand);}
  .btn-danger-outline{background:none;border:1px solid var(--brand);color:var(--brand);}
  .btn-danger-outline:hover{background:var(--brand-tint);}
  .btn-danger{background:var(--brand);border:1px solid var(--brand);color:#fff;}
  .btn-danger:hover{background:#8C0101;}
  .btn-ok-outline{background:none;border:1px solid var(--ok);color:var(--ok);}
  .btn-ok-outline:hover{background:var(--ok-tint);}

  .filter-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .filter-label{font-size:12px;color:var(--ink-soft);}
  select{
    font-family:inherit;font-size:13px;color:var(--ink);
    padding:8px 12px;border-radius:6px;border:1px solid var(--hairline);background:var(--paper);
    cursor:pointer;
  }
  select:focus{outline:none;border-color:var(--brand);}
  .search-bar{position:relative;max-width:260px;flex:1;min-width:180px;}
  .search-bar input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--hairline);
    color:var(--ink);font-family:inherit;font-size:14px;padding:8px 26px 8px 2px;
  }
  .search-bar input::placeholder{color:var(--ink-faint);}
  .search-bar input:focus{outline:none;border-bottom-color:var(--brand);}
  .search-clear-btn{
    position:absolute;right:2px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;border:none;background:none;
    color:var(--ink-faint);font-size:14px;cursor:pointer;display:none;
    align-items:center;justify-content:center;
  }
  .search-clear-btn.visible{display:flex;}
  .search-clear-btn:hover{color:var(--ink);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-weight:600;color:var(--ink-soft);font-size:12px;
    padding:9px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap;
  }
  thead th.num{text-align:right;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle;}
  tbody td.num{text-align:right;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-tint);}
  tr.row-deleted{opacity:.45;}
  tr.row-deleted .dish-name{text-decoration:line-through;}
  tr.row-new td:first-child{border-left:2px solid var(--ok);}
  .data-table-wrap{border:1px solid var(--hairline);overflow-x:auto;}
  .dish-name{font-weight:600;}
  .row-actions{display:flex;gap:8px;justify-content:flex-end;}
  .row-actions button{
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:none;border:none;
    color:var(--ink-soft);padding:2px 0;
  }
  .row-actions button:hover{color:var(--brand);}
  .tag{font-size:11px;font-weight:700;white-space:nowrap;}
  .tag-sold-out{color:var(--brand);}
  .tag-sizes{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .tag-new{color:var(--ok);}
  .empty-hint{color:var(--ink-soft);font-size:13px;padding:24px 2px;max-width:520px;line-height:1.6;}

  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;flex-wrap:wrap;border-top:1px solid var(--hairline);}
  .pager-status{font-size:12px;color:var(--ink-soft);}
  .pager-btn{
    font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;
    padding:6px 12px;border-radius:6px;
    background:none;border:1px solid var(--hairline);color:var(--ink-soft);
  }
  .pager-btn:hover:not(:disabled){color:var(--ink);border-color:var(--ink-soft);}
  .pager-btn:disabled{opacity:.35;cursor:default;}

  .modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(28,23,18,.5);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{
    background:var(--paper);border:1px solid var(--hairline);border-radius:2px;
    padding:26px 24px 24px;max-width:380px;width:100%;
  }
  .modal-title{font-size:15px;font-weight:700;margin-bottom:18px;}
  .field{margin-bottom:18px;}
  .field-label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-weight:500;}
  .field-input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--hairline);
    color:var(--ink);font-family:inherit;font-size:14px;padding:8px 2px;
  }
  .field-input:focus{outline:none;border-bottom-color:var(--brand);}
  .field-note{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}
  .field-error{font-size:12px;color:var(--brand);margin:-4px 0 12px;min-height:1.2em;}
  .confirm-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;line-height:1.6;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;padding:11px;}
</style>
</head>

const BASE_BY_ID = {};
BASE_CATALOG.forEach(d => { BASE_BY_ID[d.id] = d; });

const menuOverridesRef = db.collection('menuOverrides');
const menuStatusRef = db.collection('menuStatus').doc('soldOut');

let overridesById = new Map();   // dishId -> override doc（含 id 字段）
let soldOutIds = new Set();
let loaded = false;
let categoryFilter = 'all';
let searchQuery = '';
let modal = null;      // null | {type:'edit', id} | {type:'add'} | {type:'delete', id, isNew} | {type:'restore', id}
let saveError = '';
let page = 0;
const PAGE_SIZE = 20;

let loadError = '';

menuOverridesRef.onSnapshot(snap => {
  overridesById = new Map(snap.docs.map(d => [d.id, Object.assign({ id: d.id }, d.data())]));
  loaded = true;
  loadError = '';
  render();
}, err => {
  // 最常见的原因：firebase/firestore.rules 里加了 menuOverrides 这段规则，
  // 但还没在 Firebase 控制台手动发布——这里明确提示，别让页面看着像是空白坏掉了
  loaded = true;
  loadError = err && err.code === 'permission-denied'
    ? 'Firestore 安全规则还没有更新（menuOverrides 这段规则需要在 Firebase 控制台手动发布一次），暂时无法读取商品数据。'
    : `加载失败：${err && err.message ? err.message : err}`;
  render();
});

menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  render();
}, err => {});

// 合并出"现在菜单上一共有哪些商品"：内置目录 + 覆盖/新增，跟 customer.html 里
// rebuildMenu() 的思路一样，只是这里要展示的字段更少（不需要多语言、过敏原等）
function mergedRows(){
  const rows = BASE_CATALOG.map(d => {
    const o = overridesById.get(d.id);
    const sizes = d.sizes
      ? d.sizes.map(s => (o && o.sizePrices && typeof o.sizePrices[s.key] === 'number')
          ? Object.assign({}, s, { price: o.sizePrices[s.key] })
          : s)
      : null;
    return {
      id: d.id,
      category: (o && o.category) || d.category,
      name: (o && o.name) || d.name,
      price: sizes ? null : ((o && typeof o.price === 'number') ? o.price : d.price),
      sizes,
      deleted: !!(o && o.deleted),
      isNew: false,
      hasOverride: !!o,
    };
  });
  overridesById.forEach(o => {
    if(o.isNew){
      rows.push({
        id: o.id, category: o.category || 'snacks', name: o.name || o.id,
        price: typeof o.price === 'number' ? o.price : 0, sizes: null,
        deleted: false, isNew: true, hasOverride: true,
      });
    }
  });
  return rows;
}

function setCategoryFilter(cat){
  categoryFilter = cat;
  page = 0;
  renderList();
}
function onSearchInput(value){
  searchQuery = value;
  page = 0;
  document.getElementById('searchClearBtn').classList.toggle('visible', searchQuery.length > 0);
  renderList();
}
function clearSearch(){
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  document.getElementById('searchClearBtn').classList.remove('visible');
  page = 0;
  renderList();
}
function firstPage(){ if(page > 0){ page = 0; renderList(); } }
function prevPage(){ if(page > 0){ page--; renderList(); } }
function nextPage(totalPages){ if(page < totalPages - 1){ page++; renderList(); } }

function categoryFilterOptionsHTML(){
  const opts = ['<option value="all">全部分类</option>']
    .concat(CATEGORY_ORDER.map(cat => `<option value="${cat}" ${categoryFilter === cat ? 'selected' : ''}>${CATEGORY_LABELS[cat]}</option>`));
  return opts.join('');
}

function formatPrice(v){ return v == null ? '' : '€' + v.toFixed(2); }
function sizeLabel(key){ return SIZE_LABELS[key] || key; }
function sizesPriceHTML(sizes){
  return sizes.map(s => `${sizeLabel(s.key)} ${formatPrice(s.price)}`).join(' / ');
}

function rowHTML(r){
  const rowClass = [r.deleted ? 'row-deleted' : '', r.isNew ? 'row-new' : ''].filter(Boolean).join(' ');
  const soldOut = soldOutIds.has(r.id);
  const priceCell = r.sizes
    ? `<span class="tag-sizes">${sizesPriceHTML(r.sizes)}</span>`
    : formatPrice(r.price);
  const actions = r.deleted
    ? `<button onclick="openRestoreModal('${r.id}')">恢复</button>`
    : `<button onclick="openEditModal('${r.id}')">编辑</button><button onclick="openDeleteModal('${r.id}', ${r.isNew})">删除</button>`;
  return `
    <tr class="${rowClass}">
      <td class="dish-name">${escapeHtml(r.name)}</td>
      <td>${CATEGORY_LABELS[r.category] || r.category}</td>
      <td class="num">${priceCell}</td>
      <td>
        ${r.isNew ? '<span class="tag tag-new">新增</span>' : ''}
        ${soldOut ? '<span class="tag tag-sold-out">已沽清</span>' : ''}
      </td>
      <td><div class="row-actions">${actions}</div></td>
    </tr>`;
}

function renderList(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = ''; return; }
  if(loadError){
    document.getElementById('stat-line').textContent = '';
    app.innerHTML = `<p class="empty-hint">⚠ ${escapeHtml(loadError)}</p>`;
    return;
  }
  const catSelect = document.getElementById('categoryFilter');
  if(catSelect) catSelect.innerHTML = categoryFilterOptionsHTML();

  const q = searchQuery.trim().toLowerCase();
  const rows = mergedRows().filter(r => {
    if(categoryFilter !== 'all' && r.category !== categoryFilter) return false;
    if(q && !r.name.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById('stat-line').innerHTML =
    `商品目录共 <b>${BASE_CATALOG.length + Array.from(overridesById.values()).filter(o=>o.isNew).length}</b> 项，当前筛选 <b>${rows.length}</b> 项`;

  if(rows.length === 0){
    app.innerHTML = `<p class="empty-hint">没有找到匹配的商品。</p>`;
    return;
  }
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(page >= totalPages) page = totalPages - 1;
  const pageRows = rows.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
  const pagerHTML = totalPages > 1 ? `
    <div class="pager">
      <button class="pager-btn" onclick="firstPage()" ${page===0?'disabled':''}>回到第一页</button>
      <button class="pager-btn" onclick="prevPage()" ${page===0?'disabled':''}>上一页</button>
      <span class="pager-status">第 ${page+1} / ${totalPages} 页 · 共 ${rows.length} 项</span>
      <button class="pager-btn" onclick="nextPage(${totalPages})" ${page===totalPages-1?'disabled':''}>下一页</button>
    </div>` : '';
  app.innerHTML = `<div class="data-table-wrap">
    <table>
      <thead><tr><th>菜品</th><th>分类</th><th class="num">价格</th><th>状态</th><th></th></tr></thead>
      <tbody>${pageRows.map(rowHTML).join('')}</tbody>
    </table>
    ${pagerHTML}
  </div>`;
}

function findRow(id){ return mergedRows().find(r => r.id === id); }

function openAddModal(){
  modal = { type: 'add' };
  saveError = '';
  renderModal();
}
function openEditModal(id){
  modal = { type: 'edit', id };
  saveError = '';
  renderModal();
}
function openDeleteModal(id, isNew){
  modal = { type: 'delete', id, isNew };
  renderModal();
}
function openRestoreModal(id){
  modal = { type: 'restore', id };
  renderModal();
}
function closeModal(){
  modal = null;
  renderModal();
}

function onSizeSelectChange(){
  const sel = document.getElementById('form-size-key');
  const opt = sel.selectedOptions[0];
  document.getElementById('form-price').value = parseFloat(opt.dataset.price).toFixed(2);
}

async function submitEditForm(){
  const row = findRow(modal.id);
  const name = (document.getElementById('form-name').value || '').trim();
  const category = document.getElementById('form-category').value;
  const priceInput = document.getElementById('form-price');
  const priceStr = priceInput ? priceInput.value.trim() : '';
  if(!name){ saveError = '请输入菜品名称'; renderModal(); return; }
  const payload = { category, name, updatedAt: Date.now() };
  if(row.sizes){
    const price = parseFloat(priceStr);
    if(!priceStr || isNaN(price) || price < 0){ saveError = '请输入正确的价格'; renderModal(); return; }
    const sizeKey = document.getElementById('form-size-key').value;
    const existing = overridesById.get(modal.id);
    const sizePrices = Object.assign({}, existing && existing.sizePrices, { [sizeKey]: price });
    payload.sizePrices = sizePrices;
  }else if(priceInput){
    const price = parseFloat(priceStr);
    if(!priceStr || isNaN(price) || price < 0){ saveError = '请输入正确的价格'; renderModal(); return; }
    payload.price = price;
  }
  try{
    if(row.isNew){
      await menuOverridesRef.doc(modal.id).set(Object.assign({ isNew: true }, payload));
    }else{
      await menuOverridesRef.doc(modal.id).set(payload, { merge: true });
    }
    modal = null;
    renderModal();
  }catch(e){
    saveError = '保存失败，请重试';
    renderModal();
  }
}

async function submitAddForm(){
  const name = (document.getElementById('form-name').value || '').trim();
  const category = document.getElementById('form-category').value;
  const priceStr = (document.getElementById('form-price').value || '').trim();
  const price = parseFloat(priceStr);
  if(!name){ saveError = '请输入菜品名称'; renderModal(); return; }
  if(!priceStr || isNaN(price) || price < 0){ saveError = '请输入正确的价格'; renderModal(); return; }
  const id = 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try{
    await menuOverridesRef.doc(id).set({ isNew: true, category, name, price, updatedAt: Date.now() });
    modal = null;
    renderModal();
  }catch(e){
    saveError = '保存失败，请重试';
    renderModal();
  }
}

async function confirmDelete(){
  const userEl = document.getElementById('del-auth-user');
  const passEl = document.getElementById('del-auth-pass');
  const userInput = (userEl && userEl.value || '').trim();
  const passInput = (passEl && passEl.value) || '';
  if(userInput !== 'admingk' || passInput !== '666666'){
    const err = document.getElementById('del-auth-error');
    if(err) err.textContent = '账号或密码错误';
    return;
  }
  const { id, isNew } = modal;
  modal = null;
  renderModal();
  try{
    if(isNew){
      await menuOverridesRef.doc(id).delete();
    }else{
      await menuOverridesRef.doc(id).set({ deleted: true, updatedAt: Date.now() }, { merge: true });
    }
  }catch(e){}
}

async function confirmRestore(){
  const { id } = modal;
  modal = null;
  renderModal();
  try{
    await menuOverridesRef.doc(id).update({
      deleted: firebase.firestore.FieldValue.delete(),
      updatedAt: Date.now(),
    });
  }catch(e){}
}

  return CATEGORY_ORDER.map(cat => `<option value="${cat}" ${selected === cat ? 'selected' : ''}>${CATEGORY_LABELS[cat]}</option>`).join('');
}

    root.innerHTML = `

          <div class="field">

          </div>
          <div class="field">
            <label class="field-label">分类</label>
            <select id="form-category" class="field-input">${categorySelectHTML(row.category)}</select>
          </div>
          ${row.sizes
            ? `<div class="field">
                <label class="field-label">规格</label>
                <select id="form-size-key" class="field-input" onchange="onSizeSelectChange()">
                  ${row.sizes.map(s => `<option value="${s.key}" data-price="${s.price}">${sizeLabel(s.key)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label class="field-label">价格（€）</label>
                <input type="text" inputmode="decimal" id="form-price" class="field-input" value="${row.sizes[0].price.toFixed(2)}" autocomplete="off">
              </div>`
            : `<div class="field">
                <label class="field-label">价格（€）</label>
                <input type="text" inputmode="decimal" id="form-price" class="field-input" value="${row.price.toFixed(2)}" autocomplete="off">
              </div>`}
          <p class="field-error">${saveError}</p>
          <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" onclick="submitEditForm()">保存</button>
          </div>
        </div>
      </div>`;
    document.getElementById('form-name').focus();
    return;
  }

  if(modal.type === 'delete'){
    const row = findRow(modal.id);
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
          <p class="modal-title">下架「${escapeHtml(row.name)}」？</p>
          <p class="confirm-sub">${modal.isNew ? '这是新增的菜品，删除后无法恢复。' : '下架后顾客扫码点单将看不到这道菜，随时可以在列表里点"恢复"。'}</p>
          <div class="field">
            <label class="field-label">管理员账号</label>
            <input type="text" id="del-auth-user" class="field-input" autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label">管理员密码</label>
            <input type="password" id="del-auth-pass" class="field-input" autocomplete="off" onkeydown="if(event.key==='Enter') confirmDelete()">
          </div>
          <p class="field-error" id="del-auth-error"></p>
          <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-danger" onclick="confirmDelete()">${modal.isNew ? '确认删除' : '确认下架'}</button>
          </div>
        </div>
      </div>`;
    return;
  }

  if(modal.type === 'restore'){
    const row = findRow(modal.id);
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
          <p class="modal-title">恢复「${escapeHtml(row.name)}」？</p>
          <p class="confirm-sub">恢复后这道菜会重新出现在顾客扫码点单的菜单里。</p>
          <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal()">取消</button>
            <button class="btn btn-ok-outline" onclick="confirmRestore()">确认恢复</button>
          </div>
        </div>
      </div>`;
  }
}

function render(){
  renderList();
  renderModal();
}

document.getElementById('categoryFilter').innerHTML = categoryFilterOptionsHTML();
render();
</script>
</body>
</html>
