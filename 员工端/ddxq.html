<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>订单详情</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121012;
    --card:#1C191A;
    --line:#332E2C;
    --text:#F5F1EC;
    --text-muted:#8E8883;
    --warn:#E8A23D;
    --urgent:#D2502F;
    --ok:#5FBE8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;padding:22px 26px 60px;
  }
  .top-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .control-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .control-btn:hover{color:var(--text);border-color:var(--text-muted);}
  .add-dish-btn{background:rgba(95,190,138,.16);border-color:var(--ok);color:var(--ok);font-weight:900;}
  .add-dish-btn:hover{background:rgba(95,190,138,.26);color:var(--ok);border-color:var(--ok);}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .title-block{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  header h1{font-family:'Archivo Black',sans-serif;font-size:30px;letter-spacing:.02em;}
  .status{color:var(--text-muted);font-size:13px;}
  .elapsed{
    font-size:12px;padding:4px 10px;border-radius:20px;
    background:rgba(255,255,255,.06);color:var(--text-muted);white-space:nowrap;
  }
  .elapsed.warn{color:var(--warn);}
  .elapsed.urgent{color:var(--urgent);}
  .confirmed-badge{
    font-size:11px;font-weight:700;color:var(--ok);border:1px solid rgba(95,190,138,.5);
    border-radius:20px;padding:3px 10px;white-space:nowrap;
  }

  .empty{margin-top:22vh;text-align:center;color:var(--text-muted);}
  .empty p{font-size:15px;margin-bottom:16px;}

  /* 两列布局：左边"新加菜品/待送入厨房"红框闪烁，右边"已处理/已送入厨房"绿框静止。
     每个 order 文档（一次下单或一次加菜）就是一个批次，各自一个 batch-box，
     不再跨批次合并同名菜品——批次本身已经是视觉上的分隔，合并反而会让"这批还没做"
     和"那批早就上了"混在一起看不清楚 */
  .columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;margin-bottom:8px;}
  @media (max-width:760px){ .columns{grid-template-columns:1fr;} }
  .column-title{font-size:14px;font-weight:900;color:var(--text-muted);margin-bottom:10px;}
  .column-empty{font-size:13px;color:var(--text-muted);padding:6px 2px 18px;}
  .batch-box{border-radius:16px;padding:14px 14px 12px;margin-bottom:12px;}
  .batch-pending{background:rgba(210,80,47,.10);border:2px solid var(--urgent);}
  @media (prefers-reduced-motion:no-preference){
    .batch-pending{animation:batch-flash 1.1s ease-in-out infinite;}
  }
  @keyframes batch-flash{
    0%,100%{box-shadow:0 0 0 0 rgba(210,80,47,.5);}
    50%{box-shadow:0 0 0 7px rgba(210,80,47,0);}
  }
  .batch-processed{background:rgba(95,190,138,.08);border:2px solid var(--ok);}
  .batch-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;}
  .batch-name{font-size:13px;font-weight:900;color:var(--text-muted);}
  .batch-time{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}
  .batch-pending .batch-time{color:var(--urgent);font-weight:700;}
  .item-list{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .item-list li{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:16px;padding:9px 12px;background:rgba(255,255,255,.04);border-radius:10px;
  }
  .item-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;min-width:0;}
  .item-list .qty{
    font-family:'Archivo Black',sans-serif;color:var(--warn);margin-right:8px;
  }
  .spice-tag{font-size:11.5px;color:var(--text-muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;}
  .exclude-tag{font-size:11.5px;color:var(--urgent);border:1px solid rgba(210,80,47,.5);border-radius:20px;padding:2px 9px;font-weight:700;}
  .for-dish-tag{font-size:11.5px;color:var(--warn);border:1px solid rgba(232,162,61,.5);border-radius:20px;padding:2px 9px;font-weight:700;}
  .item-del-btn{
    flex-shrink:0;width:26px;height:26px;border-radius:8px;
    border:1.5px solid var(--urgent);background:rgba(210,80,47,.12);color:var(--urgent);
    font-size:14px;font-weight:900;cursor:pointer;line-height:1;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .item-del-btn:hover{background:rgba(210,80,47,.24);}

  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .action-row button{
    flex:1;min-width:180px;padding:14px;border-radius:10px;font-size:15px;cursor:pointer;font-weight:900;
    font-family:inherit;
  }
  .confirm-btn{background:rgba(232,162,61,.14);border:1px solid var(--warn);color:var(--warn);}
  .confirm-btn:hover{background:rgba(232,162,61,.22);}
  .checkout-btn{background:rgba(95,190,138,.14);border:1px solid var(--ok);color:var(--ok);}
  .checkout-btn:hover{background:rgba(95,190,138,.24);}
  .order-del-btn{background:none;border:1px solid rgba(210,80,47,.5);color:var(--urgent);}
  .order-del-btn:hover{background:rgba(210,80,47,.12);}

  .confirm-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 22px 22px;max-width:320px;width:100%;text-align:center;
  }
  .confirm-question{font-size:17px;font-weight:900;margin-bottom:20px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-cancel-btn, .confirm-yes-btn{
    flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .confirm-cancel-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .confirm-cancel-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .confirm-yes-btn{background:rgba(210,80,47,.18);border:1px solid var(--urgent);color:var(--urgent);}
  .confirm-yes-btn:hover{background:rgba(210,80,47,.28);}
  .confirm-yes-btn:disabled{opacity:.4;cursor:default;}
  .delete-modal-detail{
    font-size:13px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;
    background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;text-align:left;
  }
  .operator-input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:14px;padding:11px 14px;margin-bottom:6px;
    text-align:left;
  }
  .operator-input:focus{outline:none;border-color:var(--urgent);}
  .operator-hint{font-size:11.5px;color:var(--text-muted);text-align:left;margin-bottom:16px;}
</style>
</head>
<body>
<nav class="top-nav">
  <a class="control-btn" href="sjxddxtygd.html">← 接单看板</a>

<header>
  <div class="title-block">
    <h1 id="table-title">桌 -</h1>
    <span class="confirmed-badge" id="confirmed-badge" hidden>已确认</span>
    <span class="elapsed" id="elapsed-pill"></span>
  </div>
  <span class="status" id="status">加载中…</span>
</header>
<div id="app"></div>

<div id="delete-modal"></div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: 'AIzaSyBaFx1ZYKzEKfQLKbnD9YE_X_EJnFXrxOE',
  authDomain: 'sjxddxt.firebaseapp.com',
  projectId: 'sjxddxt',
  storageBucket: 'sjxddxt.firebasestorage.app',
  messagingSenderId: '56738241418',
  appId: '1:56738241418:web:1ea87e2445e9d09e3d8673',
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.settings({ experimentalAutoDetectLongPolling: true });
const ordersRef = db.collection('orders');

const params = new URLSearchParams(location.search);
const table = params.get('table');
document.getElementById('table-title').textContent = table ? `桌 ${table}` : '未指定桌号';
document.getElementById('add-dish-link').href = `ygjc.html?table=${encodeURIComponent(table || '')}`;

const SIZE_LABELS_ZH = { half:'半份', whole:'整份', large:'大份', small:'小份', glass:'杯', bottle:'瓶' };
const OPTION_LABELS_ZH = { onion:'不要洋葱', scallion:'不要葱', ginger:'不要姜', cilantro:'不要香菜', meat:'不要肉' };
const COOK_METHOD_LABELS_ZH = { steamed:'蒸', panFried:'煎' };
const SOUP_BASE_LABELS_ZH = { tomato:'番茄', classicMala:'经典川味麻辣', boneBrothSpicy:'骨汤（辣）', boneBrothMild:'骨汤（不辣）', mushroom:'菌汤', malaBan:'麻辣拌' };
const DRINK_LABELS_ZH = { cola:'可乐/无糖可乐/健怡可乐', sevenUp:'七喜/无糖七喜', fanta:'芬达', jdb:'加多宝', aloe:'芦荟汁' };

function elapsedInfo(ts){
  const diffMs = Date.now() - ts;
  const mins = Math.floor(diffMs / 60000);
  let label, level;
  if(mins < 1){ label = '刚刚下单'; } else { label = mins + ' 分钟前'; }
  if(mins < 3){ level = 'normal'; }
  else if(mins < 6){ level = 'warn'; }
  else { level = 'urgent'; }
  return { label, level };
}

let orders = [];
let loaded = false;
let firstDetailSnapshot = true;   // 首次快照不算“新到的加菜”，不用触发自动滚动

if(table){
  ordersRef.where('table', '==', String(table)).onSnapshot(snap => {
    if(!firstDetailSnapshot){
      // 有新的待处理批次到达（新下单或新加菜，呼叫服务员的单子不算）：
      // 自动把页面滚回顶部，让员工一眼看到红框闪烁的新菜品
      const hasNewPending = snap.docChanges().some(ch =>
        ch.type === 'added' && !ch.doc.data().call && ch.doc.data().status !== 'confirmed');
      if(hasNewPending) window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    firstDetailSnapshot = false;

    orders = snap.docs.map(d => ({
      key: d.id, table: d.data().table, items: d.data().items, createdAt: d.data().createdAt,
      nickname: d.data().nickname || '', partySize: d.data().partySize || null,
      status: d.data().status || 'pending', call: !!d.data().call,
      confirmedAt: d.data().confirmedAt || null,
    })).sort((a,b) => a.createdAt - b.createdAt);
    loaded = true;
    document.getElementById('status').textContent = '实时更新：' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
    render();
  }, err => {
    document.getElementById('status').textContent = '连接异常，正在重试…';
  });
}else{
  loaded = true;
}

// 确认订单，推送给顾客端“已送入厨房”动画：这批菜从左边"新加菜品"红框
// 移到右边"已处理"绿框，并记下 confirmedAt，用来算"几分钟前已处理"
async function confirmToKitchen(keys){
  const now = Date.now();
  orders = orders.map(o => keys.includes(o.key) ? Object.assign({}, o, { status: 'confirmed', confirmedAt: now }) : o);
  render();
  try{
    const batch = db.batch();
    keys.forEach(key => batch.update(ordersRef.doc(key), { status: 'confirmed', confirmedAt: now }));
    await batch.commit();
  }catch(e){ /* onSnapshot 会在下一次推送时自动纠正 */ }
}

// 结账/菜已上齐：彻底移出看板
async function archiveOrder(keys){
  orders = orders.filter(o => !keys.includes(o.key));
  render();
  try{
    const batch = db.batch();
    keys.forEach(key => batch.delete(ordersRef.doc(key)));
    await batch.commit();
  }catch(e){ /* onSnapshot 会在下一次推送时自动纠正 */ }
}

// “结账”会误删还在用餐的桌，先弹窗二次确认
let confirmKeys = null;

function confirmLeave(keys){
  confirmKeys = keys;
  renderConfirmModal();
}

function cancelLeave(){
  confirmKeys = null;
  renderConfirmModal();
}

function confirmLeaveYes(){
  const keys = confirmKeys;
  confirmKeys = null;
  renderConfirmModal();
  // 先把这一桌的流水记进“今日盘点”，再删单——记账失败也不能卡住移除看板，
  // 所以这里不等它，且内部自己吞掉错误。这里不跳转页面：这两个请求还没落地
  // 就跳走的话，页面一卸载，请求可能被浏览器直接中断，流水/日志就丢了。
  // 结账后这一桌的订单会清空，下面 render() 自然会切到"暂无订单"的空状态，
  // 里面已经带了返回看板的链接，不用强制跳转。
  recordDailyCheckout(keys);
  archiveOrder(keys);
}

function todayKey(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// “今日盘点”流水：#001、#002……每天从 1 开始，靠 Firestore 事务原子地读计数器+1，
// 避免多个员工同时结账时编号冲突或重复
async function recordDailyCheckout(keys){
  const batchOrders = orders.filter(o => keys.includes(o.key));
  const items = [];
  batchOrders.forEach(o => (o.items || []).forEach(it => {
    items.push({ name: it.name, qty: it.qty, price: it.price || 0 });
  }));
  if(items.length === 0) return;
  const revenue = items.reduce((s, it) => s + it.price * it.qty, 0);
  const date = todayKey();
  try{
    await db.runTransaction(async tx => {
      const counterRef = db.collection('counters').doc('dailyOrderSeq');
      const snap = await tx.get(counterRef);
      const prev = snap.exists ? snap.data() : null;
      const seq = (prev && prev.date === date) ? prev.seq + 1 : 1;
      tx.set(counterRef, { date, seq });
      const recordRef = db.collection('dailyOrders').doc();
      tx.set(recordRef, { seq, date, table, items, revenue, archivedAt: Date.now() });
    });
  }catch(e){ /* 记账失败就不记了，不阻塞移除看板；今日盘点里会少这一笔，需要人工核对 */ }
}

function renderConfirmModal(){
  const el = document.getElementById('confirm-modal');
  if(!confirmKeys){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="confirm-overlay">
      <div class="confirm-box">
        <p class="confirm-question">确认顾客已经结账离开？</p>
        <div class="confirm-actions">
          <button class="confirm-cancel-btn" onclick="cancelLeave()">取消</button>
          <button class="confirm-yes-btn" onclick="confirmLeaveYes()">确认已离开</button>
        </div>
      </div>
    </div>`;
}

// 单品删除 / 整单删除：都要求先填操作人姓名才能确认，且都会记一条日志到
// staffActionLogs，供"员工操作日志"页面查看
let deleteModalCtx = null;   // null | { type: 'item'|'order', target, operatorName }

function requestDeleteItem(idx){
  const target = itemDeleteTargets[idx];
  if(!target) return;
  deleteModalCtx = { type: 'item', target, operatorName: '' };
  renderDeleteModal();
}

function requestDeleteOrder(idx){
  const target = orderDeleteTargets[idx];
  if(!target) return;
  deleteModalCtx = { type: 'order', target, operatorName: '' };
  renderDeleteModal();
}

function cancelDelete(){
  deleteModalCtx = null;
  renderDeleteModal();
}

// 操作人姓名只准填汉字和英文字母——不要数字、符号、空格，边打字边过滤掉
function sanitizeOperatorName(v){
  return (v || '').replace(/[^a-zA-Z一-龥]/g, '');
}

function updateDeleteOperatorName(v){
  if(!deleteModalCtx) return;
  const clean = sanitizeOperatorName(v);
  deleteModalCtx.operatorName = clean;
  const input = document.getElementById('operator-name-input');
  if(input && input.value !== clean) input.value = clean;
  const btn = document.getElementById('delete-confirm-btn');
  if(btn) btn.disabled = clean.trim().length === 0;
}

function confirmDelete(){
  if(!deleteModalCtx) return;
  const name = deleteModalCtx.operatorName.trim();
  if(!name) return;
  const { type, target } = deleteModalCtx;
  deleteModalCtx = null;
  renderDeleteModal();
  if(type === 'item') performDeleteItem(target, name);
  else performDeleteOrder(target, name);
}

function renderDeleteModal(){
  const el = document.getElementById('delete-modal');
  if(!deleteModalCtx){ el.innerHTML = ''; return; }
  const { type, target, operatorName } = deleteModalCtx;
  const question = type === 'item' ? '确认删除这道菜？' : '确认整单删除？';
  const detail = type === 'item'
    ? `桌 ${target.table} · ${target.name} × ${target.qty}`
    : `桌 ${target.table} · 共 ${target.items.length} 项：${target.items.map(it => `${it.name}×${it.qty}`).join('、')}`;
  el.innerHTML = `
    <div class="confirm-overlay">
      <div class="confirm-box">
        <p class="confirm-question">${question}</p>
        <p class="delete-modal-detail">${detail}</p>
        <input type="text" class="operator-input" id="operator-name-input" placeholder="请输入操作人员姓名，不填不能删除"
               value="${operatorName}" oninput="updateDeleteOperatorName(this.value)"
               onkeydown="if(event.key==='Enter' && this.value.trim()) confirmDelete()" autocomplete="off">
        <p class="operator-hint">仅支持汉字和英文字母</p>
        <div class="confirm-actions">
          <button class="confirm-cancel-btn" onclick="cancelDelete()">取消</button>
          <button class="confirm-yes-btn" id="delete-confirm-btn" onclick="confirmDelete()" ${operatorName.trim() ? '' : 'disabled'}>确认删除</button>
        </div>
      </div>
    </div>`;
  const input = document.getElementById('operator-name-input');
  if(input) input.focus();
}

async function logStaffAction(entry){
  try{
    await db.collection('staffActionLogs').add({
      action: entry.action, operator: entry.operator, table: entry.table,
      detail: entry.detail, createdAt: Date.now(),
    });
  }catch(e){ /* 日志写入失败不影响已经执行完的删除操作 */ }
}

// 删掉某个批次（某个 order 文档）里的某一道菜：现在批次之间不再合并显示，
// 直接按“这份文档的 items 数组第几项”定位删除，文档删空了就整份删除
async function performDeleteItem(target, operatorName){
  const { docKey, itemIdx, name, qty } = target;
  const order = orders.find(o => o.key === docKey);
  if(!order) return;
  const items = order.items || [];
  const newItems = items.slice(0, itemIdx).concat(items.slice(itemIdx + 1));
  orders = orders.map(o => o.key === docKey ? Object.assign({}, o, { items: newItems }) : o);
  render();
  try{
    if(newItems.length === 0) await ordersRef.doc(docKey).delete();
    else await ordersRef.doc(docKey).update({ items: newItems });
  }catch(e){ /* onSnapshot 会在下一次推送时自动纠正 */ }
  logStaffAction({ action: 'deleteItem', operator: operatorName, table, detail: `${name} × ${qty}` });
}

async function performDeleteOrder(target, operatorName){
  const { keys, items } = target;
  orders = orders.filter(o => !keys.includes(o.key));
  render();
  try{
    const batch = db.batch();
    keys.forEach(key => batch.delete(ordersRef.doc(key)));
    await batch.commit();
  }catch(e){ /* onSnapshot 会在下一次推送时自动纠正 */ }
  const detail = items.map(it => `${it.name}×${it.qty}`).join('、');
  // 不强制跳转页面：日志这个请求还没发完就跳走的话可能被浏览器中断，记录会丢。
  // 整单删完后这一桌自然会变成"暂无订单"的空状态，让员工自己点空状态里的返回链接。
  logStaffAction({ action: 'deleteOrder', operator: operatorName, table, detail });
}

// 每次 render() 会先清空这个登记表，itemLineHTML/orderDelBtnHTML 往里塞“删除这一项需要
// 操作哪个 order 文档、文档里第几项”，删除按钮的 onclick 只带一个数组下标，避免把菜名
// （有些酒款名字带英文单引号）直接拼进 onclick 属性里，那样字符串会被提前截断
let itemDeleteTargets = [];
let orderDeleteTargets = [];

function itemLineHTML(it, docKey, itemIdx){
  const tags = [];
  if(it.spice) tags.push(`<span class="spice-tag">${it.spice}</span>`);
  if(it.size) tags.push(`<span class="spice-tag">${SIZE_LABELS_ZH[it.size] || it.size}</span>`);
  if(it.cookMethod) tags.push(`<span class="spice-tag">${COOK_METHOD_LABELS_ZH[it.cookMethod] || it.cookMethod}</span>`);
  if(it.soupBase) tags.push(`<span class="spice-tag">${SOUP_BASE_LABELS_ZH[it.soupBase] || it.soupBase}</span>`);
  if(it.drink) tags.push(`<span class="spice-tag">${DRINK_LABELS_ZH[it.drink] || it.drink}</span>`);
  (it.excludes || []).forEach(k => tags.push(`<span class="exclude-tag">${OPTION_LABELS_ZH[k] || k}</span>`));
  if(it.forDish) tags.push(`<span class="for-dish-tag">加菜给：${it.forDish}</span>`);
  const idx = itemDeleteTargets.length;
  itemDeleteTargets.push({ table, docKey, itemIdx, name: it.name, qty: it.qty });
  return `<li>
      <span class="item-main"><span><span class="qty">${it.qty}×</span>${it.name}</span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${tags.join('')}</span></span>
      <button class="item-del-btn" onclick="requestDeleteItem(${idx})" aria-label="删除这道菜">✕</button>
    </li>`;
}

function batchNameLabel(o){
  const name = (o.nickname || '').trim() || '匿名顾客';
  return name + (o.partySize ? ` · ${o.partySize}人` : '');
}

// 左列：还没送入厨房的批次，红框闪烁，按下单时间倒序——最新加的菜永远排在最上面
function pendingBatchHTML(o){
  const { label } = elapsedInfo(o.createdAt);
  const itemsHTML = (o.items || []).map((it, i) => itemLineHTML(it, o.key, i)).join('');
  return `<div class="batch-box batch-pending">
      <div class="batch-head"><span class="batch-name">${batchNameLabel(o)}</span><span class="batch-time">${label}</span></div>
      <ul class="item-list">${itemsHTML}</ul>
    </div>`;
}

// 右列：已经送入厨房的批次，绿框不闪烁，显示"几分钟前已处理"，同样按处理时间倒序
function processedBatchHTML(o){
  const mins = Math.floor((Date.now() - (o.confirmedAt || o.createdAt)) / 60000);
  const processedLabel = mins < 1 ? '刚刚已处理' : mins + ' 分钟前已处理';
  const itemsHTML = (o.items || []).map((it, i) => itemLineHTML(it, o.key, i)).join('');
  return `<div class="batch-box batch-processed">
      <div class="batch-head"><span class="batch-name">${batchNameLabel(o)}</span><span class="batch-time">${processedLabel}</span></div>
      <ul class="item-list">${itemsHTML}</ul>
    </div>`;
}

function orderDelBtnHTML(realBatch){
  const items = [];
  realBatch.forEach(o => (o.items || []).forEach(it => items.push({ name: it.name, qty: it.qty })));
  const idx = orderDeleteTargets.length;
  orderDeleteTargets.push({ table, keys: realBatch.map(o => o.key), items });
  return `<button class="order-del-btn" onclick="requestDeleteOrder(${idx})">🗑 整单删除</button>`;
}

function render(){
  itemDeleteTargets = [];
  orderDeleteTargets = [];
  const app = document.getElementById('app');
  if(!loaded) return;

  if(!table || orders.filter(o => !o.call && (o.items || []).length > 0).length === 0){
    document.getElementById('elapsed-pill').textContent = '';
    document.getElementById('confirmed-badge').hidden = true;
    app.innerHTML = `<div class="empty">
      <p>${table ? '这一桌暂无订单，可能已经结账或被移出看板' : '没有指定桌号'}</p>
      <a class="control-btn" href="sjxddxtygd.html">← 返回接单看板</a>
    </div>`;
    return;
  }

  const realBatch = orders.filter(o => !o.call && (o.items || []).length > 0).sort((a,b) => a.createdAt - b.createdAt);
  const { label, level } = elapsedInfo(realBatch[0].createdAt);
  const pendingBatches = realBatch.filter(o => o.status !== 'confirmed').slice().sort((a,b) => b.createdAt - a.createdAt);
  const processedBatches = realBatch.filter(o => o.status === 'confirmed').slice().sort((a,b) => (b.confirmedAt||b.createdAt) - (a.confirmedAt||a.createdAt));
  const anyPending = pendingBatches.length > 0;

  const elapsedPill = document.getElementById('elapsed-pill');
  elapsedPill.textContent = label;
  elapsedPill.className = 'elapsed ' + level;
  document.getElementById('confirmed-badge').hidden = anyPending;

  const actionBtn = anyPending
    ? `<button class="confirm-btn" data-keys="${pendingBatches.map(o=>o.key).join(',')}" onclick="confirmToKitchen(this.dataset.keys.split(','))">🍳 确认，送入厨房</button>`
    : `<button class="checkout-btn" data-keys="${realBatch.map(o=>o.key).join(',')}" onclick="confirmLeave(this.dataset.keys.split(','))">💳 结账</button>`;

  app.innerHTML = `
    <div class="columns">
      <section>
        <p class="column-title">🔴 新加菜品 · 待送入厨房</p>
        ${pendingBatches.length ? pendingBatches.map(pendingBatchHTML).join('') : '<p class="column-empty">暂无待处理菜品</p>'}
      </section>
      <section>
        <p class="column-title">✅ 已处理 · 已送入厨房</p>
        ${processedBatches.length ? processedBatches.map(processedBatchHTML).join('') : '<p class="column-empty">暂无已处理菜品</p>'}
      </section>
    </div>
    <div class="action-row">
      ${actionBtn}
      ${orderDelBtnHTML(realBatch)}
    </div>`;
}

render();
setInterval(render, 1000);
</script>
</body>
</html>
