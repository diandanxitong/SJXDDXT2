<style>
  :root{
    --bg:#121012;
    --card:#1C191A;
    --line:#332E2C;
    --text:#F5F1EC;
    --text-muted:#8E8883;
    --warn:#E8A23D;
    --urgent:#D2502F;
    --ok:#5FBE8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;padding:22px 26px 60px;
  }
  .top-nav{margin-bottom:16px;}
  .control-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .control-btn:hover{color:var(--text);border-color:var(--text-muted);}

  h1{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:.02em;}
  .page-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .clear-log-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:1px solid rgba(210,80,47,.5);color:var(--urgent);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .clear-log-btn:hover{background:rgba(210,80,47,.12);}
  .clear-log-btn:disabled{opacity:.4;cursor:default;background:none;}

  .confirm-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 22px 22px;max-width:320px;width:100%;text-align:center;
  }
  .confirm-question{font-size:16px;font-weight:900;margin-bottom:10px;}
  .confirm-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-cancel-btn, .confirm-yes-btn{
    flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .confirm-cancel-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .confirm-cancel-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .confirm-yes-btn{background:rgba(210,80,47,.18);border:1px solid var(--urgent);color:var(--urgent);}
  .confirm-yes-btn:hover{background:rgba(210,80,47,.28);}

  .login-screen{display:flex;align-items:center;justify-content:center;min-height:60vh;padding:20px;}
  .login-box{
    position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:30px 26px;max-width:320px;width:100%;text-align:center;
  }
  .login-box h1{margin-bottom:6px;}
  .login-close-btn{
    position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line);background:none;color:var(--text-muted);
    font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .login-close-btn:hover{color:var(--text);border-color:var(--text-muted);}
  .login-hint{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
  .login-input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:14px;padding:12px 14px;margin-bottom:12px;
  }
  .login-input:focus{outline:none;border-color:var(--warn);}
  .login-error{font-size:12.5px;color:var(--urgent);margin-bottom:12px;}
  .login-btn{
    width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;
    background:rgba(232,162,61,.16);border:1.5px solid var(--warn);color:var(--warn);margin-top:4px;
  }
  .login-btn:hover{background:rgba(232,162,61,.26);}

  .empty-hint{color:var(--text-muted);font-size:14px;padding:20px 2px;}

  .log-list{list-style:none;display:flex;flex-direction:column;gap:8px;max-width:900px;}
  .log-row{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .log-time{font-size:12px;color:var(--text-muted);white-space:nowrap;font-family:'Archivo Black',sans-serif;}
  .action-badge{
    font-size:11px;font-weight:900;border-radius:20px;padding:3px 10px;white-space:nowrap;

  .action-badge.deleteOrder{background:rgba(210,80,47,.16);color:var(--urgent);border:1px solid rgba(210,80,47,.5);}
  .log-table{font-size:14px;font-weight:900;white-space:nowrap;}
  .log-operator{font-size:13px;color:var(--text-muted);white-space:nowrap;}
  .log-operator b{color:var(--text);}
  .log-detail{font-size:13px;color:var(--text-muted);flex:1;min-width:160px;}

  /* ---- 经营数据查询台（DORIN 专属）：故意跟上面深色卡片风不一样，
     纯网格 + 等宽字体，做成"数据库查询工具"的严谨感 ---- */
  .sysdiag{

  .sysdiag-header{

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const db = firebase.firestore();
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
db.settings({ experimentalAutoDetectLongPolling: true });
const logsRef = db.collection('staffActionLogs');

// 注意：这只是前端的一道软性关卡——这套系统没有真正的账号体系，Firestore 规则
// 也没法按用户名密码限制读取。技术上懂一点的人可以绕过这道登录直接读到日志数据。
// 真要做到只有管理员能看，需要接入 Firebase Authentication 才行。
const ADMIN_USER = 'admingk';
const ADMIN_PASS = '123';
// 老板专用账号：登录后看到的不是这个页面表面上的"员工操作日志"，而是完整的
// 经营数据查询台——两个账号共用同一个登录框、同一个页面标题/URL，员工只知道
// admingk 这一个账号，看到的永远是操作日志，不会意识到还有另一套内容藏在这里。
const OWNER_USER = 'DORIN';
const OWNER_PASS = '822';

let authMode = null;   // null | 'staff'（员工操作日志）| 'owner'（经营数据查询台）
let loginError = '';
let logs = [];
let logsLoaded = false;
let clearConfirmOpen = false;

const ACTION_LABELS = { deleteItem: '单品删除', editItemQty: '单品改数量', deleteOrder: '整单删除' };

function formatDateTime(ms){
  const d = new Date(ms);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function startWatchingLogs(){
  logsRef.orderBy('createdAt', 'desc').onSnapshot(snap => {
    logs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    logsLoaded = true;
    render();
  }, err => {});
}

// “清除记录”：把 staffActionLogs 里的文档整批删掉，不是只清空页面上的列表——
// 这是应用户要求做的，为了不让这个 collection 一直占数据库存储空间
function openClearConfirm(){
  if(logs.length === 0) return;
  clearConfirmOpen = true;
  renderModal();
}
function closeClearConfirm(){
  clearConfirmOpen = false;
  renderModal();
}
async function confirmClearLogs(){
  clearConfirmOpen = false;
  renderModal();
  const ids = logs.map(l => l.id);
  try{
    for(let i = 0; i < ids.length; i += 400){
      const batch = db.batch();
      ids.slice(i, i + 400).forEach(id => batch.delete(logsRef.doc(id)));
      await batch.commit();
    }
  }catch(e){ /* 网络问题的话，onSnapshot 下次推送会看到还剩多少没删掉，可以再点一次 */ }
}

function handleLoginSubmit(){
  const user = (document.getElementById('login-user').value || '').trim();
  const pass = document.getElementById('login-pass').value || '';
  if(user === ADMIN_USER && pass === ADMIN_PASS){
    authMode = 'staff';
    loginError = '';
    startWatchingLogs();
  }else if(user === OWNER_USER && pass === OWNER_PASS){
    authMode = 'owner';
    loginError = '';
  }else{
    loginError = '用户名或密码错误';
  }
  render();
  if(authMode === 'owner') sysDiagInit();
}

function loginScreenHTML(){
  return `
    <div class="login-screen">
      <div class="login-box">
        <a class="login-close-btn" href="sjxddxtygd.html" aria-label="关闭，返回接单看板">✕</a>
        <h1>员工操作日志</h1>
        <p class="login-hint">此页面仅限管理员查看</p>
        <input type="text" id="login-user" class="login-input" placeholder="用户名" autocomplete="off"
               onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">
        <input type="password" id="login-pass" class="login-input" placeholder="密码" autocomplete="off"
               onkeydown="if(event.key==='Enter') handleLoginSubmit()">
        ${loginError ? `<p class="login-error">${loginError}</p>` : ''}
        <button class="login-btn" onclick="handleLoginSubmit()">登录</button>
      </div>
    </div>`;
}

function logRowHTML(log){
  return `
    <li class="log-row">
      <span class="log-time">${formatDateTime(log.createdAt)}</span>
      <span class="action-badge ${log.action}">${ACTION_LABELS[log.action] || log.action}</span>
      <span class="log-table">桌 ${escapeHtml(log.table)}</span>
      <span class="log-operator">操作人：<b>${escapeHtml(log.operator)}</b></span>
      <span class="log-detail">${escapeHtml(log.detail)}</span>
    </li>`;
}

function appHTML(){
  if(authMode === 'owner') return sysDiagHTML();
  if(authMode !== 'staff') return loginScreenHTML();
  const header = `
    <div class="page-header">
      <h1>员工操作日志</h1>
      <button class="clear-log-btn" onclick="openClearConfirm()" ${logs.length === 0 ? 'disabled' : ''}>🗑 清除记录</button>
    </div>`;
  if(!logsLoaded) return header + `<p class="empty-hint">加载中…</p>`;
  if(logs.length === 0) return header + `<p class="empty-hint">暂无操作记录——员工在接单看板上单品删除或整单删除时会自动记一条。</p>`;
  return header + `<ul class="log-list">${logs.map(logRowHTML).join('')}</ul>`;
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!clearConfirmOpen){ root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="confirm-overlay">
      <div class="confirm-box">
        <p class="confirm-question">确认清除全部操作记录？</p>
        <p class="confirm-sub">共 ${logs.length} 条记录会被永久删除，且会从数据库里彻底清掉，无法恢复。</p>
        <div class="confirm-actions">
          <button class="confirm-cancel-btn" onclick="closeClearConfirm()">取消</button>
          <button class="confirm-yes-btn" onclick="confirmClearLogs()">确认清除</button>
        </div>
      </div>
    </div>`;
}

// ============================================================================
// 经营数据查询台（DORIN 账号专属）：跟上面的"员工操作日志"共用同一个登录框、
// 同一个页面外壳，只是登录进来之后 appHTML() 走了另一条分支。样式故意跟页面
// 其它部分（深色卡片风）不一样——纯网格、等宽字体，做成"数据库查询工具"的
// 严谨感，而不是好看的仪表盘。
// ============================================================================
// 每天英国/葡萄牙时间 23:50，GitHub Actions 定时任务（scripts/daily-report.mjs）
// 会自动把"当天"的结账流水/员工操作日志/呼叫记录/单品点击打包存成一份
// dailyReports/{日期} 文档。这个页面不再需要手动选日期范围、点"查询"去现读现
// 算——只是把已经生成好的快照挑一天读出来展示。
const dailyReportsRef = db.collection('dailyReports');
// 沽清事件是永久流水（不像 dailyOrders 那样按天存），量也很小，直接整表读，
// 不受上面"查看日期"下拉框影响——库存这张表看的是全部历史，不是某一天
const soldOutEventsRef = db.collection('soldOutEvents');
// "现在沽清了哪些菜"的权威名单——soldOutEvents 这张流水表是 2026-09-06 晚上才
// 上线的，早于它就已经沽清、到现在还没恢复的菜，压根没有对应的 soldOut 事件，
// 光靠 soldOutEvents 配对会完全看不出这些菜还在沽清中，所以要单独读这份现状
// 名单，跟事件配对的结果对照着看
const menuStatusRef = db.collection('menuStatus').doc('soldOut');
// 名字查找：soldOutEvents 里记录过名字的直接用记录里的，没有事件记录的（上面
// 说的那种历史缺口）就靠菜品 id 反查名字，跟 gqcp.html 用的是同一份菜单目录

// 加菜标记（isAddOn/batchCount）是 2026-09-06 当天才上线的埋点，写在结账那一刻
// 的 dailyOrders 记录里；9-06 当天已经有不少桌子是用上线前的旧代码结账、

// 不是真的没人加菜，是历史数据缺口，补不回来——从 9-07 起才是完整数据
const ADDON_TRACKING_SINCE = '2026-09-07';

function sysDiagMoney(v){ return '€' + (v || 0).toFixed(2); }
function sysDiagPct(a, b){ return b > 0 ? ((a / b) * 100).toFixed(1) + '%' : '—'; }
function sysDiagFmtTime(ms){
  if(!ms) return '—';
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function sysDiagFmtMin(ms){ return ms == null ? '—' : (ms / 60000).toFixed(1); }
function sysDiagIsTestTable(t){ return t === '测试'; }

// 查看范围：默认按天（原有行为），也能按周/月/季度/年把多份 dailyReports 的
// orders/actionLogs/calls/clicks 直接拼起来，喂给下面同一套渲染函数——不用另外
// 写一套统计逻辑，跟"数据统计"页的周/月/季度/年是同一个思路
let sysDiagRangeKind = 'day';
const SYSDIAG_RANGE_LABELS = { day: '按天', week: '按周', month: '按月', quarter: '按季度', year: '按年' };
function sysDiagPad(n){ return String(n).padStart(2, '0'); }
function sysDiagParseDateKey(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function sysDiagIsoWeekInfo(dateStr){
  const d = sysDiagParseDateKey(dateStr);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dayNr = (target.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const firstDayNr = (firstThursday.getDay() + 6) % 7;
  firstThursday.setDate(firstThursday.getDate() - firstDayNr + 3);
  const week = 1 + Math.round((target - firstThursday) / (7 * 24 * 3600 * 1000));
  return { year: target.getFullYear(), week };
}
function sysDiagMondayOfWeek(dateStr){
  const d = sysDiagParseDateKey(dateStr);
  const dayNr = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dayNr);
  return d;
}
function sysDiagFormatShortDate(d){ return `${d.getMonth() + 1}月${d.getDate()}日`; }
const SYSDIAG_PERIOD_KEY_FNS = {
  week: dateStr => { const { year, week } = sysDiagIsoWeekInfo(dateStr); return `${year}-W${sysDiagPad(week)}`; },
  month: dateStr => dateStr.slice(0, 7),
  quarter: dateStr => { const [y, m] = dateStr.split('-').map(Number); return `${y}-Q${Math.ceil(m / 3)}`; },
  year: dateStr => dateStr.slice(0, 4),
};
function sysDiagPeriodLabel(kind, key, dates){
  if(kind === 'week'){
    const firstDate = dates.slice().sort()[0];
    const monday = sysDiagMondayOfWeek(firstDate);
    const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
    const weekNum = key.split('-W')[1];
    return `${monday.getFullYear()}年 第${weekNum}周（${sysDiagFormatShortDate(monday)} - ${sysDiagFormatShortDate(sunday)}）`;
  }
  if(kind === 'month'){ const [y, m] = key.split('-'); return `${y}年${parseInt(m, 10)}月`; }
  if(kind === 'quarter'){ const [y, q] = key.split('-Q'); return `${y}年 第${q}季度`; }
  return `${key}年`;
}
// 把 sysDiagReports（每天一份快照）按周期分组，同一组里的 orders/actionLogs/
// calls/clicks 直接拼起来
function sysDiagGroupReportsByPeriod(kind){
  const keyFn = SYSDIAG_PERIOD_KEY_FNS[kind];
  const map = new Map();
  sysDiagReports.forEach(r => {
    const key = keyFn(r.date);
    if(!map.has(key)) map.set(key, { key, dates: [], orders: [], actionLogs: [], calls: [], clicks: [] });
    const b = map.get(key);
    b.dates.push(r.date);
    b.orders.push(...(r.orders || []));
    b.actionLogs.push(...(r.actionLogs || []));
    b.calls.push(...(r.calls || []));
    b.clicks.push(...(r.clicks || []));
  });
  return Array.from(map.values())
    .map(b => Object.assign(b, { label: sysDiagPeriodLabel(kind, b.key, b.dates) }))
    .sort((a, b) => b.key.localeCompare(a.key));
}
let sysDiagPeriodBuckets = [];   // sysDiagRangeKind != 'day' 时当前分组结果

function setSysDiagRange(kind){
  if(sysDiagRangeKind === kind) return;
  sysDiagRangeKind = kind;
  sysDiagRefreshRangeUI();
}
// 切换"按天/按周/…"或者数据刚加载完，都要重新铺一遍下拉框选项，并默认选最新那个
function sysDiagRefreshRangeUI(){
  const rangeTabsEl = document.getElementById('sysdiag-range-tabs');
  if(rangeTabsEl){
    rangeTabsEl.innerHTML = Object.keys(SYSDIAG_RANGE_LABELS).map(k =>
      `<button class="range-tab ${sysDiagRangeKind === k ? 'active' : ''}" onclick="setSysDiagRange('${k}')">${SYSDIAG_RANGE_LABELS[k]}</button>`).join('');
  }
  const selectEl = document.getElementById('sysdiag-date-select');
  const labelEl = document.getElementById('sysdiag-date-label');
  if(sysDiagRangeKind === 'day'){
    if(labelEl) labelEl.textContent = '查看日期';
    if(selectEl){
      selectEl.innerHTML = sysDiagReports.length === 0
        ? `<option value="">暂无记录</option>`
        : sysDiagReports.map(r => `<option value="${r.date}">${r.date}</option>`).join('');
      selectEl.onchange = () => sysDiagSelectDate(selectEl.value);
    }
    if(sysDiagReports.length > 0) sysDiagSelectDate(sysDiagReports[0].date);
    return;
  }
  if(labelEl) labelEl.textContent = '查看周期';
  sysDiagPeriodBuckets = sysDiagGroupReportsByPeriod(sysDiagRangeKind);
  if(selectEl){
    selectEl.innerHTML = sysDiagPeriodBuckets.length === 0
      ? `<option value="">暂无记录</option>`
      : sysDiagPeriodBuckets.map(b => `<option value="${b.key}">${b.label}</option>`).join('');
    selectEl.onchange = () => sysDiagSelectPeriod(selectEl.value);
  }
  if(sysDiagPeriodBuckets.length > 0) sysDiagSelectPeriod(sysDiagPeriodBuckets[0].key);
}
function sysDiagSelectPeriod(key){
  const bucket = sysDiagPeriodBuckets.find(b => b.key === key);
  if(!bucket) return;
  const earliestDate = bucket.dates.slice().sort()[0];
  const stamp = `汇总 ${bucket.dates.length} 天（${bucket.label}）`;
  const warnHTML = earliestDate < ADDON_TRACKING_SINCE
    ? `⚠ 这个周期里包含 ${ADDON_TRACKING_SINCE} 之前的日期，那几天的加菜次数/加菜金额/加菜占比不准确，不是真的没人加菜。`
    : '';
  sysDiagRenderData(bucket.orders, bucket.actionLogs, bucket.calls, bucket.clicks, stamp, warnHTML);
}

// 登录成功后拉一次最近的快照列表，填日期下拉框、画趋势表，默认选中最新的一天。
// 上限设成 3650（约10年）——现在一天一份，量很小，但按季度/年查看要靠这些快照
// 拼起来，卡在 60 天会让"按季度/按年"缺数据
async function sysDiagInit(){
  const resultsEl = document.getElementById('sysdiag-results');
  if(resultsEl) resultsEl.innerHTML = '<p class="empty-note">加载中…</p>';
  try{
    const [reportsSnap, soldOutSnap, menuStatusDoc] = await Promise.all([
      dailyReportsRef.orderBy('date', 'desc').limit(3650).get(),
      soldOutEventsRef.get(),
      menuStatusRef.get(),
    ]);
    sysDiagReports = reportsSnap.docs.map(d => d.data());
    const currentSoldOutIds = (menuStatusDoc.exists && menuStatusDoc.data().ids) || [];
    sysDiagStockoutHTML = sysDiagRenderStockoutIntervals(soldOutSnap.docs.map(d => d.data()), currentSoldOutIds);
  }catch(e){
    if(resultsEl) resultsEl.innerHTML = `<p class="empty-note">加载失败：${escapeHtml(e.message || e)}</p>`;
    return;
  }
  if(sysDiagReports.length === 0){
    const selectEl = document.getElementById('sysdiag-date-select');
    if(selectEl) selectEl.innerHTML = `<option value="">暂无记录</option>`;
    const metaEl = document.getElementById('sysdiag-meta');
    if(metaEl) metaEl.innerHTML = '';
    const trendEl = document.getElementById('sysdiag-trend');
    if(trendEl) trendEl.innerHTML = '';
    // 每天的快照还没出来，但库存这张表跟日期无关，照样能看
    sysDiagSections = {
      overview: [`<p class="empty-note">还没有生成过任何一天的记录——每天英国时间 23:50 会自动生成当天的快照，明天这个时候就能看到第一份了。</p>`],
      dish: [], addon: [], raw: [],
      inventory: [sysDiagStockoutHTML],
    };
    sysDiagRenderTabs();
    sysDiagShowCategory(sysDiagCategory);
    return;
  }
  sysDiagRefreshRangeUI();
}

function sysDiagSelectDate(date){
  const report = sysDiagReports.find(r => r.date === date);
  if(!report) return;
  sysDiagSelectedDate = date;
  const selectEl = document.getElementById('sysdiag-date-select');
  if(selectEl) selectEl.value = date;

  const stamp = `生成于 ${new Date(report.generatedAt).toLocaleString('zh-CN', { hour12:false })}`;
  const warnHTML = date < ADDON_TRACKING_SINCE
    ? `⚠ ${date} 早于加菜埋点上线（${ADDON_TRACKING_SINCE} 起才完整），这天的加菜次数/加菜金额/加菜占比不准确，不是真的没人加菜。`
    : '';
  sysDiagRenderData(report.orders || [], report.actionLogs || [], report.calls || [], report.clicks || [], stamp, warnHTML);
}

// 不管是选了具体某一天，还是选了某个周/月/季度/年区间（多天数据已经拼成一份），
// 都走这同一套渲染逻辑——区别只在于喂进来的 orders/actionLogs/calls/clicks
// 是一天的还是好几天拼起来的
let sysDiagCurrentView = null;  // 导出 Excel 用——存一份当前正在看的原始数据，不用现从 HTML 里扒

function sysDiagRenderData(rawOrders, actionLogs, calls, clicks, stampText, warnHTML){
  const orders = rawOrders.filter(r => !sysDiagIsTestTable(r.table));
  sysDiagCurrentView = { label: stampText, orders, actionLogs, calls, clicks };

  const stampEl = document.getElementById('sysdiag-stamp');
  if(stampEl) stampEl.textContent = stampText;

  const warnEl = document.getElementById('sysdiag-warning');
  if(warnEl) warnEl.innerHTML = warnHTML;

  const trendEl = document.getElementById('sysdiag-trend');
  if(trendEl) trendEl.innerHTML = sysDiagRenderTrend(sysDiagReports);

  const metaEl = document.getElementById('sysdiag-meta');
  if(metaEl) metaEl.innerHTML = sysDiagRenderMeta(orders, calls, clicks);

  sysDiagSections = {
    overview: [
      sysDiagRenderHourly(orders),
      sysDiagRenderCallLog(calls),
    ],
    dish: [
      sysDiagRenderDishPerformance(orders, clicks),
      sysDiagRenderClickLog(clicks),
    ],
    addon: [
      sysDiagRenderTableAddonFrequency(orders),
      sysDiagRenderAddonLog(orders),
    ],
    inventory: [sysDiagStockoutHTML],
    raw: [
      sysDiagRenderCheckoutRecords(orders),
      sysDiagRenderStaffActionLog(actionLogs),
    ],
  };
  sysDiagRenderTabs();
  sysDiagShowCategory(sysDiagCategory);
}

function sysDiagRenderTabs(){
  const el = document.getElementById('sysdiag-tabs');
  if(!el) return;
  el.innerHTML = SYSDIAG_CATEGORIES.map(c =>
    `<button class="sysdiag-tab ${c.key === sysDiagCategory ? 'active' : ''}" onclick="sysDiagShowCategory('${c.key}')">${c.label}</button>`
  ).join('');
}

function sysDiagShowCategory(key){
  sysDiagCategory = key;
  sysDiagRenderTabs();
  const el = document.getElementById('sysdiag-results');
  if(el) el.innerHTML = (sysDiagSections[key] || []).join('');
}

// 近期每日趋势：所选日期之外始终显示，看多天走势用，不用来回切换查询范围
function sysDiagRenderTrend(reports){
  const rows = reports.map(r => {
    const orders = (r.orders || []).filter(o => !sysDiagIsTestTable(o.table));
    const revenue = orders.reduce((s,o) => s + (o.revenue || 0), 0);
    const addonRevenue = orders.reduce((s,o) => s + (o.items||[]).filter(it=>it.isAddOn).reduce((a,it)=>a+it.price*it.qty,0), 0);
    const clicksTotal = (r.clicks || []).reduce((s,c) => s + (c.count || 0), 0);
    return { date: r.date, checkouts: orders.length, revenue, addonRevenue, calls: (r.calls||[]).length, clicks: clicksTotal };
  });
  return `<section class="q">
      <div class="q-head"><span class="idx">趋势</span><span class="name">近期每日趋势</span></div>
      <div class="q-wrap"><table>
        <thead><tr><th>日期</th><th class="num">结账笔数</th><th class="num">营业额</th><th class="num">客单价</th><th class="num">加菜金额</th><th class="num">呼叫次数</th><th class="num">点击量</th></tr></thead>
        <tbody>${rows.map(r => `<tr class="${r.date === sysDiagSelectedDate ? 'total-row' : ''}">
          <td>${r.date}${r.date < ADDON_TRACKING_SINCE ? ' ⚠' : ''}</td><td class="num">${r.checkouts}</td><td class="num">${sysDiagMoney(r.revenue)}</td>
          <td class="num">${r.checkouts ? sysDiagMoney(r.revenue / r.checkouts) : '—'}</td><td class="num">${r.date < ADDON_TRACKING_SINCE ? '—' : sysDiagMoney(r.addonRevenue)}</td>
          <td class="num">${r.calls}</td><td class="num">${r.clicks}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="q-foot">共 ${rows.length} 天</div>
    </section>`;
}

function sysDiagQueryBlock(idx, name, columns, rows, rowsHtmlFn){
  const body = rows.length === 0
    ? `<div class="empty-note">没有数据</div>`
    : `<div class="q-wrap"><table>
        <thead><tr>${columns.map(c => `<th class="${c.num?'num':''}">${c.label}</th>`).join('')}</tr></thead>
        <tbody>${rows.map(rowsHtmlFn).join('')}</tbody>
      </table></div>`;
  return `<section class="q">
      <div class="q-head"><span class="idx">${idx}</span><span class="name">${name}</span></div>
      ${body}
      <div class="q-foot">共 ${rows.length} 条</div>
    </section>`;
}

function sysDiagRenderMeta(orders, calls, clicks){
  const revenue = orders.reduce((s,r) => s + (r.revenue || 0), 0);
  const addonRevenue = orders.reduce((s,r) => s + (r.items||[]).filter(it=>it.isAddOn).reduce((a,it)=>a+it.price*it.qty,0), 0);
  const staffRevenue = orders.reduce((s,r) => s + (r.items||[]).filter(it=>it.source==='staff').reduce((a,it)=>a+it.price*it.qty,0), 0);
  const totalClicks = clicks.reduce((s,c) => s + (c.count || 0), 0);
  const dwellSamples = orders.filter(r => r.firstOrderAt);
  const avgDwell = dwellSamples.length ? dwellSamples.reduce((s,r)=>s+(r.archivedAt-r.firstOrderAt),0)/dwellSamples.length : null;
  return [
    ['当日营业额', sysDiagMoney(revenue)],
    ['结账笔数', orders.length],
    ['客单价', orders.length ? sysDiagMoney(revenue/orders.length) : '—'],
    ['加菜金额', sysDiagMoney(addonRevenue)],
    ['员工代加金额', sysDiagMoney(staffRevenue)],
    ['平均用餐(分钟)', sysDiagFmtMin(avgDwell)],
    ['呼叫服务员次数', calls.length],
    ['单品点击总量', totalClicks],
  ].map(([k,v]) => `<div class="meta-card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}

function sysDiagRenderDishPerformance(orders, clicks){
  const clickByName = {};
  clicks.forEach(c => { clickByName[c.name] = (clickByName[c.name] || 0) + (c.count || 0); });
  const map = new Map();
  orders.forEach(r => {
    const seen = new Set();
    (r.items || []).forEach(it => {
      if(!map.has(it.name)) map.set(it.name, { name: it.name, qty:0, revenue:0, orders:0, addonQty:0, addonRevenue:0, staffQty:0 });
      const m = map.get(it.name);
      m.qty += it.qty; m.revenue += it.price * it.qty;
      if(it.isAddOn){ m.addonQty += it.qty; m.addonRevenue += it.price * it.qty; }
      if(it.source === 'staff') m.staffQty += it.qty;
      seen.add(it.name);
    });
    seen.forEach(name => map.get(name).orders++);
  });
  const rows = Array.from(map.values()).sort((a,b) => b.revenue - a.revenue).map(m => {
    const c = clickByName[m.name] || 0;
    return Object.assign(m, { clicks: c, conv: c ? sysDiagPct(m.orders, c) : '—', avgPrice: m.qty ? m.revenue/m.qty : 0 });
  });
  return sysDiagQueryBlock('3', '单品表现',
    [
      {label:'菜品'},{label:'销量',num:true},{label:'营业额',num:true},{label:'均价',num:true},
      {label:'出现笔数',num:true},{label:'加菜数量',num:true},{label:'加菜金额',num:true},
      {label:'加菜占比',num:true},{label:'员工代加数量',num:true},{label:'点击量',num:true},{label:'转化率',num:true},
    ], rows, m => `<tr>
      <td>${escapeHtml(m.name)}</td><td class="num">${m.qty}</td><td class="num">${sysDiagMoney(m.revenue)}</td>
      <td class="num">${sysDiagMoney(m.avgPrice)}</td><td class="num">${m.orders}</td><td class="num">${m.addonQty}</td>
      <td class="num">${sysDiagMoney(m.addonRevenue)}</td><td class="num">${sysDiagPct(m.addonQty, m.qty)}</td>
      <td class="num">${m.staffQty}</td><td class="num">${m.clicks}</td><td class="num">${m.conv}</td>
    </tr>`);
}

function sysDiagRenderHourly(orders){
  const buckets = Array.from({length:24}, (_,h) => ({ hour:h, checkouts:0, revenue:0 }));
  orders.forEach(r => {
    const ts = r.firstOrderAt || r.archivedAt;
    const h = new Date(ts).getHours();
    buckets[h].checkouts++; buckets[h].revenue += (r.revenue || 0);
  });
  const rows = buckets.filter(b => b.checkouts > 0);
  return sysDiagQueryBlock('1', '分时段分布',
    [{label:'时段'},{label:'结账笔数',num:true},{label:'营业额',num:true}],
    rows, b => `<tr><td>${String(b.hour).padStart(2,'0')}:00–${String(b.hour).padStart(2,'0')}:59</td><td class="num">${b.checkouts}</td><td class="num">${sysDiagMoney(b.revenue)}</td></tr>`);
}

function sysDiagRenderCheckoutRecords(orders){
  const rows = orders.slice().sort((a,b) => b.archivedAt - a.archivedAt);
  return sysDiagQueryBlock('8', '结账流水',
    [
      {label:'单号'},{label:'日期'},{label:'时间'},{label:'桌号'},{label:'菜品明细'},{label:'菜品数量',num:true},
      {label:'营业额',num:true},{label:'批次数',num:true},{label:'加菜批次',num:true},{label:'用餐(分钟)',num:true},
    ], rows, r => `<tr>
      <td>#${String(r.seq).padStart(3,'0')}</td><td>${r.date}</td><td>${sysDiagFmtTime(r.archivedAt)}</td>
      <td>${escapeHtml(r.table)}</td><td>${escapeHtml((r.items||[]).map(it=>`${it.name}×${it.qty}`).join('、'))}</td>
      <td class="num">${(r.items||[]).reduce((s,it)=>s+it.qty,0)}</td><td class="num">${sysDiagMoney(r.revenue)}</td>
      <td class="num">${r.batchCount || '—'}</td><td class="num">${r.addOnBatchCount != null ? r.addOnBatchCount : '—'}</td>
      <td class="num">${r.firstOrderAt ? sysDiagFmtMin(r.archivedAt - r.firstOrderAt) : '—'}</td>
    </tr>`);
}

// 按桌号统计"初次下单之后又加单"的频率：这张桌子这段时间一共来了几场客人、
// 其中几场有加菜、平均每场加几次——用来看哪些桌子/场次加菜最频繁
function sysDiagRenderTableAddonFrequency(orders){
  const map = new Map();
  orders.forEach(r => {
    if(!map.has(r.table)) map.set(r.table, { table: r.table, sessions:0, addonSessions:0, addonBatches:0, addonRevenue:0, revenue:0 });
    const m = map.get(r.table);
    const addonB = r.addOnBatchCount || 0;
    m.sessions++;
    m.addonBatches += addonB;
    if(addonB > 0) m.addonSessions++;
    m.revenue += (r.revenue || 0);
    m.addonRevenue += (r.items||[]).filter(it=>it.isAddOn).reduce((a,it)=>a+it.price*it.qty,0);
  });
  const rows = Array.from(map.values()).sort((a,b) => b.addonBatches - a.addonBatches);
  return sysDiagQueryBlock('5', '桌号加菜频率',
    [
      {label:'桌号'},{label:'来客场次',num:true},{label:'有加菜的场次',num:true},{label:'加菜渗透率',num:true},
      {label:'加菜次数合计',num:true},{label:'场均加菜次数',num:true},{label:'加菜金额合计',num:true},{label:'营业额合计',num:true},
    ], rows, m => `<tr>
      <td>${escapeHtml(m.table)}</td><td class="num">${m.sessions}</td><td class="num">${m.addonSessions}</td>
      <td class="num">${sysDiagPct(m.addonSessions, m.sessions)}</td><td class="num">${m.addonBatches}</td>
      <td class="num">${m.sessions ? (m.addonBatches / m.sessions).toFixed(2) : '—'}</td>
      <td class="num">${sysDiagMoney(m.addonRevenue)}</td><td class="num">${sysDiagMoney(m.revenue)}</td>
    </tr>`);
}

// 沽清区间：把 soldOutEvents 里同一道菜的 soldOut/restock 两条配对起来，算出
// 每次沽清了多久——跟"查看日期"下拉框无关，看的是全部历史。事件是按菜品各自
// 独立的一条时间线，按时间正序走一遍配对：遇到 soldOut 就开一段（已经开着的
// 就当重复点击，忽略），遇到 restock 就把最近开着的那一段收尾；最后还开着
// 没收尾的，说明这道菜现在还在沽清中，到"现在"为止算天数。
//
// currentSoldOutIds 是"沽清菜品"页当前的沽清名单（menuStatus/soldOut）——
// soldOutEvents 这张流水表是 2026-09-06 晚上才上线的，在这之前就已经沽清、
// 到现在还没恢复的菜，压根没留下 soldOut 事件，光靠事件配对完全看不出这些菜
// 还在沽清中。这里拿现状名单跟配对结果对一遍：名单里有、但事件配对却查不到
// "还开着"的那道菜，说明是统计上线前就沽清的历史缺口，补一行进去，只是标注
// 起始时间未知，不编造一个假的开始时间。
function sysDiagRenderStockoutIntervals(events, currentSoldOutIds){
  const byDish = new Map();
  events.slice().sort((a,b) => a.createdAt - b.createdAt).forEach(e => {
    if(!byDish.has(e.dishId)) byDish.set(e.dishId, { name: e.name, open: null, intervals: [] });
    const d = byDish.get(e.dishId);
    d.name = e.name;
    if(e.action === 'soldOut'){
      if(d.open == null) d.open = e.createdAt;
    }else if(e.action === 'restock'){
      if(d.open != null){ d.intervals.push({ start: d.open, end: e.createdAt }); d.open = null; }
    }
  });
  const now = Date.now();
  const rows = [];
  byDish.forEach((d, dishId) => {
    d.intervals.forEach(iv => rows.push({ dishId, name: d.name, start: iv.start, end: iv.end, ongoing: false }));
    if(d.open != null) rows.push({ dishId, name: d.name, start: d.open, end: null, ongoing: true });
  });
  (currentSoldOutIds || []).forEach(dishId => {
    const d = byDish.get(dishId);
    if(d && d.open != null) return;  // 已经从事件配对里算出"还在沽清中"了，不用重复补
    const name = (d && d.name) || DISH_ID_TO_NAME[dishId] || dishId;
    rows.push({ dishId, name, start: null, end: null, ongoing: true });
  });
  rows.sort((a,b) => (b.end || now) - (a.end || now));
  sysDiagStockoutRows = rows;  // 导出 Excel 用
  return sysDiagQueryBlock('7', '沽清区间',
    [{label:'菜品'},{label:'沽清开始'},{label:'恢复售卖'},{label:'沽清天数',num:true}],
    rows, r => `<tr class="${r.ongoing ? 'total-row' : ''}">
      <td>${escapeHtml(r.name)}</td>
      <td>${r.start == null ? '未记录（早于统计上线）' : new Date(r.start).toLocaleString('zh-CN', { hour12:false })}</td>
      <td>${r.ongoing ? '仍在沽清中' : new Date(r.end).toLocaleString('zh-CN', { hour12:false })}</td>
      <td class="num">${r.start == null ? '—' : (((r.end || now) - r.start) / 86400000).toFixed(1)}</td>
    </tr>`);
}

function sysDiagRenderAddonLog(orders){
  const rows = [];
  orders.forEach(r => (r.items||[]).forEach(it => {
    if(it.isAddOn) rows.push({ date:r.date, time:r.archivedAt, table:r.table, name:it.name, qty:it.qty, price:it.price, source: it.source || 'customer' });
  }));
  rows.sort((a,b) => b.time - a.time);
  return sysDiagQueryBlock('6', '加菜明细',
    [
      {label:'日期'},{label:'时间'},{label:'桌号'},{label:'菜品'},{label:'数量',num:true},
      {label:'单价',num:true},{label:'金额',num:true},{label:'来源'},
    ], rows, r => `<tr>
      <td>${r.date}</td><td>${sysDiagFmtTime(r.time)}</td><td>${escapeHtml(r.table)}</td><td>${escapeHtml(r.name)}</td>
      <td class="num">${r.qty}</td><td class="num">${sysDiagMoney(r.price)}</td><td class="num">${sysDiagMoney(r.price*r.qty)}</td>
      <td><span class="tag ${r.source}">${r.source === 'staff' ? '员工代加' : '顾客自加'}</span></td>
    </tr>`);
}

function sysDiagRenderCallLog(calls){
  const rows = calls.slice().sort((a,b) => b.createdAt - a.createdAt);
  return sysDiagQueryBlock('2', '呼叫服务员记录',
    [{label:'日期'},{label:'时间'},{label:'桌号'}],
    rows, c => `<tr><td>${c.date}</td><td>${sysDiagFmtTime(c.createdAt)}</td><td>${escapeHtml(c.table)}</td></tr>`);
}

function sysDiagRenderStaffActionLog(actionLogs){
  const rows = actionLogs.slice().sort((a,b) => b.createdAt - a.createdAt);
  const actionLabel = a => a === 'deleteItem' ? '删单品' : a === 'deleteOrder' ? '删整单' : a === 'editItemQty' ? '改数量' : a;
  return sysDiagQueryBlock('9', '员工操作日志',
    [{label:'日期'},{label:'时间'},{label:'操作'},{label:'操作人'},{label:'桌号'},{label:'详情'}],
    rows, l => {
      const d = new Date(l.createdAt);
      const pad = n => String(n).padStart(2,'0');
      return `<tr><td>${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}</td><td>${sysDiagFmtTime(l.createdAt)}</td>
        <td>${actionLabel(l.action)}</td><td>${escapeHtml(l.operator)}</td><td>${escapeHtml(l.table)}</td><td>${escapeHtml(l.detail)}</td></tr>`;
    });
}

function sysDiagRenderClickLog(clicks){
  const rows = clicks.slice().sort((a,b) => b.date === a.date ? b.count - a.count : b.date.localeCompare(a.date));
  return sysDiagQueryBlock('4', '单品点击记录',
    [{label:'日期'},{label:'菜品'},{label:'点击量',num:true}],
    rows, c => `<tr><td>${c.date}</td><td>${escapeHtml(c.name)}</td><td class="num">${c.count}</td></tr>`);
}

// 导出 Excel：把当前正在看的这份数据（不管是选了哪一天，还是选了哪个周/月/季度/
// 年区间）打包成一个多 sheet 的 .xlsx，直接触发浏览器下载——用的是跟渲染表格
// 同一份原始数据（sysDiagCurrentView），不是从页面 HTML 里现扒
function sysDiagExportExcel(){
  if(!sysDiagCurrentView || typeof XLSX === 'undefined') return;
  const { label, orders, actionLogs, calls, clicks } = sysDiagCurrentView;
  const wb = XLSX.utils.book_new();
  const fmtTime = ms => ms ? new Date(ms).toLocaleString('zh-CN', { hour12:false }) : '';

  const checkoutRows = orders.slice().sort((a,b) => b.archivedAt - a.archivedAt).map(r => ({
    单号: `#${String(r.seq).padStart(3,'0')}`, 日期: r.date, 时间: fmtTime(r.archivedAt), 桌号: r.table,
    菜品数量: (r.items||[]).reduce((s,it)=>s+it.qty,0), 营业额: r.revenue,
    批次数: r.batchCount || '', 加菜批次: r.addOnBatchCount != null ? r.addOnBatchCount : '',
    用餐分钟: r.firstOrderAt ? ((r.archivedAt - r.firstOrderAt) / 60000).toFixed(1) : '',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(checkoutRows), '结账流水');

  const itemRows = [];
  orders.forEach(r => (r.items || []).forEach(it => {
    itemRows.push({ 日期: r.date, 桌号: r.table, 菜品: it.name, 数量: it.qty, 单价: it.price, 小计: +((it.qty||0)*(it.price||0)).toFixed(2), 加菜: it.isAddOn ? '是' : '否' });
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itemRows), '菜品明细');

  const callRows = calls.slice().sort((a,b) => b.createdAt - a.createdAt).map(c => ({ 日期: c.date, 时间: fmtTime(c.createdAt), 桌号: c.table }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(callRows), '呼叫服务员记录');

  const clickRows = clicks.slice().sort((a,b) => b.date === a.date ? b.count - a.count : b.date.localeCompare(a.date))
    .map(c => ({ 日期: c.date, 菜品: c.name, 点击量: c.count }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clickRows), '单品点击记录');

  const actionLabel = a => a === 'deleteItem' ? '删单品' : a === 'deleteOrder' ? '删整单' : a === 'editItemQty' ? '改数量' : a;
  const logRows = actionLogs.slice().sort((a,b) => b.createdAt - a.createdAt).map(l => ({
    时间: fmtTime(l.createdAt), 操作: actionLabel(l.action), 操作人: l.operator, 桌号: l.table, 详情: l.detail,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows), '员工操作日志');

  const now = Date.now();
  const stockoutRows = sysDiagStockoutRows.map(r => ({
    菜品: r.name,
    沽清开始: r.start == null ? '未记录（早于统计上线）' : fmtTime(r.start),
    恢复售卖: r.ongoing ? '仍在沽清中' : fmtTime(r.end),
    沽清天数: r.start == null ? '' : (((r.end || now) - r.start) / 86400000).toFixed(1),
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockoutRows), '沽清区间');

  const safeLabel = label.replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `经营数据_${safeLabel}.xlsx`);
}

function sysDiagHTML(){
  return `
    <div class="sysdiag">
      <header class="sysdiag-header">
        <h1>经营数据查询台</h1>
        <div class="range-tabs" id="sysdiag-range-tabs"></div>
        <label id="sysdiag-date-label">查看日期</label>
        <select id="sysdiag-date-select"><option>加载中…</option></select>
        <button onclick="sysDiagExportExcel()">导出 Excel</button>
        <div class="spacer"></div>
        <span class="stamp" id="sysdiag-stamp"></span>
      </header>
      <div id="sysdiag-warning"></div>
      <div id="sysdiag-trend"></div>
      <div class="meta-row" id="sysdiag-meta"></div>
      <div class="sysdiag-tabs" id="sysdiag-tabs"></div>
      <div id="sysdiag-results">${'<p class="empty-note">加载中…</p>'}</div>
      <p class="sysdiag-footnote">
        每天英国/葡萄牙时间 23:50 自动生成当天的记录，不用手动选日期范围查询——上面下拉框选哪天看哪天的详情。
        呼叫留痕、单品点击量都是这次才加的埋点，只统计上线之后发生的数据；上线之前的历史记录这几项会是空的/0，不是数据丢失。
        加菜标记（isAddOn）从 ${ADDON_TRACKING_SINCE} 起才是完整数据——${ADDON_TRACKING_SINCE} 之前的日期，加菜次数/金额不准确，不是真的没人加菜，趋势表和详情页会标 ⚠ 提醒。
        单品点击量记录的是顾客点"+"把菜加入购物车的次数（不是浏览次数），转化率 = 结账中出现该菜的笔数 ÷ 点击次数，仅供参考。
      </p>
    </div>`;
}

function render(){
  document.getElementById('app').innerHTML = appHTML();
  if(!authMode){
    const el = document.getElementById('login-user');
    if(el) el.focus();
  }
  renderModal();
}

render();
</script>
