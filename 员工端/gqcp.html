  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}

  .status-pill{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:6px 16px;font-size:13px;color:var(--text-muted);
  }
  .status-pill b{color:var(--warn);font-size:15px;}

  .header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .sel-count{font-size:13px;color:var(--text-muted);white-space:nowrap;}
  .sel-count b{color:var(--text);}
  .action-btn{
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    padding:13px 22px;border-radius:12px;white-space:nowrap;
  }
  .action-btn:disabled{opacity:.4;cursor:default;}
  .sold-out-btn{background:rgba(210,80,47,.16);border:1.5px solid var(--urgent);color:var(--urgent);}
  .sold-out-btn:not(:disabled):hover{background:rgba(210,80,47,.26);}

    position:absolute;right:6px;top:50%;transform:translateY(-50%);

    color:var(--text-muted);font-size:16px;cursor:pointer;display:none;
    align-items:center;justify-content:center;
  }
  .search-clear-btn.visible{display:flex;}
  .search-clear-btn:hover{color:var(--text);}
  .no-results{color:var(--text-muted);font-size:14px;padding:10px 2px;}

  .filter-row{margin-bottom:18px;}
  .view-toggle-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;

  .view-toggle-btn.active{background:rgba(210,80,47,.16);border-color:var(--urgent);color:var(--urgent);}

  .cat-section{margin-bottom:22px;}
  .cat-section h2{font-size:14px;font-weight:900;color:var(--warn);letter-spacing:.03em;margin-bottom:10px;padding-left:2px;}
  .dish-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
  .dish-row{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
  }
  .dish-row.checked{border-color:var(--warn);background:rgba(232,162,61,.1);}
  .dish-row label{
    display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
  }
  .dish-row input[type="checkbox"]{width:18px;height:18px;flex-shrink:0;accent-color:var(--warn);cursor:pointer;}
  .dish-row-name{font-size:14px;font-weight:700;flex:1;line-height:1.35;}
  .sold-out-badge{
    font-size:11px;font-weight:700;color:var(--urgent);border:1px solid rgba(210,80,47,.5);

  }

  .modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px 22px 22px;max-width:420px;width:100%;
  }
  .modal-dish-list{
    list-style:none;max-height:220px;overflow-y:auto;
    display:flex;flex-direction:column;gap:6px;margin-bottom:16px;
  }
  .modal-dish-list li{
    font-size:14px;font-weight:700;background:rgba(255,255,255,.04);
    border-radius:8px;padding:8px 12px;
  }
  .modal-warning{
    font-size:13px;font-weight:700;color:var(--urgent);line-height:1.5;
    background:rgba(210,80,47,.12);border:1px solid rgba(210,80,47,.4);
    border-radius:10px;padding:10px 12px;margin-bottom:18px;
  }
  .modal-actions{display:flex;gap:10px;}
  .modal-cancel-btn, .modal-confirm-btn{
    flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;

  .modal-cancel-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .modal-cancel-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .modal-confirm-btn.urgent{background:rgba(210,80,47,.18);border:1px solid var(--urgent);color:var(--urgent);}

  .modal-confirm-btn.ok{background:rgba(95,190,138,.18);border:1px solid var(--ok);color:var(--ok);}

];

const CATEGORY_ORDER = ["soupBase", "houseSpecial", "seafood", "premiumBeef", "meatballs", "mushrooms", "vegetables", "snacks", "desserts", "drinks", "wine"];
const CATEGORY_LABELS = {"soupBase": "锅底", "houseSpecial": "招牌必点", "seafood": "海鲜", "premiumBeef": "精品肉类", "meatballs": "丸子", "mushrooms": "菌菇", "vegetables": "素菜", "snacks": "凉菜/小吃", "desserts": "甜品", "drinks": "果香鲜饮", "wine": "酒水"};

let soldOutIds = new Set();
let selected = new Set();
let modal = null;   // null | 'soldOut' | 'restore'
let loaded = false;
let searchQuery = '';
let showSoldOutOnly = false;

function toggleSoldOutOnlyView(){
  showSoldOutOnly = !showSoldOutOnly;
  const btn = document.getElementById('viewToggleBtn');
  btn.textContent = showSoldOutOnly ? '展示所有菜品' : '显示已沽清菜品';
  btn.classList.toggle('active', showSoldOutOnly);
  renderList();
}

function onSearchInput(value){
  searchQuery = value;
  document.getElementById('searchClearBtn').classList.toggle('visible', searchQuery.length > 0);
  renderList();   // search box lives outside #app, so it doesn't need (and shouldn't trigger) a full render()
}

function clearSearch(){
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  document.getElementById('searchClearBtn').classList.remove('visible');
  renderList();
}

function matchesFilters(d){
  if(showSoldOutOnly && !soldOutIds.has(d.id)) return false;
  if(!searchQuery.trim()) return true;
  return d.name.toLowerCase().includes(searchQuery.trim().toLowerCase());
}

menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  loaded = true;
  render();
}, err => {});

function toggleSelect(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  render();
}

function openSoldOutModal(){
  if(selected.size === 0) return;
  modal = 'soldOut';
  render();
}

function openRestoreModal(){
  if(selected.size === 0) return;
  modal = 'restore';
  render();
}

function closeModal(){
  modal = null;
  render();
}

// 沽清：把已选菜品并入现有沽清集合再整体写回（不影响其他已沽清的菜）
async function confirmSoldOut(){
  const ids = new Set(soldOutIds);
  selected.forEach(id => ids.add(id));
  try{ await menuStatusRef.set({ ids: Array.from(ids) }); }catch(e){}
  selected.clear();
  modal = null;
  render();
}

// 恢复售卖：把已选菜品从沽清集合里移除
async function confirmRestore(){
  const ids = new Set(soldOutIds);
  selected.forEach(id => ids.delete(id));
  try{ await menuStatusRef.set({ ids: Array.from(ids) }); }catch(e){}
  selected.clear();
  modal = null;
  render();
}

function dishRowHTML(d){
  const checked = selected.has(d.id);
  const soldOut = soldOutIds.has(d.id);
  return `
    <li class="dish-row ${checked ? 'checked' : ''}">
      <label>
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSelect('${d.id}')">
        <span class="dish-row-name">${d.name}</span>
        ${soldOut ? '<span class="sold-out-badge">已沽清</span>' : ''}
      </label>
    </li>`;
}

function selectedNamesHTML(){
  return DISH_LIST.filter(d => selected.has(d.id)).map(d => `<li>${d.name}</li>`).join('');
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!modal){ root.innerHTML = ''; return; }
  if(modal === 'soldOut'){
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <ul class="modal-dish-list">${selectedNamesHTML()}</ul>
          <p class="modal-warning">注意：确认沽清后此菜品将不可点单，请务必与后厨确认！</p>
          <div class="modal-actions">
            <button class="modal-cancel-btn" onclick="closeModal()">取消</button>
            <button class="modal-confirm-btn urgent" onclick="confirmSoldOut()">我已确认无误</button>
          </div>
        </div>
      </div>`;
  }else{
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <ul class="modal-dish-list">${selectedNamesHTML()}</ul>
          <p class="modal-warning">注意：确认恢复售卖后此菜品将立即恢复可点单，请确认无误！</p>
          <div class="modal-actions">
            <button class="modal-cancel-btn" onclick="closeModal()">取消</button>
            <button class="modal-confirm-btn ok" onclick="confirmRestore()">我已确认无误</button>
          </div>
        </div>
      </div>`;
  }
}

function renderList(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = '';
    return;
  }
  const sections = CATEGORY_ORDER.map(cat => {
    const items = DISH_LIST.filter(d => d.category === cat && matchesFilters(d));
    if(items.length === 0) return '';
    return `<section class="cat-section"><h2>${CATEGORY_LABELS[cat]}</h2><ul class="dish-list">${items.map(dishRowHTML).join('')}</ul></section>`;
  }).join('');
  app.innerHTML = sections || `<p class="no-results">${showSoldOutOnly ? '目前没有已沽清的菜品' : '没有找到匹配的菜品'}</p>`;
}

function render(){
  document.getElementById('selCount').textContent = selected.size;
  document.getElementById('soldOutCount').textContent = soldOutIds.size;
  document.getElementById('soldOutBtn').disabled = selected.size === 0;
  document.getElementById('restoreBtn').disabled = selected.size === 0;

  renderList();
  renderModal();
}

render();
</script>
