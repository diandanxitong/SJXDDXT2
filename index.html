<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>

<title>蜀九香都柏林点餐营销管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDFCF9;
    --paper-tint:#F7F2EA;
    --ink:#1C1712;
    --ink-soft:#736A60;
    --ink-faint:#B3A99C;
    --brand:#AA0101;
    --brand-soft:#C23434;
    --hairline:#E6E0D6;
    /* 侧边栏：暖灰色，跟右侧内容区的暖白背景同一个色温，不用冷灰/冷蓝——
       强调色沿用品牌朱红（--brand），不额外引入第二套强调色，让侧边栏
       看起来是同一套系统的一部分，而不是贴上去的通用后台模板 */
    --side-bg:#F2F0EB;
    --side-bg-active:#FFFFFF;
    --side-ink:#2B2620;
    --side-ink-soft:#8C8275;
    --side-hairline:#E2DDD1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important;}
  a{color:inherit;}

  /* 跟 员工端/staff-auth.js 一样的思路：先挡一块空白，等 Firebase 确认登录
     状态再决定显示哪个画面，避免已登录的人看到登录表单闪一下 */
  #auth-blocker{position:fixed;inset:0;background:var(--paper);}

  /* ---------- 登录 ---------- */
  .login-screen{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 24px;
  }
  .login-col{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;}
  .brand-mark{width:126px;height:auto;margin-bottom:26px;}
  .brand-name{
    font-family:'Noto Serif SC',serif;font-weight:700;font-size:23px;
    color:var(--ink);letter-spacing:.04em;text-align:center;
  }
  .brand-system{
    font-size:12.5px;color:var(--ink-soft);letter-spacing:.28em;
    margin-top:10px;text-align:center;
  }
  .brand-rule{width:36px;height:2px;background:var(--brand);margin:26px 0 34px;}

  .login-form{width:100%;}
  .field{margin-bottom:22px;}
  .field-label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:9px;font-weight:500;}
  .field-input{
    display:block;width:100%;border:none;border-bottom:1px solid var(--hairline);
    background:transparent;font-family:inherit;font-size:15px;color:var(--ink);
    padding:9px 2px;transition:border-color .15s ease;
  }
  .field-input:focus{outline:none;border-bottom-color:var(--brand);}
  .field-error{font-size:12.5px;color:var(--brand);min-height:18px;margin:-8px 0 12px;}
  .login-btn{
    width:100%;margin-top:6px;padding:14px;border:none;border-radius:2px;
    background:var(--ink);color:var(--paper);font-family:inherit;font-size:14.5px;font-weight:600;
    letter-spacing:.06em;cursor:pointer;transition:background .15s ease;
  }
  .login-btn:hover{background:var(--brand);}
  .login-btn:disabled{opacity:.5;cursor:default;}
  .login-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .login-footnote{margin-top:56px;font-size:11px;color:var(--ink-faint);letter-spacing:.1em;}

  /* ---------- 总控台：侧边栏 + 内容区 ---------- */
  .console-screen{min-height:100vh;}
  .dashboard{display:flex;min-height:100vh;align-items:stretch;}

  .sidebar{
    width:264px;flex-shrink:0;background:var(--side-bg);
    border-right:1px solid var(--side-hairline);
    display:flex;flex-direction:column;
  }

  /* 品牌区仿登录页的做法——居中的 Logo/名称/系统名 + 一道短横线，跟登录页
     的 .brand-rule 是同一个视觉动作，侧边栏因此像是登录页往下延伸出来的
     同一套东西，而不是另外拼上去的后台模板 */
  .sidebar-brand{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:36px 20px 26px;
  }
  .sidebar-logo{width:44px;height:auto;margin-bottom:14px;}
  .sidebar-brand-name{font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;color:var(--side-ink);letter-spacing:.02em;}
  .sidebar-brand-sub{font-size:10px;color:var(--side-ink-soft);letter-spacing:.22em;margin-top:7px;}
  .sidebar-brand-rule{width:26px;height:2px;background:var(--brand);margin-top:20px;}

  /* 导航做成"目录索引"的样子：每一行之间用发丝线隔开，文字居中，
     不用卡片、不用圆角色块——跟系统里表格/统计卡一贯的发丝线语言一致 */
  .sidebar-nav{border-top:1px solid var(--side-hairline);}
  .nav-item{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:none;border:none;
    border-bottom:1px solid var(--side-hairline);
    font-family:inherit;font-size:14px;font-weight:600;color:var(--side-ink-soft);
    padding:18px 24px;cursor:pointer;position:relative;letter-spacing:.02em;
    transition:color .15s ease,background .15s ease;
  }
  /* 图标沿用统计卡 .stat-icon 的线宽风格，颜色跟文字一起变——不是单独
     染色，这样激活/悬停态是"整行一起变色"，图标不会跟文字割裂 */
  .nav-icon{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover:not(.active){color:var(--side-ink);background:rgba(43,38,32,.03);}
  .nav-item.active{color:var(--brand);background:var(--side-bg-active);}
  .nav-item.active::after{
    content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:22px;height:2px;background:var(--brand);
  }

  .nav-group{border-bottom:1px solid var(--side-hairline);}
  .nav-group-toggle{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--side-ink-soft);padding:18px 24px;cursor:pointer;letter-spacing:.02em;
    transition:color .15s ease,background .15s ease;
  }
  .nav-group-toggle:hover{color:var(--side-ink);background:rgba(43,38,32,.03);}
  .nav-group-toggle .chevron{font-size:9px;color:var(--side-ink-soft);transition:transform .2s ease;}
  .nav-group.expanded .nav-group-toggle{color:var(--side-ink);}
  .nav-group.expanded .chevron{transform:rotate(180deg);}

  /* 子菜单默认收着，只有点开"菜品管理"才展开——用 grid 的 0fr/1fr 做
     高度过渡，不用 JS 量高度 */
  .nav-subwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;}
  .nav-group.expanded .nav-subwrap{grid-template-rows:1fr;}
  .nav-subwrap-inner{overflow:hidden;}
  .nav-subitem{
    display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:var(--side-ink-soft);
    text-decoration:none;padding:11px 24px;transition:color .15s ease,background .15s ease;
  }
  .nav-subicon{width:13px;height:13px;flex-shrink:0;}
  .nav-subitem:hover{color:var(--brand);background:rgba(43,38,32,.03);}
  .nav-subitem:last-child{padding-bottom:19px;}

  .main{flex:1;min-width:0;padding:22px 36px 60px;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:14px;margin-bottom:22px;border-bottom:1px solid var(--hairline);
  }
  .breadcrumb{font-size:12px;color:var(--ink-soft);letter-spacing:.03em;}
  .user-module{display:flex;align-items:center;gap:10px;}
  .user-avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    background:var(--paper-tint);border:1px solid var(--hairline);
  }
  .logout-btn{
    background:none;border:none;font-family:inherit;font-size:12.5px;
    color:var(--ink-soft);cursor:pointer;padding:6px 2px;
  }
  .logout-btn:hover{color:var(--brand);}
  .logout-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .view{display:none;}
  .view.active{display:block;}
  .section-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:17px;margin:14px 0 20px;}

  /* 运营概况整体先框一层大模块。模块顶部是一条独立的表头带（跟侧边栏
     同一个暖灰色，颜色上和下面浅米色的卡片区分开），像表格的表头行；
     里面的统计卡靠背景色区分层级，不再各自加边框——避免"框里套框" */
  .stat-panel{border:1px solid var(--hairline);background:var(--paper);max-width:900px;margin-bottom:24px;}
  .panel-header{
    font-family:'Noto Serif SC',serif;font-weight:700;font-size:15px;color:var(--side-ink);
    background:var(--side-bg);padding:14px 22px;border-bottom:1px solid var(--side-hairline);
  }
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;padding:22px;}
  .stat-card{background:var(--paper-tint);padding:18px 20px 16px;}
  .stat-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .stat-label{font-size:12.5px;color:var(--ink-soft);}
  /* 图标只用一套统一的线宽/风格，颜色刻意压得很淡——红色只留给下面的
     数字，图标不跟它抢视觉重量，纯粹是个安静的语义标记 */
  .stat-icon{width:19px;height:19px;flex-shrink:0;color:var(--ink-faint);}
  .stat-value{font-family:'Noto Serif SC',serif;font-weight:700;font-size:28px;color:var(--brand);}

  /* 运营走势：近 7 日营业额柱状图，跟上面的统计面板同一套框线语言——
     柱子只用品牌朱红一个颜色，不叠加渐变/阴影；进场时从 0 长到目标高度，
     是这块模块唯一的一次动效 */
  .chart-panel{border:1px solid var(--hairline);background:var(--paper);max-width:900px;}
  .chart-body{padding:24px 26px 22px;}
  .chart-caption{font-size:12px;color:var(--ink-soft);margin-bottom:22px;}
  .chart-bars{display:flex;align-items:flex-end;gap:20px;height:150px;border-bottom:1px solid var(--hairline);padding:0 4px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-bar-value{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .chart-bar{width:100%;max-width:38px;background:var(--brand);transform-origin:bottom;transition:transform .6s cubic-bezier(.16,1,.3,1),background .15s ease;}
  .chart-bar:hover{background:#8C0101;}
  .chart-bar.zero{background:var(--hairline);}
  .chart-labels{display:flex;gap:20px;padding:10px 4px 0;}
  .chart-col-label{flex:1;text-align:center;font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .chart-col-label.is-today{color:var(--brand);font-weight:700;}

  .staff-btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:720px;}
  .staff-btn{
    display:flex;align-items:center;justify-content:center;
    padding:64px 24px;text-decoration:none;border:1px solid var(--hairline);
    font-family:'Noto Serif SC',serif;font-weight:700;font-size:23px;color:var(--ink);
    transition:background .15s ease,border-color .15s ease;
  }
  .staff-btn:hover{background:var(--paper-tint);border-color:var(--ink-soft);}
  .staff-btn:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}

  @media (max-width:820px){
    .dashboard{flex-direction:column;}
    .sidebar{width:100%;}
    .sidebar-brand{padding:26px 20px 20px;}
    .main{padding:18px 20px 50px;}
  }
  @media (max-width:520px){
    .staff-btn-grid{grid-template-columns:1fr;}
    .staff-btn{padding:44px 20px;font-size:20px;}
  }
</style>
</head>
<body>

<div id="auth-blocker"></div>

<div class="login-screen" id="login-screen" hidden>
  <div class="login-col">
    <img class="brand-mark" src="image/LOGO/logo.webp" alt="蜀九香">
    <div class="brand-name">蜀九香都柏林</div>
    <div class="brand-system">点餐营销管理系统</div>
    <div class="brand-rule"></div>
    <div class="login-form">
      <div class="field">
        <label class="field-label" for="li-user">用户名</label>
        <input class="field-input" id="li-user" type="text" autocomplete="off"
               onkeydown="if(event.key==='Enter') document.getElementById('li-pass').focus()">
      </div>
      <div class="field">
        <label class="field-label" for="li-pass">密码</label>
        <input class="field-input" id="li-pass" type="password" autocomplete="off"
               onkeydown="if(event.key==='Enter') submitLogin()">
      </div>
      <p class="field-error" id="li-error"></p>
      <button class="login-btn" id="li-submit" onclick="submitLogin()">登录</button>
    </div>
  </div>
  <p class="login-footnote">蜀九香 · 都柏林</p>
</div>

<div class="console-screen" id="console-screen" hidden>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img class="sidebar-logo" src="image/LOGO/logo.webp" alt="蜀九香">
        <div class="sidebar-brand-name">蜀九香都柏林</div>
        <div class="sidebar-brand-sub">点餐营销管理系统</div>
        <div class="sidebar-brand-rule"></div>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" id="nav-home" onclick="switchView('home')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <rect x="3" y="3" width="6" height="6" rx="1"/>
            <rect x="11" y="3" width="6" height="6" rx="1"/>
            <rect x="3" y="11" width="6" height="6" rx="1"/>
            <rect x="11" y="11" width="6" height="6" rx="1"/>
          </svg>
          <span>系统首页</span>
        </button>
        <button class="nav-item" id="nav-staff" onclick="switchView('staff')">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="6.5" r="3.2"/>
            <path d="M3.5 16.5c0-3.4 2.9-6 6.5-6s6.5 2.6 6.5 6"/>
          </svg>
          <span>员工操作端口</span>
        </button>
        <div class="nav-group" id="nav-menu-group">
          <button class="nav-group-toggle" onclick="toggleMenuGroup()">
            <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9.3h14c0 3.9-3.1 7-7 7s-7-3.1-7-7z"/>
              <path d="M6.2 9.3c0-2.2 1.7-4 3.8-4s3.8 1.8 3.8 4"/>
              <line x1="10" y1="3" x2="10" y2="4.3"/>
            </svg>
            <span>菜品管理</span> <span class="chevron">▾</span>
          </button>
          <div class="nav-subwrap">
            <div class="nav-subwrap-inner">
              <a class="nav-subitem" href="员工端/spgl.html">
                <svg class="nav-subicon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
                  <line x1="6.3" y1="5.5" x2="16" y2="5.5"/>
                  <line x1="6.3" y1="10" x2="16" y2="10"/>
                  <line x1="6.3" y1="14.5" x2="16" y2="14.5"/>
                  <circle cx="3.4" cy="5.5" r="0.9" fill="currentColor" stroke="none"/>
                  <circle cx="3.4" cy="10" r="0.9" fill="currentColor" stroke="none"/>
                  <circle cx="3.4" cy="14.5" r="0.9" fill="currentColor" stroke="none"/>
                </svg>
                <span>商品列表</span>
              </a>
              <a class="nav-subitem" href="员工端/gqcp.html">
                <svg class="nav-subicon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
                  <circle cx="10" cy="10" r="7"/>
                  <line x1="5.3" y1="14.7" x2="14.7" y2="5.3"/>
                </svg>
                <span>沽清菜品</span>
              </a>
            </div>
          </div>
        </div>
      </nav>
    </aside>

    <div class="main">
      <div class="topbar">
        <p class="breadcrumb" id="breadcrumb">系统首页</p>
        <div class="user-module">
          <span class="user-avatar"></span>
          <button class="logout-btn" onclick="firebase.auth().signOut()">退出登录</button>
        </div>
      </div>

      <section class="view active" id="view-home">
        <div class="stat-panel">
          <div class="panel-header">运营概况</div>
          <div class="stat-grid">
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">今日桌数</span>
                <svg class="stat-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4">
                  <circle cx="10" cy="10" r="7.3"/>
                  <circle cx="10" cy="10" r="2.6"/>
                </svg>
              </div>
              <div class="stat-value" id="stat-tables">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">今日订单数</span>
                <svg class="stat-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 3h10v13l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1V3z"/>
                  <line x1="7" y1="7" x2="13" y2="7"/>
                  <line x1="7" y1="10" x2="13" y2="10"/>
                </svg>
              </div>
              <div class="stat-value" id="stat-orders">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">今日扫码点单营业额</span>
                <svg class="stat-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                  <circle cx="10" cy="10" r="7.3"/>
                  <path d="M12.6 7.1c-.7-.5-1.5-.8-2.4-.8-2 0-3.6 1.6-3.6 3.7s1.6 3.7 3.6 3.7c.9 0 1.7-.3 2.4-.8"/>
                  <line x1="6" y1="8.6" x2="10.6" y2="8.6"/>
                  <line x1="6" y1="11.4" x2="10.6" y2="11.4"/>
                </svg>
              </div>
              <div class="stat-value" id="stat-revenue">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">今日加菜次数</span>
                <svg class="stat-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 11c0 3 2.7 5 6 5s6-2 6-5"/>
                  <line x1="3.3" y1="11" x2="16.7" y2="11"/>
                  <line x1="14.5" y1="3.3" x2="14.5" y2="7.3"/>
                  <line x1="12.5" y1="5.3" x2="16.5" y2="5.3"/>
                </svg>
              </div>
              <div class="stat-value" id="stat-addons">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">
                <span class="stat-label">总订单数</span>
                <svg class="stat-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="10" cy="5.3" rx="6" ry="2"/>
                  <path d="M4 5.3v4c0 1.1 2.7 2 6 2s6-.9 6-2v-4"/>
                  <path d="M4 9.3v4c0 1.1 2.7 2 6 2s6-.9 6-2v-4"/>
                </svg>
              </div>
              <div class="stat-value" id="stat-total-orders">—</div>
            </div>
            <div class="stat-card">
              <div class="stat-card-head">

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script>
var EMAIL_SUFFIX = '@sjxddxt.local';
function toEmail(u){
  u = u.toLowerCase();
  return u.indexOf('@') === -1 ? u + EMAIL_SUFFIX : u;
}

function showLogin(){
  document.getElementById('auth-blocker').hidden = true;
  document.getElementById('console-screen').hidden = true;
  document.getElementById('login-screen').hidden = false;
  document.getElementById('li-user').focus();
}
function showConsole(){
  document.getElementById('auth-blocker').hidden = true;
  document.getElementById('login-screen').hidden = true;
  document.getElementById('console-screen').hidden = false;
}

function submitLogin(){
  var u = document.getElementById('li-user').value.trim();
  var p = document.getElementById('li-pass').value;
  var errEl = document.getElementById('li-error');
  var btn = document.getElementById('li-submit');
  if(!u || !p){ errEl.textContent = '请输入用户名和密码'; return; }
  btn.disabled = true;
  btn.textContent = '登录中…';
  firebase.auth().signInWithEmailAndPassword(toEmail(u), p).catch(function(err){
    errEl.textContent = err.code === 'auth/too-many-requests'
      ? '尝试次数过多，请稍后再试'
      : '用户名或密码错误';
    document.getElementById('li-pass').value = '';
    btn.disabled = false;
    btn.textContent = '登录';
  });
}

firebase.auth().onAuthStateChanged(function(user){
  if(user) showConsole(); else showLogin();
});

// ---------- 侧边栏分类切换（"菜品管理"下面两个子项是真链接，点了直接跳走，
// 不需要在这里处理） ----------
var VIEW_TITLES = { home: '系统首页', staff: '员工操作端口' };
function switchView(view){
  document.getElementById('nav-home').classList.toggle('active', view === 'home');
  document.getElementById('nav-staff').classList.toggle('active', view === 'staff');
  document.getElementById('view-home').classList.toggle('active', view === 'home');
  document.getElementById('view-staff').classList.toggle('active', view === 'staff');
  document.getElementById('breadcrumb').textContent = VIEW_TITLES[view];
}

// "菜品管理"是手风琴：默认收起，点了才展开出商品列表/沽清菜品两个链接
function toggleMenuGroup(){
  document.getElementById('nav-menu-group').classList.toggle('expanded');
}

// ---------- 运营概况：真实数据来自"今日盘点"用的同一份 dailyOrders 集合
// （每次结账写一条记录：当天日期、桌号、营业额、这一桌一共几批订单
// batchCount、其中几批是加菜 addOnBatchCount）。这里不按日期筛选地整份订阅，
// 数据量目前很小，"数据统计"页也是同样整份拉取的写法 ----------
var db = firebase.firestore();
db.settings({ experimentalAutoDetectLongPolling: true });
var dailyOrdersRef = db.collection('dailyOrders');

function todayKey(d){
  d = d || new Date();
  var pad = function(n){ return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function formatPrice(v){ return '€' + v.toFixed(2); }

// batchCount（一笔结账里其实下了几批订单）是 2026-09-06 才上线的埋点，
// 在那之前的结账记录没有这个字段——缺失时按"至少 1 批"退化，而不是当 0
// 计，否则历史订单数会被严重低估（见 员工端/ygczrz.html 里同样的说明）
function batchCountOf(r){ return r.batchCount != null ? r.batchCount : 1; }

dailyOrdersRef.onSnapshot(function(snap){
  var all = snap.docs.map(function(d){ return d.data(); });
  var todayStr = todayKey();
  var todayRecords = all.filter(function(r){ return r.date === todayStr; });

  var tables = new Set(todayRecords.map(function(r){ return r.table; }));
  var todayOrders = todayRecords.reduce(function(s, r){ return s + batchCountOf(r); }, 0);
  var todayAddOns = todayRecords.reduce(function(s, r){ return s + (r.addOnBatchCount || 0); }, 0);
  var todayRevenue = todayRecords.reduce(function(s, r){ return s + (r.revenue || 0); }, 0);
  var totalOrders = all.reduce(function(s, r){ return s + batchCountOf(r); }, 0);
  var totalRevenue = all.reduce(function(s, r){ return s + (r.revenue || 0); }, 0);

  // 日均桌数：每条记录本来就是"一桌一次结账"，按日期把桌号去重计数，
  // 再对出现过记录的天数取平均——不是"总桌次 / 7"这种固定天数，开业没满
  // 一周或者中间歇业的日子不该被强行摊薄
  var tablesByDate = {};
  all.forEach(function(r){
    if(!tablesByDate[r.date]) tablesByDate[r.date] = new Set();
    tablesByDate[r.date].add(r.table);
  });
  var activeDates = Object.keys(tablesByDate);
  var avgTablesPerDay = activeDates.length
    ? activeDates.reduce(function(s, d){ return s + tablesByDate[d].size; }, 0) / activeDates.length
    : 0;

  // 平均客单价：总营业额 / 总结账次数（每条记录就是一次结账），不是除以桌数——
  // 同一桌可能分批加菜但只结一次账，记录数才是真正的"单"数。是全部历史数据算
  // 出来的平均值，不是"今天"这一天的客单价
  var perTable = all.length ? totalRevenue / all.length : 0;

  document.getElementById('stat-tables').textContent = tables.size;
  document.getElementById('stat-orders').textContent = todayOrders;
  document.getElementById('stat-revenue').textContent = formatPrice(todayRevenue);
  document.getElementById('stat-addons').textContent = todayAddOns;
  document.getElementById('stat-total-orders').textContent = totalOrders;
  document.getElementById('stat-total-revenue').textContent = formatPrice(totalRevenue);
  document.getElementById('stat-avg-tables').textContent = avgTablesPerDay.toFixed(1);
  document.getElementById('stat-per-table').textContent = formatPrice(perTable);

  buildTrend(all, todayStr);
}, function(){});

// 运营走势：近 7 天（含今天）每天的营业额，按日期汇总同一份 dailyOrders 数据
function buildTrend(all, todayStr){
  var days = [];
  for(var i = 6; i >= 0; i--){
    var d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  var byDate = {};
  all.forEach(function(r){ byDate[r.date] = (byDate[r.date] || 0) + (r.revenue || 0); });
  var values = days.map(function(d){ return byDate[todayKey(d)] || 0; });
  var max = Math.max.apply(null, values.concat([1]));
  var barMaxPx = 118;

  var barsEl = document.getElementById('trend-bars');
  var labelsEl = document.getElementById('trend-labels');

  barsEl.innerHTML = days.map(function(d, i){
    var v = values[i];
    var h = v > 0 ? Math.max(Math.round((v / max) * barMaxPx), 4) : 2;
    return '<div class="chart-col">' +
      '<span class="chart-bar-value">' + (v > 0 ? formatPrice(v) : '') + '</span>' +
      '<div class="chart-bar' + (v === 0 ? ' zero' : '') + '" style="height:' + h + 'px;transform:scaleY(0)"></div>' +
    '</div>';
  }).join('');

  labelsEl.innerHTML = days.map(function(d){
    var isToday = todayKey(d) === todayStr;
    return '<div class="chart-col-label' + (isToday ? ' is-today' : '') + '">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>';
  }).join('');

  // 双 rAF：先让浏览器画出 scaleY(0) 的初始帧，下一帧再设成 scaleY(1)，
  // 这样 transition 才会真的从 0 长上去——用 transform 而不是 height 做
  // 动画，避免触发布局重排
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      barsEl.querySelectorAll('.chart-bar').forEach(function(el){
        el.style.transform = 'scaleY(1)';
      });
    });
  });
}
</script>
