let soldOutIds = new Set();
let selected = new Set();
let modal = null;   // null | 'soldOut' | 'restore'
let loaded = false;
let searchQuery = '';
let showSoldOutOnly = false;

function toggleSoldOutOnlyView(){
  showSoldOutOnly = !showSoldOutOnly;
  const btn = document.getElementById('viewToggleBtn');
  btn.textContent = showSoldOutOnly ? '展示所有菜品' : '显示已沽清菜品';
  btn.classList.toggle('active', showSoldOutOnly);
  renderList();
}

function onSearchInput(value){
  searchQuery = value;
  document.getElementById('searchClearBtn').classList.toggle('visible', searchQuery.length > 0);
  renderList();   // search box lives outside #app, so it doesn't need (and shouldn't trigger) a full render()
}

function clearSearch(){
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  document.getElementById('searchClearBtn').classList.remove('visible');
  renderList();
}

function matchesFilters(d){
  if(showSoldOutOnly && !soldOutIds.has(d.id)) return false;
  if(!searchQuery.trim()) return true;
  return d.name.toLowerCase().includes(searchQuery.trim().toLowerCase());
}

menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  loaded = true;
  render();
}, err => {});

function toggleSelect(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  render();
}

function openSoldOutModal(){
  if(selected.size === 0) return;
  modal = 'soldOut';
  render();
}

function openRestoreModal(){
  if(selected.size === 0) return;
  modal = 'restore';
  render();
}

function closeModal(){
  modal = null;
  render();
}

// 沽清：把已选菜品并入现有沽清集合再整体写回（不影响其他已沽清的菜）
async function confirmSoldOut(){
  const ids = new Set(soldOutIds);
  selected.forEach(id => ids.add(id));
  try{ await menuStatusRef.set({ ids: Array.from(ids) }); }catch(e){}
  selected.clear();
  modal = null;
  render();
}

// 恢复售卖：把已选菜品从沽清集合里移除
async function confirmRestore(){
  const ids = new Set(soldOutIds);
  selected.forEach(id => ids.delete(id));
  try{ await menuStatusRef.set({ ids: Array.from(ids) }); }catch(e){}
  selected.clear();
  modal = null;
  render();
}

function dishRowHTML(d){
  const checked = selected.has(d.id);
  const soldOut = soldOutIds.has(d.id);
  return `
    <li class="dish-row ${checked ? 'checked' : ''}">
      <label>
        <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleSelect('${d.id}')">
        <span class="dish-row-name">${d.name}</span>
        ${soldOut ? '<span class="sold-out-badge">已沽清</span>' : ''}
      </label>
    </li>`;
}

function selectedNamesHTML(){
  return DISH_LIST.filter(d => selected.has(d.id)).map(d => `<li>${d.name}</li>`).join('');
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!modal){ root.innerHTML = ''; return; }
  if(modal === 'soldOut'){
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <ul class="modal-dish-list">${selectedNamesHTML()}</ul>
          <p class="modal-warning">注意：确认沽清后此菜品将不可点单，请务必与后厨确认！</p>
          <div class="modal-actions">
            <button class="modal-cancel-btn" onclick="closeModal()">取消</button>
            <button class="modal-confirm-btn urgent" onclick="confirmSoldOut()">我已确认无误</button>
          </div>
        </div>
      </div>`;
  }else{
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <ul class="modal-dish-list">${selectedNamesHTML()}</ul>
          <p class="modal-warning">注意：确认恢复售卖后此菜品将立即恢复可点单，请确认无误！</p>
          <div class="modal-actions">
            <button class="modal-cancel-btn" onclick="closeModal()">取消</button>
            <button class="modal-confirm-btn ok" onclick="confirmRestore()">我已确认无误</button>
          </div>
        </div>
      </div>`;
  }
}

function renderList(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = '';
    return;
  }
  const sections = CATEGORY_ORDER.map(cat => {
    const items = DISH_LIST.filter(d => d.category === cat && matchesFilters(d));
    if(items.length === 0) return '';
    return `<section class="cat-section"><h2>${CATEGORY_LABELS[cat]}</h2><ul class="dish-list">${items.map(dishRowHTML).join('')}</ul></section>`;
  }).join('');
  app.innerHTML = sections || `<p class="no-results">${showSoldOutOnly ? '目前没有已沽清的菜品' : '没有找到匹配的菜品'}</p>`;
}

function render(){
  document.getElementById('selCount').textContent = selected.size;
  document.getElementById('soldOutCount').textContent = soldOutIds.size;
  document.getElementById('soldOutBtn').disabled = selected.size === 0;
  document.getElementById('restoreBtn').disabled = selected.size === 0;

  renderList();
  renderModal();
}

render();
</script>
</body>
</html>
