function todayKey(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

const ADMIN_USER = 'admingk';
const ADMIN_PASS = '321';

let records = [];
let loaded = false;
let reportOpen = false;
let selectMode = false;
let selectedIds = new Set();
let authModalOpen = false;
let authError = '';

dailyOrdersRef.where('date', '==', todayKey()).onSnapshot(snap => {
  records = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a,b) => a.seq - b.seq);
  loaded = true;
  render();
}, err => {});

// “清除”：进入勾选模式，不需要管理员账号——账号密码只在真正提交删除的那一步才校验
function toggleSelectMode(){
  selectMode = !selectMode;
  selectedIds = new Set();
  render();
}
function toggleSelectRecord(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  render();
}

function openDeleteAuth(){
  if(selectedIds.size === 0) return;
  authError = '';
  authModalOpen = true;
  renderModal();
}
function closeDeleteAuth(){
  authModalOpen = false;
  renderModal();
}

function handleDeleteAuthSubmit(){
  const user = (document.getElementById('auth-user').value || '').trim();
  const pass = document.getElementById('auth-pass').value || '';
  if(user === ADMIN_USER && pass === ADMIN_PASS){
    confirmDeleteSelected();
  }else{
    authError = '用户名或密码错误';
    renderModal();
  }
}

// 只删勾选的那几条——不是清空当天全部盘点，用来纠正误记的流水
async function confirmDeleteSelected(){
  const ids = Array.from(selectedIds);
  authModalOpen = false;
  selectMode = false;
  selectedIds = new Set();
  renderModal();
  render();
  try{
    for(let i = 0; i < ids.length; i += 400){
      const batch = db.batch();
      ids.slice(i, i + 400).forEach(id => batch.delete(dailyOrdersRef.doc(id)));
      await batch.commit();
    }
  }catch(e){ /* 网络问题的话，onSnapshot 下次推送会看到还剩多少没删掉，可以再选一次重删 */ }
}

function totalRevenue(){
  return records.reduce((s, r) => s + (r.revenue || 0), 0);
}

// 汇总当天所有流水记录里的菜品数量，按分类分别排名——报告里"前菜第一名是XX"
// 说的就是这里：每个分类各自取点选频次前 N，而不是混在一起排一个总榜
function topDishesByCategory(perCategoryLimit){
  const counts = new Map();
  records.forEach(r => {
    (r.items || []).forEach(it => {
      counts.set(it.name, (counts.get(it.name) || 0) + it.qty);
    });
  });
  const byCat = new Map();
  counts.forEach((qty, name) => {
    const cat = NAME_TO_CATEGORY[name] || 'drinks';
    if(!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push([name, qty]);
  });
  return CATEGORY_ORDER
    .filter(cat => byCat.has(cat))
    .map(cat => ({
      cat,
      label: CATEGORY_LABELS[cat],
      dishes: byCat.get(cat).sort((a, b) => b[1] - a[1]).slice(0, perCategoryLimit),
    }));
}

function openReport(){
  reportOpen = true;
  renderModal();
}
function closeReport(){
  reportOpen = false;
  renderModal();
}

function recordRowHTML(r){
  const itemSummary = (r.items || []).map(it => `${it.name}×${it.qty}`).join('、');
  const selected = selectedIds.has(r.id);
  return `
    <tr class="${selected ? 'row-selected' : ''}" ${selectMode ? `onclick="toggleSelectRecord('${r.id}')" style="cursor:pointer;"` : ''}>
      ${selectMode ? `<td><input type="checkbox" class="record-checkbox" ${selected?'checked':''} onclick="event.stopPropagation();toggleSelectRecord('${r.id}')"></td>` : ''}
      <td class="record-seq num">#${String(r.seq).padStart(3,'0')}</td>
      <td class="num">${formatTime(r.archivedAt)}</td>
      <td class="record-items">${itemSummary}</td>
      <td class="num">${formatPrice(r.revenue || 0)}</td>
    </tr>`;
}

function headerActionsHTML(){
  if(selectMode){
    return `
      <span class="select-count">已选 ${selectedIds.size} 条</span>
      <button class="btn btn-outline" onclick="toggleSelectMode()">取消</button>
      <button class="btn btn-danger-outline" onclick="openDeleteAuth()" ${selectedIds.size===0?'disabled':''}>确认清除</button>`;
  }
  return `
    <button class="btn btn-outline" onclick="toggleSelectMode()" ${records.length===0?'disabled':''}>清除记录</button>
    <button class="btn btn-primary" onclick="openReport()">生成报告</button>`;
}

// 按桌号分组：桌1只展示桌1的记录，桌与桌之间用分割线隔开（见 .table-group 的 border-bottom）
function groupByTable(list){
  const map = new Map();
  list.forEach(r => {
    if(!map.has(r.table)) map.set(r.table, []);
    map.get(r.table).push(r);
  });
  const groups = Array.from(map.entries()).map(([table, recs]) => ({
    table,
    records: recs.slice().sort((a, b) => a.seq - b.seq),
    revenue: recs.reduce((s, r) => s + (r.revenue || 0), 0),
  }));
  groups.sort((a, b) => {
    const na = parseFloat(a.table), nb = parseFloat(b.table);
    if(!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return String(a.table).localeCompare(String(b.table));
  });
  return groups;
}

function tableGroupHTML(g){
  return `
    <section class="table-group">
      <div class="table-group-head">
        <span class="table-group-num">桌 ${escapeHtml(g.table)}</span>
        <span class="table-group-meta">共 ${g.records.length} 笔 · 今日小计 <b>${formatPrice(g.revenue)}</b></span>
      </div>
      <div class="data-table-wrap"><table>
        <thead><tr>
          ${selectMode ? '<th></th>' : ''}
          <th>单号</th><th>时间</th><th>菜品明细</th><th class="num">营业额</th>
        </tr></thead>
        <tbody>${g.records.map(recordRowHTML).join('')}</tbody>
      </table></div>
    </section>`;
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(authModalOpen){
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeDeleteAuth()">
        <div class="modal-box auth-modal-box">
          <p class="confirm-question">确认删除选中的 ${selectedIds.size} 条记录？</p>
          <p class="confirm-sub">需要管理员账号确认，删除后无法恢复，且不会再出现在"数据统计"里。</p>
          <input type="text" id="auth-user" class="field-input" placeholder="用户名" autocomplete="off"
                 onkeydown="if(event.key==='Enter') document.getElementById('auth-pass').focus()">
          <input type="password" id="auth-pass" class="field-input" placeholder="密码" autocomplete="off"
                 onkeydown="if(event.key==='Enter') handleDeleteAuthSubmit()">
          ${authError ? `<p class="login-error">${authError}</p>` : ''}
          <div class="confirm-actions">
            <button class="btn btn-outline" onclick="closeDeleteAuth()">取消</button>
            <button class="btn btn-danger" onclick="handleDeleteAuthSubmit()">确认删除</button>
          </div>
        </div>
      </div>`;
    const userInput = document.getElementById('auth-user');
    if(userInput) userInput.focus();
    return;
  }
  if(!reportOpen){ root.innerHTML = ''; return; }
  const categories = topDishesByCategory(3);
  const rankMedals = ['🥇','🥈','🥉'];
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeReport()">
      <div class="modal-box">
        <div class="report-total-row">
          <span class="report-total-label">今日总营业额</span>
          <span class="report-total-amount">${formatPrice(totalRevenue())}</span>
        </div>
        <div class="report-cat-scroll">
          ${categories.length === 0
            ? `<p style="color:var(--ink-soft);font-size:13px;">暂无数据</p>`
            : categories.map(c => `
              <div class="report-cat-section">
                <p class="report-cat-title">${c.label}</p>
                <ul class="report-dish-list">
                  ${c.dishes.map(([name, qty], i) => `
                    <li>
                      <span class="rank-badge">${rankMedals[i] || (i+1)}</span>
                      <span class="report-dish-name">${name}</span>
                      <span class="report-dish-qty">${qty} 份</span>
                    </li>`).join('')}
                </ul>
              </div>`).join('')}
        </div>
        <button class="modal-close-btn" onclick="closeReport()">关闭</button>
      </div>
    </div>`;
}

function render(){
  document.getElementById('header-actions').innerHTML = headerActionsHTML();

  const app = document.getElementById('app');
  const statEl = document.getElementById('stat-line');
  if(!loaded){
    statEl.innerHTML = '';
    app.innerHTML = '';
  }else if(records.length === 0){
    statEl.innerHTML = '';
    app.innerHTML = `<p class="empty-hint">今天还没有桌子结账离开，盘点记录会在员工点"顾客已经结账离开，移出看板"后自动生成。</p>`;
  }else{
    const groups = groupByTable(records);
    statEl.innerHTML = `当天总营业额 <b>${formatPrice(totalRevenue())}</b> · 今日共 <b>${groups.length}</b> 桌 · <b>${records.length}</b> 笔结账`;
    app.innerHTML = groups.map(tableGroupHTML).join('');
  }

  renderModal();
}

render();
</script>
</body>
</html>
