async function fetchTableOrders(table){
  try{
    const snap = await withTimeout(ordersRef.where('table', '==', String(table)).get(), 8000);
    return snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  }catch(e){ return []; }
}

// 判断两份菜品列表是不是完全一样的内容（忽略数组顺序）——只在"抢草稿失败，
// 要去确认是不是被同桌另一台设备抢先提交了"这一种场景下才会用到；本机自己的
// 重试不再靠这个判断，靠下面的幂等键
function itemsSignature(items){
  return JSON.stringify((items || []).map(it =>
    [it.name, it.qty, it.price, it.spice || '', it.size || '', it.cookMethod || '', (it.excludes || []).slice().sort().join(',')]
  ).sort());
}

// 这一桌最近 windowMs 毫秒内，是不是已经有一笔菜品完全一样的订单
function findRecentDuplicateOrder(candidateOrders, items, windowMs){
  const now = Date.now();
  const sig = itemsSignature(items);
  return candidateOrders.find(o => (now - o.createdAt) < windowMs && itemsSignature(o.items) === sig) || null;
}

// 模糊重复下单提醒：跟上面"完全一致"的判重不是一回事——那一套只拦得住内容
// 逐字节相同的场景（本机重试/同桌抢草稿）。这里专门抓"内容高度重叠但不完全
// 一样"的可疑场景，比如同桌不小心把上一轮几乎整份菜又点了一遍（只是顺手换了
// 个份量、少选一样东西）。命中不直接拦下或吞掉——那样风险太高，万一真的是
// 顾客自己想再点一轮一样的菜，会造成真实丢单；只是弹窗交给顾客自己确认。
// 判重口径（10 分钟内 / 单量 > 5 / 锅底重复 / 至少 5 道菜重复）都是产品侧定的
// 经验值，不是什么精确算法。
const DUP_WARN_WINDOW_MS = 10 * 60 * 1000;
const DUP_WARN_MIN_TOTAL_ITEMS = 5;   // 这一轮提交单品数"超过五个"才需要检查
const DUP_WARN_MIN_OVERLAP = 5;       // 跟历史订单至少"五个单品重复"才算数

// 一份订单的 items 里，真正算"锅底"的那些菜品 id（排除蘸料——蘸料也挂在
// soupBase 分类下方便导航，但换蘸料不算换锅底，见 tableAlreadyHasSoupBase）
function orderSoupBaseIds(items){
  const ids = new Set();
  (items || []).forEach(it => {
    const id = ZH_NAME_TO_ID[it.name];
    const dish = id && MENU_BY_ID[id];
    if(dish && dish.category === 'soupBase' && dish.sub !== 'dipSauce') ids.add(id);
  });
  return ids;
}

// itemDishIds 是这次要提交的购物车对应的菜品 id 列表（见 submitOrder）。返回
// null（没命中）或者 { matchedOrder, overlapIds }（命中，overlapIds 是这次提交
// 里跟 matchedOrder 重复的那些菜品 id）
function findLikelyDuplicateSubmission(priorOrders, items, itemDishIds){
  if(items.length <= DUP_WARN_MIN_TOTAL_ITEMS) return null;
  const curSoupIds = orderSoupBaseIds(items);
  if(curSoupIds.size === 0) return null;
  const curDishIds = new Set(itemDishIds);
  const now = Date.now();

  const candidates = (priorOrders || []).filter(o => !o.call && (now - o.createdAt) < DUP_WARN_WINDOW_MS);
  for(const o of candidates){
    const oSoupIds = orderSoupBaseIds(o.items);
    if(oSoupIds.size === 0) continue;
    const sameSoup = [...curSoupIds].some(id => oSoupIds.has(id));
    if(!sameSoup) continue;
    const oDishIds = new Set((o.items || []).map(it => ZH_NAME_TO_ID[it.name]).filter(Boolean));
    const overlapIds = itemDishIds.filter(id => oDishIds.has(id));
    if(overlapIds.length >= DUP_WARN_MIN_OVERLAP){
      return { matchedOrder: o, overlapIds: new Set(overlapIds) };
    }
  }
  return null;
}

// 幂等键：代表"这一次提交这份内容"这个意图，不是"这一桌这一轮确认下单"这个
// 大概念——键必须跟内容绑在一起。存的是 { key, fingerprint, items }（items 是
// [{id,qty}]，供刷新页面之后 reconcileStaleKeyIfResolved 精确划账用）：取键的时候先比
// 一下这次要提交的内容跟上次存的指纹是否一样，一样才复用同一个 key（重试，
// 不管隔了多久）；不一样（比如顾客看到"失败"以为没提交上，往购物车又加了一道
// 菜再重试）就必须发一把新键——不然会命中上一次那个只有旧内容的订单文档，
// 判定成"已存在"直接复用，新加的那道菜就悄无声息地丢了，界面还显示"成功"，
// 是比重复下单更隐蔽的一种丢单。
// 存在 sessionStorage：页面刷新还能读到（断网重试时很常见的操作——用户等得
// 不耐烦习惯性刷新页面），关掉标签页/换一桌自动作废，不会被"员工测试机"或者
// "顾客下次光顾同一桌"这种无关场景污染
const IDEMPOTENCY_KEY_PREFIX = 'pendingOrderKey:';
let memoryIdempotencyKeys = {};   // sessionStorage 不可用时的内存兜底，按桌号存 { key, fingerprint, items }
function genIdempotencyKey(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}
// itemDishIds 是跟 items 下标对齐的菜品 id 数组（见 submitOrder）——存进
// sessionStorage 的 dishQtyPairs 就是靠它转出来的，供页面刷新之后
// reconcileStaleKeyIfResolved 精确划账用（详见那边的说明）
function getOrCreateIdempotencyKey(table, items, itemDishIds){
  const storageKey = IDEMPOTENCY_KEY_PREFIX + table;
  const fingerprint = itemsSignature(items);
  const dishQtyPairs = toDishQtyPairs(itemDishIds, items);
  try{
    let cached = null;
    try{ cached = JSON.parse(sessionStorage.getItem(storageKey) || 'null'); }catch(e){ cached = null; }
    if(cached && cached.key && cached.fingerprint === fingerprint) return cached.key;
    const fresh = { key: genIdempotencyKey(), fingerprint, items: dishQtyPairs };
    sessionStorage.setItem(storageKey, JSON.stringify(fresh));
    return fresh.key;
  }catch(e){
    const cached = memoryIdempotencyKeys[table];
    if(cached && cached.fingerprint === fingerprint) return cached.key;
    const fresh = { key: genIdempotencyKey(), fingerprint, items: dishQtyPairs };
    memoryIdempotencyKeys[table] = fresh;
    return fresh.key;
  }
}
function clearIdempotencyKey(table){
  try{ sessionStorage.removeItem(IDEMPOTENCY_KEY_PREFIX + table); }catch(e){}
  delete memoryIdempotencyKeys[table];
}

// 草稿里存的是"菜品 id -> 选择"，订单文档要的是"菜名/单价/规格都算好了"的
// 展示用列表——这个转换要在事务里、用事务这次读到的 draftItems 现算，不能用
// 外部传进来的一份提前算好的快照（见 attemptSubmitOrder 的说明）
function buildOrderItemsFromDraft(draftItems){
  const activeIds = Object.keys(draftItems).filter(id => draftItems[id] && draftItems[id].qty > 0);
  const orderedIds = MENU.map(d => d.id).filter(id => activeIds.includes(id));
  const out = [];
  orderedIds.forEach(id => {
    const d = MENU_BY_ID[id];
    if(!d) return;   // 菜单里已经找不到这道菜了（比如被下架），跳过，不让事务因此崩掉
    const it = draftItems[id];
    const entry = { name: dishZhName(d, it), qty: it.qty, price: dishUnitPrice(d, it) };
    if(d.spicy) entry.spice = it.spice;
    if(d.sizes) entry.size = it.size || defaultSizeKey(d);
    if(d.category === 'dumplings') entry.cookMethod = it.cookMethod || 'steamed';
    const excludeKeys = Object.keys(it.excludes || {}).filter(k => it.excludes[k]);
    if(excludeKeys.length) entry.excludes = excludeKeys;
    out.push(entry);
  });
  return out;
}

// 真正建单：一个事务里同时原子判定两件事——
// ①这个幂等键之前是不是已经落地过一笔订单了（本机自己的重试，不管隔了多久）
// ②草稿里这次要提交的菜是不是还在（不在就是同桌另一台设备已经抢先提交并清空过）
// 两件事都在数据库层面判定，不再靠猜时间窗口或者比内容——Firestore 事务是乐观
// 并发控制，谁先提交谁赢，输的那一方会自动重跑这个事务、重新读到最新状态。
//
// 关键点：写进订单的 items 必须从这次事务里刚读到的 draftItems 现算，不能用
// 外部传进来的 order.items（提交前在本机算好的一份快照）。原因是 Firestore
// 事务重试的时候，"存在性判断"会用重跑时读到的最新草稿，但如果写入用的是
// 外部闭包住的旧快照，两者就不一致了——比如 A 提交时事务读到草稿是 [X,Y]，
// 期间 B 往草稿里加了 Z，Firestore 检测到冲突自动重跑整个事务，重跑后读到的
// 草稿是 [X,Y,Z]、存在性判断照样通过，但如果写入还是用最初那份 [X,Y] 快照，
// Z 就会在"草稿被整份清空"的同时永久丢失，且没有任何报错。现在改成直接拿
// 这次事务读到的 draftItems 转换成订单内容，写入的永远是"清空前那一刻草稿里
// 真正有什么"，不会再有这个缺口
async function attemptSubmitOrder(order, idempotencyKey){
  const orderRef = ordersRef.doc(idempotencyKey);
  const draftRef = tableCartsRef.doc(order.table);
  let outcome = null;
  await db.runTransaction(async tx => {
    const orderSnap = await tx.get(orderRef);
    if(orderSnap.exists){
      outcome = { status: 'alreadyExists', docId: idempotencyKey };
      return;
    }
    const draftSnap = await tx.get(draftRef);
    const draftItems = (draftSnap.exists && draftSnap.data().items) || {};
    const itemsFromDraft = buildOrderItemsFromDraft(draftItems);
    if(itemsFromDraft.length === 0){
      outcome = { status: 'claimedByOther' };
      return;
    }
    tx.set(orderRef, {
      table: order.table, items: itemsFromDraft, createdAt: order.createdAt,
      nickname: order.nickname, partySize: order.partySize, status: 'pending',
      isAddOn: order.isAddOn,
    });
    tx.set(draftRef, { items: {}, updatedAt: Date.now() });
    outcome = { status: 'created', docId: idempotencyKey };
  });
  return outcome;
}

// 同一桌可能有多笔未处理订单（加菜），按“菜名+辣度+份量”合并数量，方便顾客看到本桌目前的点单全貌
function mergeItems(ordersList){
  const merged = new Map();
  ordersList.forEach(o => {
    o.items.forEach(it => {
      const key = it.name + '__' + it.spice + '__' + (it.size || '') + '__' + (it.cookMethod || '') + '__' + (it.soupBase || '') + '__' + (it.drink || '') + '__' + (it.forDish || '');
      if(!merged.has(key)) merged.set(key, { name: it.name, spice: it.spice, size: it.size || null, cookMethod: it.cookMethod || null, soupBase: it.soupBase || null, drink: it.drink || null, forDish: it.forDish || null, price: it.price, qty: 0 });
      merged.get(key).qty += it.qty;
    });
  });
  return Array.from(merged.values());
}

async function submitOrder(){
  if(state.submitting || totalCount() === 0) return;
  state.submitting = true; render();

  // 先主动核对一次，上一把还留着的幂等键是不是其实已经成功了——见
  // reconcileStaleKeyIfResolved 的说明。核对完如果购物车因此被划空了
  // （这次要交的内容其实早就交过了），就当无事发生，不用再提交一次
  await reconcileStaleKeyIfResolved(state.table);
  if(totalCount() === 0){
    state.submitting = false;
    render();
    return;
  }

  const items = [];
  const itemDishIds = [];
  MENU.forEach(d => {
    const it = getItem(d.id);
    if(it.qty > 0){
      const entry = { name: dishZhName(d, it), qty: it.qty, price: dishUnitPrice(d, it) };
      if(d.spicy) entry.spice = it.spice;
      if(d.sizes) entry.size = it.size || defaultSizeKey(d);
      if(d.category === 'dumplings') entry.cookMethod = it.cookMethod || 'steamed';
      const excludeKeys = Object.keys(it.excludes || {}).filter(k => it.excludes[k]);
      if(excludeKeys.length) entry.excludes = excludeKeys;
      items.push(entry);
      itemDishIds.push(d.id);
    }
  });

  const order = {
    table: state.table, items, createdAt: Date.now(),
    nickname: state.orderNickname || '', partySize: state.orderPartySize || 1,
  };
  const idempotencyKey = getOrCreateIdempotencyKey(state.table, items, itemDishIds);

  // 提交请求可能卡住/超时，但服务器那边实际上已经建单成功——先记一笔"提交过什么、
  // 用的哪个幂等键"，万一等下报错/卡住，本桌订单实时监听那边收到这笔单子推送时
  // 按 id 精确对上号，自动把这些菜从购物车扣掉（见 reconcilePendingSubmits），
  // 不会等到成功回执才清购物车
  const pendingAttempt = { dishIds: itemDishIds, items, idempotencyKey };
  state.pendingSubmitAttempts.push(pendingAttempt);

  let docId = null;
  let priorOrders = [];
  try{
    priorOrders = await fetchTableOrders(state.table);
    order.isAddOn = priorOrders.length > 0;

    const result = await attemptSubmitOrder(order, idempotencyKey);

    if(result.status === 'created' || result.status === 'alreadyExists'){
      docId = result.docId;
    }else{
      // claimedByOther：草稿已经空了，说明同桌另一台设备刚刚抢先提交过——幂等键
      // 在这里帮不上忙（两台设备各自的键本来就是不相关的随机值），只能退回内容
      // 比对，去查一下最近有没有一笔一样的订单，找到就直接借用；给一个宽松但有
      // 上限的窗口（60 秒），既接得住真实的同桌协作场景，也不会跟顾客一小时后
      // 真的想再点一份一样的菜搞混
      const freshOrders = await fetchTableOrders(state.table);
      const borrowed = findRecentDuplicateOrder(freshOrders, items, 60000);
      if(borrowed){
        docId = borrowed.id;
      }else{
        // 极小概率兜底：查不到那笔（比如它还没同步过来），直接用本机这个幂等键
        // 把订单落地，避免两边都以为对方会交、结果谁都没交。这里能直接 .set()
        // 而不用再走一遍事务，是因为刚才 attemptSubmitOrder 的事务里已经确认过
        // 这个 idempotencyKey 当时还不存在——注意：以后任何地方要重试这个幂等键，
        // 都必须先经过 attemptSubmitOrder 的 tx.get(orderRef) 检查，不能绕开事务
        // 直接对着这个 id 盲发 set()/update()。万一真的撞上"这个 id 已经建过单"，
        // Firestore 会把它判定成 update，顾客端没有登录态会被规则直接拒绝
        // （permission-denied）——那不是真失败，必须 catch 住之后按这个 id 把
        // 已有订单读回来当成功处理，不能当错误弹给用户
        const docRef = await withTimeout(ordersRef.doc(idempotencyKey).set({
          table: order.table, items: order.items, createdAt: order.createdAt,
          nickname: order.nickname, partySize: order.partySize,
          status: 'pending', isAddOn: order.isAddOn,
        }), 12000);
        docId = idempotencyKey;
      }
    }
  }catch(e){
    // 这里报错不代表真的没建单成功——很可能是网络太差、没等到服务器确认就超时了，
    // 服务器那边说不定已经建单成功。所以不清购物车、不清幂等键，也不摘掉
    // pendingAttempt，留着让 reconcilePendingSubmits 之后自己去核对：真成功了就把
    // 这些菜从购物车划掉；下次重试也会从 sessionStorage 里读到同一个幂等键，
    // 不会因为这次"看起来失败了"就换一个新键、绕开数据库的原子判定
    alert(t('orderFailed'));
    state.submitting = false;
    render();
    return;
  }

  // 走到这里说明订单已经确确实实进了 Firebase（或者命中了刚提交过的同一笔）——
  // 立刻就算成功，清购物车、翻到下单成功页，不能再让"结果页要用的补充信息"这种
  // 非关键的后续查询万一失败，倒过来把已经下成的单打成"下单失败"，逼着顾客/员工
  // 再点一次提交、变成真的重复下单（2026-09-07 发现的问题：卡在下单页看着像
  // 没提交成功，其实订单早就进去了）
  //
  // 这里不额外整份覆盖共享草稿：不管 docId 是从哪条分支拿到的——
  // attemptSubmitOrder 的事务建单（建单和清空草稿是同一个事务，不会一个成
  // 一个不成）、alreadyExists（复用的是本机之前那次已经建好的单，那次的事务
  // 早就清过草稿）、borrowed（复用同桌别人建的单，人家的事务也早清过）、还是
  // 兜底直接 .set()（进这条分支前已经确认过草稿是空的）——草稿在这一刻之前
  // 都已经被正确处理过了。这里再补一次整份清空，唯一的效果是冒着把这段等待
  // 期间同桌别的设备新加的内容一起静默抹掉的风险，没有任何东西是它修复的
  clearIdempotencyKey(state.table);
  state.pendingSubmitAttempts = state.pendingSubmitAttempts.filter(a => a !== pendingAttempt);
  // 记一笔"这是本机自己下的单"，"刚刚有人下单啦~"那个提示气泡靠这个跳过自己
  myOwnOrderIds.add(docId);

  // 订单已经落地，立刻翻到下单成功页，不再等任何额外的网络请求——summaryItems
  // （这一桌目前一共点了什么）先用手头已有的数据拼一版，这在绝大多数情况下就是
  // 准的（跟这次提交前查到的 priorOrders 加上这一笔，只有"提交前那一刻查完到现在
  // 又冒出别的批次"这种极小概率的窗口期会略有出入），比让顾客对着转圈等一次可有
  // 可无的汇总请求要好
  state.lastOrder = {
    table: order.table, items: order.items, summaryItems: mergeItems([...priorOrders, order]), isAddOn: order.isAddOn,
    nickname: order.nickname, partySize: order.partySize,
    docId, status: 'pending', removed: false,
  };
  screenHistory.push('menu');
  state.screen = 'confirm';
  state.submitting = false;
  render();

  // 后台把汇总补准一次（如果这期间桌子上确实又多了别的批次），失败或者用户已经
  // 翻页离开了都不影响——这次提交本身早就成功了
  fetchTableOrders(state.table).then(tableOrders => {
    if(tableOrders.length === 0 || !state.lastOrder || state.lastOrder.docId !== docId) return;
    state.lastOrder.summaryItems = mergeItems(tableOrders);
    if(state.screen === 'confirm') render();
  }).catch(() => {});
}

function flameIcons(n){
  let out = '';
  for(let i=0;i<3;i++){
    out += `<svg class="flame ${i<n?'lit':''}" viewBox="0 0 24 24" width="11" height="11">
      <path d="M12 2c1 3-3 4-3 7a3 3 0 006 0c0-1-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-4 3-5 5-9z"/>
    </svg>`;
  }
  return out;
}


function sizeRowHTML(d, it){
  return `<div class="size-row">
    ${d.sizes.map(s=>{
      const soldOut = isSizeSoldOut(d, s.key);
      const active = (it.size||defaultSizeKey(d))===s.key;
      return `<button class="size-pill ${active?'active':''}${soldOut?' sold-out':''}" ${soldOut?'disabled':''} onclick="setSize('${d.id}','${s.key}')">
        <span class="size-label">${tSize(s.key)}</span><span class="size-price">${soldOut ? t('soldOutShort') : formatPrice(s.price)}</span>
      </button>`;
    }).join('')}
  </div>`;
}

function optionsRowHTML(d, it){
  return `<div class="option-row">
    ${d.options.map(key=>`
      <button class="option-chip ${it.excludes[key]?'active':''}" onclick="toggleExclude('${d.id}','${key}')">
        <span class="option-check">${it.excludes[key]?'✓':''}</span><span>${tOption(key)}</span>
      </button>`).join('')}
  </div>`;
}

function allergenChipsHTML(codes){
  if(!codes || codes.length===0) return '';
  return `
    <div class="allergen-row">${codes.map(c=>`<button class="allergen-chip" onclick="showAllergenPopup(event,'${c}')">${c}</button>`).join('')}</div>
    <p class="allergen-tap-hint">${t('allergenTapHint')}</p>`;
}

document.addEventListener('click', closeAllergenPopup);

function allergenModalHTML(){
  if(!state.allergenInfoOpen) return '';
  return `
    <button class="lang-switcher-overlay" onclick="toggleAllergenInfo()" aria-label="${t('closeMenu')}"></button>
    <div class="lang-switcher-panel allergen-modal">
      <p class="lang-switcher-title">${t('allergensModalTitle')}</p>
      <div class="allergen-grid">
        ${ALLERGEN_CODE_ORDER.map(c=>`<div class="allergen-grid-item"><span class="allergen-chip">${c}</span><span>${tAllergen(c)}</span></div>`).join('')}
      </div>
    </div>`;
}

let chefCarouselTimer = null;
let chefCarouselIndex = 0;

function stopChefCarousel(){
  if(chefCarouselTimer){ clearInterval(chefCarouselTimer); chefCarouselTimer = null; }
}

function startChefCarousel(){
  if(chefCarouselTimer || CHEF_ITEMS.length < 2) return;
  chefCarouselTimer = setInterval(()=>{
    const visibleChefItems = CHEF_ITEMS.filter(d=>isDishVisible(d.id));
    if(visibleChefItems.length === 0) return;
    chefCarouselIndex = (chefCarouselIndex + 1) % visibleChefItems.length;
    const d = visibleChefItems[chefCarouselIndex];
    const name = tDish(d.id,'name');
    const img = document.getElementById('chef-carousel-photo');
    const cap = document.getElementById('chef-carousel-caption');
    if(!img || !cap) return;
    img.style.opacity = 0;
    cap.style.opacity = 0;
    setTimeout(()=>{
      img.src = d.img;
      img.alt = name;
      cap.textContent = name;
      img.style.opacity = 1;
      cap.style.opacity = 1;
    }, 300);
  }, 3000);
}

function chefCarouselHTML(){
  const visibleChefItems = CHEF_ITEMS.filter(d=>isDishVisible(d.id));
  if(visibleChefItems.length===0) return '';
  const d = visibleChefItems[chefCarouselIndex % visibleChefItems.length];
  const name = tDish(d.id,'name');
  return `
    <div class="chef-carousel">
      <button class="chef-slide" onclick="setCategory('houseSpecial')">
        <img id="chef-carousel-photo" class="chef-slide-photo" src="${d.img}" alt="${name}" decoding="async" onerror="this.style.display='none'">
        <span class="chef-slide-tag">${tCat('houseSpecial')}</span>
        <span id="chef-carousel-caption" class="chef-slide-caption">${name}</span>
      </button>
    </div>`;
}

// Everything that only shows up once qty>0 (spice level, cook method,
// options) lives in one "extension" note below the card row — a divider,
// then an inset slip — instead of stretching/recentering the row itself
// the instant the + button is tapped. Self-contained (recomputes it/flags)
// so dishCardHTML and updateItemUI can both call it without threading
// state through dishBodyHTML.
function dishExtendHTML(d){
  const it = getItem(d.id);
  if(it.qty<=0) return '';
  const rows = `
    ${d.spicy ? `
      <div class="spice-row">
        ${SPICE_LEVELS.map((lvl,i)=>`
          <button class="spice-pill ${it.spice===lvl?'active':''}" onclick="setSpice('${d.id}','${lvl}')">
            <span class="flames">${flameIcons(i+1)}</span><span class="spice-label">${tSpice(i)}</span>
          </button>`).join('')}
        ${d.category==='soupBase' ? `
          <button class="spice-pill pepper-pill ${it.excludes.noPepper?'active':''}" onclick="toggleExclude('${d.id}','noPepper')">
            <span class="spice-label">${tOption('noPepper')}</span>
          </button>` : ''}
      </div>` : ''}
    ${d.category==='dumplings' ? `
      <div class="spice-row">
        ${['steamed','panFried'].map(m=>`
          <button class="spice-pill ${(it.cookMethod||'steamed')===m?'active':''}" onclick="setCookMethod('${d.id}','${m}')">
            <span class="spice-label">${tCookMethod(m)}</span>
          </button>`).join('')}
      </div>` : ''}
    ${d.options.length>0 ? optionsRowHTML(d, it) : ''}`;
  return rows.trim() ? `<div class="dish-extend"><div class="dish-extend-note">${rows}</div></div>` : '';
}

// A customer once ordered an extra soup-base pot near the end of a meal,
// thinking it was a dish/soup to eat rather than the shared broth the table
// already had — the "Soup Base" category label alone wasn't enough to stop
// that. This note only fires for actual pot dishes (not the dipping sauce)
// and only for non-Chinese languages — Chinese speakers already know what
// 锅底 is, this is purely for guests reading a translated menu.
function isSoupPot(d){ return d.category === 'soupBase' && d.sub !== 'dipSauce'; }

function dishBodyHTML(d){
  const it = getItem(d.id);
  const name = dishDisplayName(d, it);
  const tag = dishDisplayTag(d, it);
  // Dishes with a spice-level picker (potBeefPork/potBeefMushroom/potBeefTomato)
  // carry a static tag that just says "spice level selectable" — that's exactly
  // what the spice-row's own pill labels say once revealed post-qty, so showing
  // both makes the card wider/taller than plain soup-base cards for no reason.
  // Drop the redundant tag and let the extend row speak for itself.
  const hasDeferredSpiceTag = d.spicy;
  return `
          <div class="dish-title-row">
            <h3 class="dish-name">${name}</h3>
            <span class="dish-price">${dishPriceLabel(d, it)}</span>
          </div>
          ${tag && !hasDeferredSpiceTag ? `<p class="tag">${tag}</p>` : ''}
          ${isSoupPot(d) && state.lang !== 'zh' && state.lang !== 'zhHant' ? `<p class="tag pot-note">${t('soupPotNote')}</p>` : ''}
          ${allergenChipsHTML(d.allergens)}
          ${d.sizes ? sizeRowHTML(d, it) : ''}
          <div class="dish-actions">
            <div class="stepper">
              <button onclick="changeQty('${d.id}',-1)" ${it.qty<=0?'disabled':''} aria-label="${t('decreaseQty')}">−</button>

// 算好的一份合并汇总摊平显示，看不出"几点几分下了什么、谁下的、送厨房了没"。
// 改成直接读 liveTableOrders（本桌订单的实时镜像，选桌那一刻就订阅了，见
// watchTableOrders），跟"我的订单"页用同一份 myOrderBatchHTML 按批次展示——
// 时间、昵称、绿/红状态章都跟着一起有了，不用再维护两份不一样的展示逻辑。
// 这样即使 state.lastOrder.removed 为真（这一笔被工作人员删了），下面这份
// 列表也是实时的，会自动只剩下还在的批次，不需要额外处理
// 顾客点完这一笔的一瞬间，liveTableOrders 那个实时监听可能还没来得及推送这
// 一笔（Firestore 事务提交和本机监听收到回声之间总有个极短的窗口）——如果直接
// 用 liveTableOrders 拼批次列表，会有一闪而过的"这一笔怎么不在列表里"。这里
// 用 state.lastOrder 自己已经知道的内容（items/nickname/status……）先补一份
// 本地兜底进去，liveTableOrders 追上来之后（同一个 docId）会自然替换掉它
function confirmBatches(order){
  const batches = liveTableOrders.filter(o => !o.call);
  if(order.docId && !order.removed && !batches.some(o => o.id === order.docId)){
    batches.push({
      id: order.docId, table: order.table, items: order.items, createdAt: order.createdAt,
      nickname: order.nickname, partySize: order.partySize, status: order.status, isAddOn: order.isAddOn,
    });
  }
  return batches.sort((a,b) => a.createdAt - b.createdAt);
}

function confirmHTML(order){

// Keyed by order.docId so a live Firestore update that re-renders the
// confirm screen (e.g. someone else's item edited) doesn't re-slam the
// stamp or restart the chef's steam every time — each plays once per order.
const confirmAnimState = { stampDocId: null, chefDocId: null, chefTimeline: null, chefDotTween: null };

function animateStamp(){
  const el = document.querySelector('.stamp-ring');
  if(!el) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    gsap.set(el, { autoAlpha: 1, scale: 1, rotation: -8 });
    return;
  }
  const restShadow = '0 0 0 1px rgba(184,64,42,.15), 0 10px 24px rgba(59,44,30,.28), 0 3px 6px rgba(184,64,42,.22)';
  const impactShadow = '0 0 0 1px rgba(184,64,42,.3), 0 16px 30px rgba(59,44,30,.34), 0 0 22px rgba(184,64,42,.4)';
  gsap.set(el, { autoAlpha: 0, scale: 2.1, y: -70, rotation: -8, transformOrigin: '50% 50%', boxShadow: restShadow });
  gsap.timeline()
    .to(el, { autoAlpha: 1, duration: 0.04 }, 0)
    .to(el, { y: 0, scale: 1, duration: 0.3, ease: 'power4.in' }, 0)
    .to(el, { scale: 1.08, rotation: -14, boxShadow: impactShadow, duration: 0.09, ease: 'power1.out' })
    .to(el, { scale: 0.94, rotation: -4, duration: 0.12, ease: 'sine.inOut' })
    .to(el, { scale: 1, rotation: -8, boxShadow: restShadow, duration: 0.4, ease: 'elastic.out(1, 0.45)' });
}

function animateChefSteam(){
  const scene = document.querySelector('.chef-cooking');
  if(!scene) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rings = scene.querySelectorAll('.fx-cooking-ring');
  const dot = scene.querySelector('.fx-cooking-dot');
  gsap.set(rings, { autoAlpha: 0, scale: 0.4, transformOrigin: '50% 50%' });
  gsap.set(dot, { transformOrigin: '50% 50%', scale: 1 });
  // A radar-ping "in progress" indicator: rings radiate out and fade on a
  // loop, a solid center dot breathes independently — a status badge, not a
  // scene, and it keeps reading as "live" for however long the kitchen takes.
  const tl = gsap.timeline({ repeat: -1 });
  rings.forEach((r, i) => {
    tl.fromTo(r, { autoAlpha: 0.6, scale: 0.4 }, { autoAlpha: 0, scale: 2.6, duration: 1.6, ease: 'power1.out' }, i * 0.55);
  });
  confirmAnimState.chefTimeline = tl;
  confirmAnimState.chefDotTween = gsap.to(dot, { scale: 1.15, duration: 0.8, ease: 'sine.inOut', repeat: -1, yoyo: true });
}

function playConfirmAnimations(){
  const order = state.lastOrder;
  if(!order) return;
  const key = order.docId || 'local';
  if(confirmAnimState.stampDocId !== key){
    confirmAnimState.stampDocId = key;
    celebrateOrderSuccess();
    animateStamp();
  }
  if(order.status === 'confirmed' && confirmAnimState.chefDocId !== key){
    confirmAnimState.chefDocId = key;
    animateChefSteam();
  }
}

// The chef-steam loop runs forever (repeat:-1) — stop it once its elements
// are torn out by a render() into a different screen, so it doesn't keep
// ticking against a detached node.
function stopConfirmAnimations(){
  if(confirmAnimState.chefTimeline){
    confirmAnimState.chefTimeline.kill();
    confirmAnimState.chefTimeline = null;
  }
  if(confirmAnimState.chefDotTween){
    confirmAnimState.chefDotTween.kill();
    confirmAnimState.chefDotTween = null;
  }
}

function maintenanceHTML(){
  return `
    <div class="welcome-screen">
      <div class="welcome-inner">
        <div class="welcome-leaf in">
          <img src="../image/LOGO/logo.webp" alt="SJX Cheng Du Hotpot"/>
        </div>
        <p class="maintenance-msg" id="maintenance-msg">${MAINTENANCE_MSG[LANG_ORDER[0]]}</p>
      </div>
    </div>`;
}

let maintenanceTimer = null;
function stopMaintenanceCycle(){
  if(maintenanceTimer){ clearInterval(maintenanceTimer); maintenanceTimer = null; }
}
function mountMaintenanceScreen(){
  if(maintenanceTimer) return;
  let idx = 0;
  maintenanceTimer = setInterval(()=>{
    const el = document.getElementById('maintenance-msg');
    if(!el) return;
    el.classList.add('swap');
    setTimeout(()=>{
      idx = (idx + 1) % LANG_ORDER.length;
      el.textContent = MAINTENANCE_MSG[LANG_ORDER[idx]];
      el.classList.remove('swap');
    }, 400);
  }, 2800);
}

function render(){
  const app = document.getElementById('app');

  if(systemDisabled){
    app.innerHTML = maintenanceHTML();
    document.body.classList.remove('lang-zh-custom', 'lang-zh-hant');
    document.body.classList.add('welcome-bg');
    document.getElementById('panda-nav').innerHTML = '';
    document.getElementById('cart-popup-root').innerHTML = '';
    stopWelcomeCycle();
    stopChefCarousel();
    stopConfirmAnimations();
    mountMaintenanceScreen();
    return;
  }
  stopMaintenanceCycle();

  let screenHtml;
  if(state.screen === 'welcome'){ screenHtml = welcomeHTML(); }
  else if(state.screen === 'confirm'){ screenHtml = confirmHTML(state.lastOrder); }
  else if(state.screen === 'myOrder'){ screenHtml = myOrderHTML(); }
  else if(state.screen === 'cart'){ screenHtml = cartHTML(); }
  else if(state.screen === 'orderReview'){ screenHtml = orderReviewHTML(); }
  else{ screenHtml = menuHTML(); }

  const overlayHtml = state.langSwitcherOpen ? `
    <button class="lang-switcher-overlay" onclick="closeLangSwitcher()" aria-label="${t('closeMenu')}"></button>
    <div class="lang-switcher-panel">
      <p class="lang-switcher-title">${t('languageLabel')}</p>
      ${langPanelHTML('setLanguage')}
    </div>` : '';

  app.innerHTML = screenHtml + overlayHtml;
  document.body.classList.toggle('lang-zh-custom', state.lang === 'zh' && (state.screen === 'welcome' || state.screen === 'menu'));
  document.body.classList.toggle('lang-zh-hant', state.lang === 'zhHant');
  document.body.classList.toggle('welcome-bg', state.screen === 'welcome');
  renderPandaNav();
  renderCartPopup();

  if(state.screen === 'welcome'){ mountWelcomeScreen(); }
  else{ stopWelcomeCycle(); }
  if(state.screen === 'menu'){ startChefCarousel(); }
  else{ stopChefCarousel(); }
  if(state.screen === 'confirm'){ playConfirmAnimations(); }
  else{ stopConfirmAnimations(); }
  syncBrowserHistory();
}

if(state.table){
  watchTableOrders(state.table);
  watchSharedCart(state.table);
  // 这一桌如果还没结账（Firestore 里还有它的订单——结账后订单文档会被整个删掉，
  // 呼叫服务员的 call 单不算），说明顾客是中途重新扫码，不是第一次进店：直接跳过
  // 欢迎页进菜单，语言用这台设备上次选过的（没存过就默认英文，不默认中文，
  // 免得语言忽然变成看不懂的）。用 state.screen==='welcome' 兜底，防止这份请求
  // 还没回来时顾客已经自己手动选了语言/往下走了，那样就不要再帮它跳转一次。
  fetchTableOrders(state.table).then(list => {
    const hasActiveOrder = list.some(o => !o.call);
    if(hasActiveOrder && state.screen === 'welcome'){
      applyLanguage(getStoredLanguage() || 'en');
      stopWelcomeCycle();
      screenHistory = [];
      state.screen = 'menu';
      render();
    }
  });
}
render();
</script>
</body>
</html>
