  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);

    min-height:100vh;padding:22px 26px 60px;
  }
  .top-nav{margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;}
  .control-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .control-btn:hover{color:var(--text);border-color:var(--text-muted);}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:14px;}
  header h1{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:.02em;}
  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .report-btn{
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    padding:13px 22px;border-radius:12px;white-space:nowrap;
    background:rgba(95,190,138,.16);border:1.5px solid var(--ok);color:var(--ok);
  }
  .report-btn:hover{background:rgba(95,190,138,.26);}
  .clear-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    padding:12px 18px;border-radius:12px;white-space:nowrap;
    background:none;border:1px solid rgba(210,80,47,.5);color:var(--urgent);
  }
  .clear-btn:hover{background:rgba(210,80,47,.12);}
  .clear-btn:disabled{opacity:.4;cursor:default;background:none;}
  .select-count{font-size:13px;color:var(--text-muted);white-space:nowrap;}
  .cancel-select-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    padding:12px 18px;border-radius:12px;white-space:nowrap;
    background:none;border:1px solid var(--line);color:var(--text-muted);
  }
  .cancel-select-btn:hover{color:var(--text);border-color:var(--text-muted);}
  .confirm-clear-btn{
    font-family:inherit;font-size:13.5px;font-weight:900;cursor:pointer;
    padding:12px 18px;border-radius:12px;white-space:nowrap;
    background:rgba(210,80,47,.16);border:1.5px solid var(--urgent);color:var(--urgent);

  .confirm-clear-btn:hover{background:rgba(210,80,47,.26);}
  .confirm-clear-btn:disabled{opacity:.4;cursor:default;background:rgba(210,80,47,.16);}

    padding:20px 24px;margin-bottom:24px;
    display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .revenue-label{font-size:14px;font-weight:700;color:var(--text-muted);}
  .revenue-amount{font-family:'Archivo Black',sans-serif;font-size:34px;color:var(--ok);letter-spacing:.01em;}
  .revenue-sub{font-size:12.5px;color:var(--text-muted);width:100%;}

  .record-row.selected{border-color:var(--urgent);background:rgba(210,80,47,.08);}
  .record-checkbox{width:18px;height:18px;flex-shrink:0;accent-color:var(--urgent);cursor:pointer;}

  .report-dish-list li:nth-child(3) .rank-badge{background:#B0784A;color:#1a1408;}

// 注意：跟"员工操作日志"页一样，这只是前端的一道软性关卡——这套系统没有真正的
// 账号体系，Firestore 规则也没法按用户名密码限制删除。技术上懂一点的人可以绕过
// 这道校验直接调 Firestore API 删记录。真要做到只有管理员能删，需要接入
// Firebase Authentication 才行。
const ADMIN_USER = 'admingk';
const ADMIN_PASS = '321';

let records = [];
let loaded = false;
let reportOpen = false;
let selectMode = false;
let selectedIds = new Set();
let authModalOpen = false;
let authError = '';

dailyOrdersRef.where('date', '==', todayKey()).onSnapshot(snap => {
  records = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a,b) => a.seq - b.seq);
  loaded = true;
  render();
}, err => {});

// “清除”：进入勾选模式，不需要管理员账号——账号密码只在真正提交删除的那一步才校验
function toggleSelectMode(){
  selectMode = !selectMode;
  selectedIds = new Set();
  render();
}
function toggleSelectRecord(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  render();
}

function openDeleteAuth(){
  if(selectedIds.size === 0) return;
  authError = '';
  authModalOpen = true;
  renderModal();
}
function closeDeleteAuth(){
  authModalOpen = false;
  renderModal();
}

function handleDeleteAuthSubmit(){
  const user = (document.getElementById('auth-user').value || '').trim();
  const pass = document.getElementById('auth-pass').value || '';
  if(user === ADMIN_USER && pass === ADMIN_PASS){
    confirmDeleteSelected();
  }else{
    authError = '用户名或密码错误';
    renderModal();
  }
}

// 只删勾选的那几条——不是清空当天全部盘点，用来纠正误记的流水
async function confirmDeleteSelected(){
  const ids = Array.from(selectedIds);
  authModalOpen = false;
  selectMode = false;
  selectedIds = new Set();
  renderModal();
  render();
  try{
    for(let i = 0; i < ids.length; i += 400){
      const batch = db.batch();
      ids.slice(i, i + 400).forEach(id => batch.delete(dailyOrdersRef.doc(id)));
      await batch.commit();
    }
  }catch(e){ /* 网络问题的话，onSnapshot 下次推送会看到还剩多少没删掉，可以再选一次重删 */ }
}

function totalRevenue(){
  return records.reduce((s, r) => s + (r.revenue || 0), 0);
}

// 汇总当天所有流水记录里的菜品数量，按分类分别排名——报告里"前菜第一名是XX"
// 说的就是这里：每个分类各自取点选频次前 N，而不是混在一起排一个总榜
function topDishesByCategory(perCategoryLimit){
  const counts = new Map();
  records.forEach(r => {
    (r.items || []).forEach(it => {
      counts.set(it.name, (counts.get(it.name) || 0) + it.qty);
    });
  });
  const byCat = new Map();
  counts.forEach((qty, name) => {
    const cat = NAME_TO_CATEGORY[name] || 'drinks';
    if(!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push([name, qty]);
  });
  return CATEGORY_ORDER
    .filter(cat => byCat.has(cat))
    .map(cat => ({
      cat,
      label: CATEGORY_LABELS[cat],
      dishes: byCat.get(cat).sort((a, b) => b[1] - a[1]).slice(0, perCategoryLimit),
    }));
}

function openReport(){
  reportOpen = true;
  renderModal();
}
function closeReport(){
  reportOpen = false;
  renderModal();
}

function recordRowHTML(r){
  const itemSummary = (r.items || []).map(it => `${it.name}×${it.qty}`).join('、');
  const selected = selectedIds.has(r.id);
  return `
    <li class="record-row ${selectMode ? 'selectable' : ''} ${selected ? 'selected' : ''}"
        ${selectMode ? `onclick="toggleSelectRecord('${r.id}')"` : ''}>
      ${selectMode ? `<input type="checkbox" class="record-checkbox" ${selected?'checked':''} onclick="event.stopPropagation();toggleSelectRecord('${r.id}')">` : ''}
      <span class="record-seq">#${String(r.seq).padStart(3,'0')}</span>
      <span class="record-time">${formatTime(r.archivedAt)}</span>
      <span class="record-items">${itemSummary}</span>
      <span class="record-revenue">${formatPrice(r.revenue || 0)}</span>
    </li>`;
}

function headerActionsHTML(){
  if(selectMode){
    return `
      <span class="select-count">已选 ${selectedIds.size} 条</span>
      <button class="cancel-select-btn" onclick="toggleSelectMode()">取消</button>
      <button class="confirm-clear-btn" onclick="openDeleteAuth()" ${selectedIds.size===0?'disabled':''}>确认清除</button>`;
  }
  return `
    <button class="clear-btn" onclick="toggleSelectMode()" ${records.length===0?'disabled':''}>🗑 清除</button>
    <button class="report-btn" onclick="openReport()">📊 生成报告</button>`;
}

// 按桌号分组：桌1只展示桌1的记录，桌与桌之间用分割线隔开（见 .table-group 的 border-bottom）
function groupByTable(list){
  const map = new Map();
  list.forEach(r => {
    if(!map.has(r.table)) map.set(r.table, []);
    map.get(r.table).push(r);
  });
  const groups = Array.from(map.entries()).map(([table, recs]) => ({
    table,
    records: recs.slice().sort((a, b) => a.seq - b.seq),
    revenue: recs.reduce((s, r) => s + (r.revenue || 0), 0),
  }));
  groups.sort((a, b) => {
    const na = parseFloat(a.table), nb = parseFloat(b.table);
    if(!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return String(a.table).localeCompare(String(b.table));
  });
  return groups;
}

function tableGroupHTML(g){
  return `
    <section class="table-group">
      <div class="table-group-head">
        <span class="table-group-num">桌 ${escapeHtml(g.table)}</span>
        <span class="table-group-meta">共 ${g.records.length} 笔 · 今日小计 <b>${formatPrice(g.revenue)}</b></span>
      </div>
      <ul class="record-list">${g.records.map(recordRowHTML).join('')}</ul>
    </section>`;
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(authModalOpen){
    root.innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeDeleteAuth()">
        <div class="modal-box auth-modal-box">
          <p class="confirm-question">确认删除选中的 ${selectedIds.size} 条记录？</p>
          <p class="confirm-sub">需要管理员账号确认，删除后无法恢复，且不会再出现在"历史盘点"里。</p>
          <input type="text" id="auth-user" class="login-input" placeholder="用户名" autocomplete="off"
                 onkeydown="if(event.key==='Enter') document.getElementById('auth-pass').focus()">
          <input type="password" id="auth-pass" class="login-input" placeholder="密码" autocomplete="off"
                 onkeydown="if(event.key==='Enter') handleDeleteAuthSubmit()">
          ${authError ? `<p class="login-error">${authError}</p>` : ''}
          <div class="confirm-actions">
            <button class="confirm-cancel-btn" onclick="closeDeleteAuth()">取消</button>
            <button class="confirm-yes-btn" onclick="handleDeleteAuthSubmit()">确认删除</button>
          </div>
        </div>
      </div>`;
    const userInput = document.getElementById('auth-user');
    if(userInput) userInput.focus();
    return;
  }
  if(!reportOpen){ root.innerHTML = ''; return; }
  const categories = topDishesByCategory(3);
  const rankMedals = ['🥇','🥈','🥉'];
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeReport()">
      <div class="modal-box">
        <div class="report-total-row">
          <span class="report-total-label">今日总营业额</span>
          <span class="report-total-amount">${formatPrice(totalRevenue())}</span>
        </div>
        <div class="report-cat-scroll">
          ${categories.length === 0
            ? `<p style="color:var(--text-muted);font-size:13px;">暂无数据</p>`
            : categories.map(c => `
              <div class="report-cat-section">
                <p class="report-cat-title">${c.label}</p>
                <ul class="report-dish-list">
                  ${c.dishes.map(([name, qty], i) => `
                    <li>
                      <span class="rank-badge">${rankMedals[i] || (i+1)}</span>
                      <span class="report-dish-name">${name}</span>
                      <span class="report-dish-qty">${qty} 份</span>
                    </li>`).join('')}
                </ul>
              </div>`).join('')}
        </div>
        <button class="modal-close-btn" onclick="closeReport()">关闭</button>
      </div>
    </div>`;
}

function render(){
  document.getElementById('totalRevenue').textContent = formatPrice(totalRevenue());
  document.getElementById('header-actions').innerHTML = headerActionsHTML();

  const app = document.getElementById('app');
  if(!loaded){
    document.getElementById('recordCountHint').textContent = '';
    app.innerHTML = '';
  }else if(records.length === 0){
    document.getElementById('recordCountHint').textContent = '';
    app.innerHTML = `<p class="empty-hint">今天还没有桌子结账离开，盘点记录会在员工点"顾客已经结账离开，移出看板"后自动生成。</p>`;
  }else{
    const groups = groupByTable(records);
    document.getElementById('recordCountHint').textContent = `今日共 ${groups.length} 桌 · ${records.length} 笔结账`;
    app.innerHTML = groups.map(tableGroupHTML).join('');
  }

  renderModal();
}

render();
</script>
