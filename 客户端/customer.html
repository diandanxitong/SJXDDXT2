
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>扫码点单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Zihun Suzhou';
    src:url("../字体/字体.ttf") format('truetype');
    font-weight:400;
    font-display:swap;
  }
  :root{
    --bg:#F6EFE0;
    --bg-soft:#ECE0C6;
    --card:#FDFBF5;
    --card-line:#8B6F47;
    --ember:#C9502E;
    --ember-dark:#96371D;
    --cinnabar:#B8402A;
    --jade:#2F7A5E;
    --jade-hi:#9BC7A6;
    --jade-dark:#245F49;
    --gold:#E8A23D;
    --gold-ink:#8A5A18;
    --gold-line:rgba(138,90,24,.4);
    --text:#221A13;
    --text-muted:#5C4A34;
    --radius:16px;
    --brush:'Ma Shan Zheng',cursive;
    --serif-display:'Fraunces',serif;
    --ease-silk:cubic-bezier(.22,1,.36,1);
    --dur-fast:.18s;
    --dur:.32s;
    --gold-hi:#F6DFA0;
    --gold-deep:#9C6A1E;
    --shadow-card:0 1px 2px rgba(59,44,30,.12), 0 16px 32px -16px rgba(59,44,30,.35);
    --shadow-card-active:0 2px 4px rgba(59,44,30,.18), 0 22px 40px -14px rgba(59,44,30,.4);
    --shadow-pop:0 22px 54px rgba(59,44,30,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
  }
  body.lang-zh-custom{
    font-family:'Zihun Suzhou','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  }
  body.lang-zh-hant{
    font-family:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
  }
  body{
    display:flex;
    justify-content:center;
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(184,64,42,.10) 0, transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(232,162,61,.08) 0, transparent 46%),
      repeating-linear-gradient(45deg, rgba(232,162,61,.025) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(-45deg, rgba(184,64,42,.025) 0 2px, transparent 2px 26px);
    background-attachment:fixed;
  }
  #app{
    width:100%;max-width:480px;min-height:100vh;position:relative;padding-bottom:110px;
    box-shadow:0 0 0 1px rgba(232,162,61,.06);
  }
  #app::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--cinnabar),var(--gold) 50%,var(--cinnabar));
  }
  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--gold-ink);
    text-transform:uppercase;font-weight:700;
  }
  /* ---------- table picker (test mode) ---------- */
  .pick-screen{padding:64px 24px;text-align:center;}
  .pick-screen h1{
    font-family:var(--brush);
    font-weight:400;
    font-size:44px;margin:10px 0 6px;color:var(--text);
    text-shadow:0 0 18px rgba(184,64,42,.45);
  }
  .pick-hint{color:var(--text-muted);font-size:14px;margin-bottom:32px;}
  .table-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .table-grid button{
    aspect-ratio:1;border-radius:14px;border:1px solid var(--card-line);
    background:var(--card);color:var(--text);font-size:22px;font-weight:700;
    font-family:var(--serif-display);cursor:pointer;
  }
  .table-grid button:hover{border-color:var(--gold-ink);color:var(--gold-ink);}
  .table-grid button:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px;}

  /* ---------- header ---------- */
  header.bar{
    padding:26px 24px 22px;
    position:relative;overflow:hidden;
  }
  header.bar::after{
    content:"";position:absolute;top:-42px;right:-42px;width:120px;height:120px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23E8A23D' stroke-width='2'><circle cx='50' cy='50' r='30'/><path d='M20 50 Q35 30 50 50 Q65 70 80 50'/><path d='M20 50 Q35 70 50 50 Q65 30 80 50'/></g></svg>");
    background-size:contain;background-repeat:no-repeat;opacity:.1;pointer-events:none;
  }
  .bar-row{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .table-badge{display:flex;flex-direction:column;align-items:flex-start;gap:10px;position:relative;}
  .table-badge-row{display:flex;align-items:baseline;gap:14px;}
  .table-badge .num{
    font-family:var(--serif-display);font-weight:700;
    font-size:36px;color:var(--ember);line-height:1;
    text-shadow:0 0 22px rgba(201,80,46,.5);
  }
  .masthead-rule{
    margin-top:2px;height:1px;position:relative;
    background:linear-gradient(90deg, var(--gold-line), transparent 85%);
  }
  .change-table{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;
  }
  .change-table:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  /* ---------- panda nav ----------
     On the menu screen it's docked inline in the header (.menu-panda-slot)
     so it scrolls away with the page instead of floating forever; #panda-nav
     is the fixed fallback root used on the other (less-visited) screens. */
  #panda-nav{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;}
  .menu-panda-slot{position:relative;z-index:56;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;}
  .panda-overlay{position:fixed;inset:0;z-index:55;background:none;border:none;padding:0;margin:0;cursor:default;}
  .my-order-btn{
    position:relative;z-index:56;
    display:flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;
    padding:0;font-family:inherit;color:var(--text);
  }
  .panda-avatar{
    width:38px;height:38px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .panda-avatar img{display:block;width:100%;height:100%;object-fit:contain;}
  .my-order-label{font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .my-order-btn:hover .my-order-label{color:var(--gold-ink);}
  .panda-dropdown{
    position:relative;z-index:56;margin-top:8px;min-width:136px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:12px;
    overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .panda-dropdown button{
    display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
    font-size:13.5px;font-weight:700;padding:12px 16px;cursor:pointer;font-family:inherit;
  }
  .panda-dropdown button+button{border-top:1px solid var(--card-line);}
  .panda-dropdown button:hover{background:var(--bg-soft);color:var(--cinnabar);}

  /* ---------- menu ---------- */
  .menu-title-row{
    padding:20px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .menu-title{
    font-size:26px;font-weight:400;color:var(--gold-ink);
    font-family:var(--brush);letter-spacing:.04em;
  }
  .allergen-info-btn{
    flex-shrink:0;background:none;border:1px solid var(--gold-line);color:var(--gold-ink);
    font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;
    white-space:nowrap;font-family:inherit;
  }
  .allergen-info-btn:hover{background:rgba(232,162,61,.1);}
  .allergen-modal{padding-bottom:8px;}
  .allergen-grid{padding:4px 18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;}
  .allergen-grid-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);}
  /* ---------- chef's-special carousel (one photo, auto-advances every 3s) ---------- */
  .chef-carousel{padding:22px 0 6px;}
  .chef-slide{
    position:relative;display:block;width:calc(100% - 48px);margin:0 24px;aspect-ratio:16/9;
    border-radius:16px;overflow:hidden;border:1px solid var(--gold-line);
    background:var(--card);padding:0;cursor:pointer;font-family:inherit;
  }
  .chef-slide-photo{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:opacity .3s ease;
  }
  .chef-slide-tag{
    position:absolute;left:14px;top:14px;z-index:2;
    background:rgba(20,14,11,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    border:1px solid var(--gold-line);color:var(--gold-hi);
    font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 11px;border-radius:20px;
  }
  .chef-slide-caption{
    position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,.76) 0%, rgba(0,0,0,0) 100%);
    color:#fff;font-size:15px;font-weight:800;letter-spacing:.01em;text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:opacity .3s ease;
  }
  .menu-body{display:flex;align-items:flex-start;}
  .category-nav{
    width:84px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--card-line);
    position:sticky;top:0;align-self:flex-start;
    max-height:100vh;overflow-y:auto;
    scrollbar-width:none;
    padding:4px 0;
  }
  .category-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    position:relative;
    background:none;border:none;color:var(--text-muted);
    font-size:13px;font-weight:700;padding:12px 6px;cursor:pointer;text-align:center;
    font-family:inherit;line-height:1.3;
    margin:2px 8px;border-radius:11px;
  }
  .cat-btn.active{
    color:var(--gold-ink);
    background:linear-gradient(160deg, rgba(232,162,61,.28), rgba(232,162,61,.12));
    box-shadow:inset 0 0 0 1px var(--gold-line);
  }
  .cat-btn:hover{color:var(--text);}
  .dish-panel{flex:1;min-width:0;padding-right:16px;}
  .dish-list{padding:0 0 0 16px;display:flex;flex-direction:column;gap:14px;}
  .dish-group-header{
    font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--gold-ink);
    padding:2px 2px 0;margin-top:2px;
  }
  .dish-group-header:first-child{margin-top:0;}
  .dish-card{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
  }
  .dish-photo-wrap{
    position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;
    background:linear-gradient(160deg,var(--bg-soft) 0%,var(--card) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .dish-photo-wrap::before{
    content:"🍽";font-size:36px;opacity:.28;position:absolute;
  }
  .dish-photo{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;}
  .dish-body{padding:15px 18px 16px;}
  .dish-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dish-name{font-size:14.5px;font-weight:900;letter-spacing:.01em;line-height:1.32;color:var(--text);}
  .dish-price{
    flex-shrink:0;font-family:'Archivo Black',sans-serif;font-size:11.5px;color:#fff;
    background:linear-gradient(160deg,var(--jade-hi),var(--jade) 62%,var(--jade-dark));
    white-space:nowrap;padding:3px 9px 4px;border-radius:7px;margin-top:1px;
  }
  .dish-body .tag{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.55;overflow-wrap:break-word;}
  .dish-card.sold-out .dish-photo-wrap::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:rgba(245,241,236,.6);
  }
  .dish-card.sold-out .dish-name{color:var(--text-muted);}
  .sold-out-msg{font-size:13px;font-weight:800;color:var(--gold-ink);text-align:center;margin-top:10px;}
  .allergen-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
  .allergen-chip{
    font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--text-muted);
    border:1px solid var(--card-line);border-radius:6px;padding:2px 6px;cursor:default;
    background:none;font-family:inherit;
  }
  .allergen-row .allergen-chip{cursor:pointer;}
  .allergen-row .allergen-chip:hover, .allergen-row .allergen-chip:active{
    border-color:var(--gold-ink);color:var(--gold-ink);background:rgba(232,162,61,.1);
  }
  .allergen-tap-hint{font-size:10.5px;color:var(--text-muted);margin-top:5px;}
  .allergen-popup{
    position:fixed;z-index:75;transform:translate(-50%,-100%) translateY(-10px);
    max-width:min(78vw,260px);
    display:flex;align-items:flex-start;gap:8px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:10px;
    padding:9px 12px;box-shadow:0 10px 26px rgba(0,0,0,.5);
    font-size:12.5px;color:var(--text);line-height:1.4;
  }
  .allergen-popup-code{
    flex-shrink:0;font-weight:900;color:var(--gold-ink);font-size:11px;
    background:rgba(232,162,61,.14);border-radius:6px;padding:1px 6px;
  }
  .size-row{display:flex;gap:6px;margin-top:12px;}
  .size-pill{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:7px 4px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11px;cursor:pointer;text-align:center;
  }
  .size-pill .size-label{font-weight:700;}
  .size-pill .size-price{font-size:10.5px;opacity:.85;}
  .size-pill.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .option-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .option-chip{
    display:flex;align-items:center;gap:5px;
    padding:6px 10px;border-radius:20px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11.5px;cursor:pointer;font-family:inherit;
  }
  .option-chip .option-check{
    width:13px;height:13px;flex-shrink:0;border-radius:4px;border:1px solid var(--card-line);
    display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:var(--bg);
  }
  .option-chip.active{border-color:var(--jade);color:var(--text);background:rgba(47,122,94,.16);}
  .option-chip.active .option-check{background:var(--jade);border-color:var(--jade);color:#fff;}
  .dish-actions{display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--card-line);}
  .stepper{
    display:flex;align-items:center;gap:0;flex-shrink:0;
    border:1px solid var(--card-line);border-radius:999px;padding:3px;
    background:var(--bg-soft);
  }
  .stepper button{
    width:30px;height:30px;border-radius:999px;border:none;
    background:none;color:var(--text);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper button:disabled{opacity:.35;cursor:not-allowed;}
  .stepper button:not(:disabled):hover{color:var(--ember);}
  .stepper button.stepper-add{
    border-radius:50%;background:var(--jade);color:#fff;font-size:19px;
  }
  .stepper button.stepper-add:not(:disabled):hover{background:var(--jade-dark);color:#fff;}
  .dish-card .stepper button.stepper-add{font-size:17px;}
  .stepper .qty{
    width:28px;text-align:center;font-weight:700;font-size:15px;
    font-family:'Archivo Black',sans-serif;
  }
  .dish-card .stepper button{width:27px;height:27px;font-size:15px;}
  .dish-card .stepper .qty{width:24px;font-size:13.5px;}
  .spice-row{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--card-line);}
  .spice-pill{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 4px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11px;line-height:1.2;cursor:pointer;
    text-align:center;
  }
  .spice-pill .flames{display:flex;gap:1px;flex-shrink:0;}
  .spice-pill .spice-label{overflow-wrap:break-word;}
  .spice-pill.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .flame{fill:var(--card-line);}
  .spice-pill.active .flame.lit{fill:var(--cinnabar);}
  .spice-pill:not(.active) .flame.lit{fill:var(--text-muted);}

  /* ---------- sticky bottom bar ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:30;
    background:linear-gradient(180deg,rgba(27,22,19,0) 0%,var(--bg) 30%);
    padding:20px 16px 26px;
  }
  .bottom-bar-inner{
    width:100%;max-width:448px;display:flex;align-items:stretch;gap:12px;
  }
  .submit-btn{
    flex:1;background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    color:#fff;border:1px solid var(--gold-line);border-radius:14px;
    padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
    box-shadow:0 6px 18px rgba(150,55,29,.35);
  }
  .submit-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;border-color:var(--card-line);}
  .submit-btn:not(:disabled):active{background:var(--ember-dark);}

  /* one unified pill spanning most of the screen width, slim, split unevenly into two actions */
  .action-pill-wrap{position:relative;width:84%;max-width:380px;min-width:280px;margin:0 auto;}
  .action-pill{
    position:relative;display:flex;align-items:stretch;
    border-radius:999px;overflow:hidden;
    background:var(--card);
    border:1px solid var(--gold-line);
    box-shadow:0 12px 28px rgba(0,0,0,.45);
  }
  .action-pill::before{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 42%);
  }
  .action-pill::after{
    content:"";position:absolute;z-index:2;top:20%;bottom:20%;left:40%;width:1px;
    background:linear-gradient(180deg, transparent, rgba(232,162,61,.45), transparent);
    pointer-events:none;
  }
  .cart-btn, .order-now-btn{
    min-width:0;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:10px 8px;text-align:center;
  }
  .cart-btn{flex:2;background:none;color:var(--gold-ink);}
  .order-now-btn{flex:3;background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);color:#fff;}
  .cart-btn .cart-btn-sub{color:var(--text-muted);}
  .cart-btn:disabled{color:var(--text-muted);cursor:not-allowed;}
  .order-now-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;}
  .cart-btn:not(:disabled):active{background:rgba(232,162,61,.1);}
  .order-now-btn:not(:disabled):active{background:var(--ember-dark);}
  .cart-btn-title, .order-now-title{font-size:16px;font-weight:900;letter-spacing:.02em;overflow-wrap:break-word;}
  .cart-btn-sub, .order-now-sub{font-size:10px;font-weight:500;opacity:.85;overflow-wrap:break-word;}

  /* ---------- cart button: slim vertical tab docked to the right edge ---------- */
  .cart-side-fab{
    position:fixed;right:0;top:56%;transform:translateY(-50%);z-index:40;
    width:32px;padding:12px 4px;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    background:linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    border:1px solid var(--gold-line);border-right:none;border-radius:14px 0 0 14px;
    color:var(--text);cursor:pointer;
    box-shadow:-4px 6px 16px rgba(0,0,0,.4);
  }
  .cart-side-fab:active:not(:disabled){transform:translateY(-50%) scale(.96);}
  .cart-side-fab-icon-wrap{position:relative;flex-shrink:0;display:flex;}
  .cart-side-fab-icon{width:20px;height:20px;object-fit:contain;pointer-events:none;display:block;}
  .cart-side-fab-badge{
    position:absolute;top:-7px;right:-9px;min-width:16px;height:16px;padding:0 3px;
    border-radius:999px;background:var(--cinnabar);color:#fff;
    font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--bg-soft);
  }
  .cart-side-fab-label{
    font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--gold-ink);
    writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.2;
    min-height:38px;
  }
  .cart-side-fab-label.latin{
    text-orientation:sideways;letter-spacing:.02em;
  }
  .cart-side-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);border:none;padding:0;margin:0;cursor:default;}
  .cart-side-panel{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);transform-origin:right center;
    animation:cart-side-in .26s cubic-bezier(.2,1,.3,1);
    z-index:71;width:min(84vw,340px);max-height:70vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--gold-line);border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);padding:18px 18px 14px;
  }
  @keyframes cart-side-in{
    from{opacity:0;transform:translateY(-50%) translateX(24px) scale(.94);}
    to{opacity:1;transform:translateY(-50%) translateX(0) scale(1);}
  }
  .cart-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cart-side-title{font-family:var(--brush);font-weight:400;font-size:20px;color:var(--gold-ink);}
  .cart-side-close{
    flex-shrink:0;background:none;border:1px solid var(--card-line);color:var(--text-muted);
    width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cart-side-close:hover{color:var(--gold-ink);border-color:var(--gold-line);}
  .cart-side-panel .order-summary{margin:0;}

  /* ---------- add-to-cart dumpling/hotpot animation ---------- */
  .hotpot-toast{
    position:fixed;left:50%;bottom:148px;z-index:80;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    animation:hotpot-toast-life 1.7s ease forwards;
  }
  @keyframes hotpot-toast-life{
    0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9);}
    10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    82%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.96);}
  }
  .hotpot-pot{position:relative;width:112px;height:84px;}
  .hotpot-pot svg{position:absolute;left:0;top:0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45));}
  .hotpot-dumpling{
    position:absolute;left:50%;top:50%;font-size:26px;line-height:1;
    transform:translate(-50%,-120px) rotate(-25deg);
    animation:dumpling-drop .55s cubic-bezier(.55,0,.85,.6) .3s forwards;
  }
  @keyframes dumpling-drop{
    0%{transform:translate(-50%,-120px) rotate(-25deg);opacity:1;}
    85%{transform:translate(-50%,-14px) rotate(20deg);opacity:1;}
    100%{transform:translate(-50%,-10px) rotate(15deg) scale(.92);opacity:1;}
  }
  .hotpot-splash{
    position:absolute;left:50%;top:36%;font-size:20px;
    transform:translate(-50%,-50%) scale(.2);opacity:0;
    animation:hotpot-splash .45s ease-out .82s forwards;
  }
  @keyframes hotpot-splash{
    0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
    35%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}
    100%{transform:translate(-50%,-60%) scale(1.6);opacity:0;}
  }
  .hotpot-steam{
    position:absolute;color:rgba(255,255,255,.55);font-size:16px;font-weight:700;opacity:0;
    animation:hotpot-steam-rise 1.6s ease-in-out infinite;
  }
  .hotpot-steam.s1{left:36%;top:4px;animation-delay:0s;}
  .hotpot-steam.s2{left:58%;top:0;animation-delay:.5s;}
  @keyframes hotpot-steam-rise{
    0%{opacity:0;transform:translateY(4px) scale(.8);}
    30%{opacity:.8;}
    100%{opacity:0;transform:translateY(-22px) scale(1.15);}
  }
  .hotpot-caption{
    background:var(--card);border:1px solid var(--card-line);color:var(--text);
    font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:20px;
    opacity:0;animation:hotpot-caption-in .4s ease .9s forwards;
  }
  .call-toast-bell{font-size:48px;line-height:1;animation:call-bell-ring .5s ease-in-out .1s 3;}
  @keyframes call-bell-ring{
    0%,100%{transform:rotate(0);}
    20%{transform:rotate(-18deg);}
    40%{transform:rotate(14deg);}
    60%{transform:rotate(-10deg);}
    80%{transform:rotate(6deg);}
  }
  @keyframes hotpot-caption-in{
    0%{opacity:0;transform:translateY(6px);}
    100%{opacity:1;transform:translateY(0);}
  }

  /* ---------- confirm screen ---------- */
  .confirm-screen{padding:56px 28px 40px;text-align:center;}
  .stamp-ring{
    width:132px;height:132px;margin:0 auto 26px;border-radius:50%;
    border:3px solid var(--cinnabar);display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);position:relative;
    box-shadow:0 0 0 1px rgba(184,64,42,.15), 0 0 26px rgba(184,64,42,.35);
  }
  .stamp-ring::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--cinnabar);border-radius:50%;
  }
  .stamp-ring span{
    font-family:var(--serif-display);font-weight:700;color:var(--cinnabar);font-size:19px;letter-spacing:.05em;
  }
  @media (prefers-reduced-motion:no-preference){
    .stamp-ring{animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
  }
  @keyframes pop{from{transform:rotate(-8deg) scale(.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  .confirm-screen h2{
    font-family:var(--brush);font-weight:400;font-size:34px;color:var(--gold-ink);margin-bottom:22px;
  }

  /* ---------- chef-cooking animation (shown once staff confirms the order) ---------- */
  .chef-cooking{
    position:relative;width:170px;height:118px;margin:16px auto 4px;
  }
  .chef-emoji{font-size:44px;position:absolute;left:2px;bottom:4px;z-index:2;}
  .chef-wok{font-size:54px;position:absolute;right:6px;bottom:-2px;z-index:1;}
  .chef-ladle{
    position:absolute;right:32px;bottom:50px;font-size:30px;
    transform-origin:bottom center;transform:rotate(0deg);z-index:3;
  }
  .chef-ladle.g2{opacity:.4;z-index:2;filter:blur(.3px);}
  .chef-ladle.g3{opacity:.18;z-index:1;filter:blur(.6px);}
  @media (prefers-reduced-motion:no-preference){
    .chef-ladle{animation:chef-swing .5s ease-in-out infinite;}
    .chef-ladle.g2{animation-delay:-.09s;}
    .chef-ladle.g3{animation-delay:-.18s;}
  }
  @keyframes chef-swing{
    0%{transform:rotate(-38deg);}
    50%{transform:rotate(30deg);}
    100%{transform:rotate(-38deg);}
  }
  .kitchen-sent-title{
    font-family:var(--brush);font-weight:400;font-size:26px;color:var(--gold-ink);margin:4px 0 2px;
  }
  .order-summary{list-style:none;text-align:left;background:var(--card);border:1px solid var(--card-line);
    border-top:1px solid var(--gold-line);
    border-radius:var(--radius);padding:6px 18px;margin-bottom:20px;}
  .order-summary li{padding:13px 0;font-size:15px;}
  .order-summary li + li{border-top:1px dashed var(--card-line);}
  .order-line-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:700;}
  .order-line-name{overflow-wrap:break-word;}
  .order-line-price{color:var(--gold-ink);font-size:13.5px;white-space:nowrap;flex-shrink:0;padding-top:1px;}
  .order-line-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .order-line-bottom .stepper{margin-left:auto;}
  .order-total-line{
    display:flex;justify-content:space-between;padding:14px 0 6px;
    font-weight:900;font-size:15px;color:var(--gold-ink);
  }
  .spice-tag{font-size:11.5px;color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:20px;padding:2px 9px;}
  .hint{color:var(--text-muted);font-size:13.5px;margin-bottom:26px;}
  .order-removed-notice{
    color:var(--cinnabar);font-size:13.5px;font-weight:700;line-height:1.5;
    background:rgba(184,64,42,.1);border:1px solid rgba(184,64,42,.35);
    border-radius:var(--radius);padding:12px 16px;margin-bottom:22px;
  }
  .ghost-btn{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    padding:11px 22px;border-radius:12px;font-size:14px;cursor:pointer;
  }
  .ghost-btn:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  .back-row{text-align:left;padding:14px 24px 0;}
  .back-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:13px;font-weight:700;cursor:pointer;padding:6px 2px;
    font-family:inherit;
  }
  .back-btn:hover{color:var(--gold-ink);}

  .my-order-card{
    margin-top:32px;text-align:left;
    background:var(--card);border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .my-order-title{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--text);}
  .my-order-card .order-summary{
    margin:12px 0 0;background:none;border:none;padding:0;
  }
  .my-order-card .order-summary li{padding:11px 0;}
  .my-order-card .order-summary li + li{border-top:1px dashed var(--card-line);}
  .my-order-note{font-size:12.5px;color:var(--gold-ink);margin:14px 0 0;}
  .text-link-btn{
    background:none;border:none;color:var(--cinnabar);font-weight:700;font-size:14px;
    cursor:pointer;padding:14px 0 0;font-family:inherit;display:block;
  }
  .text-link-btn:hover{text-decoration:underline;}

  /* ---------- welcome / language select ---------- */
  .welcome-screen{
    position:relative;overflow:hidden;
    min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
    padding:10vh 24px;
    background:var(--bg) url("../image/background/背景图.webp") center/cover no-repeat;
  }
  .welcome-inner{
    position:relative;z-index:1;
    text-align:center;width:100%;max-width:380px;
    display:flex;flex-direction:column;align-items:center;
  }

  .welcome-leaf{
    width:150px;
    opacity:0;transform:translateY(10px) scale(.86);
    transition:opacity 1.1s cubic-bezier(.16,.9,.28,1), transform 1.1s cubic-bezier(.16,.9,.28,1);
    filter:drop-shadow(0 6px 14px rgba(59,44,30,.25));
  }
  .welcome-leaf.in{opacity:1;transform:translateY(0) scale(1);}
  .welcome-leaf img{
    display:block;width:100%;height:auto;
  }

  .welcome-word{
    margin:24px 0 0;min-height:1.3em;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    font-family:'Cormorant Garamond','Songti SC','Noto Serif SC',serif;
    font-weight:600;font-size:clamp(26px,6.4vw,32px);
    letter-spacing:.02em;color:var(--text);
    text-shadow:0 1px 2px rgba(239,224,190,.6);
  }
  .welcome-word.in{opacity:1;transform:translateY(0);}
  .welcome-word.swap{opacity:0;transform:translateY(6px);transition:opacity .38s ease, transform .38s ease;}

  .welcome-divider{
    width:0%;height:1px;margin:22px 0 20px;
    background:linear-gradient(90deg, transparent, var(--gold-deep) 50%, transparent);
    transition:width 1s ease;
  }
  .welcome-divider.in{width:64%;}

  .welcome-wordmark{
    opacity:0;transform:translateY(14px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
  }
  .welcome-wordmark.in{opacity:1;transform:translateY(0);}
  .welcome-wordmark h1{
    margin:0;
    font-family:'Cormorant Garamond',Georgia,'Songti SC',serif;
    font-weight:700;font-size:clamp(20px,5.2vw,26px);
    letter-spacing:.06em;text-transform:uppercase;line-height:1.3;
    color:var(--gold-deep);
  }

  .welcome-kicker{
    margin-top:16px;
    opacity:0;transform:translateY(8px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-deep);
  }
  .welcome-kicker.in{opacity:1;transform:translateY(0);}

  .welcome-btn-wrap{
    margin-top:38px;
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.2,.9,.3,1), transform .8s cubic-bezier(.2,.9,.3,1);
    position:relative;
  }
  .welcome-btn-wrap.in{opacity:1;transform:translateY(0);}
  .lang-select-btn{
    position:relative;z-index:56;
    display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(160deg, #221C14 0%, #120E0A 100%);
    border:1px solid var(--gold);color:var(--gold-hi);
    padding:13px 28px;border-radius:999px;font-size:13px;font-weight:700;
    letter-spacing:.05em;cursor:pointer;font-family:inherit;
    box-shadow:0 10px 26px rgba(59,44,30,.35);
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease, background .2s ease;
  }
  .lang-select-btn:hover{border-color:var(--gold-hi);box-shadow:0 12px 30px rgba(59,44,30,.45);transform:translateY(-1px);}
  .lang-select-icon{font-size:16px;}
  .lang-panel{
    position:relative;z-index:56;margin-top:14px;
    background:linear-gradient(165deg, var(--card), var(--bg));
    border:1px solid var(--gold-line);
    border-radius:16px;overflow:hidden;box-shadow:0 14px 34px rgba(59,44,30,.4);
    text-align:left;
  }
  .lang-panel button{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:none;border:none;color:var(--text);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    padding:14px 18px;font-size:14.5px;font-weight:700;cursor:pointer;
  }
  .lang-panel button+button{border-top:1px solid var(--card-line);}
  .lang-panel button:hover{background:rgba(232,162,61,.1);}
  .lang-panel .lang-check{color:var(--gold-ink);opacity:0;font-size:13px;}
  .lang-panel button.active .lang-check{opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .welcome-leaf,.welcome-word,.welcome-divider,.welcome-wordmark,.welcome-kicker,.welcome-btn-wrap{
      transition:none !important;
    }
  }

  /* ---------- in-app language switcher ---------- */
  .lang-switcher-overlay{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);border:none;padding:0;margin:0;cursor:default;}
  .lang-switcher-panel{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:66;width:calc(100% - 56px);max-width:340px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:18px;
    overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);
  }
  .lang-switcher-title{padding:16px 18px 8px;font-size:12px;letter-spacing:.1em;color:var(--gold-ink);text-transform:uppercase;font-weight:700;}

  /* ---------- order review page ---------- */
  .review-field{margin-top:16px;}
  .review-input{
    width:100%;padding:15px 18px;border-radius:999px;
    border:1px solid var(--card-line);background:var(--bg-soft);color:var(--text);
    font-size:14px;font-family:inherit;
  }
  .review-input::placeholder{color:var(--text-muted);}
  .review-input:focus{outline:none;border-color:var(--gold-line);}
  .review-field-stepper{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 10px 11px 18px;border-radius:999px;
    border:1px solid var(--card-line);background:var(--bg-soft);
  }
  .review-field-label{font-size:14px;color:var(--text);font-weight:700;}

  /* ---------- drink/dessert upsell modal ---------- */
  .upsell-modal{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:70;width:calc(100% - 48px);max-width:380px;max-height:calc(100vh - 80px);overflow-y:auto;
    background:var(--card);border:1px solid var(--gold-line);border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);padding:20px;
  }
  .upsell-title{
    text-align:center;font-family:var(--brush);font-size:21px;font-weight:400;
    color:var(--gold-ink);margin-bottom:16px;
  }
  .upsell-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .upsell-tile{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    border:1px solid var(--card-line);border-radius:14px;overflow:hidden;
    background:var(--bg-soft);padding:0 0 10px;cursor:pointer;font-family:inherit;text-align:center;
  }
  .upsell-tile.selected{border-color:var(--gold-ink);box-shadow:0 0 0 1px var(--gold-line);}
  .upsell-photo-wrap{position:relative;width:100%;aspect-ratio:1/1;}
  .upsell-photo{width:100%;height:100%;object-fit:cover;display:block;}
  .upsell-check{
    position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;
    background:rgba(20,14,11,.55);color:rgba(255,255,255,.35);
    transition:background .15s ease, color .15s ease;
  }
  .upsell-tile.selected .upsell-check{background:var(--jade);color:#fff;}
  .upsell-name{font-size:12px;font-weight:800;color:var(--text);margin-top:6px;padding:0 6px;line-height:1.3;}
  .upsell-price{font-size:11px;color:var(--gold-ink);}
  .upsell-actions{display:flex;gap:10px;margin-top:18px;}
  .upsell-add-btn, .upsell-later-btn{
    flex:1;min-width:0;border-radius:12px;padding:12px 8px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .upsell-add-btn{background:linear-gradient(160deg,var(--jade) 0%,var(--jade-dark) 100%);color:#fff;border:1px solid var(--gold-line);}
  .upsell-later-btn{background:none;border:1px solid var(--card-line);color:var(--text-muted);}
  .upsell-later-btn:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  /* ---------- premium motion & depth pass ---------- */
  button, .dish-card, .cat-btn, .size-pill, .option-chip, .spice-pill,
  .allergen-chip, .upsell-tile, .lang-panel button, .table-grid button,
  .review-input, .review-field-stepper{
    transition:
      transform var(--dur-fast) var(--ease-silk),
      background-color var(--dur) var(--ease-silk),
      background var(--dur) var(--ease-silk),
      border-color var(--dur) var(--ease-silk),
      box-shadow var(--dur) var(--ease-silk),
      color var(--dur) var(--ease-silk),
      opacity var(--dur) var(--ease-silk);
  }
  button:active:not(:disabled){transform:scale(.96);}

  .dish-card{
    box-shadow:var(--shadow-card);
    animation:dish-in .5s var(--ease-silk) both;
  }
  .dish-card:nth-of-type(1){animation-delay:0ms}
  .dish-card:nth-of-type(2){animation-delay:35ms}
  .dish-card:nth-of-type(3){animation-delay:70ms}
  .dish-card:nth-of-type(4){animation-delay:105ms}
  .dish-card:nth-of-type(5){animation-delay:140ms}
  .dish-card:nth-of-type(6){animation-delay:175ms}
  @keyframes dish-in{
    from{opacity:0;transform:translateY(12px) scale(.985);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .dish-card:active{transform:translateY(-1px);box-shadow:var(--shadow-card-active);}
  @media (hover:hover){
    .dish-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card-active);}
  }
  .dish-photo{transition:transform .6s var(--ease-silk);}
  .dish-card:active .dish-photo{transform:scale(1.05);}
  @media (hover:hover){
    .dish-card:hover .dish-photo{transform:scale(1.05);}
  }

  .chef-slide{box-shadow:var(--shadow-card);}
  .chef-slide-photo{animation:hero-kenburns 10s ease-in-out infinite alternate;}
  @keyframes hero-kenburns{from{transform:scale(1);}to{transform:scale(1.07);}}

  .menu-title, .cart-side-title, .kitchen-sent-title, .confirm-screen h2, .upsell-title{
    color:var(--gold-ink);
  }

  .cart-side-overlay, .lang-switcher-overlay{
    backdrop-filter:blur(7px) saturate(140%);-webkit-backdrop-filter:blur(7px) saturate(140%);
    animation:overlay-fade .22s ease;
  }
  .panda-overlay{animation:overlay-fade .22s ease;}
  @keyframes overlay-fade{from{opacity:0}to{opacity:1}}

  .lang-switcher-panel, .upsell-modal{
    animation:modal-pop-in .3s var(--ease-silk) both;
  }
  @keyframes modal-pop-in{
    from{opacity:0;transform:translate(-50%,-50%) scale(.94);}
    to{opacity:1;transform:translate(-50%,-50%) scale(1);}
  }

  .review-input:focus{box-shadow:0 0 0 3px rgba(232,162,61,.16);}

  .cart-side-fab-badge.bump{animation:badge-bump .38s var(--ease-silk);}

// 导致请求悬在那里既不成功也不报错。这里让 SDK 自动探测并回退到长轮询，兼容性更好。
db.settings({ experimentalAutoDetectLongPolling: true });
const ordersRef = db.collection('orders');
const menuStatusRef = db.collection('menuStatus').doc('soldOut');

// 给一个 promise 加超时：网络很差时 Firestore 请求可能一直挂着不 resolve 也不 reject，
// 页面就会卡在"下单中"出不来。超时后统一当失败处理，好歹能提示顾客重试。
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

// 沽清菜品：员工在接单看板的"沽清菜品"页里勾选后写入这里，这边实时监听，

function isSoldOut(id){ return soldOutIds.has(id); }

  const data = snap.data();

  render();
}, err => {});

function tDish(id, field){ return (I18N[state.lang] || I18N.zh).dishes[id][field]; }
function tAllergen(code){ return (ALLERGEN_NAMES[code] || {})[state.lang] || ALLERGEN_NAMES[code].zh; }
function tSize(key){ return (SIZE_LABELS[key] || {})[state.lang] || SIZE_LABELS[key].zh; }
function tCookMethod(key){ return (COOK_METHOD_LABELS[key] || {})[state.lang] || COOK_METHOD_LABELS[key].zh; }
function tOption(key){ return (OPTION_LABELS[key] || {})[state.lang] || OPTION_LABELS[key].zh; }
function displayDishName(zhName){
  const id = ZH_NAME_TO_ID[zhName];
  return id ? tDish(id, 'name') : zhName;
}
function zhDishName(id){ return I18N.zh.dishes[id].name; }
function displaySpice(zhSpice){
  const idx = SPICE_LEVELS.indexOf(zhSpice);
  return idx >= 0 ? tSpice(idx) : zhSpice;
}
function formatPrice(v){ return '€' + v.toFixed(2); }
function dishUnitPrice(d, item){
  if(d.sizes){
    const key = (item && item.size) || d.sizes[0].key;
    const opt = d.sizes.find(s => s.key === key);
    return opt ? opt.price : d.sizes[0].price;
  }
  return d.price;
}
function dishPriceLabel(d, item){
  let label = formatPrice(dishUnitPrice(d, item));
  if(d.unit === 'person') label += t('perPersonSuffix');
  return label;
}

// 用常识从中文配料/菜名里判断：这道菜是否可调辣度、是否可勾选“不要肉”
const SPICY_RE = /辣|剁椒/;
const MEAT_RE = /鸡肉|鸡柳|猪肉|牛肉|鸭肉|火腿|猪排|牛舌|牛肚|猪腰|猪大肠|猪蹄|五花肉|西冷牛肉|爱尔兰牛柳|小牛肉|培根|午餐肉/;
// 这些菜本身就是“以某种肉为主角”（菜名/身份就是那块肉），去掉肉等于没有这道菜了，
// 所以即使配料里含肉也不提供“不要肉”——常见于名字里直接点名一种肉的招牌菜/汤/干货
const MEAT_OPTION_EXCLUDE = new Set([
  'crispyWonton', 'mouthWateringChicken', 'chongqingSpicyChicken', 'fuqiFeipian', 'spicyBeefJerky',
  'porkDumplings', 'chickenDumplings', 'siuMai', 'nourishingChickenSoup', 'pekingDuck',
  'kungPaoChicken', 'sweetSourChickenPineapple', 'goldenCrispyChickenSalad', 'sweetSpicyChicken',
  'blackPepperBeef', 'blackPepperChicken', 'sirloinBeefCubes', 'braisedIrishSteak', 'sweetSourPorkChop',
  'stirFriedYellowBeef', 'kidneyFlowers', 'twiceCookedPork', 'beefSpicyBroth', 'porkSpicyBroth',
  'tiHuaTang', 'dryFriedPorkIntestine', 'farmhousePork', 'chickenCurry', 'beefCurry',
]);
function detectSpicy(d){ return SPICY_RE.test(d.i18n.zh.name + d.i18n.zh.tag); }
function detectOptions(d){
  // 饺子/烧卖不需要忌口选项，改用蒸/煎的做法选择（见 dishBodyHTML 里的 cook-method-row）
  if(d.category === 'dumplings') return [];
  const opts = [];
  // 葱/洋葱/姜/香菜是通用的忌口选项，除了甜品（和不会展示的饮品），其余菜品统一提供
  if(d.category !== 'dessert' && d.category !== 'drinks'){
    opts.push('scallion', 'onion', 'ginger', 'cilantro');
  }
  if(MEAT_RE.test(d.i18n.zh.tag) && !MEAT_OPTION_EXCLUDE.has(d.id)){
    opts.push('meat');
  }
  return opts;
}

// 本桌订单的实时镜像：一旦选定桌号就一直监听，不管顾客在看菜单/下单确认页/我的订单页。
// 员工在接单看板上单品删除或整单删除，都是直接改/删 Firestore 里的 order 文档，这个监听
// 会立刻收到推送——用来把"下单确认页"和"我的订单页"的展示实时同步过来，而不是等顾客
// 手动刷新或重新进入页面才发现菜品已经被后台删掉了。
let liveTableOrdersUnsub = null;
let liveTableOrders = [];
let liveTableOrdersLoaded = false;

function watchTableOrders(table){
  if(liveTableOrdersUnsub){ liveTableOrdersUnsub(); liveTableOrdersUnsub = null; }
  liveTableOrders = [];
  liveTableOrdersLoaded = false;
  if(!table) return;
  liveTableOrdersUnsub = ordersRef.where('table', '==', String(table)).onSnapshot(snap => {
    liveTableOrders = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    liveTableOrdersLoaded = true;
    onTableOrdersChanged();
  }, err => {});
}

function onTableOrdersChanged(){
  const foodOrders = liveTableOrders.filter(o => !o.call);

  if(state.myOrderItems !== null){
    state.myOrderItems = mergeItems(foodOrders);
  }

  if(state.lastOrder){
    const doc = liveTableOrders.find(o => o.id === state.lastOrder.docId);
    state.lastOrder.summaryItems = mergeItems(foodOrders);
    state.lastOrder.removed = !doc;
    if(doc && doc.status) state.lastOrder.status = doc.status;
  }

  if(state.screen === 'myOrder' || state.screen === 'confirm') render();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function fetchTableOrders(table){
  try{
    const snap = await withTimeout(ordersRef.where('table', '==', String(table)).get(), 8000);
    return snap.docs.map(d => d.data());
  }catch(e){ return []; }
}

// 同一桌可能有多笔未处理订单（加菜），按“菜名+辣度+份量”合并数量，方便顾客看到本桌目前的点单全貌
function mergeItems(ordersList){
  const merged = new Map();
  ordersList.forEach(o => {
    o.items.forEach(it => {
      const key = it.name + '__' + it.spice + '__' + (it.size || '') + '__' + (it.cookMethod || '');
      if(!merged.has(key)) merged.set(key, { name: it.name, spice: it.spice, size: it.size || null, cookMethod: it.cookMethod || null, price: it.price, qty: 0 });
      merged.get(key).qty += it.qty;
    });
  });
  return Array.from(merged.values());
}

async function submitOrder(){
  if(state.submitting || totalCount() === 0) return;
  state.submitting = true; render();

  const items = MENU
    .map(d => {
      const it = getItem(d.id);
      if(it.qty <= 0) return null;
      const entry = { name: zhDishName(d.id), qty: it.qty, price: dishUnitPrice(d, it) };
      if(d.spicy) entry.spice = it.spice;
      if(d.sizes) entry.size = it.size || d.sizes[0].key;
      if(d.category === 'dumplings') entry.cookMethod = it.cookMethod || 'steamed';
      const excludeKeys = Object.keys(it.excludes || {}).filter(k => it.excludes[k]);
      if(excludeKeys.length) entry.excludes = excludeKeys;
      return entry;
    })
    .filter(Boolean);

  const order = {
    table: state.table, items, createdAt: Date.now(),
    nickname: state.orderNickname || '', partySize: state.orderPartySize || 1,
  };

  try{
    const priorOrders = await fetchTableOrders(state.table);
    const isAddOn = priorOrders.length > 0;

    const docRef = await withTimeout(ordersRef.add({
      table: order.table,
      items: order.items,
      createdAt: order.createdAt,
      nickname: order.nickname,
      partySize: order.partySize,
      status: 'pending',
    }), 12000);

    const tableOrders = await fetchTableOrders(state.table);
    const summaryItems = mergeItems(tableOrders.length > 0 ? tableOrders : [...priorOrders, order]);

    state.lastOrder = {
      table: order.table, items: order.items, summaryItems, isAddOn,
      nickname: order.nickname, partySize: order.partySize,
      docId: docRef.id, status: 'pending', removed: false,
    };
    screenHistory.push('menu');
    state.screen = 'confirm';
  }catch(e){
    alert(t('orderFailed'));
  }
  state.submitting = false;
  render();
}

  return `
    <div class="chef-carousel">
      <button class="chef-slide" onclick="setCategory('chefSpecial')">
        <img id="chef-carousel-photo" class="chef-slide-photo" src="${d.img}" alt="${name}" decoding="async" onerror="this.style.display='none'">
        <span class="chef-slide-tag">${tCat('chefSpecial')}</span>
        <span id="chef-carousel-caption" class="chef-slide-caption">${name}</span>
      </button>
    </div>`;
}

function dishBodyHTML(d){
  const it = getItem(d.id);
  const name = tDish(d.id,'name');
  const tag = tDish(d.id,'tag');
  return `
          <div class="dish-title-row">
            <h3 class="dish-name">${name}</h3>
            <span class="dish-price">${dishPriceLabel(d, it)}</span>
          </div>
          ${tag ? `<p class="tag">${tag}</p>` : ''}
          ${allergenChipsHTML(d.allergens)}
          ${d.sizes ? sizeRowHTML(d, it) : ''}
          <div class="dish-actions">
            <div class="stepper">
              <button onclick="changeQty('${d.id}',-1)" ${it.qty<=0?'disabled':''} aria-label="${t('decreaseQty')}">−</button>
              <span class="qty">${it.qty}</span>
              <button class="stepper-add" onclick="changeQty('${d.id}',1)" aria-label="${t('increaseQty')}">+</button>
            </div>
          </div>
          ${it.qty>0 && d.spicy ? `
            <div class="spice-row">
              ${SPICE_LEVELS.map((lvl,i)=>`
                <button class="spice-pill ${it.spice===lvl?'active':''}" onclick="setSpice('${d.id}','${lvl}')">
                  <span class="flames">${flameIcons(i+1)}</span><span class="spice-label">${tSpice(i)}</span>
                </button>`).join('')}
            </div>` : ''}
          ${it.qty>0 && d.category==='dumplings' ? `
            <div class="spice-row">
              ${['steamed','panFried'].map(m=>`
                <button class="spice-pill ${(it.cookMethod||'steamed')===m?'active':''}" onclick="setCookMethod('${d.id}','${m}')">
                  <span class="spice-label">${tCookMethod(m)}</span>
                </button>`).join('')}
            </div>` : ''}
          ${it.qty>0 && d.options.length>0 ? optionsRowHTML(d, it) : ''}`;
}

// Photo wrapper is rendered once per card and never touched again by
// updateItemUI — only .dish-body gets patched — so tapping qty/spice/
// size/exclude never re-creates the <img> and flashes the photo.
function soldOutBodyHTML(d){
  const name = tDish(d.id,'name');
  const tag = tDish(d.id,'tag');
  return `
          <div class="dish-title-row">
            <h3 class="dish-name">${name}</h3>
          </div>
          ${tag ? `<p class="tag">${tag}</p>` : ''}
          <p class="sold-out-msg">${t('soldOutMsg')}</p>`;
}

function dishCardHTML(d){
  const name = tDish(d.id,'name');
  const soldOut = isSoldOut(d.id);
  return `
      <div class="dish-card${soldOut ? ' sold-out' : ''}" data-id="${d.id}">
        <div class="dish-photo-wrap">
          <img class="dish-photo" src="${d.img}" alt="${name}" loading="lazy" decoding="async" onerror="this.style.display='none'">
        </div>
        <div class="dish-body">${soldOut ? soldOutBodyHTML(d) : dishBodyHTML(d)}</div>
      </div>`;
}

function menuHTML(){
  const activeCat = state.activeCategory || 'all';
  const filteredMenu = activeCat === 'all' ? MENU : MENU.filter(d=>d.category===activeCat);

  let lastSub = null;
  const dishesHTML = filteredMenu.map(d=>{
    const groupHeaderHTML = (d.sub && d.sub !== lastSub) ? `<div class="dish-group-header">${tSubGroup(d.sub)}</div>` : '';
    lastSub = d.sub || lastSub;
    return groupHeaderHTML + dishCardHTML(d);
  }).join('');

  const categoryNavHTML = CATEGORIES.map(cat=>`
    <button class="cat-btn ${activeCat===cat?'active':''}" onclick="setCategory('${cat}')">${tCat(cat)}</button>
  `).join('');

  const count = totalCount();

  return `
    ${backRowHTML()}
    <header class="bar">
      <div class="bar-row">
        <div class="table-badge">
          <span class="eyebrow">${t('tableEyebrow')}</span>
          <div class="table-badge-row">
            <span class="num">${state.table}</span>
            ${!state.lockedByUrl ? `<button class="change-table" onclick="changeTable()">${t('changeTable')}</button>` : ''}
          </div>
        </div>
        <div id="menu-panda-slot" class="menu-panda-slot"></div>
      </div>
      <div class="masthead-rule"></div>
    </header>
    ${chefCarouselHTML()}
    <div class="menu-title-row">
      <p class="menu-title">${t('menuTitle')}</p>
      <button class="allergen-info-btn" onclick="toggleAllergenInfo()">ⓘ ${t('allergensBtn')}</button>
    </div>
    <div class="menu-body">
      <nav class="category-nav">${categoryNavHTML}</nav>
      <div class="dish-panel">
        <div class="dish-list">${dishesHTML}</div>
      </div>
    </div>
    ${allergenModalHTML()}
    <button class="cart-side-fab" onclick="toggleCartPopup()" aria-label="${t('cart')}">
      <span class="cart-side-fab-icon-wrap">
        <img class="cart-side-fab-icon" src="../image/LOGO/CART.png" alt=""/>
        <span class="cart-side-fab-badge">${count}</span>
      </span>
      <span class="cart-side-fab-label${(state.lang === 'zh' || state.lang === 'zhHant') ? '' : ' latin'}">${t('cart')}</span>
    </button>
    <div class="bottom-bar">
      <div class="action-pill-wrap">
        <div class="action-pill">
          <button class="cart-btn" onclick="callWaiter()" ${state.callingWaiter?'disabled':''}>
            <span class="cart-btn-title">${state.callingWaiter ? t('calling') : t('callWaiter')}</span>
            <span class="cart-btn-sub">${t('callWaiterSub')}</span>
          </button>
          <button class="order-now-btn" onclick="goToOrderReview()" ${count===0?'disabled':''}>
            <span class="order-now-title">${t('orderNow')}</span>
            <span class="order-now-sub">${t('orderNowSub')}</span>
          </button>
        </div>
      </div>
    </div>`;
}

function orderLineHTML({name, qty, spice, price, extra}){
  const lineTotal = price != null ? formatPrice(price * qty) : '';
  const bottomBits = (spice ? `<span class="spice-tag">${spice}</span>` : '') + (extra || '');
  return `<li class="order-line">
    <div class="order-line-top">
      <span class="order-line-name">${name} × ${qty}</span>
      ${lineTotal ? `<span class="order-line-price">${lineTotal}</span>` : ''}
    </div>
    ${bottomBits ? `<div class="order-line-bottom">${bottomBits}</div>` : ''}
  </li>`;
}
function totalRowHTML(total){
  return `<li class="order-total-line"><span>${t('totalLabel')}</span><span>${formatPrice(total)}</span></li>`;
}
function editableOrderSummaryHTML(items, total){
  return `<ul class="order-summary">
    ${items.map(it=>`
      <li class="order-line">
        <div class="order-line-top">
          <span class="order-line-name">${it.name}</span>
          <span class="order-line-price">${formatPrice(it.price*it.qty)}</span>
        </div>
        <div class="order-line-bottom">
          ${it.spicy ? `<span class="spice-tag">${displaySpice(it.spice)}</span>` : ''}
          ${it.sizeLabel ? `<span class="spice-tag">${it.sizeLabel}</span>` : ''}
          ${it.cookMethodLabel ? `<span class="spice-tag">${it.cookMethodLabel}</span>` : ''}
          ${it.excludeTags}
          <span class="stepper">
            <button onclick="changeQty('${it.id}',-1)" aria-label="${t('decreaseQty')}">−</button>
            <span class="qty">${it.qty}</span>
            <button onclick="changeQty('${it.id}',1)" aria-label="${t('increaseQty')}">+</button>
          </span>
        </div>
      </li>`).join('')}
    ${totalRowHTML(total)}
  </ul>`;
}
function excludesTagsHTML(excludes){
  if(!excludes || excludes.length === 0) return '';
  return excludes.map(k => `<span class="spice-tag">${tOption(k)}</span>`).join('');
}

function myOrderHTML(){
  const items = state.myOrderItems || [];
  const total = items.reduce((s,it)=> s + (it.price||0)*it.qty, 0);
  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">${t('tableEyebrow')} ${state.table}</p>
      <h2 style="margin-top:6px;">${t('myOrder')}</h2>
      ${state.myOrderLoading
        ? `<p class="hint">${t('loading')}</p>`
        : items.length === 0
          ? `<p class="hint">${t('noOrderYet')}</p>`
          : `<ul class="order-summary">
              ${items.map(it=>{
                const dish = MENU_BY_ID[ZH_NAME_TO_ID[it.name]];
                return orderLineHTML({
                  name: displayDishName(it.name),
                  qty: it.qty,
                  spice: dish && dish.spicy ? displaySpice(it.spice) : '',
                  price: it.price,
                  extra: (it.size ? `<span class="spice-tag">${tSize(it.size)}</span>` : '') + (it.cookMethod ? `<span class="spice-tag">${tCookMethod(it.cookMethod)}</span>` : '') + excludesTagsHTML(it.excludes),
                });
              }).join('')}
              ${totalRowHTML(total)}
            </ul>
            <p class="hint">${t('removeHint')}</p>`
      }
      <button class="ghost-btn" onclick="goBack()">${t('backToMenu')}</button>
    </div>`;
}

function cartItemsForCheckout(){
  return MENU
    .map(d => {
      const it = getItem(d.id);
      if(it.qty <= 0) return null;
      return {
        id: d.id, name: tDish(d.id,'name'), qty: it.qty, spice: it.spice, spicy: d.spicy,
        price: dishUnitPrice(d, it),
        sizeLabel: d.sizes ? tSize(it.size || d.sizes[0].key) : null,
        cookMethodLabel: d.category==='dumplings' ? tCookMethod(it.cookMethod || 'steamed') : null,
        excludeTags: excludesTagsHTML(Object.keys(it.excludes||{}).filter(k=>it.excludes[k])),
      };
    })
    .filter(Boolean);
}

function cartSideBodyHTML(){
  const items = cartItemsForCheckout();
  const total = items.reduce((s,it)=>s+it.price*it.qty,0);
  return items.length === 0
    ? `<p class="hint" style="margin:0;">${t('emptyCart')}</p>`
    : editableOrderSummaryHTML(items, total);
}

function cartPopupHTML(){
  if(!state.cartPopupOpen) return '';
  return `
    <button class="cart-side-overlay" onclick="toggleCartPopup()" aria-label="${t('closeMenu')}"></button>
    <div class="cart-side-panel">
      <div class="cart-side-head">
        <p class="cart-side-title">${t('cart')}</p>
        <button class="cart-side-close" onclick="toggleCartPopup()" aria-label="${t('closeMenu')}">✕</button>
      </div>
      <div id="cart-side-body">${cartSideBodyHTML()}</div>
    </div>`;
}

function cartHTML(){
  const items = cartItemsForCheckout();
  const count = totalCount();
  const total = items.reduce((s,it)=>s+it.price*it.qty,0);

  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">${t('tableEyebrow')} ${state.table}</p>
      <h2 style="margin-top:6px;">${t('cart')}</h2>
      ${items.length === 0
        ? `<p class="hint">${t('emptyCart')}</p>`
        : editableOrderSummaryHTML(items, total)
      }
      <button class="ghost-btn" onclick="goBack()">${t('backToMenu')}</button>
    </div>
    ${count > 0 ? `
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="submit-btn" onclick="goToOrderReview()">
          ${t('orderNow')}
        </button>
      </div>
    </div>` : ''}`;
}

function orderReviewHTML(){
  const items = cartItemsForCheckout();
  const total = items.reduce((s,it)=>s+it.price*it.qty,0);
  const count = totalCount();

  return `
    ${backRowHTML()}
    <div class="confirm-screen">
      <p class="eyebrow">${t('tableEyebrow')} ${state.table}</p>
      <h2 style="margin-top:6px;">${t('orderReviewTitle')}</h2>
      ${items.length === 0
        ? `<p class="hint">${t('emptyCart')}</p>`
        : editableOrderSummaryHTML(items, total)
      }

      <div class="review-field">
        <input type="text" class="review-input" placeholder="${t('nicknamePlaceholder')}" value="${(state.orderNickname||'').replace(/"/g,'&quot;')}" oninput="state.orderNickname=this.value" maxlength="30">
      </div>
      <div class="review-field review-field-stepper">
        <span class="review-field-label">${t('partySizeLabel')}</span>
        <span class="stepper">
          <button onclick="setPartySize(-1)" aria-label="${t('decreaseQty')}">−</button>
          <span class="qty">${state.orderPartySize}</span>
          <button onclick="setPartySize(1)" aria-label="${t('increaseQty')}">+</button>
        </span>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="submit-btn" onclick="handlePlaceOrderClick()" ${state.submitting||count===0?'disabled':''}>
          ${state.submitting?t('ordering'):t('orderNow')}
        </button>
      </div>
    </div>
    ${upsellModalHTML()}`;
}

function upsellModalHTML(){
  if(!state.upsellOpen) return '';
  const items = state.upsellItems.map(id => MENU_BY_ID[id]).filter(Boolean);
  return `
    <button class="lang-switcher-overlay" aria-label="${t('upsellTitle')}"></button>
    <div class="upsell-modal">
      <p class="upsell-title">${t('upsellTitle')}</p>
      <div class="upsell-grid">
        ${items.map(d=>{
          const selected = !!state.upsellSelected[d.id];
          return `
          <button class="upsell-tile ${selected?'selected':''}" data-id="${d.id}" onclick="toggleUpsellItem('${d.id}')">
            <span class="upsell-photo-wrap">
              <img class="upsell-photo" src="${d.img}" alt="${tDish(d.id,'name')}" loading="lazy">
              <span class="upsell-check">✓</span>
            </span>
            <span class="upsell-name">${tDish(d.id,'name')}</span>
            <span class="upsell-price">${formatPrice(dishUnitPrice(d, {}))}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="upsell-actions">
        <button class="upsell-add-btn" onclick="confirmUpsellAdd()">${t('addToOrderBtn')}</button>
        <button class="upsell-later-btn" onclick="skipUpsell()">${t('laterBtn')}</button>
      </div>
    </div>`;
}

function pandaNavHTML(){
  if(!state.table) return '';
  return `
    ${state.pandaMenuOpen ? `<button class="panda-overlay" onclick="closePandaMenu()" aria-label="${t('closeMenu')}"></button>` : ''}
    <button class="my-order-btn" onclick="togglePandaMenu()" aria-label="${t('myPot')}" aria-expanded="${state.pandaMenuOpen}">
      <span class="panda-avatar"><img src="../image/LOGO/logo.png" alt=""/></span>
      <span class="my-order-label">${t('myPot')}</span>
    </button>
    ${state.pandaMenuOpen ? `
      <div class="panda-dropdown">
        <button onclick="goToCart()">${t('cart')}</button>
        <button onclick="goToMyOrder()">${t('orderedItems')}</button>
        <button onclick="toggleLangSwitcher()">🌐 ${LANG_META[state.lang].native}</button>
      </div>` : ''}`;
}

function chefCookingHTML(){
  return `
    <div class="chef-cooking" aria-hidden="true">
      <span class="chef-emoji">👨‍🍳</span>
      <span class="chef-wok">🥘</span>
      <span class="chef-ladle g3">🥄</span>
      <span class="chef-ladle g2">🥄</span>
      <span class="chef-ladle g1">🥄</span>
    </div>`;
}

function confirmHTML(order){
  const total = order.summaryItems.reduce((s,it)=> s + (it.price||0)*it.qty, 0);
  const isConfirmed = order.status === 'confirmed';
  return `
    <div class="confirm-screen">
      ${backRowHTML()}
      <div class="stamp-ring"><span>${order.isAddOn ? t('addOnSuccess') : t('orderPlaced')}</span></div>
      <h2>${t('tableEyebrow')} ${order.table}</h2>
      ${order.removed ? `<p class="order-removed-notice">${t('orderRemovedNotice')}</p>` : (isConfirmed ? `
        ${chefCookingHTML()}
        <p class="kitchen-sent-title">${t('kitchenSentTitle')}</p>
        <p class="hint">${t('kitchenSentHint')}</p>
      ` : `<p class="hint">${t('waitConfirm')}</p>`)}
      <button class="ghost-btn" onclick="resetToMenu()">${t('continueOrdering')}</button>

      ${order.summaryItems.length === 0 ? '' : `
      <div class="my-order-card">
        <p class="my-order-title">${t('myOrder')}</p>
        <ul class="order-summary">
          ${order.summaryItems.map(it=>{
            const dish = MENU_BY_ID[ZH_NAME_TO_ID[it.name]];
            return orderLineHTML({
              name: displayDishName(it.name),
              qty: it.qty,
              spice: dish && dish.spicy ? displaySpice(it.spice) : '',
              price: it.price,
              extra: (it.size ? `<span class="spice-tag">${tSize(it.size)}</span>` : '') + (it.cookMethod ? `<span class="spice-tag">${tCookMethod(it.cookMethod)}</span>` : '') + excludesTagsHTML(it.excludes),
            });
          }).join('')}
          ${totalRowHTML(total)}
        </ul>
        <p class="hint my-order-note">${t('removeHint')}</p>
        <button class="text-link-btn" onclick="resetToMenu()">${t('continueOrdering')} →</button>
      </div>`}
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  let screenHtml;
  if(state.screen === 'welcome'){ screenHtml = welcomeHTML(); }
  else if(state.screen === 'pick'){ screenHtml = tablePickHTML(); }
  else if(state.screen === 'confirm'){ screenHtml = confirmHTML(state.lastOrder); }
  else if(state.screen === 'myOrder'){ screenHtml = myOrderHTML(); }
  else if(state.screen === 'cart'){ screenHtml = cartHTML(); }
  else if(state.screen === 'orderReview'){ screenHtml = orderReviewHTML(); }
  else{ screenHtml = menuHTML(); }

  const overlayHtml = state.langSwitcherOpen ? `
    <button class="lang-switcher-overlay" onclick="closeLangSwitcher()" aria-label="${t('closeMenu')}"></button>
    <div class="lang-switcher-panel">
      <p class="lang-switcher-title">${t('languageLabel')}</p>
      ${langPanelHTML('setLanguage')}
    </div>` : '';

  app.innerHTML = screenHtml + overlayHtml;
  document.body.classList.toggle('lang-zh-custom', state.lang === 'zh' && (state.screen === 'welcome' || state.screen === 'menu'));
  document.body.classList.toggle('lang-zh-hant', state.lang === 'zhHant');
  renderPandaNav();
  renderCartPopup();

  if(state.screen === 'welcome'){ mountWelcomeScreen(); }
  else{ stopWelcomeCycle(); }
  if(state.screen === 'menu'){ startChefCarousel(); }
  else{ stopChefCarousel(); }
}

if(state.table) watchTableOrders(state.table);
render();
</script>
</body>
</html>
