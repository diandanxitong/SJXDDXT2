<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>历史盘点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121012;
    --card:#1C191A;
    --line:#332E2C;
    --text:#F5F1EC;
    --text-muted:#8E8883;
    --warn:#E8A23D;
    --urgent:#D2502F;
    --ok:#5FBE8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;padding:22px 26px 60px;
  }
  .top-nav{margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;}
  .control-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .control-btn:hover{color:var(--text);border-color:var(--text-muted);}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:14px;}
  header h1{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:.02em;}
  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .clear-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    padding:12px 18px;border-radius:12px;white-space:nowrap;
    background:none;border:1px solid rgba(210,80,47,.5);color:var(--urgent);
  }
  .clear-btn:hover{background:rgba(210,80,47,.12);}
  .clear-btn:disabled{opacity:.4;cursor:default;background:none;}
  .select-count{font-size:13px;color:var(--text-muted);white-space:nowrap;}
  .cancel-select-btn{
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    padding:12px 18px;border-radius:12px;white-space:nowrap;
    background:none;border:1px solid var(--line);color:var(--text-muted);
  }
  .cancel-select-btn:hover{color:var(--text);border-color:var(--text-muted);}
  .confirm-clear-btn{
    font-family:inherit;font-size:13.5px;font-weight:900;cursor:pointer;
    padding:12px 18px;border-radius:12px;white-space:nowrap;
    background:rgba(210,80,47,.16);border:1.5px solid var(--urgent);color:var(--urgent);
  }
  .confirm-clear-btn:hover{background:rgba(210,80,47,.26);}
  .confirm-clear-btn:disabled{opacity:.4;cursor:default;background:rgba(210,80,47,.16);}

  .revenue-banner{
    background:linear-gradient(160deg,var(--card) 0%,var(--bg) 100%);
    border:1px solid var(--line);border-radius:16px;
    padding:20px 24px;margin-bottom:20px;
    display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .revenue-label{font-size:14px;font-weight:700;color:var(--text-muted);}
  .revenue-amount{font-family:'Archivo Black',sans-serif;font-size:34px;color:var(--ok);letter-spacing:.01em;}
  .revenue-sub{font-size:12.5px;color:var(--text-muted);width:100%;}

  .period-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .period-tab{
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
    padding:9px 18px;border-radius:20px;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
  }
  .period-tab:hover{color:var(--text);border-color:var(--text-muted);}
  .period-tab.active{background:rgba(232,162,61,.16);border-color:var(--warn);color:var(--warn);}

  .period-list{list-style:none;display:flex;flex-direction:column;gap:10px;max-width:640px;}
  .period-card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .period-card.selectable{cursor:pointer;}
  .period-card.selected{border-color:var(--urgent);background:rgba(210,80,47,.08);}
  .period-checkbox{width:18px;height:18px;flex-shrink:0;accent-color:var(--urgent);cursor:pointer;}
  .period-card-main{display:flex;flex-direction:column;gap:4px;}
  .period-card-label{font-size:15px;font-weight:900;}
  .period-card-meta{font-size:12.5px;color:var(--text-muted);}
  .period-card-revenue{font-family:'Archivo Black',sans-serif;font-size:20px;color:var(--ok);white-space:nowrap;margin-left:auto;}

  .empty-hint{color:var(--text-muted);font-size:14px;padding:20px 2px;}

  .modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px 22px 22px;max-width:320px;width:100%;text-align:center;
  }
  .confirm-question{font-size:16px;font-weight:900;margin-bottom:10px;}
  .confirm-sub{font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.5;}
  .login-input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:14px;padding:12px 14px;margin-bottom:12px;
  }
  .login-input:focus{outline:none;border-color:var(--warn);}
  .login-error{font-size:12.5px;color:var(--urgent);margin-bottom:12px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-cancel-btn, .confirm-yes-btn{
    flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .confirm-cancel-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .confirm-cancel-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .confirm-yes-btn{background:rgba(210,80,47,.18);border:1px solid var(--urgent);color:var(--urgent);}
  .confirm-yes-btn:hover{background:rgba(210,80,47,.28);}
</style>
</head>
<body>
<nav class="top-nav">
  <a class="control-btn" href="sjxddxtygd.html">← 接单看板</a>
  <a class="control-btn" href="jrpd.html">📊 今日盘点</a>
</nav>
<header>
  <h1>历史盘点</h1>
  <div class="header-actions" id="header-actions"></div>
</header>
<div class="revenue-banner">
  <span class="revenue-label">历史累计营业额</span>
  <span class="revenue-amount" id="totalRevenue">€0.00</span>
  <span class="revenue-sub" id="totalHint"></span>
</div>
<div class="period-tabs" id="period-tabs"></div>
<div id="app"></div>
<div id="modal-root"></div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: 'AIzaSyBaFx1ZYKzEKfQLKbnD9YE_X_EJnFXrxOE',
  authDomain: 'sjxddxt.firebaseapp.com',
  projectId: 'sjxddxt',
  storageBucket: 'sjxddxt.firebasestorage.app',
  messagingSenderId: '56738241418',
  appId: '1:56738241418:web:1ea87e2445e9d09e3d8673',
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.settings({ experimentalAutoDetectLongPolling: true });
// 不按日期过滤——“今日盘点”结账时写进 dailyOrders 的每一条流水都会长期留着，
// 这里读全部记录，按周/月/季度/年重新分组，就是“历史盘点”
const dailyOrdersRef = db.collection('dailyOrders');

function pad(n){ return String(n).padStart(2, '0'); }
function formatPrice(v){ return '€' + v.toFixed(2); }

function parseDateKey(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatShortDate(d){ return `${d.getMonth() + 1}月${d.getDate()}日`; }

// ISO 周：周一为一周的开始，跨年边界按"该周星期四落在哪一年"归属，
// 避免 12月/1月 交界的那一周被拆成两半
function isoWeekInfo(dateStr){
  const d = parseDateKey(dateStr);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dayNr = (target.getDay() + 6) % 7; // 周一=0 .. 周日=6
  target.setDate(target.getDate() - dayNr + 3); // 挪到本周的星期四
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const firstDayNr = (firstThursday.getDay() + 6) % 7;
  firstThursday.setDate(firstThursday.getDate() - firstDayNr + 3);
  const week = 1 + Math.round((target - firstThursday) / (7 * 24 * 3600 * 1000));
  return { year: target.getFullYear(), week };
}
function mondayOfWeek(dateStr){
  const d = parseDateKey(dateStr);
  const dayNr = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dayNr);
  return d;
}

const PERIOD_KEY_FNS = {
  week: dateStr => { const { year, week } = isoWeekInfo(dateStr); return `${year}-W${pad(week)}`; },
  month: dateStr => dateStr.slice(0, 7),
  quarter: dateStr => { const [y, m] = dateStr.split('-').map(Number); return `${y}-Q${Math.ceil(m / 3)}`; },
  year: dateStr => dateStr.slice(0, 4),
};
const PERIOD_TAB_LABELS = { week: '按周', month: '按月', quarter: '按季度', year: '按年' };

function periodLabel(kind, key, dates){
  if(kind === 'week'){
    const firstDate = Array.from(dates).sort()[0];
    const monday = mondayOfWeek(firstDate);
    const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
    const weekNum = key.split('-W')[1];
    return `${monday.getFullYear()}年 第${weekNum}周（${formatShortDate(monday)} - ${formatShortDate(sunday)}）`;
  }
  if(kind === 'month'){
    const [y, m] = key.split('-');
    return `${y}年${parseInt(m, 10)}月`;
  }
  if(kind === 'quarter'){
    const [y, q] = key.split('-Q');
    return `${y}年 第${q}季度`;
  }
  return `${key}年`;
}

// 注意：跟"今日盘点"页一样，这只是前端的一道软性关卡——这套系统没有真正的
// 账号体系，Firestore 规则也没法按用户名密码限制删除。技术上懂一点的人可以绕过
// 这道校验直接调 Firestore API 删记录。真要做到只有管理员能删，需要接入
// Firebase Authentication 才行。
const ADMIN_USER = 'admingk';
const ADMIN_PASS = '321';
const PERIOD_UNIT_LABELS = { week: '周', month: '月', quarter: '季度', year: '年' };

let records = [];
let loaded = false;
let periodKind = 'month';
let currentBuckets = [];   // 当前 periodKind 下渲染出的分组，headerActions/删除逻辑都从这里取 ids
let selectMode = false;
let selectedKeys = new Set();
let authModalOpen = false;
let authError = '';

dailyOrdersRef.onSnapshot(snap => {
  records = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  loaded = true;
  render();
}, err => {});

function totalRevenue(){
  return records.reduce((s, r) => s + (r.revenue || 0), 0);
}

function groupByPeriod(kind){
  const keyFn = PERIOD_KEY_FNS[kind];
  const map = new Map();
  records.forEach(r => {
    const key = keyFn(r.date);
    if(!map.has(key)) map.set(key, { key, revenue: 0, orders: 0, dates: new Set(), ids: [] });
    const bucket = map.get(key);
    bucket.revenue += r.revenue || 0;
    bucket.orders += 1;
    bucket.dates.add(r.date);
    bucket.ids.push(r.id);
  });
  return Array.from(map.values())
    .map(b => ({ key: b.key, revenue: b.revenue, orders: b.orders, days: b.dates.size, ids: b.ids, label: periodLabel(kind, b.key, b.dates) }))
    .sort((a, b) => b.key.localeCompare(a.key));
}

// 切换周/月/季度/年会换一套分组 key，之前勾选的（比如某一周）在新分组里没意义，直接清空重选
function setPeriodKind(kind){
  periodKind = kind;
  selectMode = false;
  selectedKeys = new Set();
  render();
}

// “清除”：进入勾选模式，不需要管理员账号——账号密码只在真正提交删除的那一步才校验
function toggleSelectMode(){
  selectMode = !selectMode;
  selectedKeys = new Set();
  render();
}
function toggleSelectPeriod(key){
  if(selectedKeys.has(key)) selectedKeys.delete(key); else selectedKeys.add(key);
  render();
}

// 一个"周期"卡片背后是一批 dailyOrders 记录（比如整月），删的时候要把这些记录的
// doc id 全部收集起来，而不是只删这一条汇总
function selectedRecordIds(){
  const ids = [];
  currentBuckets.forEach(b => { if(selectedKeys.has(b.key)) ids.push(...b.ids); });
  return ids;
}
function selectedOrderCount(){
  let n = 0;
  currentBuckets.forEach(b => { if(selectedKeys.has(b.key)) n += b.orders; });
  return n;
}

function openDeleteAuth(){
  if(selectedKeys.size === 0) return;
  authError = '';
  authModalOpen = true;
  renderModal();
}
function closeDeleteAuth(){
  authModalOpen = false;
  renderModal();
}

function handleDeleteAuthSubmit(){
  const user = (document.getElementById('auth-user').value || '').trim();
  const pass = document.getElementById('auth-pass').value || '';
  if(user === ADMIN_USER && pass === ADMIN_PASS){
    confirmDeleteSelected();
  }else{
    authError = '用户名或密码错误';
    renderModal();
  }
}

// 删掉选中的那几个统计周期背后的全部流水记录——同一批也会从"今日盘点"（如果还在
// 当天范围内）和其它分组方式里一起消失，因为都是同一个 dailyOrders collection
async function confirmDeleteSelected(){
  const ids = selectedRecordIds();
  authModalOpen = false;
  selectMode = false;
  selectedKeys = new Set();
  renderModal();
  render();
  try{
    for(let i = 0; i < ids.length; i += 400){
      const batch = db.batch();
      ids.slice(i, i + 400).forEach(id => batch.delete(dailyOrdersRef.doc(id)));
      await batch.commit();
    }
  }catch(e){ /* 网络问题的话，onSnapshot 下次推送会看到还剩多少没删掉，可以再选一次重删 */ }
}

function periodTabsHTML(){
  return Object.keys(PERIOD_TAB_LABELS).map(kind => `
    <button class="period-tab ${periodKind === kind ? 'active' : ''}" onclick="setPeriodKind('${kind}')">${PERIOD_TAB_LABELS[kind]}</button>`).join('');
}

function periodCardHTML(b){
  const selected = selectedKeys.has(b.key);
  return `
    <li class="period-card ${selectMode ? 'selectable' : ''} ${selected ? 'selected' : ''}"
        ${selectMode ? `onclick="toggleSelectPeriod('${b.key}')"` : ''}>
      ${selectMode ? `<input type="checkbox" class="period-checkbox" ${selected?'checked':''} onclick="event.stopPropagation();toggleSelectPeriod('${b.key}')">` : ''}
      <div class="period-card-main">
        <span class="period-card-label">${b.label}</span>
        <span class="period-card-meta">${b.days} 天营业 · ${b.orders} 笔结账</span>
      </div>
      <span class="period-card-revenue">${formatPrice(b.revenue)}</span>
    </li>`;
}

function headerActionsHTML(){
  if(selectMode){
    return `
      <span class="select-count">已选 ${selectedKeys.size} 个${PERIOD_UNIT_LABELS[periodKind]}</span>
      <button class="cancel-select-btn" onclick="toggleSelectMode()">取消</button>
      <button class="confirm-clear-btn" onclick="openDeleteAuth()" ${selectedKeys.size===0?'disabled':''}>确认清除</button>`;
  }
  return `<button class="clear-btn" onclick="toggleSelectMode()" ${currentBuckets.length===0?'disabled':''}>🗑 清除</button>`;
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!authModalOpen){ root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeDeleteAuth()">
      <div class="modal-box">
        <p class="confirm-question">确认删除选中的 ${selectedKeys.size} 个统计周期？</p>
        <p class="confirm-sub">会连带删掉里面全部 ${selectedOrderCount()} 笔结账流水，需要管理员账号确认，删除后无法恢复，其它分组方式（周/月/季度/年）和"今日盘点"里也不会再出现。</p>
        <input type="text" id="auth-user" class="login-input" placeholder="用户名" autocomplete="off"
               onkeydown="if(event.key==='Enter') document.getElementById('auth-pass').focus()">
        <input type="password" id="auth-pass" class="login-input" placeholder="密码" autocomplete="off"
               onkeydown="if(event.key==='Enter') handleDeleteAuthSubmit()">
        ${authError ? `<p class="login-error">${authError}</p>` : ''}
        <div class="confirm-actions">
          <button class="confirm-cancel-btn" onclick="closeDeleteAuth()">取消</button>
          <button class="confirm-yes-btn" onclick="handleDeleteAuthSubmit()">确认删除</button>
        </div>
      </div>
    </div>`;
  const userInput = document.getElementById('auth-user');
  if(userInput) userInput.focus();
}

function render(){
  document.getElementById('totalRevenue').textContent = formatPrice(totalRevenue());
  document.getElementById('period-tabs').innerHTML = periodTabsHTML();

  const app = document.getElementById('app');
  currentBuckets = [];
  if(!loaded){
    document.getElementById('totalHint').textContent = '';
    app.innerHTML = '';
    document.getElementById('header-actions').innerHTML = headerActionsHTML();
    renderModal();
    return;
  }
  if(records.length === 0){
    document.getElementById('totalHint').textContent = '';
    app.innerHTML = `<p class="empty-hint">还没有历史盘点数据——每天在接单看板点"顾客已经结账离开，移出看板"后，流水会自动记进来。</p>`;
    document.getElementById('header-actions').innerHTML = headerActionsHTML();
    renderModal();
    return;
  }
  const dayCount = new Set(records.map(r => r.date)).size;
  document.getElementById('totalHint').textContent = `共 ${dayCount} 天营业数据 · ${records.length} 笔结账`;

  currentBuckets = groupByPeriod(periodKind);
  app.innerHTML = `<ul class="period-list">${currentBuckets.map(periodCardHTML).join('')}</ul>`;
  document.getElementById('header-actions').innerHTML = headerActionsHTML();
  renderModal();
}

render();
</script>
</body>
</html>
