<script>
const db = firebase.firestore();
db.settings({ experimentalAutoDetectLongPolling: true });
const menuStatusRef = db.collection('menuStatus').doc('soldOut');
// 后台经营数据统计用：记一条"这道菜什么时候被沽清/恢复"的日志，用来算沽清了
// 多久——跟 menuStatus 那份"当前沽清名单"完全独立，menuStatus 会被覆盖写、
// 看不出历史，这里只增不改，专门留痕，"经营数据"页会把 soldOut/restock 两条
// 配对算出沽清区间和天数
const soldOutEventsRef = db.collection('soldOutEvents');
function todayKey(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function logSoldOutEvents(ids, action){
  const now = Date.now();
  const date = todayKey();
  ids.forEach(id => {
    const dish = DISH_LIST.find(d => d.id === id);
    soldOutEventsRef.add({ dishId: id, name: (dish && dish.name) || id, action, date, createdAt: now }).catch(() => {});
  });
}

const CATEGORY_ORDER = ["soupBase", "houseSpecial", "seafood", "premiumBeef", "meatballs", "mushrooms", "vegetables", "snacks", "desserts", "drinks", "softDrinks", "tea", "fineWines", "beer"];
const CATEGORY_LABELS = {"soupBase": "锅底", "houseSpecial": "招牌必点", "seafood": "海鲜", "premiumBeef": "精品肉类", "meatballs": "丸子", "mushrooms": "菌菇", "vegetables": "素菜", "snacks": "凉菜/小吃", "desserts": "甜品", "drinks": "果香鲜饮", "softDrinks": "软饮/水", "tea": "茶", "fineWines": "Fine Wines", "beer": "啤酒"};

let soldOutIds = new Set();
let selected = new Set();
let modal = null;   // null | 'soldOut' | 'restore'
let loaded = false;
let searchQuery = '';
let showSoldOutOnly = false;

function toggleSoldOutOnlyView(){
  showSoldOutOnly = !showSoldOutOnly;
  const btn = document.getElementById('viewToggleBtn');
  btn.textContent = showSoldOutOnly ? t('showAll') : t('showSoldOutOnly');
  btn.classList.toggle('active', showSoldOutOnly);
  renderList();
}

function onSearchInput(value){
  searchQuery = value;
  document.getElementById('searchClearBtn').classList.toggle('visible', searchQuery.length > 0);
  renderList();   // search box lives outside #app, so it doesn't need (and shouldn't trigger) a full render()
}

function clearSearch(){
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  document.getElementById('searchClearBtn').classList.remove('visible');
  renderList();
}

function matchesFilters(d){
  if(showSoldOutOnly && !soldOutIds.has(d.id)) return false;
  if(!searchQuery.trim()) return true;
  return staffDishName(d.id, d.name).toLowerCase().includes(searchQuery.trim().toLowerCase());
}

menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  loaded = true;
  render();
}, err => {});

function toggleSelect(id){
  if(selected.has(id)) selected.delete(id); else selected.add(id);
  render();
}

function openSoldOutModal(){
  if(selected.size === 0) return;
  modal = 'soldOut';
  render();
}

function openRestoreModal(){
  if(selected.size === 0) return;
  modal = 'restore';
  render();
}

function closeModal(){
  modal = null;
  render();
}

// 沽清：把已选菜品并入现有沽清集合再整体写回（不影响其他已沽清的菜）
async function confirmSoldOut(){
  const ids = new Set(soldOutIds);
  selected.forEach(id => ids.add(id));
  try{ await menuStatusRef.set({ ids: Array.from(ids) }); logSoldOutEvents(Array.from(selected), 'soldOut'); }catch(e){}
  selected.clear();
  modal = null;
  render();
}

// 恢复售卖：把已选菜品从沽清集合里移除
async function confirmRestore(){
  const ids = new Set(soldOutIds);
  selected.forEach(id => ids.delete(id));
  try{ await menuStatusRef.set({ ids: Array.from(ids) }); logSoldOutEvents(Array.from(selected), 'restock'); }catch(e){}
  selected.clear();
  modal = null;
  render();
}

function dishRowHTML(d){
  const checked = selected.has(d.id);
  const soldOut = soldOutIds.has(d.id);
  return `
    <tr class="${checked ? 'row-checked' : ''}" onclick="toggleSelect('${d.id}')" style="cursor:pointer;">
      <td><input type="checkbox" class="dish-row-checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation();toggleSelect('${d.id}')"></td>
      <td class="dish-row-name">${staffDishName(d.id, d.name)}</td>
      <td>${soldOut ? `<span class="sold-out-badge">${t('soldOutBadge')}</span>` : ''}</td>
    </tr>`;
}

function selectedNamesHTML(){
  return DISH_LIST.filter(d => selected.has(d.id)).map(d => `<li>${staffDishName(d.id, d.name)}</li>`).join('');
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!modal){ root.innerHTML = ''; return; }
  if(modal === 'soldOut'){
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <ul class="modal-dish-list">${selectedNamesHTML()}</ul>
          <p class="modal-warning">${t('soldOutWarning')}</p>
          <div class="modal-actions">
            <button class="modal-cancel-btn" onclick="closeModal()">${t('cancel')}</button>
            <button class="modal-confirm-btn urgent" onclick="confirmSoldOut()">${t('confirmSoldOutBtn')}</button>
          </div>
        </div>
      </div>`;
  }else{
    root.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box">
          <ul class="modal-dish-list">${selectedNamesHTML()}</ul>
          <p class="modal-warning">${t('restoreWarning')}</p>
          <div class="modal-actions">
            <button class="modal-cancel-btn" onclick="closeModal()">${t('cancel')}</button>
            <button class="modal-confirm-btn ok" onclick="confirmRestore()">${t('confirmRestoreBtn')}</button>
          </div>
        </div>
      </div>`;
  }
}

function renderList(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = '';
    return;
  }
  const sections = CATEGORY_ORDER.map(cat => {
    const items = DISH_LIST.filter(d => d.category === cat && matchesFilters(d));
    if(items.length === 0) return '';
    return `<section class="cat-section">
      <h2>${staffCategoryLabel(cat, CATEGORY_LABELS[cat])}</h2>
      <div class="data-table-wrap"><table><tbody>${items.map(dishRowHTML).join('')}</tbody></table></div>
    </section>`;
  }).join('');
  app.innerHTML = sections || `<p class="no-results">${showSoldOutOnly ? t('noSoldOutYet') : t('noMatch')}</p>`;
}

function render(){
  document.getElementById('selCount').textContent = selected.size;
  document.getElementById('soldOutCount').textContent = soldOutIds.size;
  document.getElementById('soldOutBtn').disabled = selected.size === 0;
  document.getElementById('restoreBtn').disabled = selected.size === 0;

  renderList();
  renderModal();
}

applyStaticI18n();
render();
</script>
