<style>
  :root{
    --bg:#121012;
    --card:#1C191A;
    --line:#332E2C;
    --text:#F5F1EC;
    --text-muted:#8E8883;
    --warn:#E8A23D;
    --urgent:#D2502F;
    --ok:#5FBE8A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;padding:22px 26px 60px;
  }
  .top-nav{margin-bottom:16px;}
  .control-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .control-btn:hover{color:var(--text);border-color:var(--text-muted);}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .title-block{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header h1{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:.02em;}
  .status-pill{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:6px 16px;font-size:13px;color:var(--text-muted);
  }
  .status-pill b{color:var(--warn);font-size:15px;}

  .header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .sel-count{font-size:13px;color:var(--text-muted);white-space:nowrap;}
  .sel-count b{color:var(--text);}
  .action-btn{
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    padding:13px 22px;border-radius:12px;white-space:nowrap;
  }
  .action-btn:disabled{opacity:.4;cursor:default;}
  .add-btn{background:rgba(95,190,138,.16);border:1.5px solid var(--ok);color:var(--ok);}
  .add-btn:not(:disabled):hover{background:rgba(95,190,138,.26);}

  .search-bar{position:relative;margin-bottom:18px;max-width:420px;}
  .search-bar input{
    width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;
    color:var(--text);font-family:inherit;font-size:14px;padding:10px 38px 10px 16px;
  }
  .search-bar input::placeholder{color:var(--text-muted);}
  .search-bar input:focus{outline:none;border-color:var(--ok);}
  .search-clear-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:26px;height:26px;border-radius:50%;border:none;background:none;
    color:var(--text-muted);font-size:16px;cursor:pointer;display:none;
    align-items:center;justify-content:center;
  }
  .search-clear-btn.visible{display:flex;}
  .search-clear-btn:hover{color:var(--text);}
  .no-results{color:var(--text-muted);font-size:14px;padding:10px 2px;}

  .cat-section{margin-bottom:22px;}
  .cat-section h2{font-size:14px;font-weight:900;color:var(--ok);letter-spacing:.03em;margin-bottom:10px;padding-left:2px;}
  .dish-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;}
  .dish-row{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
  }
  .dish-row.checked{border-color:var(--ok);background:rgba(95,190,138,.08);}
  .dish-row-main{
    display:flex;flex-direction:column;gap:8px;padding:12px 14px;
  }
  .dish-row-top{display:flex;align-items:flex-start;gap:8px;}
  .dish-row-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .qty-stepper{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .qty-btn{
    width:28px;height:28px;border-radius:50%;background:none;
    font-size:17px;font-weight:900;cursor:pointer;font-family:inherit;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;
    border:1.5px solid;
  }
  .qty-btn.minus{border-color:var(--urgent);color:var(--urgent);}
  .qty-btn.minus:hover{background:rgba(210,80,47,.18);}
  .qty-btn.plus{border-color:var(--ok);color:var(--ok);}
  .qty-btn.plus:hover{background:rgba(95,190,138,.18);}
  .qty-num{min-width:16px;text-align:center;font-size:14px;font-weight:900;color:var(--text);}
  .dish-row-name{font-size:14px;font-weight:700;flex:1;line-height:1.35;min-width:0;}
  .dish-row-price{font-size:12.5px;color:var(--text-muted);font-weight:700;white-space:nowrap;}
  .sold-out-badge{
    font-size:11px;font-weight:700;color:var(--urgent);border:1px solid rgba(210,80,47,.5);
    border-radius:20px;padding:2px 9px;white-space:nowrap;
  }
  .size-btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .dish-row-qty-row{display:flex;justify-content:flex-end;}
  .size-opt-btn{
    font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
    padding:6px 12px;border-radius:20px;background:none;border:1px solid var(--line);color:var(--text-muted);
  }
  .size-opt-btn.active{background:rgba(95,190,138,.18);border-color:var(--ok);color:var(--ok);}

  .modal-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px 22px 22px;max-width:420px;width:100%;
  }
  .modal-dish-list{
    list-style:none;max-height:260px;overflow-y:auto;
    display:flex;flex-direction:column;gap:6px;margin-bottom:16px;
  }
  .modal-dish-list li{
    font-size:14px;font-weight:700;background:rgba(255,255,255,.04);
    border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;
  }
  .modal-dish-list li span:last-child{color:var(--text-muted);font-weight:700;white-space:nowrap;}
  .modal-note{
    font-size:13px;color:var(--text-muted);line-height:1.5;
    background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;margin-bottom:18px;
  }
  .modal-actions{display:flex;gap:10px;}
  .modal-cancel-btn, .modal-confirm-btn{
    flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .modal-cancel-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .modal-cancel-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .modal-confirm-btn.ok{background:rgba(95,190,138,.18);border:1px solid var(--ok);color:var(--ok);}
  .modal-confirm-btn.ok:hover{background:rgba(95,190,138,.28);}
</style>

const DISH_BY_ID = {};
DISH_LIST.forEach(d => { DISH_BY_ID[d.id] = d; });

let soldOutIds = new Set();
let selected = new Map();   // id -> { size: string|null, qty: number }
let dishSizeChoice = new Map();   // id -> size key，就算数量还是 0 也记住上次选的大小份/杯瓶
let modalOpen = false;
let loaded = false;
let searchQuery = '';

function onSearchInput(value){
  searchQuery = value;
  document.getElementById('searchClearBtn').classList.toggle('visible', searchQuery.length > 0);
  renderList();   // search box lives outside #app，不需要（也不该触发）整页重画
}

function clearSearch(){
  searchQuery = '';
  const input = document.getElementById('searchInput');
  if(input) input.value = '';
  document.getElementById('searchClearBtn').classList.remove('visible');
  renderList();
}

function matchesFilters(d){
  if(!searchQuery.trim()) return true;
  return staffDishName(d.id, d.name).toLowerCase().includes(searchQuery.trim().toLowerCase());
}

menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  loaded = true;
  render();
}, err => { loaded = true; render(); });

function incrementQty(id){
  const d = DISH_BY_ID[id];
  if(!d) return;
  const sel = selected.get(id);
  if(sel){
    sel.qty += 1;
  }else{
    selected.set(id, { size: d.sizes ? currentSizeKey(d) : null, qty: 1 });
  }
  render();
}

function decrementQty(id){
  const sel = selected.get(id);
  if(!sel) return;
  sel.qty -= 1;
  if(sel.qty <= 0) selected.delete(id);
  render();
}

function currentSizeKey(d){
  const sel = selected.get(d.id);
  if(sel && sel.size) return sel.size;
  return dishSizeChoice.get(d.id) || d.sizes[0].key;
}

function setDishSize(id, key){
  dishSizeChoice.set(id, key);
  const sel = selected.get(id);
  if(sel) sel.size = key;
  renderList();
}

function dishPrice(d, sel){
  if(d.sizes){
    const opt = d.sizes.find(s => s.key === (sel && sel.size)) || d.sizes[0];
    return opt.price;
  }
  return d.price;
}

function priceLabelHTML(d){
  return `€${d.price.toFixed(2)}${d.unit === 'person' ? t('perPersonSuffix') : ''}`;
}

function sizeButtonsHTML(d){
  const activeKey = currentSizeKey(d);
  return `<div class="size-btn-group">${d.sizes.map(s => `
    <button type="button" class="size-opt-btn ${activeKey === s.key ? 'active' : ''}" onclick="setDishSize('${d.id}','${s.key}')">${t('sizeLabels')[s.key] || s.key} €${s.price.toFixed(2)}</button>
  `).join('')}</div>`;
}

function openAddModal(){
  if(!table || selected.size === 0) return;
  modalOpen = true;
  renderModal();
}

function closeModal(){
  modalOpen = false;
  renderModal();
}

// 加菜：生成一笔新订单，昵称固定标成"员工代加"，方便在看板/详情页里跟顾客自己
// 扫码点的区分开。员工代加是员工当面下的单，不需要再走一遍"确认送入厨房"，
// 直接标记成已处理（status:'confirmed'），落进订单详情页右边的绿框
async function confirmAdd(){
  if(!table || selected.size === 0) return;
  const items = [];
  selected.forEach((sel, id) => {
    const d = DISH_BY_ID[id];
    if(!d) return;
    const entry = { name: d.name, qty: sel.qty, price: dishPrice(d, sel) };
    if(d.sizes) entry.size = (sel && sel.size) || d.sizes[0].key;
    items.push(entry);
  });
  try{
    const now = Date.now();
    await ordersRef.add({
      table: String(table), items, createdAt: now,
      nickname: '员工代加', partySize: 1, status: 'confirmed', confirmedAt: now,
    });
  }catch(e){
    alert(t('addFailedMsg'));
    return;
  }
  location.href = `ddxq.html?table=${encodeURIComponent(table)}`;
}

function dishRowHTML(d){
  const sel = selected.get(d.id);
  const qty = sel ? sel.qty : 0;
  const checked = qty > 0;
  const soldOut = soldOutIds.has(d.id);
  const qtyStepper = `
    <div class="qty-stepper">
      <button type="button" class="qty-btn minus" onclick="decrementQty('${d.id}')">−</button>
      <span class="qty-num">${qty}</span>
      <button type="button" class="qty-btn plus" onclick="incrementQty('${d.id}')">+</button>
    </div>`;
  const priceAndQty = d.sizes ? `
    ${sizeButtonsHTML(d)}
    <div class="dish-row-qty-row">${qtyStepper}</div>` : `
    <div class="dish-row-bottom">
      <span class="dish-row-price">${priceLabelHTML(d)}</span>
      ${qtyStepper}
    </div>`;
  return `
    <li class="dish-row ${checked ? 'checked' : ''}">
      <div class="dish-row-main">
        <div class="dish-row-top">
          <span class="dish-row-name">${staffDishName(d.id, d.name)}</span>
          ${soldOut ? `<span class="sold-out-badge">${t('soldOutBadge')}</span>` : ''}
        </div>
        ${priceAndQty}
      </div>
    </li>`;
}

function selectedRowsHTML(){
  return Array.from(selected.entries()).map(([id, sel]) => {
    const d = DISH_BY_ID[id];
    if(!d) return '';
    const price = dishPrice(d, sel);
    const sizeLabel = d.sizes ? `（${t('sizeLabels')[sel.size] || sel.size}）` : '';
    return `<li><span>${staffDishName(d.id, d.name)}${sizeLabel} × ${sel.qty}</span><span>€${(price * sel.qty).toFixed(2)}</span></li>`;
  }).join('');
}

function renderModal(){
  const root = document.getElementById('modal-root');
  if(!modalOpen){ root.innerHTML = ''; return; }
  root.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <ul class="modal-dish-list">${selectedRowsHTML()}</ul>
        <p class="modal-note">${t('modalNote')(table)}</p>
        <div class="modal-actions">
          <button class="modal-cancel-btn" onclick="closeModal()">${t('cancel')}</button>
          <button class="modal-confirm-btn ok" onclick="confirmAdd()">${t('confirmAddBtn')}</button>
        </div>
      </div>
    </div>`;
}

function renderList(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = ''; return; }
  if(!table){
    app.innerHTML = `<p class="no-results">${t('noTableMsg')}</p>`;
    return;
  }
  const sections = CATEGORY_ORDER.map(cat => {
    const items = DISH_LIST.filter(d => d.category === cat && matchesFilters(d));
    if(items.length === 0) return '';
    return `<section class="cat-section"><h2>${staffCategoryLabel(cat, CATEGORY_LABELS[cat])}</h2><ul class="dish-list">${items.map(dishRowHTML).join('')}</ul></section>`;
  }).join('');
  app.innerHTML = sections || `<p class="no-results">${t('noMatch')}</p>`;
}

function render(){
  document.getElementById('selCount').textContent = selected.size;
  document.getElementById('addBtn').disabled = !table || selected.size === 0;
  renderList();
  renderModal();
}

applyStaticI18n();
render();
</script>
