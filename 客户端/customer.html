// Keyed by order.docId so a live Firestore update that re-renders the
// confirm screen (e.g. someone else's item edited) doesn't re-slam the
// stamp or restart the chef's steam every time — each plays once per order.
const confirmAnimState = { stampDocId: null, chefDocId: null, chefTimeline: null, chefDotTween: null };

function animateStamp(){
  const el = document.querySelector('.stamp-ring');
  if(!el) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    gsap.set(el, { autoAlpha: 1, scale: 1, rotation: -8 });
    return;
  }
  const restShadow = '0 0 0 1px rgba(184,64,42,.15), 0 10px 24px rgba(59,44,30,.28), 0 3px 6px rgba(184,64,42,.22)';
  const impactShadow = '0 0 0 1px rgba(184,64,42,.3), 0 16px 30px rgba(59,44,30,.34), 0 0 22px rgba(184,64,42,.4)';
  gsap.set(el, { autoAlpha: 0, scale: 2.1, y: -70, rotation: -8, transformOrigin: '50% 50%', boxShadow: restShadow });
  gsap.timeline()
    .to(el, { autoAlpha: 1, duration: 0.04 }, 0)
    .to(el, { y: 0, scale: 1, duration: 0.3, ease: 'power4.in' }, 0)
    .to(el, { scale: 1.08, rotation: -14, boxShadow: impactShadow, duration: 0.09, ease: 'power1.out' })
    .to(el, { scale: 0.94, rotation: -4, duration: 0.12, ease: 'sine.inOut' })
    .to(el, { scale: 1, rotation: -8, boxShadow: restShadow, duration: 0.4, ease: 'elastic.out(1, 0.45)' });
}

function animateChefSteam(){
  const scene = document.querySelector('.chef-cooking');
  if(!scene) return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rings = scene.querySelectorAll('.fx-cooking-ring');
  const dot = scene.querySelector('.fx-cooking-dot');
  gsap.set(rings, { autoAlpha: 0, scale: 0.4, transformOrigin: '50% 50%' });
  gsap.set(dot, { transformOrigin: '50% 50%', scale: 1 });
  // A radar-ping "in progress" indicator: rings radiate out and fade on a
  // loop, a solid center dot breathes independently — a status badge, not a
  // scene, and it keeps reading as "live" for however long the kitchen takes.
  const tl = gsap.timeline({ repeat: -1 });
  rings.forEach((r, i) => {
    tl.fromTo(r, { autoAlpha: 0.6, scale: 0.4 }, { autoAlpha: 0, scale: 2.6, duration: 1.6, ease: 'power1.out' }, i * 0.55);
  });
  confirmAnimState.chefTimeline = tl;
  confirmAnimState.chefDotTween = gsap.to(dot, { scale: 1.15, duration: 0.8, ease: 'sine.inOut', repeat: -1, yoyo: true });
}

function playConfirmAnimations(){
  const order = state.lastOrder;
  if(!order) return;
  const key = order.docId || 'local';
  if(confirmAnimState.stampDocId !== key){
    confirmAnimState.stampDocId = key;
    animateStamp();
  }
  if(order.status === 'confirmed' && confirmAnimState.chefDocId !== key){
    confirmAnimState.chefDocId = key;
    animateChefSteam();
  }
}

// The chef-steam loop runs forever (repeat:-1) — stop it once its elements
// are torn out by a render() into a different screen, so it doesn't keep
// ticking against a detached node.
function stopConfirmAnimations(){
  if(confirmAnimState.chefTimeline){
    confirmAnimState.chefTimeline.kill();
    confirmAnimState.chefTimeline = null;
  }
  if(confirmAnimState.chefDotTween){
    confirmAnimState.chefDotTween.kill();
    confirmAnimState.chefDotTween = null;
  }
}

function maintenanceHTML(){
  return `
    <div class="welcome-screen">
      <div class="welcome-inner">
        <div class="welcome-leaf in">
          <img src="../image/LOGO/logo.webp" alt="SJX Cheng Du Hotpot"/>
        </div>
        <p class="maintenance-msg" id="maintenance-msg">${MAINTENANCE_MSG[LANG_ORDER[0]]}</p>
      </div>
    </div>`;
}

let maintenanceTimer = null;
function stopMaintenanceCycle(){
  if(maintenanceTimer){ clearInterval(maintenanceTimer); maintenanceTimer = null; }
}
function mountMaintenanceScreen(){
  if(maintenanceTimer) return;
  let idx = 0;
  maintenanceTimer = setInterval(()=>{
    const el = document.getElementById('maintenance-msg');
    if(!el) return;
    el.classList.add('swap');
    setTimeout(()=>{
      idx = (idx + 1) % LANG_ORDER.length;
      el.textContent = MAINTENANCE_MSG[LANG_ORDER[idx]];
      el.classList.remove('swap');
    }, 400);
  }, 2800);
}

function render(){
  const app = document.getElementById('app');

  if(systemDisabled){
    app.innerHTML = maintenanceHTML();
    document.body.classList.remove('lang-zh-custom', 'lang-zh-hant');
    document.body.classList.add('welcome-bg');
    document.getElementById('panda-nav').innerHTML = '';
    document.getElementById('cart-popup-root').innerHTML = '';
    stopWelcomeCycle();
    stopChefCarousel();
    stopConfirmAnimations();
    mountMaintenanceScreen();
    return;
  }
  stopMaintenanceCycle();

  let screenHtml;
  if(state.screen === 'welcome'){ screenHtml = welcomeHTML(); }
  else if(state.screen === 'pick'){ screenHtml = tablePickHTML(); }
  else if(state.screen === 'confirm'){ screenHtml = confirmHTML(state.lastOrder); }
  else if(state.screen === 'myOrder'){ screenHtml = myOrderHTML(); }
  else if(state.screen === 'cart'){ screenHtml = cartHTML(); }
  else if(state.screen === 'orderReview'){ screenHtml = orderReviewHTML(); }
  else{ screenHtml = menuHTML(); }

  const overlayHtml = state.langSwitcherOpen ? `
    <button class="lang-switcher-overlay" onclick="closeLangSwitcher()" aria-label="${t('closeMenu')}"></button>
    <div class="lang-switcher-panel">
      <p class="lang-switcher-title">${t('languageLabel')}</p>
      ${langPanelHTML('setLanguage')}
    </div>` : '';

  app.innerHTML = screenHtml + overlayHtml;
  document.body.classList.toggle('lang-zh-custom', state.lang === 'zh' && (state.screen === 'welcome' || state.screen === 'menu'));
  document.body.classList.toggle('lang-zh-hant', state.lang === 'zhHant');
  document.body.classList.toggle('welcome-bg', state.screen === 'welcome');
  renderPandaNav();
  renderCartPopup();

  if(state.screen === 'welcome'){ mountWelcomeScreen(); }
  else{ stopWelcomeCycle(); }
  if(state.screen === 'menu'){ startChefCarousel(); }
  else{ stopChefCarousel(); }
  if(state.screen === 'confirm'){ playConfirmAnimations(); }
  else{ stopConfirmAnimations(); }
}

if(state.table){
  watchTableOrders(state.table);
  watchSharedCart(state.table);
  // 这一桌如果还没结账（Firestore 里还有它的订单——结账后订单文档会被整个删掉，
  // 呼叫服务员的 call 单不算），说明顾客是中途重新扫码，不是第一次进店：直接跳过
  // 欢迎页进菜单，语言用这台设备上次选过的（没存过就默认英文，不默认中文，
  // 免得语言忽然变成看不懂的）。用 state.screen==='welcome' 兜底，防止这份请求
  // 还没回来时顾客已经自己手动选了语言/往下走了，那样就不要再帮它跳转一次。
  fetchTableOrders(state.table).then(list => {
    const hasActiveOrder = list.some(o => !o.call);
    if(hasActiveOrder && state.screen === 'welcome'){
      applyLanguage(getStoredLanguage() || 'en');
      stopWelcomeCycle();
      screenHistory = [];
      state.screen = 'menu';
      render();
    }
  });
}
render();
