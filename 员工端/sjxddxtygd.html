<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>接单看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    /* 深藏青背景 + 比它稍浅一档的卡片色，靠色差"浮"出层次，不用阴影。
       状态色全站只用三种：橙（待处理/新订单/加菜）、绿（已处理/送入厨房）、
       蓝（顾客呼叫）——每种都配一个更亮的“状态文字”专用色阶，正文文字统一用
       带灰蓝调的浅色，不用纯白，深色背景下久看更柔和 */
    --bg:#0F172A;
    --card:#1E293B;
    --line:#334155;
    --text:#E6F1FB;
    --text-muted:#94A3B8;
    --normal:#2F6F5C;
    --warn:#F59E0B;
    --warn-bright:#FAC775;
    --urgent:#F87171;
    --ok:#34D399;
    --ok-bright:#6EE7B7;
    --call:#38BDF8;
    --call-bright:#7DD3FC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;padding:22px 26px 40px;
  }
  .warn-banner{
    background:var(--urgent);color:#fff;text-align:center;
    font-weight:900;font-size:15px;letter-spacing:.02em;
    padding:12px 16px;margin:-22px -26px 20px;
  }
  @media (prefers-reduced-motion:no-preference){
    .warn-banner{animation:warn-pulse 1.4s ease-in-out infinite;}
  }
  @keyframes warn-pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .top-nav{margin-bottom:16px;}
  .control-btn{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--text-muted);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:20px;
    font-family:inherit;cursor:pointer;
  }
  .control-btn:hover{color:var(--text);border-color:var(--text-muted);}
  .control-btn:disabled{color:var(--ok);border-color:var(--ok);cursor:default;opacity:.9;}
  .sound-toggle-alert{
    background:rgba(245,158,11,.16);border-color:var(--warn);color:var(--warn-bright);
  }
  @media (prefers-reduced-motion:no-preference){
    .sound-toggle-alert{animation:status-flash 1.2s ease-in-out infinite;}
  }
  .sold-out-entry-btn{
    background:rgba(245,158,11,.16);border-color:var(--warn);color:var(--warn);font-weight:900;
  }
  .sold-out-entry-btn:hover{background:rgba(245,158,11,.26);color:var(--warn);border-color:var(--warn);}
  .system-toggle-btn{
    background:rgba(248,113,113,.16);border-color:var(--urgent);color:var(--urgent);font-weight:900;
  }
  .system-toggle-btn:hover{background:rgba(248,113,113,.26);color:var(--urgent);border-color:var(--urgent);}
  .system-toggle-btn.is-disabled{
    background:rgba(52,211,153,.16);border-color:var(--ok);color:var(--ok);
  }
  .system-toggle-btn.is-disabled:hover{background:rgba(52,211,153,.26);color:var(--ok);border-color:var(--ok);}

  .password-input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:16px;letter-spacing:.08em;padding:11px 14px;margin-bottom:8px;
    text-align:center;
  }
  .password-input:focus{outline:none;border-color:var(--urgent);}
  .password-error{font-size:12.5px;color:var(--urgent);margin:-2px 0 12px;min-height:1.2em;}

  header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-bottom:22px;gap:14px;}
  header h1{font-family:'Archivo Black',sans-serif;font-size:22px;letter-spacing:.02em;white-space:nowrap;}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;}
  @media (prefers-reduced-motion:no-preference){
    .live-dot{animation:pulse 1.8s ease-in-out infinite;}
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .header-center{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;}
  /* 齿轮下拉：把不常点的"盘点/日志"几个入口收起来，固定在页面最右边，
     其余按钮就能在标题和齿轮之间的空间里居中，不用被一长排入口挤得偏左 */
  .gear-menu-wrap{position:relative;justify-self:end;}
  .gear-btn{font-size:16px;padding:8px 12px;}
  .gear-dropdown{
    position:absolute;top:calc(100% + 8px);right:0;z-index:50;min-width:172px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:6px;display:flex;flex-direction:column;gap:2px;
    box-shadow:0 12px 28px rgba(0,0,0,.35);
  }
  .gear-dropdown[hidden]{display:none;}
  .gear-dropdown a{
    display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;
    color:var(--text-muted);text-decoration:none;font-size:13px;font-weight:700;font-family:inherit;
  }
  .gear-dropdown a:hover{background:rgba(255,255,255,.06);color:var(--text);}
  .status{color:var(--text-muted);font-size:13px;}
  .count-pill{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:6px 16px;font-size:13px;color:var(--text-muted);
    font-family:inherit;cursor:pointer;
  }
  .count-pill:hover{border-color:var(--text-muted);color:var(--text);}
  .count-pill b{color:var(--text);font-size:15px;}
  .count-pill.active{border-color:var(--warn);color:var(--warn-bright);}
  .count-pill.active b{color:var(--warn-bright);}
  .pending-bubble{
    position:absolute;top:-8px;right:-8px;background:var(--warn);color:#0F172A;
    font-size:11px;font-weight:900;min-width:18px;height:18px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    box-shadow:0 0 0 2px var(--bg);
  }
  .pending-bubble[hidden]{display:none;}
  @media (prefers-reduced-motion:no-preference){
    .pending-bubble{animation:pulse 1.8s ease-in-out infinite;}
  }

  .empty{
    margin-top:22vh;text-align:center;color:var(--text-muted);
  }
  .empty p{font-size:15px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
  }
  .order-card{
    background:var(--card);border-radius:16px;border:1px solid var(--line);
    border-left:5px solid var(--normal);padding:18px 18px 16px;
    display:flex;flex-direction:column;gap:12px;
  }
  .order-card.warn{border-left-color:var(--warn);}
  .order-card.urgent{border-left-color:var(--urgent);}

  /* 测试桌卡片整块标成亮黄色，跟一整版正式桌的深色卡片一眼区分开 */
  .order-card.test-table{background:#FDE047;border-color:#EAB308;}
  .order-card.test-table.warn, .order-card.test-table.urgent{border-left-color:#B45309;}
  .order-card.test-table .table-num, .order-card.test-table .status-sub{color:#3F2D00;}
  .order-card.test-table .elapsed{background:rgba(0,0,0,.1);color:#3F2D00;}
  .order-card.test-table.warn .elapsed, .order-card.test-table.urgent .elapsed{color:#3F2D00;}
  .order-card.test-table .confirmed-badge{background:rgba(255,255,255,.55);}
  .order-card.test-table .test-table-note{background:rgba(255,255,255,.6);color:#7C2D12;border-color:rgba(124,45,18,.5);}
  .order-card.test-table .status-panel.state-new, .order-card.test-table .status-panel.state-add,
  .order-card.test-table .status-panel.state-done{background:rgba(255,255,255,.4);}
  .order-card.test-table .checkout-btn{background:rgba(255,255,255,.6);}
  .order-card.test-table .view-detail-btn{background:rgba(255,255,255,.35);border-color:rgba(63,45,0,.35);color:#3F2D00;}
  .order-card.test-table .view-detail-btn:hover{border-color:#3F2D00;color:#3F2D00;}

  /* 桌号模块（整张卡片）外框跟着状态方框里的"新订单/加菜"文字一起闪红光——
     用 box-shadow 叠一层扩散的红色光圈，和 status-flash 用同样的时长/节奏，
     视觉上像是同一次呼吸在闪，而不是两个各闪各的动画 */
  .order-card.flashing{border-color:var(--urgent);}
  @media (prefers-reduced-motion:no-preference){
    .order-card.flashing{animation:card-glow 1s ease-in-out infinite;}
  }
  @keyframes card-glow{
    0%,100%{box-shadow:0 0 0 1px var(--urgent), 0 0 26px 5px rgba(248,113,113,.55);}
    50%{box-shadow:0 0 0 1px rgba(248,113,113,.3), 0 0 8px 1px rgba(248,113,113,.15);}
  }

  /* 看板卡片不再显示具体菜品：只是个"状态方框"——新订单/加菜用橙字闪烁提醒，
     已处理用绿字静止显示，单品/整单删除、加菜、送入厨房都在"查看详细订单"打开的
     独立页面（ddxq.html）里，不放在这里，避免桌数一多、每张卡片信息量太大导致误操作 */
  .status-panel{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:22px 8px;border-radius:12px;text-align:center;
  }
  .status-panel.state-new, .status-panel.state-add{
    background:rgba(245,158,11,.14);border:2px solid var(--warn);
  }
  .status-panel.state-done{
    background:rgba(52,211,153,.12);border:2px solid var(--ok);
  }
  .status-big{font-family:'Archivo Black',sans-serif;font-size:21px;letter-spacing:.02em;color:var(--warn-bright);}
  .status-panel.state-done .status-big{color:var(--ok-bright);}
  @media (prefers-reduced-motion:no-preference){
    .status-panel.state-new .status-big, .status-panel.state-add .status-big{animation:status-flash 1s ease-in-out infinite;}
  }
  @keyframes status-flash{0%,100%{opacity:1}50%{opacity:.25}}
  .status-sub{font-size:12px;color:var(--text-muted);}

  .card-body-wrap{position:relative;display:flex;flex-direction:column;}
  .card-body{display:flex;flex-direction:column;gap:12px;}
  .card-body.blurred{filter:blur(6px);pointer-events:none;user-select:none;}
  .call-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;}
  .call-overlay-abs{position:absolute;inset:0;background:rgba(15,23,42,.55);border-radius:12px;z-index:5;}
  .call-overlay-inline{padding:26px 0 6px;}
  .call-bell{font-size:42px;line-height:1;animation:bell-ring 1s ease-in-out infinite;}
  @keyframes bell-ring{
    0%,100%{transform:rotate(0);}
    20%{transform:rotate(-14deg);}
    40%{transform:rotate(11deg);}
    60%{transform:rotate(-8deg);}
    80%{transform:rotate(5deg);}
  }
  .call-caption{font-weight:700;font-size:15px;color:var(--call-bright);}
  .call-dismiss-btn{
    padding:9px 18px;border-radius:20px;border:1px solid var(--call);
    background:rgba(56,189,248,.18);color:var(--call);font-weight:700;cursor:pointer;font-size:13px;
  }
  .call-dismiss-btn:hover{background:rgba(56,189,248,.28);}

  .confirm-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-box{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 22px 22px;max-width:320px;width:100%;text-align:center;
  }
  .confirm-question{font-size:17px;font-weight:900;margin-bottom:20px;}
  .confirm-actions{display:flex;gap:10px;}
  .confirm-cancel-btn, .confirm-yes-btn{
    flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;
  }
  .confirm-cancel-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .confirm-cancel-btn:hover{border-color:var(--text-muted);color:var(--text);}
  .confirm-yes-btn{background:rgba(248,113,113,.18);border:1px solid var(--urgent);color:var(--urgent);}
  .confirm-yes-btn:hover{background:rgba(248,113,113,.28);}
  .confirm-yes-btn:disabled{opacity:.4;cursor:default;}
  .delete-modal-detail{
    font-size:13px;color:var(--text-muted);margin-bottom:14px;line-height:1.5;
    background:rgba(255,255,255,.04);border-radius:8px;padding:10px 12px;text-align:left;
  }

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .table-num{font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1;}
  /* 英文版 "Table 12" 比中文 "桌 12" 长不少，Archivo Black 又是个很粗重的字体，
     30px 直接照搬会显得又大又挤——縮小号+去掉字间距撑开的空隙，视觉重量跟中文版对齐 */
  body.lang-en .table-num{font-size:22px;letter-spacing:0;}
  .elapsed{
    font-size:12px;padding:4px 10px;border-radius:20px;
    background:rgba(255,255,255,.06);color:var(--text-muted);white-space:nowrap;
  }
  .order-card.warn .elapsed{color:var(--warn);}
  .order-card.urgent .elapsed{color:var(--urgent);}

  .confirmed-badge{
    font-size:11px;font-weight:700;color:var(--ok);border:1px solid rgba(52,211,153,.5);
    border-radius:20px;padding:3px 10px;white-space:nowrap;
  }
  .test-table-note{
    font-size:11px;font-weight:700;color:var(--warn);border:1px solid rgba(245,158,11,.5);
    border-radius:20px;padding:3px 10px;display:inline-block;margin-top:8px;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* 状态方框底部两个大按钮：结账（常用、放绿色）+ 查看详细订单（次要、灰边框） */
  .preview-actions{display:flex;gap:8px;margin-top:2px;}
  .checkout-btn, .view-detail-btn{
    flex:1;min-width:0;padding:13px 6px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:900;
    font-family:inherit;text-decoration:none;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .checkout-btn{background:rgba(52,211,153,.14);border:1px solid var(--ok);color:var(--ok);}
  .checkout-btn:hover{background:rgba(52,211,153,.24);}
  .checkout-btn:active{background:rgba(52,211,153,.32);}
  .view-detail-btn{background:none;border:1px solid var(--line);color:var(--text-muted);}
  .view-detail-btn:hover{border-color:var(--text-muted);color:var(--text);}

  /* 记账失败提示：结账本身照样立刻把桌子移出看板（不能因为记账失败卡住服务），
     但这一笔流水会悄悄漏记，所以需要一个不会被无视、要手动点掉才会消失的条子，
     提醒员工去"今日盘点"里人工补录 */
  .checkout-fail-stack{
    position:fixed;left:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;
    max-width:320px;
  }
  .checkout-fail-card{
    background:var(--card);border:1px solid var(--urgent);border-radius:12px;
    padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .checkout-fail-card b{color:var(--urgent);}
  .checkout-fail-dismiss{
    margin-top:8px;width:100%;padding:7px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;
    background:none;border:1px solid var(--line);color:var(--text-muted);font-family:inherit;
  }
  .checkout-fail-dismiss:hover{border-color:var(--text-muted);color:var(--text);}
</style>
</head>
<body>
<div class="warn-banner" id="warn-banner">！顾客未结账时禁止点击结账！</div>
<nav class="top-nav">
  <a class="control-btn" href="../index.html" id="back-to-control">← 控制系统</a>
</nav>
<div class="checkout-fail-stack" id="checkout-fail-stack"></div>
<header>
  <h1><span class="live-dot"></span><span id="board-title">接单看板</span></h1>
  <div class="header-center">
    <a class="control-btn sold-out-entry-btn" href="gqcp.html" id="sold-out-entry">🚫 沽清菜品</a>
    <button class="control-btn" onclick="location.reload()" id="refresh-btn">🔄 刷新</button>
    <button class="control-btn" id="sound-toggle" onclick="unlockAudio()">🔊 开启提示音</button>
    <button class="control-btn system-toggle-btn" id="system-toggle-btn" onclick="openSystemModal()">⛔ 关闭系统</button>
    <button class="control-btn" id="lang-toggle-btn" onclick="toggleStaffLang()">EN</button>
    <span class="status" id="status">加载中…</span>
    <button class="count-pill" id="pending-filter-btn" onclick="togglePendingFilter()"><span id="pending-label">待处理</span> <b id="count">0</b><span id="pending-suffix"> 桌</span><span class="pending-bubble" id="pending-bubble" hidden>0</span></button>
  </div>
  <div class="gear-menu-wrap">
    <button class="control-btn gear-btn" id="gear-btn" onclick="toggleGearMenu()" aria-haspopup="true" aria-expanded="false" aria-label="更多">⚙️</button>
    <div class="gear-dropdown" id="gear-dropdown" hidden>
      <a href="jrpd.html" id="gear-jrpd">📊 今日盘点</a>
      <a href="lspd.html" id="gear-lspd">📅 历史盘点</a>
      <a href="ygczrz.html" id="gear-ygczrz">🗒 员工操作日志</a>
    </div>
  </div>
</header>
<div id="app"></div>
<div id="confirm-modal"></div>
<div id="system-modal"></div>

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="staff-i18n.js"></script>
<script>
const firebaseConfig = {
  apiKey: 'AIzaSyBaFx1ZYKzEKfQLKbnD9YE_X_EJnFXrxOE',
  authDomain: 'sjxddxt.firebaseapp.com',
  projectId: 'sjxddxt',
  storageBucket: 'sjxddxt.firebasestorage.app',
  messagingSenderId: '56738241418',
  appId: '1:56738241418:web:1ea87e2445e9d09e3d8673',
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
db.settings({ experimentalAutoDetectLongPolling: true });
const ordersRef = db.collection('orders');

// 桌号来自顾客扫码点单时的 URL 参数，属于外部输入，塞进 innerHTML 前必须转义，
// 否则顾客一个特制链接就能在看板上跑任意脚本
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// 英文版：只是给员工看板换一套界面文字，不影响任何业务逻辑或数据。语言状态存在
// localStorage 里（staff-i18n.js 里定义），沽清菜品/员工加菜/订单详情几个页面共用
// 同一个开关，接单看板点一次就全部切过去，不用每个页面各点一次
const UI = {
  zh: {
    warnBanner: '！顾客未结账时禁止点击结账！',
    backToControl: '← 控制系统', boardTitle: '接单看板',
    soldOutEntry: '🚫 沽清菜品', refresh: '🔄 刷新',
    soundOff: '🔊 开启提示音', soundOn: '🔔 提示音已开启', soundLocked: '🔊 提示音已断开，点此重新开启',
    systemDisableBtn: '⛔ 关闭系统', systemEnableBtn: '🔓 重新开启系统',
    loading: '加载中…', connError: '连接异常，正在重试…', liveStatusPrefix: '实时更新：',
    pendingLabel: '待处理', pendingSuffix: ' 桌', gearMore: '更多',
    gearToday: '📊 今日盘点', gearHistory: '📅 历史盘点', gearLog: '🗒 员工操作日志',
    emptyPending: '暂无待处理的桌号', viewAll: '← 查看全部', emptyAll: '暂无订单，等待顾客点单中…',
    confirmedBadge: '已确认', statusNewBig: '🔴 新订单', statusNewSub: '等待送入厨房',
    statusAddBig: '🔴 加菜', statusAddSub: '有新加菜品待处理',

// 提示音：顾客呼叫 / 顾客下单。浏览器要求先有一次用户交互才允许播放音频，
// 所以需要员工手动点一下"开启提示音"，这里顺带做一次静音播放来解锁。
//
// 之前 playSound 是每次 cloneNode() 出一个新 <audio> 再播放——iPad Safari 上
// clone 出来的元素没有经过用户手势解锁，播放会被静默拒绝（桌面 Chrome 对这条
// 策略比较宽松所以不会发现问题）。这里改成在解锁时就一次性 clone 出一小池
// 元素并逐个解锁，播放时轮流复用池子里的元素，而不是现造一个新的。
const SOUND_POOL_SIZE = 4;
const callSound = new Audio('提示音/顾客呼叫.mp3');
const orderSound = new Audio('提示音/顾客下单.mp3');
let audioUnlocked = false;
let callPool = [];
let orderPool = [];
let poolCursor = { call: 0, order: 0 };

function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  callPool = Array.from({length: SOUND_POOL_SIZE}, () => callSound.cloneNode());
  orderPool = Array.from({length: SOUND_POOL_SIZE}, () => orderSound.cloneNode());
  [callSound, orderSound, ...callPool, ...orderPool].forEach(a => {
    a.muted = true;
    a.play().then(()=>{ a.pause(); a.currentTime = 0; a.muted = false; }).catch(()=>{ a.muted = false; });
  });
  const btn = document.getElementById('sound-toggle');
  if(btn){ btn.textContent = t('soundOn'); btn.disabled = true; btn.classList.remove('sound-toggle-alert'); }
}

// 浏览器规定必须先有一次用户交互才允许播放音频，这一条挡不掉——但员工不用非得
// 记得去点那颗"开启提示音"按钮：随手点一下页面上任何地方（点结账、点查看详情、
// 随便点哪儿）都会顺带把音频解锁。iPad Safari 熄屏一次就会把已经解锁的播放权限
// 收回（Windows/桌面浏览器不会），而且收回时不报错，只有真的想放声音时 play()
// 才会被拒绝——所以这个监听要能重新挂上，不能只挂一次
let globalUnlockArmed = false;
function armGlobalAudioUnlock(){
  if(globalUnlockArmed) return;
  globalUnlockArmed = true;
  const handler = () => { globalUnlockArmed = false; unlockAudio(); };
  ['pointerdown', 'keydown'].forEach(evt => document.addEventListener(evt, handler, { once: true, passive: true }));
}
armGlobalAudioUnlock();

// 专供无人值守的看板设备：浏览器本身要求"先有一次真实用户手势才允许播放声音"这条
// 挡不掉，但如果这台设备启动时就用了 --autoplay-policy=no-user-gesture-required 这类
// 参数，浏览器自己已经放开了这条限制，那就没必要死等一次点击——用 ?kiosk=1 打开本页
// 时直接跳过等待，开机即解锁。普通设备（没加那个启动参数）打开时不带这个参数，
// 行为不变，还是老老实实等第一次点击
if(new URLSearchParams(location.search).get('kiosk') === '1'){
  unlockAudio();
}

// 发现播放权限被收回了：把按钮打回"点此重新开启"的可点状态并高亮，让员工一眼
// 看到、随手一点就能恢复，而不是背地里一直放不出声音自己都不知道
function markAudioLocked(){
  if(!audioUnlocked) return;
  audioUnlocked = false;
  const btn = document.getElementById('sound-toggle');
  if(btn){
    btn.textContent = t('soundLocked');
    btn.disabled = false;
    btn.classList.add('sound-toggle-alert');
  }
  armGlobalAudioUnlock();
}

// 屏幕重新亮起时主动试播一下（静音），提前发现权限是否已经被收回，
// 不用等到真的漏放一次提示音才发现
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !audioUnlocked) return;
  const probe = callPool[0];
  if(!probe) return;
  probe.muted = true;
  probe.play().then(()=>{ probe.pause(); probe.currentTime = 0; probe.muted = false; })
    .catch(()=>{ probe.muted = false; markAudioLocked(); });
});

function playSound(kind){
  const pool = kind === 'call' ? callPool : orderPool;
  if(pool.length === 0) return;
  const a = pool[poolCursor[kind] % pool.length];
  poolCursor[kind]++;
  try{
    a.currentTime = 0;
    a.play().catch(() => markAudioLocked());
  }catch(e){ markAudioLocked(); }
}

function elapsedInfo(ts){
  const diffMs = Date.now() - ts;
  const mins = Math.floor(diffMs / 60000);
  let label, level;
  if(mins < 1){ label = t('justOrdered'); } else { label = t('minutesAgo')(mins); }
  if(mins < 3){ level = 'normal'; }
  else if(mins < 6){ level = 'warn'; }
  else { level = 'urgent'; }
  return { label, level };
}

function todayKey(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// “今日盘点”流水：#001、#002……每天从 1 开始，靠 Firestore 事务原子地读计数器+1，
// 避免多个员工同时结账时编号冲突或重复
async function recordDailyCheckout(keys, table){
  const batchOrders = orders.filter(o => keys.includes(o.key));
  const items = [];
  batchOrders.forEach(o => (o.items || []).forEach(it => {
    items.push({ name: it.name, qty: it.qty, price: it.price || 0 });
  }));
  if(items.length === 0) return;
  const revenue = items.reduce((s, it) => s + it.price * it.qty, 0);
  const date = todayKey();
  try{
    await db.runTransaction(async tx => {
      const counterRef = db.collection('counters').doc('dailyOrderSeq');
      const snap = await tx.get(counterRef);
      const prev = snap.exists ? snap.data() : null;
      const seq = (prev && prev.date === date) ? prev.seq + 1 : 1;
      tx.set(counterRef, { date, seq });
      const recordRef = db.collection('dailyOrders').doc();
      tx.set(recordRef, { seq, date, table, items, revenue, archivedAt: Date.now() });
    });
  }catch(e){
    // 记账失败就不记了，不阻塞移除看板；但不能让这一笔悄无声息地消失，
    // 得有个员工必须手动点掉的提示，逼着他们去"今日盘点"里人工补录
    showCheckoutFailAlert(table, revenue);
  }
}

// 同一桌可能分多次下单（加菜），这里按桌号把订单合并成一张看板卡片
function groupByTable(list){
  const map = new Map();
  for(const o of list){
    if(!map.has(o.table)) map.set(o.table, []);
    map.get(o.table).push(o);
  }
  const groups = [];
  for(const [table, batch] of map){
    batch.sort((a,b) => a.createdAt - b.createdAt);
    groups.push({ table, batch, createdAt: batch[0].createdAt, keys: batch.map(o => o.key) });
  }
  groups.sort((a,b) => a.createdAt - b.createdAt);
  return groups;
}

// 一桌的状态：new = 头一批订单还没送入厨房（红字"新订单"闪烁）；
// add = 已经有送入厨房的批次，又来了新的加菜还没送入厨房（红字"加菜"闪烁）；
// done = 所有批次都已送入厨房（绿字"已处理"静止）；empty = 这桌没有真实菜品（可能只有呼叫）
function tableState(realBatch){
  const pending = realBatch.some(o => o.status !== 'confirmed');
  const confirmed = realBatch.some(o => o.status === 'confirmed');
  if(pending) return confirmed ? 'add' : 'new';
  return confirmed ? 'done' : 'empty';
}

  return `<div class="status-panel state-done">

      <span class="status-sub">${t('statusDoneSub')}</span>
    </div>`;
}

// 看板格子：只是个状态方框——新订单/加菜（红字闪烁）或已处理（绿字静止）+ 结账 / 查看详细订单两个按钮。
// 具体菜品、单品删除、加菜、确认送入厨房、整单删除都在"查看详细订单"打开的独立页面（ddxq.html）里，
// 不放在这里，避免桌数一多、每张卡片信息量太大导致误操作
function cardHTML(group){
  const { label, level } = elapsedInfo(group.createdAt);
  const realBatch = group.batch.filter(o => !o.call && (o.items || []).length > 0);
  const callKeys = group.batch.filter(o => o.call).map(o => o.key);
  const hasCall = callKeys.length > 0;
  const state = tableState(realBatch);
  const hasRealContent = state !== 'empty';
  const detailHref = `ddxq.html?table=${encodeURIComponent(group.table)}`;
  const flashingClass = (state === 'new' || state === 'add') ? ' flashing' : '';
  const testClass = isTestTable(group.table) ? ' test-table' : '';
  return `
    <div class="order-card ${level}${flashingClass}${testClass}">
      <div class="card-top">
        <span class="table-num">${t('tablePrefix')}${escapeHtml(group.table)}</span>
        <span style="display:flex;gap:8px;align-items:center;">
          ${state === 'done' ? `<span class="confirmed-badge">${t('confirmedBadge')}</span>` : ''}
          <span class="elapsed">${label}</span>
        </span>
      </div>
      ${isTestTable(group.table) ? `<span class="test-table-note">${t('testTableNote')}</span>` : ''}
      ${hasRealContent ? `
      <div class="card-body-wrap">
        <div class="card-body${hasCall ? ' blurred' : ''}">
          ${statusPanelHTML(state)}
          <div class="preview-actions">
            <button class="checkout-btn" data-keys="${realBatch.map(o=>o.key).join(',')}" data-table="${escapeHtml(group.table)}" onclick="confirmLeave(this.dataset.keys.split(','), this.dataset.table)">${isTestTable(group.table) ? t('testCompleteBtn') : t('checkoutBtn')}</button>
            <a class="view-detail-btn" href="${detailHref}">${t('viewDetailBtn')}</a>
          </div>
        </div>
        ${hasCall ? callOverlayHTML(callKeys, true) : ''}
      </div>` : (hasCall ? callOverlayHTML(callKeys, false) : '')}
    </div>`;
}

// 看板排序：闪红光（新订单/加菜）的桌永远排在最前面，已处理的桌自动沉到最后面，
// 和桌号本身的大小顺序无关——方便员工一眼扫到最上面几格就是当前要处理的桌。
// 同一优先级内部仍按下单时间从早到晚排（groupByTable 已经排好，Array.sort 是稳定排序，
// 这里只按优先级分组不会打乱同组内的相对顺序）。
function tablePriority(group){
  const state = tableState(group.batch.filter(o => !o.call && (o.items || []).length > 0));
  return (state === 'new' || state === 'add') ? 0 : 1;
}

function sortForDisplay(groups){
  return [...groups].sort((a, b) => tablePriority(a) - tablePriority(b));
}

let pendingFilterOn = false;   // 点一次"待处理"只显示还有菜没送入厨房的桌，再点一次恢复显示全部

function togglePendingFilter(){
  pendingFilterOn = !pendingFilterOn;
  render();
}

function render(){
  const groups = groupByTable(orders);
  const pendingGroups = groups.filter(g => {
    const state = tableState(g.batch.filter(o => !o.call && (o.items || []).length > 0));
    return state === 'new' || state === 'add';
  });

  document.getElementById('count').textContent = pendingGroups.length;
  const bubble = document.getElementById('pending-bubble');
  bubble.hidden = pendingGroups.length === 0;
  bubble.textContent = pendingGroups.length;
  document.getElementById('pending-filter-btn').classList.toggle('active', pendingFilterOn);

  const shown = pendingFilterOn ? pendingGroups : sortForDisplay(groups);
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = ''; return; }
  if(shown.length === 0){
    app.innerHTML = pendingFilterOn
      ? `<div class="empty"><p>${t('emptyPending')}</p><p style="margin-top:14px;"><button class="control-btn" onclick="togglePendingFilter()">${t('viewAll')}</button></p></div>`
      : `<div class="empty"><p>${t('emptyAll')}</p></div>`;
    return;
  }
  app.innerHTML = `<div class="grid">${shown.map(cardHTML).join('')}</div>`;
}

applyStaticI18n();
render();
setInterval(render, 1000);        // 每秒刷新一次等待时长与颜色提示（订单数据本身由 onSnapshot 实时推送）
</script>
</body>
</html>
