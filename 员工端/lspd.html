    font-family:inherit;font-size:13px;color:var(--ink);

  .period-summary{font-size:12px;color:var(--ink-soft);}
  .period-summary b{color:var(--ink);font-weight:700;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-weight:600;color:var(--ink-soft);font-size:12px;
    padding:9px 12px;border-bottom:1px solid var(--hairline);white-space:nowrap;
  }
  thead th.num{text-align:right;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle;}
  tbody td.num{text-align:right;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--paper-tint);}
  .data-table-wrap{border:1px solid var(--hairline);max-width:720px;overflow-x:auto;}
  .rank-cell{color:var(--ink-soft);width:28px;}
  tr.top-rank .rank-cell{color:var(--brand);font-weight:700;}

  .empty-hint{color:var(--ink-soft);font-size:13px;padding:24px 2px;max-width:520px;line-height:1.6;}

  .section-title{font-family:'Noto Serif SC',serif;font-weight:700;font-size:16px;margin:40px 0 16px;}

  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;flex-wrap:wrap;border-top:1px solid var(--hairline);}

  .pager-btn{

  }
  .pager-btn:hover:not(:disabled){color:var(--ink);border-color:var(--ink-soft);}
  .pager-btn:disabled{opacity:.35;cursor:default;}

const NAME_TO_CATEGORY = {};
DISH_LIST.forEach(d => { NAME_TO_CATEGORY[d.name] = d.category; });

function pad(n){ return String(n).padStart(2, '0'); }
function formatPrice(v){ return '€' + v.toFixed(2); }

function parseDateKey(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatShortDate(d){ return `${d.getMonth() + 1}月${d.getDate()}日`; }

// ISO 周：周一为一周的开始，跨年边界按"该周星期四落在哪一年"归属，
// 避免 12月/1月 交界的那一周被拆成两半
function isoWeekInfo(dateStr){
  const d = parseDateKey(dateStr);
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dayNr = (target.getDay() + 6) % 7; // 周一=0 .. 周日=6
  target.setDate(target.getDate() - dayNr + 3); // 挪到本周的星期四
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const firstDayNr = (firstThursday.getDay() + 6) % 7;
  firstThursday.setDate(firstThursday.getDate() - firstDayNr + 3);
  const week = 1 + Math.round((target - firstThursday) / (7 * 24 * 3600 * 1000));
  return { year: target.getFullYear(), week };
}
function mondayOfWeek(dateStr){
  const d = parseDateKey(dateStr);
  const dayNr = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dayNr);
  return d;
}

const PERIOD_KEY_FNS = {
  week: dateStr => { const { year, week } = isoWeekInfo(dateStr); return `${year}-W${pad(week)}`; },
  month: dateStr => dateStr.slice(0, 7),
  quarter: dateStr => { const [y, m] = dateStr.split('-').map(Number); return `${y}-Q${Math.ceil(m / 3)}`; },
  year: dateStr => dateStr.slice(0, 4),
};
const PERIOD_TAB_LABELS = { week: '周', month: '月', quarter: '季度', year: '年' };

function periodLabel(kind, key, dates){
  if(kind === 'week'){
    const firstDate = Array.from(dates).sort()[0];
    const monday = mondayOfWeek(firstDate);
    const sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
    const weekNum = key.split('-W')[1];
    return `${monday.getFullYear()}年 第${weekNum}周（${formatShortDate(monday)} - ${formatShortDate(sunday)}）`;
  }
  if(kind === 'month'){
    const [y, m] = key.split('-');
    return `${y}年${parseInt(m, 10)}月`;
  }
  if(kind === 'quarter'){
    const [y, q] = key.split('-Q');
    return `${y}年 第${q}季度`;
  }
  return `${key}年`;
}

let records = [];
let loaded = false;
let periodKind = 'month';
let currentBuckets = [];   // 当前 periodKind 下的分组，下拉框从这里取
let viewPeriodKey = null;  // 下拉框选中的具体周期

dailyOrdersRef.onSnapshot(snap => {
  records = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
  loaded = true;
  render();
}, err => {});

let salesCategoryFilter = 'all';
let salesPage = 0;
const SALES_PAGE_SIZE = 10;

function setSalesFilter(cat){
  salesCategoryFilter = cat;
  salesPage = 0;
  renderSalesRank();
}
function setViewPeriod(key){
  viewPeriodKey = key;
  salesPage = 0;
  renderPeriodSummary();
  renderSalesRank();
}
function salesRankPrevPage(){ if(salesPage > 0){ salesPage--; renderSalesRank(); } }
function salesRankNextPage(totalPages){ if(salesPage < totalPages - 1){ salesPage++; renderSalesRank(); } }
function salesRankFirstPage(){ if(salesPage > 0){ salesPage = 0; renderSalesRank(); } }

// 只统计下拉框选中的那个周期里卖出的份数
function aggregateSales(){
  const keyFn = PERIOD_KEY_FNS[periodKind];
  const map = new Map();
  records.forEach(r => {
    if(viewPeriodKey != null && keyFn(r.date) !== viewPeriodKey) return;
    (r.items || []).forEach(it => {
      const cat = NAME_TO_CATEGORY[it.name] || 'other';
      if(salesCategoryFilter !== 'all' && cat !== salesCategoryFilter) return;
      const cur = map.get(it.name) || { name: it.name, qty: 0, category: cat };
      cur.qty += it.qty || 0;
      map.set(it.name, cur);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.qty - a.qty);
}

function salesFilterOptionsHTML(){
  const opts = ['<option value="all">全部分类</option>']
    .concat(Object.keys(CATEGORY_LABELS).map(cat =>
      `<option value="${cat}" ${salesCategoryFilter === cat ? 'selected' : ''}>${CATEGORY_LABELS[cat]}</option>`));
  return opts.join('');
}

function renderSalesRank(){
  const select = document.getElementById('sales-filter-select');
  if(select) select.innerHTML = salesFilterOptionsHTML();
  const app = document.getElementById('sales-rank-app');
  if(!loaded){ app.innerHTML = ''; return; }
  const ranked = aggregateSales();
  if(ranked.length === 0){
    app.innerHTML = `<p class="empty-hint">这个周期、这个分类下还没有销量数据。</p>`;
    return;
  }
  const totalPages = Math.max(1, Math.ceil(ranked.length / SALES_PAGE_SIZE));
  if(salesPage >= totalPages) salesPage = totalPages - 1;
  const pageItems = ranked.slice(salesPage * SALES_PAGE_SIZE, salesPage * SALES_PAGE_SIZE + SALES_PAGE_SIZE);
  const rowsHTML = pageItems.map((item, i) => {
    const rank = salesPage * SALES_PAGE_SIZE + i + 1;
    return `<tr class="${rank <= 3 ? 'top-rank' : ''}">
      <td class="num rank-cell">${rank}</td>
      <td>${escapeHtml(item.name)}</td>
      <td>${CATEGORY_LABELS[item.category] || item.category}</td>
      <td class="num">${item.qty}</td>
    </tr>`;
  }).join('');
  const pagerHTML = `
    <div class="pager">
      <button class="pager-btn" onclick="salesRankFirstPage()" ${salesPage===0?'disabled':''}>回到第一页</button>
      <button class="pager-btn" onclick="salesRankPrevPage()" ${salesPage===0?'disabled':''}>上一页</button>
      <span class="pager-status">第 ${salesPage+1} / ${totalPages} 页 · 共 ${ranked.length} 项</span>
      <button class="pager-btn" onclick="salesRankNextPage(${totalPages})" ${salesPage===totalPages-1?'disabled':''}>下一页</button>
    </div>`;
  app.innerHTML = `<div class="data-table-wrap">
    <table>
      <thead><tr><th class="num">名次</th><th>菜品</th><th>分类</th><th class="num">份数</th></tr></thead>
      <tbody>${rowsHTML}</tbody>
    </table>
    ${totalPages > 1 ? pagerHTML : ''}
  </div>`;
}

function totalRevenue(){
  return records.reduce((s, r) => s + (r.revenue || 0), 0);
}

function groupByPeriod(kind){
  const keyFn = PERIOD_KEY_FNS[kind];
  const map = new Map();
  records.forEach(r => {
    const key = keyFn(r.date);
    if(!map.has(key)) map.set(key, { key, revenue: 0, orders: 0, dates: new Set(), ids: [] });
    const bucket = map.get(key);
    bucket.revenue += r.revenue || 0;
    bucket.orders += 1;
    bucket.dates.add(r.date);
    bucket.ids.push(r.id);
  });
  return Array.from(map.values())
    .map(b => ({ key: b.key, revenue: b.revenue, orders: b.orders, days: b.dates.size, ids: b.ids, label: periodLabel(kind, b.key, b.dates) }))
    .sort((a, b) => b.key.localeCompare(a.key));
}

// 切换周/月/季度/年会换一套分组 key，下拉框选中的周期也要清空，
// render() 里会自动挑新分组下最新的那个周期
function setPeriodKind(kind){
  periodKind = kind;
  viewPeriodKey = null;
  salesPage = 0;
  render();
}

function periodTabsHTML(){
  return Object.keys(PERIOD_TAB_LABELS).map(kind => `
    <button class="period-tab ${periodKind === kind ? 'active' : ''}" onclick="setPeriodKind('${kind}')">${PERIOD_TAB_LABELS[kind]}</button>`).join('');
}

function periodSelectOptionsHTML(){
  return currentBuckets.map(b =>
    `<option value="${b.key}" ${viewPeriodKey === b.key ? 'selected' : ''}>${b.label}</option>`).join('');
}

// 下拉框选中周期后，旁边这行小字显示该周期的营业额/天数/笔数
function renderPeriodSummary(){
  const el = document.getElementById('period-summary');
  if(!el) return;
  const b = currentBuckets.find(x => x.key === viewPeriodKey);
  el.innerHTML = b
    ? `营业额 <b>${formatPrice(b.revenue)}</b> · <b>${b.days}</b> 天营业 · <b>${b.orders}</b> 笔结账`
    : '';
}

function render(){
  document.getElementById('period-tabs').innerHTML = periodTabsHTML();

  const app = document.getElementById('app');
  currentBuckets = [];
  if(!loaded){
    document.getElementById('stat-line').textContent = '';
    app.innerHTML = '';
    renderSalesRank();
    return;
  }
  if(records.length === 0){
    document.getElementById('stat-line').textContent = '';
    app.innerHTML = `<p class="empty-hint">还没有历史营销数据——每天在接单看板点"顾客已经结账离开，移出看板"后，流水会自动记进来。</p>`;
    renderSalesRank();
    return;
  }
  const dayCount = new Set(records.map(r => r.date)).size;
  document.getElementById('stat-line').innerHTML =
    `历史累计营业额 <b>${formatPrice(totalRevenue())}</b> · 共 <b>${dayCount}</b> 天营业数据 · <b>${records.length}</b> 笔结账`;

  currentBuckets = groupByPeriod(periodKind);
  if(viewPeriodKey == null || !currentBuckets.some(b => b.key === viewPeriodKey)){
    viewPeriodKey = currentBuckets.length ? currentBuckets[0].key : null;
  }

  app.innerHTML = `
    <div class="filter-row">
      <span class="filter-label">周期</span>
      <select id="period-select" onchange="setViewPeriod(this.value)">${periodSelectOptionsHTML()}</select>
      <span class="period-summary" id="period-summary"></span>
    </div>`;
  renderPeriodSummary();

  renderSalesRank();
}

render();
</script>
