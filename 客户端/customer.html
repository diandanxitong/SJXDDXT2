
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELCOME~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Archivo+Black&family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EFE0;
    --bg-soft:#ECE0C6;
    --card:#FDFBF5;
    --card-line:#8B6F47;
    --ember:#C9502E;
    --ember-dark:#96371D;
    --cinnabar:#B8402A;
    --jade:#2F7A5E;
    --jade-hi:#9BC7A6;
    --jade-dark:#245F49;
    --gold:#E8A23D;
    --gold-ink:#8A5A18;
    --gold-line:rgba(138,90,24,.4);
    --text:#221A13;
    --text-muted:#5C4A34;
    --radius:16px;
    --brush:'Ma Shan Zheng',cursive;
    --serif-display:'Bodoni Moda',serif;
    --ease-silk:cubic-bezier(.22,1,.36,1);
    --dur-fast:.18s;
    --dur:.32s;
    --gold-hi:#F6DFA0;
    --gold-deep:#9C6A1E;
    --pepper-brown:#6B4226;
    --shadow-card:0 1px 2px rgba(59,44,30,.12), 0 16px 32px -16px rgba(59,44,30,.35);
    --shadow-card-active:0 2px 4px rgba(59,44,30,.18), 0 22px 40px -14px rgba(59,44,30,.4);
    --shadow-pop:0 22px 54px rgba(59,44,30,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  ::selection{background:rgba(184,64,42,.24);color:var(--text);}
  :focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px;border-radius:4px;}
  *{scrollbar-width:thin;scrollbar-color:var(--card-line) transparent;}
  *::-webkit-scrollbar{width:8px;height:8px;}
  *::-webkit-scrollbar-track{background:transparent;}
  *::-webkit-scrollbar-thumb{background:var(--card-line);border-radius:8px;}
  html,body{background:var(--bg);color:var(--text);}
  body{
    font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100vh;
  }
  body.lang-zh-custom{
    font-family:'Noto Serif SC','Songti SC','SimSun','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  }
  body.lang-zh-hant{
    font-family:'Noto Serif TC','PingFang TC','Microsoft JhengHei',serif;
  }
  html,body{overscroll-behavior-y:none;}
  body{
    display:flex;
    justify-content:center;
    background-color:var(--bg);
  }
  #app{
    width:100%;max-width:480px;min-height:100vh;position:relative;padding-bottom:110px;
    box-shadow:0 0 0 1px rgba(232,162,61,.06);
  }
  #app::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--cinnabar),var(--gold) 50%,var(--cinnabar));
  }
  .eyebrow{
    font-size:12px;letter-spacing:.14em;color:var(--gold-ink);
    text-transform:uppercase;font-weight:700;
  }

  /* ---------- header ---------- */
  header.bar{
    padding:26px 24px 22px;
    position:relative;overflow:hidden;
  }
  header.bar::after{
    content:"";position:absolute;top:-42px;right:-42px;width:120px;height:120px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23E8A23D' stroke-width='2'><circle cx='50' cy='50' r='30'/><path d='M20 50 Q35 30 50 50 Q65 70 80 50'/><path d='M20 50 Q35 70 50 50 Q65 30 80 50'/></g></svg>");
    background-size:contain;background-repeat:no-repeat;opacity:.1;pointer-events:none;
  }
  /* logo 跟桌号数字同一行、水平对齐，放在线（.masthead-rule）上方正中间——
     两侧的桌号牌和"我的"宽度不一定相等，用 grid 的 1fr auto 1fr 保证中间
     这一列永远居中，不会因为两边宽度不同而歪掉 */
  .bar-row{
    position:relative;z-index:1;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  }
  .menu-logo-row{display:flex;justify-content:center;}
  .menu-logo{width:104px;height:auto;display:block;filter:drop-shadow(0 4px 10px rgba(59,44,30,.25));}
  .table-badge{display:flex;flex-direction:column;align-items:flex-start;gap:10px;position:relative;justify-self:start;min-width:0;}
  .table-badge-row{display:flex;align-items:baseline;gap:14px;}
  .table-badge .num{
    font-family:var(--serif-display);font-weight:700;
    font-size:36px;color:var(--ember);line-height:1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 3px 2px rgba(201,80,46,.28), 0 8px 16px rgba(59,44,30,.2);
  }
  .masthead-rule{
    margin-top:2px;height:1px;position:relative;
    background:linear-gradient(90deg, var(--gold-line), transparent 85%);
  }
  /* ---------- panda nav ----------
     每个页面都把 #menu-panda-slot 这个 id 嵌在自己的顶部布局里（菜单页在
     header 里，其它页在 .screen-top-row 里，见 screenTopRowHTML），renderPandaNav
     每次都会优先找这个 id 原地挂载——所以熊猫"我的订单"/语言切换这两个按钮在
     全部页面上都是跟着内容一起滚走的嵌入式布局，不是悬浮在视口上的固定定位
     （2026-09-08 试过做成一直悬浮跟随，顾客说不要；2026-09-09 进一步把"不悬浮"
     从菜单页推广到全部页面）。#panda-nav 保留作为兜底（万一哪个页面漏加了
     slot），正常情况下用不到。 */
  /* "我的订单"在上、语言切换在下，竖着排在右上角——"我的订单"点了直接跳
     "我的订单"页，不再经过下拉菜单；语言切换是独立按钮，图标用 lang.webp
     （那个通用的"文/A"翻译图标） */
  #panda-nav{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .menu-panda-slot{position:relative;z-index:56;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;justify-self:end;min-width:0;}
  .panda-overlay{position:fixed;inset:0;z-index:55;background:none;border:none;padding:0;margin:0;cursor:default;}
  .my-order-btn{
    position:relative;z-index:56;
    display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
    padding:0;font-family:inherit;color:var(--text);
  }
  .panda-avatar{
    position:relative;
    width:32px;height:32px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .panda-avatar img{display:block;width:100%;height:100%;object-fit:contain;}
  .panda-order-badge{
    position:absolute;top:-5px;right:-7px;min-width:16px;height:16px;padding:0 3px;
    border-radius:999px;background:var(--cinnabar);color:#fff;
    font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--bg-soft);
  }
  /* 之前是纯文字（13.5px、无边框），顾客反馈要加个框、字再大一点 */
  .my-order-label{
    font-size:15px;font-weight:800;color:var(--text-muted);white-space:nowrap;
    border:1.5px solid var(--card-line);border-radius:20px;padding:6px 12px;background:var(--card);
  }
  .my-order-btn:hover .my-order-label{color:var(--gold-ink);border-color:var(--gold-line);}

  /* cart/购物车确认/下单成功/我的订单 四个页面共用：左边返回按钮，右边熊猫
     导航槽（#menu-panda-slot），见 screenTopRowHTML */
  .screen-top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 24px 0;}

  /* ---------- menu ---------- */
  .menu-title-row{
    padding:20px 24px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .menu-title{
    font-size:26px;font-weight:400;color:var(--gold-ink);
    font-family:var(--brush);letter-spacing:.04em;
  }
  .allergen-info-btn{
    flex-shrink:0;background:none;border:1px solid var(--gold-line);color:var(--gold-ink);
    font-size:11px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;
    white-space:nowrap;font-family:inherit;
  }
  .allergen-info-btn:hover{background:rgba(232,162,61,.1);}
  .allergen-modal{padding-bottom:8px;}
  .allergen-grid{padding:4px 18px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;}
  .allergen-grid-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);}
  /* ---------- chef's-special carousel (one photo, auto-advances every 3s) ---------- */
  .chef-carousel{padding:22px 0 6px;}
  .chef-slide{
    position:relative;display:block;width:calc(100% - 24px);margin:0 12px;aspect-ratio:3/1;
    overflow:hidden;border:none;border-radius:0;
    background:var(--card);padding:0;cursor:pointer;font-family:inherit;
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
  }
  .chef-slide-photo{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:opacity .3s ease;
  }
  .chef-slide-tag{
    position:absolute;left:14px;top:14px;z-index:2;
    background:rgba(20,14,11,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    border:1px solid var(--gold-line);color:var(--gold-hi);
    font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 11px;border-radius:20px;
  }
  .chef-slide-caption{
    position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;
    background:linear-gradient(0deg, rgba(0,0,0,.76) 0%, rgba(0,0,0,0) 100%);
    color:#fff;font-size:15px;font-weight:800;letter-spacing:.01em;text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:opacity .3s ease;
  }
  .menu-body{display:flex;align-items:flex-start;}
  .category-nav{
    width:84px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--card-line);
    position:sticky;top:0;align-self:flex-start;
    max-height:100vh;max-height:100dvh;overflow-y:auto;
    overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:4px 0;
  }
  .category-nav.latin{width:96px;}
  .category-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    position:relative;
    background:none;border:none;color:var(--text-muted);
    font-size:13.5px;font-weight:700;padding:12px 6px;cursor:pointer;text-align:center;
    font-family:inherit;line-height:1.3;
    margin:2px 8px;border-radius:11px;
    overflow-wrap:break-word;word-break:break-word;hyphens:auto;
  }
  .cat-btn.latin{
    font-size:11px;font-weight:700;line-height:1.22;letter-spacing:-.01em;
    padding:10px 4px;hyphens:none;
  }
  .cat-btn.active{
    color:var(--gold-ink);
    background:linear-gradient(160deg, rgba(232,162,61,.28), rgba(232,162,61,.12));
    box-shadow:inset 0 0 0 1px var(--gold-line);
  }
  .cat-btn:hover{color:var(--text);}
  @keyframes cat-flash-warn{
    0%,100%{color:inherit;text-shadow:none;}
    50%{color:#ff3b30;text-shadow:0 0 10px rgba(255,59,48,.65);}
  }
  .cat-btn.flash-warn{animation:cat-flash-warn .28s ease-in-out 3;}

  /* ---------- nag toast (missing soup base / missing rice-noodle toppings) ---------- */
  .nag-toast{
    position:fixed;left:50%;top:88px;z-index:90;transform:translateX(-50%);
    max-width:82vw;text-align:center;pointer-events:none;
    background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    color:#fff;font-size:13px;font-weight:800;line-height:1.4;
    padding:11px 18px;border-radius:14px;border:1px solid var(--gold-line);
    box-shadow:0 14px 32px rgba(0,0,0,.45);
    animation:nag-toast-life 2.6s ease forwards;
  }
  .nag-toast.nag-toast-info{
    background:linear-gradient(160deg,var(--jade) 0%,var(--jade-dark) 100%);
  }
  @keyframes nag-toast-life{
    0%{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.94);}
    10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    85%{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
    100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(.96);}
  }

  /* ---------- 页面顶部"有小伙伴成功下单啦"跑马灯：见 queueOrderAnnouncement /
     playNextOrderMarquee。不管顾客当前在客户端哪个页面（菜单/购物车/确认单/
     我的订单……）都固定在页面最顶部展示，跟这个人具体在看哪个页面无关。
     一条消息必须完整滚完（animationend 才算这条播完），不会被下一条打断——
     多条消息用队列排队播，不用旧版 .order-bubble 那种"来了新的就地替换、
     直接吃掉上一条"的做法（那样如果同时有好几桌一起下单，后面几笔会悄悄
     被吞掉，顾客完全看不到）。右侧"我的订单"按钮全程固定在跑马灯最右边，
     不随文字滚动，方便顾客看到提示后随手点进去核对。 ---------- */
  .order-marquee-bar{
    position:fixed;left:0;right:0;top:0;z-index:97;
    display:flex;align-items:stretch;height:54px;
    background:linear-gradient(160deg,var(--jade) 0%,var(--jade-dark) 100%);
    box-shadow:0 10px 24px rgba(0,0,0,.35);
    animation:order-marquee-bar-in .22s ease;
  }
  @keyframes order-marquee-bar-in{
    from{ transform:translateY(-100%); }
    to{ transform:translateY(0); }
  }
  .order-marquee-track{ flex:1; min-width:0; position:relative; overflow:hidden; }
  .order-marquee-text{
    position:absolute; left:0; top:0; height:100%;
    display:flex; align-items:center; white-space:nowrap;
    color:#fff; font-size:15px; font-weight:800; padding:0 4px;
    animation-name:order-marquee-scroll; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes order-marquee-scroll{
    from{ transform:translateX(100vw); }
    to{ transform:translateX(-100%); }
  }
  .order-marquee-cta{
    flex-shrink:0; display:flex; align-items:center; gap:4px;
    padding:0 18px; border:none; cursor:pointer; font-family:inherit;
    white-space:nowrap; color:#fff; font-size:13.5px; font-weight:800;
    background:linear-gradient(90deg, rgba(20,40,30,0) 0%, rgba(20,40,30,.32) 34%, rgba(20,40,30,.32) 100%);
  }
  .order-marquee-cta:active{ opacity:.75; }
  .dish-panel{flex:1;min-width:0;padding-right:16px;}
  .category-note{
    font-size:12px;line-height:1.5;color:var(--text-muted);
    background:var(--bg-soft);border:1px solid var(--card-line);border-radius:12px;
    padding:9px 12px;margin:0 0 14px 16px;
  }
  .category-note .note-link{
    color:var(--gold-ink);font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer;
  }
  .dish-list{padding:0 0 0 16px;display:flex;flex-direction:column;gap:8px;}
  .dish-group-header{
    font-size:13.5px;font-weight:800;letter-spacing:.04em;color:var(--gold-ink);
    padding:2px 2px 0;margin-top:2px;
  }
  .dish-group-header:first-child{margin-top:0;}
  .dish-card{
    position:relative;overflow:hidden;
    padding:9px;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23E8A23D' stroke-width='2' stroke-opacity='.16'><circle cx='50' cy='50' r='30'/><path d='M20 50 Q35 30 50 50 Q65 70 80 50'/><path d='M20 50 Q35 70 50 50 Q65 30 80 50'/></g></svg>"),
      linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    background-repeat:no-repeat,no-repeat;
    background-position:right -20px top -20px,0 0;
    background-size:86px 86px,100% 100%;
    border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
  }
  /* Photo pinned top-left and never re-centered — the extend note below can
     grow the card as tall as it wants without nudging the photo. */
  .dish-card-row{display:flex;align-items:flex-start;gap:10px;}
  .dish-photo-wrap{
    position:relative;width:84px;height:84px;flex-shrink:0;overflow:hidden;
    border-radius:calc(var(--radius) - 6px);
    background:linear-gradient(160deg,var(--bg-soft) 0%,var(--card) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .dish-photo-wrap::before{
    content:"🍽";font-size:24px;opacity:.28;position:absolute;
  }
  .dish-photo{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;}
  .dish-body{flex:1;min-width:0;}
  .dish-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .dish-name{font-size:15px;font-weight:900;letter-spacing:.01em;line-height:1.32;color:var(--text);}
  .dish-price{
    flex-shrink:0;font-family:'Archivo Black',sans-serif;font-size:13px;color:#fff;font-variant-numeric:tabular-nums;
    background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    border:1px solid var(--gold-line);
    white-space:nowrap;padding:4px 10px 5px;border-radius:8px;margin-top:1px;
    box-shadow:0 2px 6px rgba(150,55,29,.35);
  }
  .dish-body .tag{font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.4;overflow-wrap:break-word;}
  .dish-body .tag.pot-note{color:var(--gold-ink);font-weight:700;}
  .dish-card.sold-out .dish-photo-wrap::after{
    content:"";position:absolute;inset:0;z-index:2;
    background:rgba(245,241,236,.6);
  }
  .dish-card.sold-out .dish-name{color:var(--text-muted);}
  .sold-out-msg{font-size:13px;font-weight:800;color:var(--gold-ink);text-align:center;margin-top:10px;}
  .allergen-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .allergen-chip{
    font-size:10px;font-weight:800;letter-spacing:.02em;color:var(--text-muted);
    border:1px solid var(--card-line);border-radius:6px;padding:2px 6px;cursor:default;
    background:none;font-family:inherit;
  }
  .allergen-row .allergen-chip{cursor:pointer;}
  .allergen-row .allergen-chip:hover, .allergen-row .allergen-chip:active{
    border-color:var(--gold-ink);color:var(--gold-ink);background:rgba(232,162,61,.1);
  }
  .allergen-tap-hint{font-size:10.5px;color:var(--text-muted);margin-top:5px;}
  .allergen-popup{
    position:fixed;z-index:75;transform:translate(-50%,-100%) translateY(-10px);
    max-width:min(78vw,260px);
    display:flex;align-items:flex-start;gap:8px;
    background:var(--card);border:1px solid var(--gold-line);border-radius:10px;
    padding:9px 12px;box-shadow:0 10px 26px rgba(0,0,0,.5);
    font-size:12.5px;color:var(--text);line-height:1.4;
  }
  .allergen-popup-code{
    flex-shrink:0;font-weight:900;color:var(--gold-ink);font-size:11px;
    background:rgba(232,162,61,.14);border-radius:6px;padding:1px 6px;
  }
  .size-row{display:flex;gap:6px;margin-top:10px;}
  .size-pill{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:7px 4px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11.5px;cursor:pointer;text-align:center;
  }
  .size-pill .size-label{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .size-pill .size-price{font-size:11px;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .size-pill.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .size-pill.sold-out{opacity:.45;cursor:default;text-decoration:line-through;}
  .option-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .option-chip{
    display:flex;align-items:center;gap:5px;
    padding:6px 10px;border-radius:20px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:12px;cursor:pointer;font-family:inherit;
  }
  .option-chip .option-check{
    width:13px;height:13px;flex-shrink:0;border-radius:4px;border:1px solid var(--card-line);
    display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:var(--bg);
  }
  .option-chip.active{border-color:var(--jade);color:var(--text);background:rgba(47,122,94,.16);}
  .option-chip.active .option-check{background:var(--jade);border-color:var(--jade);color:#fff;}
  .dish-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:7px;padding-top:6px;border-top:1px dashed var(--card-line);}
  .spice-tag.add-on-tag{color:var(--cinnabar);border-color:rgba(184,64,42,.4);}
  .stepper{
    display:flex;align-items:center;gap:0;flex-shrink:0;
    border:1px solid var(--card-line);border-radius:999px;padding:3px;
    background:var(--bg-soft);
  }
  .stepper button{
    width:30px;height:30px;border-radius:999px;border:none;
    background:none;color:var(--text);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .stepper button:disabled{opacity:.35;cursor:not-allowed;}
  .stepper button:not(:disabled):hover{color:var(--ember);}
  .stepper button.stepper-add{
    border-radius:50%;background:var(--jade);color:#fff;font-size:19px;
  }
  .stepper button.stepper-add:not(:disabled):hover{background:var(--jade-dark);color:#fff;}
  .dish-card .stepper button.stepper-add{font-size:17px;}
  .stepper .qty{
    width:28px;text-align:center;font-weight:700;font-size:15px;
    font-family:'Archivo Black',sans-serif;font-variant-numeric:tabular-nums;
  }
  .dish-card .stepper button{width:36px;height:36px;font-size:15px;}
  .dish-card .stepper .qty{width:26px;font-size:13.5px;}
  .dish-extend{
    margin-top:12px;padding-top:12px;border-top:1px dashed var(--card-line);
    animation:dish-extend-in .3s cubic-bezier(.2,1,.3,1);
  }
  @keyframes dish-extend-in{
    from{opacity:0;transform:translateY(-8px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){
    .dish-extend{animation:none;}
  }
  /* the note reads as a small slip clipped below the ticket, not the card itself stretching */
  .dish-extend-note{
    position:relative;background:var(--bg-soft);
    border:1px solid var(--card-line);border-radius:12px;
    padding:14px 14px 12px;
  }
  .dish-extend-note::before{
    content:"";position:absolute;top:-7px;left:16px;width:26px;height:7px;
    background:var(--gold);border-radius:3px 3px 0 0;
  }
  .dish-extend-note>*:first-child{margin-top:0;padding-top:0;border-top:none;}
  .spice-row{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--card-line);}
  .spice-pill{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:8px 4px;border-radius:10px;border:1px solid var(--card-line);
    background:var(--bg-soft);color:var(--text-muted);font-size:11.5px;line-height:1.25;cursor:pointer;
    text-align:center;
  }
  .spice-pill .flames{display:flex;gap:1px;flex-shrink:0;}
  .spice-pill .spice-label{overflow-wrap:break-word;}
  .spice-pill.active{border-color:var(--cinnabar);color:var(--gold-ink);background:rgba(184,64,42,.16);}
  .flame{fill:var(--card-line);}
  .spice-pill.active .flame.lit{fill:var(--cinnabar);}
  .spice-pill:not(.active) .flame.lit{fill:var(--text-muted);}
  .spice-pill:disabled{opacity:.4;cursor:not-allowed;}
  /* 锅底"不要花椒"按钮：跟辣度档位并排，但用棕色区分——它不是辣度选项，
     而是独立的做法要求（去花椒），选中后填色以示已勾选 */
  .spice-pill.pepper-pill{flex:0 0 auto;border-color:var(--pepper-brown);color:var(--pepper-brown);}
  .spice-pill.pepper-pill.active{background:var(--pepper-brown);color:#fff;border-color:var(--pepper-brown);}
  .spice-row-disabled{cursor:not-allowed;}

  /* ---------- sticky bottom bar ---------- */
  .bottom-bar{
    position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:30;
    padding:20px 16px 42px;
  }
  .bottom-bar-inner{
    width:100%;max-width:448px;display:flex;align-items:stretch;gap:12px;
  }
  .submit-btn{
    flex:1;background:linear-gradient(160deg,rgba(150,55,29,.72) 0%,rgba(105,38,20,.72) 100%);
    backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
    color:#fff;border:1px solid var(--gold-line);border-radius:14px;
    padding:14px 10px;font-size:15px;font-weight:700;cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
    box-shadow:0 6px 18px rgba(150,55,29,.35);
  }
  .submit-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;border-color:var(--card-line);}
  .submit-btn:not(:disabled):active{background:var(--ember-dark);}

  /* one unified pill spanning most of the screen width, split unevenly into two actions;
     fixed (not fully-round) radius so wrapping to extra lines in other languages just
     lengthens the pill instead of making it look like it's ballooning wider */
  .action-pill-wrap{position:relative;width:74%;max-width:340px;min-width:250px;margin:0 auto;}
  .action-pill{
    position:relative;display:flex;align-items:stretch;
    border-radius:26px;overflow:hidden;
    background:linear-gradient(160deg, rgba(253,251,245,.78) 0%, rgba(236,224,198,.78) 100%);
    backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--gold-line);
    box-shadow:0 12px 28px rgba(0,0,0,.45);
  }
  .action-pill::before{
    content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,0) 42%);
  }
  .action-pill::after{
    content:"";position:absolute;z-index:2;top:20%;bottom:20%;left:40%;width:1px;
    background:linear-gradient(180deg, transparent, rgba(232,162,61,.45), transparent);
    pointer-events:none;
  }
  .cart-btn, .order-now-btn{
    min-width:0;border:none;cursor:pointer;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:10px 8px;text-align:center;
  }
  /* 呼叫服务员字多，分到的宽度比立即下单大一点；整条按钮（pill）本身也整体
     缩窄一些，让左边不再压到分类栏。颜色保持不变：呼叫服务员仍是朱红色毛
     玻璃，立即下单仍是深红棕色毛玻璃 */
  .cart-btn{flex:3;background:rgba(184,64,42,.1);color:var(--cinnabar);}
  .order-now-btn{
    flex:2;color:#fff;
    background:linear-gradient(160deg, rgba(150,55,29,.86) 0%, rgba(105,38,20,.86) 100%);
  }
  .cart-btn-title{text-shadow:0 1px 1px rgba(255,255,255,.5);}
  .order-now-title{text-shadow:0 1px 2px rgba(0,0,0,.4);}
  .cart-btn .cart-btn-sub{color:var(--cinnabar);opacity:.8;}
  .cart-btn:disabled{color:var(--text-muted);cursor:not-allowed;background:none;}
  .order-now-btn:disabled{background:var(--card-line);color:var(--text-muted);cursor:not-allowed;box-shadow:none;}
  .cart-btn:not(:disabled):active{background:rgba(184,64,42,.2);}
  .order-now-btn:not(:disabled):active{background:linear-gradient(160deg, rgba(150,55,29,.96) 0%, rgba(105,38,20,.96) 100%);}
  .cart-btn-title, .order-now-title{font-size:16px;font-weight:900;letter-spacing:.02em;overflow-wrap:break-word;}
  .cart-btn-sub, .order-now-sub{font-size:10px;font-weight:700;opacity:.85;overflow-wrap:break-word;}
  /* 立即下单分到的宽度变小了，字号跟着缩小一档，避免文字被挤到换行超框。
     英文版靠已有的 .latin.lang-en 规则（选择器更精确）继续保持原尺寸，不受影响 */
  .order-now-btn .order-now-title{font-size:14px;letter-spacing:0;line-height:1.15;}
  .order-now-btn .order-now-sub{font-size:9px;line-height:1.15;}
  .cart-btn.latin, .order-now-btn.latin{padding:9px 6px;}
  .cart-btn.latin .cart-btn-title, .order-now-btn.latin .order-now-title{font-size:13px;letter-spacing:0;line-height:1.15;}
  .cart-btn.latin .cart-btn-sub, .order-now-btn.latin .order-now-sub{font-size:9px;line-height:1.15;}
  .cart-btn.latin.lang-en .cart-btn-title, .order-now-btn.latin.lang-en .order-now-title{font-size:16px;letter-spacing:.02em;line-height:1.15;}
  .cart-btn.latin.lang-en .cart-btn-sub, .order-now-btn.latin.lang-en .order-now-sub{font-size:10px;line-height:1.15;}

  /* ---------- cart button: slim vertical tab docked to the right edge ---------- */
  .cart-side-fab{
    position:fixed;right:0;top:56%;transform:translateY(-50%);z-index:40;
    width:32px;padding:12px 4px;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    background:linear-gradient(160deg,var(--card) 0%,var(--bg-soft) 100%);
    border:1px solid var(--gold-line);border-right:none;border-radius:14px 0 0 14px;
    color:var(--text);cursor:pointer;
    box-shadow:-4px 6px 16px rgba(0,0,0,.4);
  }
  .cart-side-fab:active:not(:disabled){transform:translateY(-50%) scale(.96);}
  .cart-side-fab-icon-wrap{position:relative;flex-shrink:0;display:flex;}
  .cart-side-fab-icon{width:20px;height:20px;object-fit:contain;pointer-events:none;display:block;}
  .cart-side-fab-badge{
    position:absolute;top:-7px;right:-9px;min-width:16px;height:16px;padding:0 3px;
    border-radius:999px;background:var(--cinnabar);color:#fff;
    font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--bg-soft);
  }
  .cart-side-fab-label{
    font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.03em;color:var(--gold-ink);
    writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.2;
    min-height:38px;
  }
  .cart-side-fab-label.latin{
    text-orientation:sideways;letter-spacing:.02em;
  }
  .cart-side-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);border:none;padding:0;margin:0;cursor:default;}
  .cart-side-panel{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);transform-origin:right center;
    animation:cart-side-in .26s cubic-bezier(.2,1,.3,1);
    z-index:71;width:min(84vw,340px);max-height:70vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--gold-line);border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);padding:18px 18px 14px;
  }
  @keyframes cart-side-in{
    from{opacity:0;transform:translateY(-50%) translateX(24px) scale(.94);}
    to{opacity:1;transform:translateY(-50%) translateX(0) scale(1);}
  }
  .cart-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cart-side-title{font-family:var(--brush);font-weight:400;font-size:20px;color:var(--gold-ink);}
  .cart-side-close{
    flex-shrink:0;background:none;border:1px solid var(--card-line);color:var(--text-muted);
    width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cart-side-close:hover{color:var(--gold-ink);border-color:var(--gold-line);}
  .cart-side-panel .order-summary{margin:0;}

  /* ---------- add-to-cart status animation (GSAP-driven, see celebrateAddToCart) ---------- */
  .hotpot-toast{
    position:fixed;left:50%;bottom:148px;z-index:80;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .fx-check{width:56px;height:56px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));}
  .hotpot-caption{
    background:var(--card);border:1px solid var(--card-line);color:var(--text);
    font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:20px;
  }
  .call-toast-bell{font-size:48px;line-height:1;}

  /* ---------- 下单/加单成功后，屏幕正中弹一个放大版对勾、同时把它下面的内容
     模糊一下，持续约 1 秒再一起淡出——见 celebrateOrderSuccess。之前"成功了
     没"只靠 confirm 页顶部一个印章样式的 stamp-ring，顾客反馈不够醒目、容易
     漏看，这个是额外加的一层更抢眼的确认 ---------- */
  .order-success-fx{
    position:fixed;inset:0;z-index:120;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,14,11,0);
    backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
    transition:background-color .28s ease, backdrop-filter .28s ease, -webkit-backdrop-filter .28s ease;
  }
  .order-success-fx.blurred{
    background:rgba(20,14,11,.24);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .fx-check-big{width:92px;height:92px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.4));}

  /* ---------- confirm screen ---------- */
  .confirm-screen{padding:56px 28px 40px;text-align:center;}
  .stamp-ring{
    width:132px;height:132px;margin:0 auto 26px;border-radius:50%;
    border:3px solid var(--cinnabar);display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);position:relative;
    box-shadow:0 0 0 1px rgba(184,64,42,.15), 0 10px 24px rgba(59,44,30,.28), 0 3px 6px rgba(184,64,42,.22);
  }
  .stamp-ring::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--cinnabar);border-radius:50%;
  }
  .stamp-ring span{
    font-family:var(--serif-display);font-weight:700;color:var(--cinnabar);font-size:19px;letter-spacing:.05em;
  }
  .confirm-screen h2{
    font-family:var(--brush);font-weight:400;font-size:34px;color:var(--gold-ink);margin-bottom:22px;
  }

  /* ---------- kitchen-status pulse (shown once staff confirms the order, GSAP-driven, see animateChefSteam) ---------- */
  .chef-cooking{position:relative;width:56px;height:56px;margin:18px auto 10px;}
  .fx-cooking-ring{
    position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
    border-radius:50%;border:2px solid var(--ember);opacity:0;
  }
  .fx-cooking-dot{
    position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
    border-radius:50%;background:linear-gradient(160deg,var(--ember) 0%,var(--ember-dark) 100%);
    box-shadow:0 3px 8px rgba(150,55,29,.4);
  }
  .kitchen-sent-title{
    font-family:var(--brush);font-weight:400;font-size:26px;color:var(--gold-ink);margin:4px 0 2px;
  }
  .order-summary{list-style:none;text-align:left;background:var(--card);border:1px solid var(--card-line);
    border-top:1px solid var(--gold-line);
    border-radius:var(--radius);padding:6px 18px;margin-bottom:20px;}
  .order-summary li{padding:13px 0;font-size:15px;}
  .order-summary li + li{border-top:1px dashed var(--card-line);}
  .order-line-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:700;}
  .order-line-name{overflow-wrap:break-word;}
  .order-line-price{color:var(--gold-ink);font-size:13.5px;white-space:nowrap;flex-shrink:0;padding-top:1px;}
  .order-line-bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .order-line-bottom .stepper{margin-left:auto;}
  .order-total-line{
    display:flex;justify-content:space-between;padding:14px 0 6px;
    font-weight:900;font-size:15px;color:var(--gold-ink);
  }
  .spice-tag{font-size:11.5px;color:var(--gold-ink);border:1px solid var(--gold-line);border-radius:20px;padding:2px 9px;}
  .hint{color:var(--text-muted);font-size:13.5px;margin-bottom:26px;}
  .order-removed-notice{
    color:var(--cinnabar);font-size:13.5px;font-weight:700;line-height:1.5;
    background:rgba(184,64,42,.1);border:1px solid rgba(184,64,42,.35);
    border-radius:var(--radius);padding:12px 16px;margin-bottom:22px;
  }
  /* "请稍候，服务员马上确认～"：之前跟其它次要说明文字共用 .hint（13.5px、灰色），
     顾客反馈这一条是"还在等"这个关键状态，太容易被忽略——单独给一个带底色的
     胶囊徽标 + 常驻呼吸的小圆点，跟已确认状态那个 chef-cooking 动画一样明确 */
  .wait-confirm-badge{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(232,162,61,.14);border:1px solid var(--gold-line);color:var(--gold-ink);
    font-size:14px;font-weight:800;padding:10px 18px;border-radius:999px;margin:0 0 26px;
  }
  .wait-confirm-dot{
    width:8px;height:8px;border-radius:50%;background:var(--ember);flex-shrink:0;
    animation:wait-confirm-pulse 1.4s ease-in-out infinite;
  }
  @keyframes wait-confirm-pulse{
    0%{box-shadow:0 0 0 0 rgba(201,80,46,.55);}
    70%{box-shadow:0 0 0 7px rgba(201,80,46,0);}
    100%{box-shadow:0 0 0 0 rgba(201,80,46,0);}
  }
  .confirm-actions-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .ghost-btn{
    background:none;border:1px solid var(--card-line);color:var(--text-muted);
    padding:11px 22px;border-radius:12px;font-size:14px;cursor:pointer;
  }
  .ghost-btn:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  .back-row{text-align:left;padding:14px 24px 0;}
  /* 之前是纯文字链接（13px、无边框），顾客反馈不够醒目——改成实心边框的
     胶囊按钮，字号也加大一档，跟页面里其它按钮的可点击感一致 */
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--card);border:1.5px solid var(--card-line);color:var(--text);
    font-size:15.5px;font-weight:800;cursor:pointer;padding:10px 18px;border-radius:14px;
    font-family:inherit;box-shadow:0 2px 8px rgba(59,44,30,.08);
  }
  .back-btn:hover{color:var(--gold-ink);border-color:var(--gold-line);}

  .my-order-card{
    margin-top:32px;text-align:left;
    background:var(--card);border:1px solid var(--card-line);border-top:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
  }
  .my-order-title{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--text);}
  .my-order-card .order-summary{
    margin:12px 0 0;background:none;border:none;padding:0;
  }
  .my-order-card .order-summary li{padding:11px 0;}
  .my-order-card .order-summary li + li{border-top:1px dashed var(--card-line);}
  .my-order-note{font-size:12.5px;color:var(--gold-ink);margin:14px 0 0;}

  /* ---------- 我的订单：按下单批次展示，字号比其它页面的 order-summary 大一档 ---------- */
  .my-order-batch{margin-bottom:20px;position:relative;}
  .my-order-batch-time{
    font-weight:900;font-size:15.5px;color:var(--gold-ink);margin:0 0 8px;
    display:flex;align-items:center;gap:8px;
  }
  .my-order-batch-tag{
    font-size:11px;font-weight:800;color:var(--jade);border:1px solid var(--jade);
    border-radius:20px;padding:2px 9px;
  }
  .my-order-batch-nickname{
    font-size:11px;font-weight:800;color:var(--text-muted);border:1px solid var(--card-line);
    border-radius:20px;padding:2px 9px;overflow-wrap:anywhere;
  }
  /* 每个批次卡片右上角盖一个线条章，跟顾客直接说"到底送厨房了没"——绿色实心边框
     ="已下单成功"（staff 已确认、送进厨房），红色="等待中"（还在等 staff 确认）。
     只用边框不填色，是印章的视觉语言，跟 confirm 页那个 .stamp-ring 一脉相承 */
  .batch-status-stamp{
    position:absolute;top:14px;right:2px;z-index:1;pointer-events:none;
    border:1.5px solid currentColor;border-radius:7px;
    font-family:var(--serif-display);font-weight:700;font-size:11px;letter-spacing:.03em;
    padding:3px 8px;transform:rotate(-7deg);background:none;white-space:nowrap;
  }
  .batch-status-stamp.stamp-green{color:var(--jade);}
  .batch-status-stamp.stamp-red{color:var(--cinnabar);}
  .my-order-screen .order-summary li{font-size:17px;padding:15px 0;}

// 餐厅 wifi 经常是带代理/防火墙的访客网络，会挡掉 Firestore 默认用的 WebSocket 长连接，
// 导致请求悬在那里既不成功也不报错。这里让 SDK 自动探测并回退到长轮询，兼容性更好。
db.settings({ experimentalAutoDetectLongPolling: true });

// 文档 id 就是桌号，字段 items 结构跟 state.items 一模一样，按菜品 id 逐条存。

const callEventsRef = db.collection('callEvents');

function todayKey(d){
  d = d || new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// 桌号来自 URL 参数，顾客昵称是自由输入——两者都可能被塞进 innerHTML 的场合
// (state.table/order.table 显示、之后流入员工看板) 必须先转义，否则相当于
// 一个反射型 XSS 入口
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// "测试"桌是内部专用的英文名字，切到非中文界面时显示"Test"而不是原样中文
function displayTableName(tbl){
  return (tbl === '测试' && state.lang !== 'zh' && state.lang !== 'zhHant') ? 'Test' : tbl;
}

// 给一个 promise 加超时：网络很差时 Firestore 请求可能一直挂着不 resolve 也不 reject，
// 页面就会卡在"下单中"出不来。超时后统一当失败处理，好歹能提示顾客重试。
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

// 沽清菜品：员工在接单看板的"沽清菜品"页里勾选后写入这里，这边实时监听，
// 让菜单里对应菜品立刻变灰、不可点选（无需刷新页面）
let soldOutIds = new Set();
function isSoldOut(id){ return soldOutIds.has(id); }
// 带规格的菜品（比如水的大/小瓶）可以只沽清某一个规格：沽清集合里存
// "菜品id:规格key"。整道菜的id沽清了，则所有规格都算沽清。
function isSizeSoldOut(d, sizeKey){ return soldOutIds.has(d.id) || soldOutIds.has(`${d.id}:${sizeKey}`); }
function dishFullySoldOut(d){
  if(d.sizes) return d.sizes.every(s => isSizeSoldOut(d, s.key));
  return soldOutIds.has(d.id);
}
function defaultSizeKey(d){
  const avail = d.sizes.find(s => !isSizeSoldOut(d, s.key));
  return (avail || d.sizes[0]).key;
}
menuStatusRef.onSnapshot(snap => {
  const data = snap.data();
  soldOutIds = new Set((data && data.ids) || []);
  render();
}, err => {});

// 接单看板上的"关闭系统"：员工输入密码后写这个文档，扫码端实时监听到 disabled:true

}, err => {});

// 商品管理（spgl.html）页对菜单做的改动，不直接改 BASE_DISH_DATA，而是叠加
// 一层"补丁"：menuOverrides 里按 dishId 存的记录——isNew 的整条拼进菜单，
// deleted 的从菜单里拿掉，其余字段（name/price/category）存在的就覆盖对应
// 内置菜品的值。改名统一覆盖全部语言的名字（不需要员工分别输入六种语言）。
// DISH_DATA/MENU/... 都保留 const 绑定但内容可变（clear+refill），这样
// rebuildMenu() 之后所有已经引用过 MENU_BY_ID[x] 之类的地方不用重新获取引用
const DISH_DATA = [];
const MENU = [];
const ZH_NAME_TO_ID = {};
const MENU_BY_ID = {};
const CHEF_ITEMS = [];
let menuOverrides = [];   // menuOverridesRef.onSnapshot 推送的原始记录

function applyOverridesToBaseDishData(overrides){
  const byId = new Map();
  overrides.forEach(o => { if(!o.isNew) byId.set(o.id, o); });
  const patched = BASE_DISH_DATA
    .filter(d => !(byId.get(d.id) && byId.get(d.id).deleted))
    .map(d => {
      const o = byId.get(d.id);
      if(!o) return d;
      const next = Object.assign({}, d, { i18n: Object.assign({}, d.i18n) });
      if(o.category) next.category = o.category;
      if(typeof o.price === 'number' && !next.sizes) next.price = o.price;
      if(o.sizePrices && next.sizes){
        next.sizes = next.sizes.map(s => (typeof o.sizePrices[s.key] === 'number')
          ? Object.assign({}, s, { price: o.sizePrices[s.key] })
          : s);
      }
      if(o.name){
        LANG_ORDER.forEach(lang => {
          next.i18n[lang] = Object.assign({}, next.i18n[lang], { name: o.name });
        });
      }
      return next;
    });
  const newDishes = overrides.filter(o => o.isNew).map(o => {
    const name = o.name || o.id;
    const i18n = {};
    LANG_ORDER.forEach(lang => { i18n[lang] = { name, tag: '' }; });
    return { id: o.id, img: '', category: o.category || 'snacks', price: typeof o.price === 'number' ? o.price : 0, allergens: [], i18n };
  });
  return patched.concat(newDishes);
}

function rebuildMenu(){
  DISH_DATA.length = 0;

  MENU.length = 0;

let screenHistory = [];   // 记录来源页面，供“返回”按钮回退用

// ---------- 浏览器原生返回键（手机物理返回键/浏览器返回箭头/侧滑返回手势）
// 接入应用内部的 screenHistory 栈 ----------
// screenHistory 原来只服务于页面内"←返回"按钮，跟浏览器自己的 history 完全没
// 关联——顾客按手机物理返回键/浏览器自带的返回箭头，浏览器只会按它自己那份
// （从来没写入过任何状态的）history 走，实际效果是直接离开这个页面，而不是
// 回到 app 内的上一屏。
//
// 这里没有让 popstate 处理器去"读浏览器 history entry 里存的 state 直接切屏"——
// 试过那个做法，但 screenHistory 不是单纯的"访问顺序"：submitOrder() 下单成功
// 跳到 confirm 屏时故意 push('menu')，跳过了 orderReview（不想让顾客点返回又
// 看到一份已经提交过的订单确认页），这一步会让 screenHistory 记的"上一屏"
// 跟浏览器真实的前进顺序（…→orderReview→confirm）对不上；如果原生返回键去走
// 浏览器自己那份真实顺序，会把顾客送回一个已经过时的 orderReview 页，而不是
// screenHistory 原本想去的 menu。
//
// 改成更简单也更保险的办法：浏览器 history 只负责"制造深度"，让原生返回键
// 有触发 popstate 的机会（不然默认行为是直接离开页面）；popstate 触发后，
// 具体切到哪一屏完全交给 goBack() 那同一套逻辑决定——原生返回键和"←返回"按钮
// 永远走同一份判断，不会各自维护一份、互相打架。
let historySyncedScreen; // undefined = 还没同步过（首次 render 用 replaceState 补一条基线记录，不占用一次"前进"）
let suppressPopstateHandling = false;

function syncBrowserHistory(){
  if(state.screen === historySyncedScreen) return;
  try{
    if(historySyncedScreen === undefined) history.replaceState({ s: 1 }, '', location.href);
    else history.pushState({ s: 1 }, '', location.href);
  }catch(e){
    // 极少数限制了 History API 的嵌入式 webview：什么都不做，"←返回"按钮和
    // 页面内导航都不受影响，只是原生返回键这层增强用不上
  }
  historySyncedScreen = state.screen;
}

window.addEventListener('popstate', () => {
  // 这次 popstate 是 goBack() 自己调用 history.back() 引出的回声，不是顾客
  // 真的按了原生返回键——已经在 goBack() 里同步切过屏了，这里跳过，不要
  // 再切一次（不然等于连续 pop 两次，会多跳过一屏）
  if(suppressPopstateHandling){ suppressPopstateHandling = false; return; }
  if(screenHistory.length === 0) return;   // app 内没有更多能退的了，交给浏览器默认行为处理（比如真的离开页面）
  const prev = screenHistory.pop();
  state.screen = prev;
  render();
});

let welcomeTimer = null;

// 本桌订单的实时镜像：一旦选定桌号就一直监听，不管顾客在看菜单/下单确认页/我的订单页。
// 员工在接单看板上单品删除或整单删除，都是直接改/删 Firestore 里的 order 文档，这个监听

// 手动刷新或重新进入页面才发现菜品已经被后台删掉了。
let liveTableOrdersUnsub = null;
let liveTableOrders = [];
let liveTableOrdersLoaded = false;

// "有小伙伴成功下单啦"顶部跑马灯用的两份记录：
// - knownOrderIds：上一次推送时见过的订单 id 集合，null 表示还没建立过基线（首次
//   加载）——首次加载看到的都是本桌已有的历史订单，不能当成"新单"播一轮
// - myOwnOrderIds：本机自己提交成功过的订单 id（在 submitOrder 里落地），即使
//   它们对 knownOrderIds 来说是"新出现的"，也不播——这个提示是给"别人下单了"用的

let myOwnOrderIds = new Set();

// 跑马灯播放队列：一次快照里可能同时出现好几笔别人的新单（比如同桌好几台手机

// 顶掉上一条"。orderMarqueePlaying 标记当前是不是正有一条在播，避免并发触发

let orderMarqueePlaying = false;

function watchTableOrders(table){

// 同桌共享购物车草稿：本桌一旦选定就订阅 tableCarts/<桌号>，任何一台设备改了某道菜
// （数量/辣度/锅底/饮品……）都会推到这个文档，其它设备的 onSnapshot 立刻收到并合并
// 进本地 state.items，界面自动跟着更新（复用 updateItemUI 逐张菜卡片刷新，不整页重画）。
let sharedCartUnsub = null;

function watchSharedCart(table){
  if(sharedCartUnsub){ sharedCartUnsub(); sharedCartUnsub = null; }
  if(!table) return;
  sharedCartUnsub = tableCartsRef.doc(table).onSnapshot(snap => {
    const data = snap.data();
    const incoming = (data && data.items) || {};

    // 整份清空信号：attemptSubmitOrder 的事务建单成功时会整份 tx.set(draftRef,
    // {items:{}}) 覆盖整份文档，跟下面 pushSharedCartItem 的逐项 merge 不一样——
    // 就算同桌的菜一道道被本机删光，merge 也不会让文档变成真正的空对象 {}。
    // 所以"文档存在、但 items 是空对象"只有一种可能：同桌某台设备（不一定是
    // 本机）已经成功下单并清空了草稿。这时候本机手里如果还留着一堆"待提交"的菜，
    // 必须跟着清空，不然本机稍后再点"确认下单"，会把这些其实已经下过的菜重复
    // 交一遍——2026-09-07 桌2 连续三笔近乎一样的订单就是这里没清导致的：三台
    // 手机各自攒着同一份还没提交的购物车，第一台下单成功后，另外两台完全不知道，
    // 各自又把自己那份（几乎一样）交了一遍
    if(data && Object.keys(incoming).length === 0){
      if(Object.keys(state.items).length > 0){
        state.items = {};
        render();
      }
      return;
    }

    // 除了上面这种"确凿的整份清空"，其余情况只用共享草稿"新增/更新"本地购物车，
    // 绝不因为某道菜不在这次推送里就把它从本地删掉——本地选择永远以本机这次点单
    // 为准，共享草稿只是拿来同步其它设备改了什么，不能反过来抹掉本机自己已经选的
    // 菜。这一点很关键：本机自己写共享草稿的那次"乐观回声"也会经过这个回调，如果
    // 那次写入之后被回滚（权限被拒/网络失败/餐厅wifi 抽风……），回滚后的快照里
    // 这道菜就是"缺失"的——只要缺失就跳过、绝不删除，本地购物车就不会被回滚顺带
    // 清空（之前出现过"点了显示加入购物车成功，但购物车是空的"就是因为这里曾经
    // 写成"缺失就删除"）。
    const changedIds = [];
    Object.keys(incoming).forEach(id => {
      const newVal = incoming[id];
      if(!newVal) return;
      if(JSON.stringify(state.items[id] || null) === JSON.stringify(newVal)) return;
      state.items[id] = newVal;
      changedIds.push(id);
    });
    if(changedIds.length === 0) return;
    if(state.screen === 'menu') changedIds.forEach(updateItemUI);
    else if(state.screen === 'cart' || state.screen === 'orderReview') render();
  }, err => {});
}

// 每次本地改动某道菜（数量/口味/锅底……）都同步写一份到共享购物车草稿里。
// 用嵌套对象字面量 { items: { [菜品id]: 值 } } + merge:true——Firestore 对 set()
// 的嵌套 map 字段是递归合并的，只会精确覆盖这一道菜自己的记录，不会动到同桌其他人
// 正在改的另一道菜，文档还不存在时（本桌第一次有人点单）也会自动建出来。
// （注意：不能写成顶层带点号的字段路径 "items.<id>" 当 key——那个写法只对 update()
// 生效；传给 set() 时会被当成一个字面量就叫 "items.xxx" 的字段，既没merge进 items
// 这个 map，也会被安全规则的 hasOnly(['items','updatedAt']) 拒绝，之前就是栽在这上面。）
function pushSharedCartItem(id){
  if(!state.table) return;
  tableCartsRef.doc(state.table).set({
    items: { [id]: state.items[id] || null },
    updatedAt: Date.now(),
  }, { merge: true }).catch(()=>{});
}

// dishIds/items（两个下标对齐的并行数组，见 submitOrder）转成 [{id,qty}]，是
// sessionStorage 里存的格式，也是下面精确划账函数认的格式——只留划账用得到的
// 两个字段，不整份存 items（避免菜单改动、字段变化导致存量数据格式对不上）
function toDishQtyPairs(dishIds, items){
  return dishIds.map((id, idx) => ({ id, qty: items[idx].qty }));
}

// 按 dishQtyPairs 记录的数量，把一次已经确认成功的提交从本地购物车和共享草稿里
// 都精确划掉——都是按数量扣减，不是整体清零/整体清空。
// 本地购物车这边直接改内存，立刻生效；共享草稿这边必须在事务里现读现减，不能假设
// 草稿此刻是"干净"的——本机自己在等确认期间如果又碰了一下这道菜（比如手滑又点了
// 一次"+"，以为还没提交上），会把它重新写回共享草稿，这时候需要精确扣掉这次核对
// 确认的那部分数量，剩下的（不管是本机后来又加的，还是同桌别人加的）原样保留，
// 不能像早先那版一样对整个草稿文档做一次整体覆盖清空
async function reconcileDishQtyPairs(table, dishQtyPairs){
  if(!dishQtyPairs || !dishQtyPairs.length) return;

  dishQtyPairs.forEach(({ id, qty }) => {
    const cur = state.items[id];
    if(!cur) return;
    const newQty = Math.max(0, cur.qty - qty);
    if(newQty === 0) delete state.items[id];
    else state.items[id] = Object.assign({}, cur, { qty: newQty });
    updateItemUI(id);
  });

  if(!table) return;
  const draftRef = tableCartsRef.doc(table);
  try{
    await db.runTransaction(async tx => {
      const draftSnap = await tx.get(draftRef);
      if(!draftSnap.exists) return;
      const draftItems = Object.assign({}, draftSnap.data().items || {});
      let changed = false;
      dishQtyPairs.forEach(({ id, qty }) => {
        const entry = draftItems[id];
        if(!entry) return;
        const remaining = Math.max(0, (entry.qty || 0) - qty);
        draftItems[id] = Object.assign({}, entry, { qty: remaining });
        changed = true;
      });
      if(changed) tx.set(draftRef, { items: draftItems, updatedAt: Date.now() }, { merge: true });
    });
  }catch(e){
    // 精确划账这一步失败（比如网络问题），不影响本地购物车已经做完的扣减——
    // 共享草稿这边留着没扣的部分不算错误，最坏情况是下一次核对（被动监听或者
    // 下次点确认前的主动核对）还会再试一次，多试几次没有副作用
  }
}

// 核对"卡住/报错"的下单尝试是不是其实已经成功了：本桌订单的实时推送里只要出现一笔
// id 跟某次 pendingSubmitAttempt 的幂等键精确对上号的订单，就说明那次不是真的
// 失败，是网络太差、没等到确认。用幂等键（就是这笔订单的文档 id）精确匹配，比之前
// "createdAt+菜品签名"两个字段一起比对更直接——同一个 id 只可能是同一笔提交，
// 不存在巧合撞上的可能
function reconcilePendingSubmits(){
  if(!state.pendingSubmitAttempts.length || !liveTableOrders.length) return;
  const resolved = [];
  state.pendingSubmitAttempts = state.pendingSubmitAttempts.filter(attempt => {
    const matched = liveTableOrders.find(o => o.id === attempt.idempotencyKey);
    if(!matched) return true;
    resolved.push(attempt);
    return false;
  });
  // 被动路径，不 await——这里是监听回调，没有谁在等这个结果；划账失败可以留给
  // 下一次监听推送或者下次下单前的主动核对再补，不用卡住当前这次回调
  resolved.forEach(attempt => reconcileDishQtyPairs(state.table, toDishQtyPairs(attempt.dishIds, attempt.items)));
}

// 下单前主动核对一次：缓存着的旧幂等键，是不是其实已经在服务器上成功建单了。
// 只靠 reconcilePendingSubmits 被动等实时监听不够——本机点"确认下单"这个动作
// 不受监听是否追上的限制，网络差的时候监听推送可能跟这次提交一样慢、甚至更慢，
// 用户完全可能在监听赶到之前就已经点了第二次确认。这里在生成新键之前直接查一次
// 服务器（source:'server'，不吃本地监听缓存），旧键如果已经真实落地，就先把这次
// 已经成交的内容从本地购物车和共享草稿里都精确划掉、旧键作废，再往下走——不然
// 购物车/草稿里如果还混着已经成交过的菜（比如本机没收到确认、以为失败，用户又
// 碰了一下那道菜的数量），会被当成"新内容"顶着新键又交一遍，变成真的重复下单。
// 查不到 / 这次查询本身超时失败，就什么都不做，照旧走后面的指纹比对逻辑——这一步
// 只是多一层保险，不能因为它自己失败就把整个下单流程卡住。
//
// 找不到 attempt（比如中途刷新过页面，state.pendingSubmitAttempts 这个内存数组
// 被重置了）不代表这次核对就没法做精确划账了——getOrCreateIdempotencyKey 存键的
// 时候，会把 dishQtyPairs 跟 { key, fingerprint } 一起存进 sessionStorage（活得过
// 刷新），这里退化用 cached.items 兜底，两条路径最终用的是同一份 reconcileDishQtyPairs，
// 划账结果一致
async function reconcileStaleKeyIfResolved(table){
  const storageKey = IDEMPOTENCY_KEY_PREFIX + table;
  let cached = null;
  try{ cached = JSON.parse(sessionStorage.getItem(storageKey) || 'null'); }catch(e){}
  if(!cached) cached = memoryIdempotencyKeys[table] || null;
  if(!cached || !cached.key) return;

  let exists = false;
  try{
    const oldOrderSnap = await withTimeout(ordersRef.doc(cached.key).get({ source: 'server' }), 5000);
    exists = oldOrderSnap.exists;
  }catch(e){ return; }
  if(!exists) return;

  const attempt = state.pendingSubmitAttempts.find(a => a.idempotencyKey === cached.key);
  const dishQtyPairs = attempt ? toDishQtyPairs(attempt.dishIds, attempt.items) : (cached.items || []);
  if(attempt){
    state.pendingSubmitAttempts = state.pendingSubmitAttempts.filter(a => a !== attempt);
  }
  // 这一步要 await：下面 submitOrder 紧接着就要用（划账后的）购物车重新算这次
  // 真正要提交的内容，必须先等精确划账做完，不能让它在后台自己跑
  await reconcileDishQtyPairs(table, dishQtyPairs);
  clearIdempotencyKey(table);
}

function onTableOrdersChanged(){
  const foodOrders = liveTableOrders.filter(o => !o.call);
  reconcilePendingSubmits();

  if(state.myOrders !== null){
    state.myOrders = foodOrders.slice().sort((a,b) => a.createdAt - b.createdAt);
  }

  if(state.lastOrder){
    const doc = liveTableOrders.find(o => o.id === state.lastOrder.docId);
    state.lastOrder.summaryItems = mergeItems(foodOrders);
    state.lastOrder.removed = !doc;
    if(doc && doc.status) state.lastOrder.status = doc.status;
  }

  // "有小伙伴成功下单啦"顶部跑马灯：不看顾客现在停在客户端哪个页面，只要不是
  // 本机自己刚提交的新单就播——首次建立基线（knownOrderIds 还是 null）不播，
  // 不然一进页面就对着本桌已有的历史订单播一轮
  const curIds = new Set(foodOrders.map(o => o.id));
  if(knownOrderIds !== null){
    const newFromOthers = foodOrders
      .filter(o => !knownOrderIds.has(o.id) && !myOwnOrderIds.has(o.id))
      .sort((a,b) => a.createdAt - b.createdAt);
    newFromOthers.forEach(queueOrderAnnouncement);
  }
  knownOrderIds = curIds;
  renderPandaNav();

  if(state.screen === 'myOrder' || state.screen === 'confirm') render();
}

function goBack(){
  const prev = screenHistory.pop();
  if(!prev) return;
  state.screen = prev;
  render();
  // 顺手让浏览器自己的 history 深度也退一步，不然原生返回键那边的"余量"会
  // 越攒越多——不指望它成功、也不靠它决定切到哪一屏（那件事上面已经做完了），
  // 纯粹是让原生返回键之后按下去的次数尽量对得上。suppressPopstateHandling
  // 是为了让 history.back() 引出的那次 popstate 别又跟着 pop 一次
  // screenHistory（不然等于连续退两屏）；如果这次浏览器压根没触发 popstate
  // （极少数环境），400ms 后自动放开这个标记，不会卡死后续真正的原生返回键
  try{
    suppressPopstateHandling = true;
    history.back();
    setTimeout(() => { suppressPopstateHandling = false; }, 400);
  }catch(e){
    suppressPopstateHandling = false;
  }
}

function getItem(id){
  return state.items[id] || {
    qty:0, spice: '中辣',
    size:null, excludes:{}, cookMethod:'steamed',

// 防呆：同一桌（同一个二维码）全程只能点一份锅底——见 tableAlreadyHasSoupBase
// 顶部那段真实事故说明（顾客把加点的锅底当成普通汤菜又点了一份）。这里在锅底类
// 菜品（isSoupPot，排除蘸料）上做两层拦截，只在"从 0 加到有"这一下触发：
// ①本桌是不是已经点过一份真锅底了（不管是本机之前提交过、还是同桌另一台设备
//   提交过，tableAlreadyHasSoupBase 已经查过 liveTableOrders）——命中就直接拦，
//   连购物车都不让加进去，弹提示请联系服务员
// ②购物车里（含同桌共享草稿同步过来的）是不是已经选了另一款还没提交的锅底——
//   命中就把那一款清零换成这一款，当成单选处理，不让两款一起叠在购物车里
// 锅底数量本身也封顶在 1（Math.min(1, ...)），不像其它菜品能一路加到 20
function changeQty(id, delta){
  const d = MENU_BY_ID[id];
  const cur = getItem(id);

  if(delta > 0 && cur.qty <= 0 && d && isSoupPot(d)){
    if(tableAlreadyHasSoupBase()){
      showNagToast(t('soupBaseAlreadyOrderedMsg'));
      return;
    }
    MENU.forEach(other => {
      if(other.id === id || !isSoupPot(other)) return;
      const otherItem = getItem(other.id);
      if(otherItem.qty <= 0) return;
      state.items[other.id] = Object.assign({}, otherItem, { qty: 0 });
      updateItemUI(other.id);
      pushSharedCartItem(other.id);
    });
  }

  const cap = (d && isSoupPot(d)) ? 1 : 20;
  const qty = Math.max(0, Math.min(cap, cur.qty + delta));
  state.items[id] = { qty, spice: cur.spice, size: cur.size, excludes: cur.excludes, cookMethod: cur.cookMethod };
  if(delta > 0 && qty > cur.qty){ celebrateAddToCart(); logDishClick(id); }
  updateItemUI(id);
  pushSharedCartItem(id);
}

// 单品点击量统计：每次顾客按"+"把这道菜加一份，本地先计数，攒够一小段时间/攒到
// 页面要离开了再一次性合并写入 Firestore（用 increment 叠加当天这道菜的总数），
// 不然手速快的顾客连点几十次"+"就要打几十次 Firestore，既没必要也费流量。
let pendingClickCounts = {};
let clickFlushTimer = null;

function logDishClick(id){
  pendingClickCounts[id] = (pendingClickCounts[id] || 0) + 1;
  if(!clickFlushTimer) clickFlushTimer = setTimeout(flushDishClicks, 20000);
}

function flushDishClicks(){
  clickFlushTimer = null;
  const counts = pendingClickCounts;
  pendingClickCounts = {};
  const date = todayKey();
  Object.keys(counts).forEach(id => {
    const d = MENU_BY_ID[id];
    if(!d) return;
    dishClicksRef.doc(`${date}_${id}`).set({
      date, dishId: id, name: zhDishName(id),
      count: firebase.firestore.FieldValue.increment(counts[id]),
    }, { merge: true }).catch(() => {});
  });
}

// 顾客切走标签页/关掉页面前，把还没攒够时间的点击数也尽量冲一次，宁可漏几次
// 点击统计，也不要攒了一堆从来没写进去
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden' && Object.keys(pendingClickCounts).length > 0){
    clearTimeout(clickFlushTimer);
    flushDishClicks();
  }
});

// Patches just the affected dish card (+ cart badge/panel) instead of the

function updateItemUI(id){
  if(state.screen !== 'menu'){ render(); return; }

  const card = document.querySelector(`.dish-card[data-id="${id}"]`);
  if(card){
    const body = card.querySelector('.dish-body');

    const extendSlot = card.querySelector('.dish-extend-slot');
    if(extendSlot) extendSlot.innerHTML = dishExtendHTML(MENU_BY_ID[id]);
  }

  if(state.cartPopupOpen){
    const body = document.getElementById('cart-side-body');
    if(body) body.innerHTML = cartSideBodyHTML();
  }

  const count = totalCount();
  const fab = document.querySelector('.cart-side-fab');
  if(fab){
    const badge = fab.querySelector('.cart-side-fab-badge');
    if(badge){
      badge.textContent = count;
      badge.classList.remove('bump');
      void badge.offsetWidth;
      badge.classList.add('bump');
    }

  if(orderBtn) orderBtn.disabled = count === 0;
}

function showNagToast(msg, kind){

  toast.addEventListener('animationend', (ev)=>{ if(ev.target === toast) toast.remove(); });
}

// 把一笔"别人刚下的单"拼成跑马灯要念的一整句话：✅ + 前缀 + 逐道菜"菜名 x数量"，
// 用 displayDishName 而不是订单里存的原始中文名，保证外语顾客看到的也是翻译过的
// 菜名（订单文档里 items[].name 永远是中文，是给厨房看的，见 buildOrderItemsFromDraft）
function buildOrderAnnounceMsg(order){
  const isCJK = state.lang === 'zh' || state.lang === 'zhHant';
  const sep = isCJK ? '，' : ', ';
  const itemsText = (order.items || [])
    .map(it => `${displayDishName(it.name)} x${it.qty}`)
    .join(sep);
  return `✅ ${t('orderAnnouncePrefix')}${itemsText}`;
}

// 排进跑马灯播放队列，不立即播——playNextOrderMarquee 里的 animationend 回调
// 会在上一条真正播完之后才取下一条，保证每一笔"别人下的单"都完整滚过一遍，
// 不会被后一笔紧跟着覆盖掉（旧版 .order-bubble 是"来新的就地替换"，同时来好几
// 笔时后面几笔会被静默吞掉，顾客根本看不到）
function queueOrderAnnouncement(order){
  orderMarqueeQueue.push(buildOrderAnnounceMsg(order));
  playNextOrderMarquee();
}

function playNextOrderMarquee(){
  if(orderMarqueePlaying) return;
  const msg = orderMarqueeQueue.shift();
  if(!msg) return;
  orderMarqueePlaying = true;
  showOrderMarquee(msg);
}

// 滚动速度按文字长短给一个大致匀速的时长（太短会读不完就飞走，太长又拖沓）；
// 不追求逐像素精确计算滚动距离——from 状态用 100vw（够把整条文字先推到视口右
// 边界外），to 状态用 translateX(-100%)（相对自身宽度，不管文字多长，滚到这个
// 状态时一定已经完全滚出左边界），两头对不齐的那点误差用户感知不到
function showOrderMarquee(msg){
  const root = document.getElementById('order-marquee-root');
  const duration = Math.max(6, Math.min(16, msg.length * 0.22));
  root.innerHTML = `
    <div class="order-marquee-bar">
      <div class="order-marquee-track">
        <span class="order-marquee-text" style="animation-duration:${duration}s;">${escapeHtml(msg)}</span>
      </div>
      <button class="order-marquee-cta" onclick="goToMyOrder()">${escapeHtml(t('myOrder'))}</button>
    </div>`;
  const textEl = root.querySelector('.order-marquee-text');
  textEl.addEventListener('animationend', (ev)=>{
    if(ev.target !== textEl) return;
    root.innerHTML = '';
    orderMarqueePlaying = false;
    playNextOrderMarquee();
  });
}

// 下单前的最终把关：火锅生食材必须配一份锅底
// bug fix：锅底送进厨房后，顾客再扫码回来只加菜，本地购物车 state.items 是全新的空对象，
// 看不到"锅底其实已经点过了"，会被误判成没点锅底又逼着重选一次。这里查一下本桌
// liveTableOrders（已经提交、还没被移出看板的所有订单，含厨房里正在做的）里是不是已经
// 有一份真正的锅底菜（排除蘸料），有的话这一轮点单就不用再强制选了。
function tableAlreadyHasSoupBase(){
  return liveTableOrders.some(o => !o.call && (o.items || []).some(it => {
    const dish = MENU_BY_ID[ZH_NAME_TO_ID[it.name]];
    return !!dish && dish.category === 'soupBase' && dish.sub !== 'dipSauce';
  }));
}

// 甜品/饮品推销只在本桌第一次下单时弹一次——查的是 liveTableOrders 而不是本机的
// state.upsellShown，所以不管顾客是同一台设备加菜、还是同桌换了另一台手机扫码，
// 只要这一桌已经有过正式订单（呼叫服务员的 call 单不算），后面都不会再弹，
// 免得每次点单都被推销一遍让人反感。这里没有额外等 liveTableOrdersLoaded：
// 选定桌号那一刻就订阅了，走到下单这一步时通常早就有数据了；真赶上极端情况下
// 还没加载出来，宁可漏推一次，也不要在明明点过单的桌子上又弹一次。
function tableHasPriorOrder(){
  return liveTableOrders.some(o => !o.call);
}

function validateCartForCheckout(){
  const hasQty = cats => MENU.some(d => cats.includes(d.category) && getItem(d.id).qty > 0);
  // "蘸料" 也挂在 soupBase 分类下（方便导航），但它是蘸碟不是锅底，不能当锅底数
  const hasSoupBase = MENU.some(d => d.category === 'soupBase' && d.sub !== 'dipSauce' && getItem(d.id).qty > 0)
    || tableAlreadyHasSoupBase();
  if(hasQty(HOTPOT_INGREDIENT_CATS) && !hasSoupBase){
    return { ok:false, category:'soupBase', message:t('missingSoupBaseMsg') };
  }
  return { ok:true };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 忘点提醒按三档优先级往下找：第一档(果饮/甜品/小吃凉菜)优先推；这三类都点过了
// 才轮到第二档(软饮水/茶)；第二档也点过了才轮到第三档(酒水/啤酒)。每一档内部，
// 哪个类别已经点过就从这一档里去掉那个类别，不推重复类型。真要是连酒水啤酒都
// 点全了，池子会是空的，openUpsell 已有的"池子为空就直接下单"逻辑会接住
const UPSELL_TIERS = [
  ['drinks', 'desserts', 'snacks'],
  ['softDrinks', 'tea'],
  ['fineWines', 'beer'],
];
function orderedCategories(){
  return new Set(MENU.filter(d => getItem(d.id).qty > 0).map(d => d.category));
}
function upsellPool(){
  const ordered = orderedCategories();
  let cats = [];
  for(const tier of UPSELL_TIERS){
    cats = tier.filter(c => !ordered.has(c));
    if(cats.length > 0) break;
  }
  return MENU.filter(d => cats.includes(d.category) && !dishFullySoldOut(d));
}

// 从"没展示过"的洗牌队列里取 4 个：队列不够了就把（除了这一批已经选中的）
// 剩下菜品重新洗牌接上去，保证同一轮里不重复、一轮展示完了才无限循环重来
function nextUpsellBatch(){
  const poolIds = upsellPool().map(d => d.id);
  if(poolIds.length === 0) return [];
  const batch = [];
  while(batch.length < 4 && batch.length < poolIds.length){
    if(state.upsellQueue.length === 0){
      const remaining = poolIds.filter(id => !batch.includes(id));
      if(remaining.length === 0) break;
      state.upsellQueue = shuffle(remaining);
    }
    batch.push(state.upsellQueue.shift());
  }
  return batch;
}

function openUpsell(){
  const pool = upsellPool();
  if(pool.length === 0){
    state.upsellShown = true;
    submitOrder();
    return;
  }
  state.upsellQueue = shuffle(pool.map(d => d.id));
  state.upsellItems = nextUpsellBatch();
  state.upsellSelected = {};
  state.upsellOpen = true;
  render();
}

// “换一批”：从洗牌队列里接着取下 4 个，规则见 nextUpsellBatch。
// 只重画格子本身，弹窗其余部分（标题、按钮）不用跟着重建。
function shuffleUpsell(event){
  const pool = upsellPool();
  if(pool.length === 0) return;
  state.upsellItems = nextUpsellBatch();
  state.upsellSelected = {};
  const grid = document.querySelector('.upsell-grid');
  if(grid) grid.innerHTML = upsellTilesHTML();
  const btn = event && event.currentTarget;
  if(btn){
    btn.classList.remove('spinning');
    void btn.offsetWidth;
    btn.classList.add('spinning');
  }
}
